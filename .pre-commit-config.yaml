# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: check-git-diff
        name: Check git whitespace and conflict markers
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: check-ck3-repo
        name: Check CK3 mod files (BOM, braces, newlines)
        entry: uv run scripts/check_repo.py
        language: system
        files: '^(common|events|gui|localization)/.*\.(txt|gui|yml)$'
        pass_filenames: true
      - id: calculate-tokens
        name: Calculate token cost for agent rules and skills (.agents/cost.md)
        entry: uvx --with tiktoken python scripts/calculate_tokens.py
        language: system
        files: '^(AGENTS\.md|\.agents/(rules/.*|skills/.*))$'
        pass_filenames: false
