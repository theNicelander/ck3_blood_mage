l_polish:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Magowie Krwi"
  rule_bm_blood_mage_prevalence: "Powszechność Magów Krwi"
  setting_bm_prevalence_player_only: "Tylko gracze"
  setting_bm_prevalence_player_only_desc: "Tylko postacie kontrolowane przez graczy mogą otrzymać cechę Maga Krwi. Zdobywanie jej przez SI, w tym naturalne pojawienie się i dziedziczenie, jest zablokowane."
  setting_bm_prevalence_extremely_rare: "Niezwykle rzadkie"
  setting_bm_prevalence_extremely_rare_desc: "Mnoży wagi decyzji i interakcji SI prowadzących do zdobycia magii krwi przez 0,01 (jedną setną wartości domyślnej). Postacie SI zachowują 10% naturalnie wygenerowanych lub odziedziczonych cech Maga Krwi."
  setting_bm_prevalence_rare: "Rzadkie"
  setting_bm_prevalence_rare_desc: "Mnoży wagi decyzji i interakcji SI prowadzących do zdobycia magii krwi przez 0,10 (jedną dziesiątą wartości domyślnej). Postacie SI zachowują 40% naturalnie wygenerowanych lub odziedziczonych cech Maga Krwi."
  setting_bm_prevalence_uncommon: "Nieczęste"
  setting_bm_prevalence_uncommon_desc: "Mnoży wagi decyzji i interakcji SI prowadzących do zdobycia magii krwi przez 0,50 (połowę wartości domyślnej). Postacie SI zachowują 70% naturalnie wygenerowanych lub odziedziczonych cech Maga Krwi."
  setting_bm_prevalence_default: "Domyślne"
  setting_bm_prevalence_default_desc: "Używa pierwotnych częstotliwości pojawiania się, dziedziczenia, rytuałów i interakcji."
  setting_bm_prevalence_more_frequent: "Częstsze"
  setting_bm_prevalence_more_frequent_desc: "Mnoży wagi decyzji i interakcji SI prowadzących do zdobycia magii krwi przez 2,00. Noworodki SI mają około 50% szans na odziedziczenie jej po jednym rodzicu Magu Krwi i około 1,25% szans na spontaniczne pojawienie się."
  rule_bm_lore: "Świat Magów Krwi"
  setting_bm_lore_historical: "Historyczny"
  setting_bm_lore_historical_desc: "Używa Kultu Kwintesencji wraz z jego dziedzictwem religijnym osadzonym w świecie historycznym i siecią miejsc świętych."
  setting_bm_lore_agot: "Gra o tron"
  setting_bm_lore_agot_desc: "Po wczytaniu dodatku Blood Mages - AGOT Religions zastępuje kulty świata historycznego tradycjami zgodnymi z uniwersum Siedmiu, Starych Bogów, Utopionego Boga, R'hllora, Rhoyne i Valyrii."
  rule_bm_physical_alteration: "Wygląd Magów Krwi"
  setting_bm_physical_alteration_none: "Bez zmian"
  setting_bm_physical_alteration_none_desc: "Magia krwi nie zmienia koloru oczu ani włosów Maga Krwi."
  setting_bm_physical_alteration_eyes: "Tylko oczy"
  setting_bm_physical_alteration_eyes_desc: "Wraz ze wzrostem biegłości magia krwi stopniowo zmienia kolor oczu Maga Krwi, ale nie wpływa na jego włosy."
  setting_bm_physical_alteration_eyes_hair: "Oczy i włosy"
  setting_bm_physical_alteration_eyes_hair_desc: "Magia krwi stopniowo zmienia oczy Maga Krwi, a przy większej biegłości sprawia, że jego włosy stają się białe."
  rule_bm_initiation_faith_requirement: "Wiara wymagana do inicjacji"
  setting_bm_initiation_dedicated_cult: "Dedykowany kult krwi"
  setting_bm_initiation_dedicated_cult_desc: "Tylko wyznawcy Kultu Kwintesencji lub wiary wyraźnie oznaczonej jako kult magii krwi mogą odprawić rytuał inicjacji."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Kult krwi lub akceptowane czary"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Postacie mogą odprawić rytuał inicjacji, jeśli wyznają Kult Kwintesencji, wiarę wyraźnie oznaczoną jako kult magii krwi albo wiarę, która akceptuje czary."
  rule_quintessence_religion: "Religia Magów Krwi"
  setting_quintessence_religion_enabled: "Włączone"
  setting_quintessence_religion_enabled_desc: "Decyzja o przyjęciu wiary Maga Krwi jest możliwa."
  setting_quintessence_religion_disabled: "Wyłączone"
  setting_quintessence_religion_disabled_desc: "Decyzja o przyjęciu wiary Maga Krwi jest nieaktywna."
  setting_quintessence_religion_enabled_player_only: "Tylko gracz"
  setting_quintessence_religion_enabled_player_only_desc: "Tylko gracze mogą podjąć decyzję o przyjęciu wiary Maga Krwi."
