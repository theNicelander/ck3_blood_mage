  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Postacie mogą odprawić rytuał inicjacji, jeśli wyznają Kult Kwintesencji, wiarę wyraźnie oznaczoną jako kult magii krwi albo wiarę, która akceptuje czary."
  rule_quintessence_religion: "Religia Magów Krwi"
  setting_quintessence_religion_enabled: "Włączone"
  setting_quintessence_religion_enabled_desc: "Decyzja o przyjęciu wiary Maga Krwi jest możliwa."
  setting_quintessence_religion_disabled: "Wyłączone"
  setting_quintessence_religion_disabled_desc: "Decyzja o przyjęciu wiary Maga Krwi jest nieaktywna."
  setting_quintessence_religion_enabled_player_only: "Tylko gracz"
  setting_quintessence_religion_enabled_player_only_desc: "Tylko gracze mogą podjąć decyzję o przyjęciu wiary Maga Krwi."
