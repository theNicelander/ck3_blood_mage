  # Religion family
  rf_quintessence: "Kwintesencja"
  rf_quintessence_desc: "Wiary pragnące zapanować nad esencją życiową przenoszoną we krwi."
  rf_quintessence_opinion: "Opinia [GetReligionFamily('rf_quintessence').GetName]"

  # Core Terms - Religion
  quintessence_religion: "Kult Kwintesencji"
  quintessence_religion_adj: "Kwintesencja"
  quintessence_religion_adherent: "Kwintesencjalista"
  quintessence_religion_adherent_plural: "Kwintesencjaliści"
  quintessence_religion_desc: "Kult Kwintesencji postrzega pierwotną siłę życiową, która przepływa przez wszystkie istoty, nie jako boską, ale jako ostateczną walutę mocy. Poprzez zakazane rytuały krwi i wykalkulowane ofiary wyznawcy wydobywają, manipulują i ujarzmiają tę esencję, aby przekroczyć ograniczenia śmiertelności. W przeciwieństwie do konwencjonalnych wyznań, które czczą bóstwa, kwintesencjaliści postrzegają siebie jako potencjalnych mistrzów podstawowego podłoża istnienia."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "Kult Kwintesencji"
  quintessence_faith_adj: "Kwintesencja"
  quintessence_faith_adherent: "Kwintesencjalista"
  quintessence_faith_adherent_plural: "Kwintesencjaliści"
  quintessence_faith_desc: "Chrześcijańscy kwintesencjaliści głoszą, że krew przelana na Kalwarii odsłoniła głębszą tajemnicę: życie samo w sobie jest świętym strumieniem, który można przelać, przyjąć i opanować. Interpretują Mękę, męczenników i Eucharystię poprzez zakazaną teologię szkarłatu, nauczając, że każde uderzenie serca jest echem ofiary Chrystusa i że ci, którzy pojmą tajemnicę krwi, mogą przezwyciężyć kruchość śmiertelnego ciała."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Islamscy kwintesencjaliści upierają się, że tylko Allah jest boski, podczas gdy krew to amanah – święty depozyt złożony w każdym żywym ciele. Twierdzą, że prorocy, lekarze i mistycy dostrzegli część jej ukrytego prawa i że poprzez zdyscyplinowane rytuały, post oraz starannie odmierzone ofiary wierni mogą zapanować nad nurtem życia, poddając się porządkowi wpisanemu w stworzenie."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Żydowscy kwintesencjaliści zaczynają od starożytnego nauczania, że życie ciała jest we krwi. Uważają przymierze, obrzezanie i pamięć o ofierze świątynnej za fragmenty ukrytej dyscypliny, utrzymując, że krew niesie zarówno dziedzictwo pokoleń, jak i obowiązki łączące naród. Rozporządzanie tym dziedzictwem oznacza w ich oczach dotknięcie najgłębszego nurtu stworzenia."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Wschodni kwintesencjaliści opisują Kwintesencję jako strumień życiowy poruszający się w samsarze: oddech, krew, karma i świadomość połączone w jednym krążeniu. Niektórzy nazywają ją praną, podczas gdy inni rozumieją ją jako środek rozluźniający przywiązania lub oczyszczający ciężary karmiczne. Wszyscy nauczają, że rygorystyczne rytuały mogą przekierować ten prąd w kierunku przebudzenia, długowieczności i ostatecznego wyzwolenia."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Siniccy kwintesencjaliści utrzymują, że krew jest najgęstszym naczyniem qi, odziedziczonym od przodków i uporządkowanym pod Niebem. Śledząc meridiany ciała, oddając cześć zmarłym i równoważąc poświęcenie z harmonią, starają się udoskonalić odziedziczoną esencję, zamiast ją marnować. Mówi się, że doskonałe krążenie jednoczy ciało, linię rodową i kosmos w jednym szkarłatnym porządku."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Kwintesencjaliści Ásatrú odrzucają obce naleciałości i dostrzegają karmazynowy nurt w próbie Odyna, bitewnym szale einherjarów oraz krwi przelanej podczas blót. Zabijanie lub śmierć w określonym celu uwalnia moc dla klanu, ziemi i bogów; wojna jest sakramentem, ofiara wymianą, a Kwintesencja należy do tych, którzy mają dość odwagi, by ją ujarzmić."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Wśród wyznawców dawnych bogów krew jest pamiętana jako pierwszy język używany między śmiertelnikami, przodkami i duchami. Kwintesencjaliści przestrzegają przysięgi, ofiary i uczty ofiarnej, ale nauczają, że te rytuały nie tylko uspokajają niewidzialne moce: otwierają kanały, przez które siła przechodzi od bestii do wojownika, od umarłych do żywych i z ziemi do wybranego ludu."
