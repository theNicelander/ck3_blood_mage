l_polish:
 bm_trait_drain.001.b: "Ten bystry umysł mógłby mi się przydać."
 bm_trait_drain.001.c: "Mogę stać się silniejszy..."
 bm_trait_drain.001.d: "Cóż za uroda... Dlaczego nie miałaby należeć do mnie?"
 bm_trait_drain.001.desc: "Więzień klęczy przed tobą, a w jego szeroko otwartych oczach widać przerażenie, gdy karmazynowe runy rozbłyskują na posadzce komnaty. Jego błagania o litość cichną do szeptu, kiedy podchodzisz, kreśląc palcami tajemne wzory w powietrzu. Wyczuwasz to, co czyni go wyjątkowym — iskrę inteligencji, fizyczną krzepę, niezwykłą urodę — pulsujące pod skórą niczym latarnia wzywająca twoją moc.\n\nMagia krwi wymaga ofiary, a jego wyjątkowe dary wkrótce staną się twoje. Powietrze gęstnieje od oczekiwania, gdy macki twojej świadomości wyciągają się ku niemu, gotowe wyrwać to, czego pragniesz. Jego wargi drżą, układając się w rozpaczliwe słowa:\n\n„Proszę... wszystko, tylko nie to...”\n\nLecz ty wiesz lepiej. Jego esencja posłuży ci znacznie lepiej, niż kiedykolwiek mogłoby jego ciało."
 bm_trait_drain.001.e: "Doskonale."
 bm_trait_drain.001.f: "Cóż za wzrost... Ciekawe, jak wygląda świat z takiej wysokości."
 bm_trait_drain.001.fail: "Nie udaje mi się odebrać mu tego daru"
 bm_trait_drain.001.g: "Jego krew jest wyśmienita..."
 bm_trait_drain.001.h: "Taka siła bardzo by mi się przydała."
 bm_trait_drain.001.nice: "Doskonale."
 bm_trait_drain.001.success: "Odbieram mu ten dar"
 bm_trait_drain.001.title: "Żniwo esencji"
 bm_trait_drain.001.z: "Puścić go wolno..."
