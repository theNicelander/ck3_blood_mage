l_polish:
 bm_blood_mage_story:0 "Magia krwi"
 bm_blood_mage_story_desc:0 "Twoja krew jest zarazem grymuarem i tyglem. Każdy rytuał pogłębia twoje mistrzostwo w jednej z dyscyplin karmazynowej sztuki."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help Każda dyscyplina osiąga mistrzostwo przy 100 punktach doświadczenia. Najedź na dyscyplinę, aby zobaczyć zasady jej rozwoju.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Krwawe golemy"
 BM_CRIMSON_RETINUE:0 "Karmazynowi wojownicy i czempioni"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Odśwież listę Krwawych golemów, Karmazynowych wojowników i Karmazynowych czempionów służących obecnie na twoim dworze"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Odśwież listy postaci wyświetlane w tym panelu historii"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Brak"
 bm_blood_mage_lifeforce_major:0 "Siła życiowa: #P Duży zapas#!"
 bm_blood_mage_lifeforce_minor:0 "Siła życiowa: #V Mały zapas#!"
 bm_blood_mage_lifeforce_negative_major:0 "Siła życiowa: #N Poważnie wyczerpana#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Siła życiowa: #N Wyczerpana#!"
 bm_blood_mage_lifeforce_none:0 "Siła życiowa: #weak Nieujawniona#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Ładunki siły życiowej#! — #P Duże#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Małe#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Siła życiowa#!\nMała i duża siła życiowa to oddzielne, kumulujące się zasoby pozyskiwane przez wysysanie życia i inne rytuały. Zdolności magii krwi wskazują, który zasób zużywają; rzucenie zaklęcia zwykle usuwa wymagany ładunek i może tymczasowo wyczerpać twoją siłę życiową.\n\nDopóki nie zostaną zużyte, wszystkie ładunki zwiększają zdrowie, płodność, długość życia i odporność na choroby. Duży ładunek daje trzykrotnie większe korzyści dla przeżywalności niż mały."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Dostrojenie#!: #weak Brak#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Dostrojenie siły życiowej#!\nWydaj jedną małą siłę życiową i 25 pobożności poprzez interakcję osobistą #V Dostrojenie siły życiowej#!, aby wybrać dyscyplinę magii krwi. Możesz utrzymywać tylko jedno Dostrojenie; wybór innego zastępuje obecne, a interakcja ma pięcioletni czas odnowienia.\n\nKażdego roku dostrojona dyscyplina ma 50% szans na zdobycie #P 1 punktu doświadczenia#!. Jej modyfikator Dostrojenia zapewnia również pasywną korzyść właściwą dla tej dyscypliny."
