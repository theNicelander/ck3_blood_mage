l_french:
 blood_mage_yearly_events.002.success: "L'héritage magique de votre dynastie vous a fait gagner de l'expérience"
 bm_channel_lifeforce_bloodline.001.a: "Diplomatie — Nos paroles porteront l'autorité du sang"
 bm_channel_lifeforce_bloodline.001.b: "Martialité — Le sang des conquérants ne s'affaiblira jamais dans nos veines"
 bm_channel_lifeforce_bloodline.001.c: "Intendance — La richesse et la prospérité afflueront vers notre lignée"
 bm_channel_lifeforce_bloodline.001.d: "Intrigue — Nul secret ne se dérobera à notre regard"
 bm_channel_lifeforce_bloodline.001.desc: "J'ai tracé le cercle rituel avec mon propre sang ; ses symboles sacrés me relient à chaque membre de ma maison. Tandis que je récite les paroles anciennes, des filaments de puissance traversent le temps et l'espace à la recherche de tous ceux qui partagent mon sang. Quel don léguerai-je à ma dynastie pour les générations à venir ?"
 bm_channel_lifeforce_bloodline.001.e: "Érudition — Les murmures ancestraux guideront notre lignée à jamais"
 bm_channel_lifeforce_bloodline.001.f: "Santé — Notre sang résistera à la maladie et au déclin"
 bm_channel_lifeforce_bloodline.001.g: "Hérédité — Chaque génération naîtra plus forte que la précédente"
 bm_channel_lifeforce_bloodline.001.h: "Expérience — Les secrets des anciens se révéleront à notre lignée"
 bm_channel_lifeforce_bloodline.001.title: "Le pacte du sang ancestral"
 bm_channel_lifeforce_bloodline.001.x: "Le pouvoir du carmin"
 channel_lifeforce_bloodline: "Imprégner la dynastie d'hématurgie"
 channel_lifeforce_bloodline.effects_list: "Insufflez de puissants effets d'hématurgie à toute votre dynastie :\n#indent_newline: $EFFECT_LIST_BULLET$ Diplomatie : [GetModifier('dynasty_crimson_charisma_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Martialité : [GetModifier('dynasty_crimson_fury_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Intendance : [GetModifier('dynasty_crimson_prosperity_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Intrigue : [GetModifier('dynasty_crimson_shadows_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Érudition : [GetModifier('dynasty_crimson_insight_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Génétique : [GetModifier('dynasty_crimson_legacy_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ Expérience : [GetModifier('dynasty_crimson_expertise_modifier').GetNameWithTooltip]"
 channel_lifeforce_bloodline_confirm: "Lier notre lignée par le sang"
 channel_lifeforce_bloodline_desc: "Chaque modificateur dynastique écarlate accorde à votre dynastie une chance de gagner de l'expérience dans la voie de la Lignée.\n\nPar des rites sacrés et de grands sacrifices, votre hématurgie peut vous dépasser et insuffler un pouvoir surnaturel à toute votre descendance."
 channel_lifeforce_bloodline_tooltip: "Accomplissez un puissant rituel qui imprégnera à jamais toute votre dynastie de l'essence de votre hématurgie."
