l_french:
 building_bm_university_0: "École hématurgique"
 building_bm_university_0_desc: "Une modeste salle d'étude consacrée aux premiers rudiments de l'hématurgie."
 building_bm_university_1: "Institut hématurgique"
 building_bm_university_1_desc: "Un établissement où maîtres et novices approfondissent ensemble les secrets de l'hématurgie."
 building_bm_university_2: "Collège hématurgique"
 building_bm_university_2_desc: "Une petite communauté d'hématurges entièrement vouée à l'étude et à la pratique de leur art."
 building_bm_university_3: "Académie hématurgique"
 building_bm_university_3_desc: "Au cœur d'un vaste domaine savant se dresse une forteresse où les plus grands hématurges repoussent les limites de leur art."
 building_type_bm_university_0: "Université hématurgique"
 building_type_bm_university_0_desc: "Un lieu où les hématurges échangent leurs connaissances, mènent leurs expériences et approfondissent leur maîtrise des arts occultes."
