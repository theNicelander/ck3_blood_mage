l_french:
 become_blood_cultist_decision: "Embrasser le culte du sang"
 become_blood_cultist_decision_confirm: "Le sang me soutiendra"
 become_blood_cultist_decision_desc: "Les murmures sont devenus trop insistants pour être ignorés. Ils parlent d'immortalité et d'une puissance puisée dans l'essence même de la vie. Face aux pouvoirs tangibles qu'offre le Culte du sang, les anciennes religions ne sont plus que des coquilles vides. Ses textes sacrés promettent de transcender la condition mortelle par le sacrifice et de soumettre les lois de la nature en payant à la vie son tribut sanglant. Peut-être est-il temps de renoncer aux promesses creuses des anciens dieux et d'embrasser la vérité viscérale qui coule en chaque être vivant."
 become_blood_cultist_decision_tooltip: "Renoncez à votre foi actuelle et embrassez les pouvoirs interdits de l'hématurgie."
 bm_repair_quintessence_reformation_decision: "Réparer la réforme du Culte"
 bm_repair_quintessence_reformation_decision_confirm: "Détacher cette autorité prématurée"
 bm_repair_quintessence_reformation_decision_tooltip: "Détachez du Culte son chef temporel prématuré afin de pouvoir réformer la foi, sans détruire le titre ni perturber le domaine"
 bm_repair_quintessence_reformation_decision_desc: "Le Culte a établi un chef temporel avant l'organisation formelle de ses rites. Cette fonction prématurée empêche désormais toute réforme de la foi. La détacher du Culte rétablira sa tradition sans chef jusqu'à ce qu'une organisation religieuse appropriée soit choisie lors de la réforme, tout en préservant le titre et le domaine de son détenteur."
 bm_blood_cultist_become_blood_mage_decision: "Cultiste du sang : devenir hématurge"
 bm_blood_cultist_become_blood_mage_decision_confirm: "Ma chair canalisera le pouvoir écarlate"
 bm_blood_cultist_become_blood_mage_decision_desc: "Fidèle dévoué du Culte du sang, j'ai contemplé la puissance brute de nos membres les plus exaltés. La foi seule m'a laissé entrevoir le véritable potentiel du sang, mais devenir hématurge me permettrait de transcender les limites mortelles. Le rituel exige un sacrifice, au sens propre comme au figuré, car mon corps doit devenir le réceptacle d'un pouvoir ancestral. La transformation sera atroce, mais quiconque renaît de ce baptême écarlate acquiert la maîtrise de la vie elle-même. Le temps est venu de passer d'adorateur à maître."
 bm_blood_cultist_become_blood_mage_decision_tooltip: "Accomplissez le rite sacré qui fera de ce simple adepte un véritable maître de l'hématurgie."
 bm_enhance_blood_ritual_decision: "Rituel d'initiation écarlate"
 bm_enhance_blood_ritual_decision.injury_failure_tt: "Je suis marqué, mais j'ai survécu."
 bm_enhance_blood_ritual_decision.mental_failure_tt: "Mon esprit est brisé !"
 bm_enhance_blood_ritual_decision.physical_failure_tt: "Mon corps est brisé !"
 bm_enhance_blood_ritual_decision.success_tt: "Le pouvoir est à moi !"
 bm_enhance_blood_ritual_decision_confirm: "Libérer le pouvoir qui m'habite"
 bm_enhance_blood_ritual_decision_desc: "Mes recherches approfondies sur les arts écarlates m'ont conduit au bord du précipice. Faute de mentor, je dois devenir mon propre creuset et employer ma vitalité comme catalyseur. L'esprit érudit qui a déchiffré ces rites doit désormais les guider avec une précision absolue.\n\nLa réussite éveillera le pouvoir latent de mon sang ; l'échec me laissera l'esprit brisé ou le corps en ruine.\n\n#help Les traits qui rendent cette décision disponible augmentent ses chances de réussite. Les traits acquis après un échec les augmentent également. L'âge et la santé entrent aussi en ligne de compte.#!"
 bm_enhance_blood_ritual_decision_tooltip: "Tentez d'accroître votre maîtrise de l'hématurgie en accomplissant seul un dangereux rituel."
 bm_self_initiation_decision: "Tenter l'auto-initiation"
 bm_self_initiation_decision_confirm: "Je serai mon propre creuset"
 bm_self_initiation_decision_desc: "Les tomes et les parchemins livrent des indices fragmentaires, mais je n'ai ni mentor pour me guider ni sujet sur lequel m'exercer. La seule voie qui s'offre à moi est la plus périlleuse : accomplir le rituel d'initiation sur ma propre personne. Je dois être à la fois chirurgien et patient, sorcier et sacrifice.\n\nMon sang sera le médium et mon esprit, le champ de bataille où je soumettrai la puissance brute. Aucun dogme, seulement un savoir dangereux et la force de ma volonté. Si je réussis, je commanderai l'essence même de la vie. Si j'échoue, mon esprit et mon corps en paieront le prix."
 bm_self_initiation_decision_tooltip: "Mettez à profit un savoir interdit pour accomplir le rituel d'initiation sur vous-même. Sans guide, les risques sont immenses : un échec pourrait détruire votre esprit ou votre corps."
 convert_to_blood_magic_from_witch: "Devenir hématurge"
 convert_to_blood_magic_from_witch.tooltip: "Devenir hématurge"
 convert_to_blood_magic_from_witch_confirm: "Embrasser l'hématurgie"
 convert_to_blood_magic_from_witch_desc: "Renoncez aux pratiques inférieures des sorcières et devenez hématurge !"
 convert_to_blood_magic_from_witch_tooltip: "Abandonnez la sorcellerie pour devenir hématurge"
 decision_group_type_bm_decision_group: "Décisions d'hématurge"
 manifest_lifeforce_decision: "Manifester la force vitale"
 manifest_lifeforce_decision_confirm: "Changer le divin en sang"
 manifest_lifeforce_decision_desc: "Par une méditation profonde et une intense communion spirituelle, un hématurge peut manifester de la force vitale brute en canalisant une immense quantité de piété."
 manifest_lifeforce_decision_tooltip: "Convertissez votre puissance spirituelle en force vitale tangible."
 manifest_lifeforce_major_failure_tt: "Vous n'avez pas réussi à manifester la force vitale"
 manifest_lifeforce_major_success_tt: "Vous avez manifesté de la force vitale"
 manifest_lifeforce_minor_failure_tt: "Vous n'avez pas réussi à manifester la force vitale"
 manifest_lifeforce_minor_success_tt: "Vous avez manifesté de la force vitale"
 mass_lifedrain_prisoners_decision.text: "Au moins une personne est-elle emprisonnée ?"
