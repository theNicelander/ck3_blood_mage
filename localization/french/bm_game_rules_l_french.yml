l_french:
 game_rule_category_blood_mages: "@bm_game_rule_icon! Hématurges"
 rule_bm_lore: "Univers des hématurges"
 setting_bm_lore_historical: "Historique"
 setting_bm_lore_historical_desc: "Utilise le Culte de la Quintessence, son héritage religieux adapté au monde historique et son réseau de lieux saints."
 setting_bm_lore_agot: "Le Trône de fer"
 setting_bm_lore_agot_desc: "Lorsque le module Blood Mages - AGOT Religions est chargé, remplace les cultes du monde historique par des traditions fidèles à l'univers des Sept, des Anciens Dieux, du Dieu Noyé, de R'hllor, de la Rhoyne et de Valyria."
 rule_bm_physical_alteration: "Apparence des hématurges"
 setting_bm_physical_alteration_none: "Aucune altération"
 setting_bm_physical_alteration_none_desc: "La magie du sang ne modifie ni la couleur des yeux ni celle des cheveux des hématurges."
 setting_bm_physical_alteration_eyes: "Yeux uniquement"
 setting_bm_physical_alteration_eyes_desc: "La magie du sang modifie progressivement la couleur des yeux des hématurges à mesure que leur maîtrise augmente, mais laisse leurs cheveux inchangés."
 setting_bm_physical_alteration_eyes_hair: "Yeux et cheveux"
 setting_bm_physical_alteration_eyes_hair_desc: "La magie du sang modifie progressivement les yeux des hématurges et, à mesure que leur maîtrise augmente, blanchit leurs cheveux."
 rule_bm_initiation_faith_requirement: "Foi requise pour l'initiation"
 setting_bm_initiation_dedicated_cult: "Culte du sang consacré"
 setting_bm_initiation_dedicated_cult_desc: "Seuls les personnages qui suivent le Culte de la Quintessence ou une foi explicitement désignée comme culte de la magie du sang peuvent accomplir le rite d'initiation."
 setting_bm_initiation_cult_or_witchcraft_accepted: "Culte du sang ou sorcellerie acceptée"
 setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Les personnages peuvent accomplir le rite d'initiation s'ils suivent le Culte de la Quintessence, une foi explicitement désignée comme culte de la magie du sang ou une foi qui accepte la sorcellerie."
 rule_quintessence_religion: "Religion des hématurges"
 setting_quintessence_religion_disabled: "Désactivé"
 setting_quintessence_religion_disabled_desc: "La décision permettant d'embrasser une foi d'hématurge est désactivée."
 setting_quintessence_religion_enabled: "Activé"
 setting_quintessence_religion_enabled_desc: "La décision permettant d'embrasser une foi d'hématurge est accessible à tous."
 setting_quintessence_religion_enabled_player_only: "Joueur uniquement"
 setting_quintessence_religion_enabled_player_only_desc: "Seuls les personnages joueurs peuvent décider d'embrasser une foi d'hématurge."
