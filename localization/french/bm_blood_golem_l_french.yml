l_french:
 blood_golem.001.a: "Lève-toi, ma création. Ton voyage ne fait que commencer."
 blood_golem.001.desc: "Le cercle rituel est achevé, tracé avec votre propre sang mêlé à de rares substances alchimiques. En son centre se dresse une silhouette vaguement humaine, façonnée d'argile rouge, de limon et de poussière d'os. Lorsque vous prononcez les derniers mots de l'incantation, le sang jaillit de vos mains tendues et pénètre la statue d'argile.\n\nRien ne se produit tout d'abord. Puis un frémissement parcourt la forme. Des fissures apparaissent à sa surface et laissent filtrer une faible lueur écarlate. La statue remue ; l'argile se remodèle et dessine des traits humains plus précis. Lentement, ses articulations plient, ses doigts se crispent et ses paupières sculptées s'ouvrent enfin sur deux orbes d'un rouge carmin incandescent.\n\nLe golem de sang fait un premier pas chancelant, puis s'agenouille devant vous. Sa bouche demeure immobile, mais sa voix résonne directement dans votre esprit : un murmure né de votre propre sang, désormais doué de conscience.\n\n« Créateur... Je vis pour vous servir. »"
 blood_golem.001.title: "La naissance du sang et de l'argile"
 blood_golem.002.athletic: "Lui conférer une agilité surnaturelle"
 blood_golem.002.berserker: "Lui insuffler la rage du combat"
 blood_golem.002.blademaster: "Lui transmettre la maîtrise des armes"
 blood_golem.002.complete: "Achever le rituel et lier le golem à mon service"
 blood_golem.002.complete.tooltip: "Votre golem de sang conservera ses traits actuels, qui seront définitivement scellés."
 blood_golem.002.desc: "Votre golem de sang se tient devant vous, prêt à être perfectionné. Votre magie peut encore modeler votre création et développer les aptitudes qui serviront le mieux vos desseins."
 blood_golem.002.fail: "L'amélioration échoue"
 blood_golem.002.fail_crit: "L'amélioration tourne au désastre"
 blood_golem.002.hunter: "Lui inculquer l'instinct du chasseur"
 blood_golem.002.physique: "Renforcer son corps"
 blood_golem.002.prowess: "Lui enseigner l'art du combat"
 blood_golem.002.success: "Golem de sang amélioré"
 blood_golem.002.title: "Perfectionner le golem de sang"
 blood_golem.002.viking: "Lui insuffler l'esprit du pillard"
 blood_golem_creation_decision: "Créer un golem de sang"
 blood_golem_creation_decision_confirm: "Insuffler la vie à l'argile par le sang"
 blood_golem_creation_decision_desc: "Les anciens tomes décrivent des serviteurs façonnés dans la terre et animés par l'essence même de la vie. Un rituel complexe, exigeant une immense puissance magique, permet de lier votre force vitale à une forme artificielle et de créer un serviteur loyal dont l'existence dépend de votre sang. Gardien autant qu'instrument, ce golem prolongera votre volonté avec des facultés bien supérieures à celles d'un mortel. Le rite vous privera d'une grande part de votre vitalité, mais donner conscience à un tel être consacrera votre maîtrise de l'hématurgie."
 blood_golem_creation_decision_tooltip: "Créez un serviteur doué de conscience, lié à votre sang et d'une loyauté indéfectible."
 blood_golem_creation_decision_tt: "Vous créez un puissant combattant que vous pourrez encore améliorer au prix de votre piété"
 blood_golem_creator: "Créateur par le sang"
 blood_golem_creator_desc: "Ce personnage m'a donné la vie grâce à l'hématurgie."
 bm_house_golem: "Golem"
 bm_house_golem_motto: "La chair faiblit, l'argile demeure"
 bm_the_prefix: "les "
 dynn_bm_golem: "Golem"
