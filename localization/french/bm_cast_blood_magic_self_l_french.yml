 NOT_bm_cast_blood_magic_self_major_blood_rune_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 NOT_bm_cast_blood_magic_self_major_improve_education_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 NOT_bm_cast_blood_magic_self_major_new_education_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 bm_attune_lifeforce.001.b: "Longévité — Prolonger mes jours et acquérir la sagesse des âges"
 bm_attune_lifeforce.001.c: "Éveil — Accélérer mon développement magique"
 bm_attune_lifeforce.001.d: "Lignée — Renforcer l'héritage magique de ma dynastie"
 bm_attune_lifeforce.001.desc: "L'essence écarlate qui coule dans mes veines palpite d'une puissance encore indécise. En accordant ma magie à une discipline précise, j'en approfondirai plus vite la maîtrise."
 bm_attune_lifeforce.001.e: "Bénédiction — Améliorer mes pouvoirs de guérison et de renforcement"
 bm_attune_lifeforce.001.f: "Hématurgie — Affiner ma maîtrise de la récolte de force vitale"
 bm_attune_lifeforce.001.title: "Harmoniser l'hématurgie"
 bm_attune_lifeforce.effects_list: "Choisissez l'une des affinités suivantes (vous ne pouvez en avoir qu'une à la fois) :\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('ancient_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('enlightenment_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('bloodline_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('benediction_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('hematurgy_attuned').GetNameWithTooltip]"
 bm_cast_blood_magic_self_attune_lifeforce: "Affinité de force vitale"
 bm_cast_blood_magic_self_attune_lifeforce_desc: "Dépensez [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] pour harmoniser votre hématurgie avec une voie particulière du trait [GetTrait('lifestyle_blood_mage').GetName( GetNullCharacter )] et gagner davantage d'expérience."
 bm_cast_blood_magic_self_channel_minor_lifeforce: "Canaliser une force vitale mineure"
 bm_cast_blood_magic_self_channel_minor_lifeforce_desc: "Dépensez [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] pour obtenir un léger avantage temporaire."
 bm_cast_blood_magic_self_major_blood_rune: "Graver des runes de sang"
 bm_cast_blood_magic_self_major_blood_rune_desc: "Dépensez [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] pour graver dans votre chair une rune de sang permanente."
 bm_cast_blood_magic_self_major_blood_rune_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 bm_cast_blood_magic_self_major_crimson_empowerment: "Canaliser le renforcement écarlate"
 bm_cast_blood_magic_self_major_crimson_empowerment_desc: "Dépensez [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] pour accroître définitivement vos facultés physiques et mentales."
 bm_cast_blood_magic_self_major_improve_education: "Perfectionner son éducation"
 bm_cast_blood_magic_self_major_improve_education_desc: "Dépensez [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] pour tenter d'améliorer l'un de vos traits d'éducation."
 bm_cast_blood_magic_self_major_improve_education_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 bm_cast_blood_magic_self_major_new_education: "Acquérir une nouvelle éducation"
 bm_cast_blood_magic_self_major_new_education_desc: "Dépensez [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] pour tenter d'acquérir un nouveau trait d'éducation."
 bm_cast_blood_magic_self_major_new_education_xp_requirement: "Nécessite au moins [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] points d'expérience en [GetTrait('lifestyle_crimson_empowerment').GetName( GetNullCharacter )]"
 bm_channel_lifeforce_enlightenment_minor.001.a: "Diplomatie — Une goutte de sang sur ma langue déliera les secrets"
 bm_channel_lifeforce_enlightenment_minor.001.b: "Martialité — Ma lame a soif de combat"
 bm_channel_lifeforce_enlightenment_minor.001.c: "Intendance — Une vision teintée de sang révèle les valeurs cachées"
 bm_channel_lifeforce_enlightenment_minor.001.d: "Intrigue — Les ombres s'écarteront devant mon regard écarlate"
 bm_channel_lifeforce_enlightenment_minor.001.desc: "Un murmure de puissance s'éveille dans mes veines. Ce n'est pas le rugissement d'un grand rituel, mais ce frémissement suffira à m'accorder un avantage. Avec assez de concentration, je peux diriger ce mince courant écarlate vers l'une de mes facultés et l'aiguiser pour un temps."
 bm_channel_lifeforce_enlightenment_minor.001.e: "Érudition — Le savoir palpite à chaque battement de cœur"
 bm_channel_lifeforce_enlightenment_minor.001.f: "Fertilité — Que notre descendance prospère"
 bm_channel_lifeforce_enlightenment_minor.001.g: "Expérience — Le sang se souvient des chemins du pouvoir"
 bm_channel_lifeforce_enlightenment_minor.001.h: "Prouesse — La lame sera trempée dans le sang"
 bm_channel_lifeforce_enlightenment_minor.001.title: "Le murmure du sang"
 bm_crimson_empowerment_event.001.charisma: "Charisme — Mes paroles distilleront un venin auquel nul ne résiste"
 bm_crimson_empowerment_event.001.desc: "L'hématurgie rugit en moi comme une bête en cage, impatiente d'être libérée. Je la sens se tendre sous ma chair, prête à remodeler mon essence selon ma volonté. Quelle part de mon être vais-je lui abandonner aujourd'hui ?"
 bm_crimson_empowerment_event.001.expertise: "Expertise — Le sang se souvient de tout ce qu'il a vu au fil des âges"
 bm_crimson_empowerment_event.001.fury: "Fureur — Le champ de bataille rougira de mon triomphe"
 bm_crimson_empowerment_event.001.insight: "Perspicacité — La sagesse du sang ancien inondera mon esprit"
 bm_crimson_empowerment_event.001.legacy: "Héritage — Une vitalité sans pareille animera ma lignée"
 bm_crimson_empowerment_event.001.prosperity: "Prospérité — La richesse affluera entre mes mains comme le sang"
 bm_crimson_empowerment_event.001.shadows: "Ombres — Le sang de mes ennemis me livrera leurs secrets"
 bm_crimson_empowerment_event.001.title: "Renforcement écarlate"
 bm_crimson_empowerment_event.001.toast: "Renforcement écarlate"
 bm_crimson_empowerment_event.001.versatility: "Polyvalence — Mon pouvoir transcendera toutes les limites"
 bm_education_enhancement.001.desc: "L'essence écarlate s'engouffre dans les canaux que vous avez préparés, chacun gravé de runes de savoir et de puissance. Au moment d'entamer le rituel, vous devez choisir la discipline que l'hématurgie approfondira. L'épreuve sera ardue : plus votre éducation est poussée, plus il sera difficile de la perfectionner encore."
 bm_education_enhancement.001.diplomacy: "Perfectionner mon éducation diplomatique"
 bm_education_enhancement.001.intrigue: "Perfectionner mon éducation à l'intrigue"
 bm_education_enhancement.001.learning: "Perfectionner mon éducation érudite"
 bm_education_enhancement.001.martial: "Perfectionner mon éducation martiale"
 bm_education_enhancement.001.stewardship: "Perfectionner mon éducation à l'intendance"
 bm_education_enhancement.001.title: "Le savoir infusé dans le sang"
 bm_education_enhancement.failure: "L'infusion sanguine échoue"
 bm_education_enhancement.success: "Éducation perfectionnée"
 bm_education_new.001.desc: "D'antiques ouvrages s'ouvrent devant vous tandis que vous préparez le lieu du rituel. Cette fois, il ne s'agit plus d'approfondir un savoir acquis : vous devrez abattre les barrières de votre esprit et y bâtir de nouvelles structures de pensée. Les runes écarlates peintes sur vos tempes palpitent déjà. Elles conduiront le savoir jusqu'au plus profond de votre conscience. Quelle discipline inconnue imposerez-vous aujourd'hui à votre esprit ?"
 bm_education_new.001.diplomacy: "Acquérir une éducation diplomatique"
 bm_education_new.001.intrigue: "Acquérir une éducation à l'intrigue"
 bm_education_new.001.learning: "Acquérir une éducation érudite"
 bm_education_new.001.martial: "Acquérir une éducation martiale"
 bm_education_new.001.stewardship: "Acquérir une éducation à l'intendance"
 bm_education_new.001.title: "Refaçonner mon esprit"
 channel_lifeforce_enlightenment_minor.effects_list: "Canalisez une hématurgie mineure pour améliorer temporairement un attribut :\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('diplomacy_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('martial_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('stewardship_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('intrigue_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('learning_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('prowess_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('exp_lifeforce_modifier').GetNameWithTooltip]"
 new_education_decision: "Acquérir un nouveau savoir"
