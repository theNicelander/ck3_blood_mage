l_french:
 bm_mass_lifedrain.001: "La moisson des cachots"
 bm_mass_lifedrain.001.a: "LES VIDER JUSQU'AU DERNIER !"
 bm_mass_lifedrain.001.b: "Épargner les plus précieux. Les autres ne sont que du bétail."
 bm_mass_lifedrain.001.desc: "Vous descendez dans les profondeurs humides de vos cachots. À travers les murs de pierre, vous percevez les pulsations de la force vitale de vos captifs. Chacun d'eux recèle une puissance brute qui ne demande qu'à être prise, une essence que le rituel changera en énergie magique pour nourrir vos arts. L'air s'alourdit tandis que vous commencez les préparatifs."
 bm_mass_lifedrain.001.title: "La moisson sanglante"
 bm_mass_lifedrain.001.z: "Peut-être une autre fois..."
 bm_mass_lifedrain_custom_tooltip_a: "Tous les prisonniers seront drainés. Vous gagnerez de la force vitale pour chacun d'eux ainsi que de l'expérience en hématurgie, mais les exécutions injustifiées pourront vous valoir de la tyrannie."
 bm_mass_lifedrain_custom_tooltip_b: "Les prisonniers aux traits précieux et leurs proches seront épargnés. Tous les autres seront vidés de leur force vitale."
 bm_mass_lifedrain_custom_tooltip_z: "Le rituel est annulé. Aucun prisonnier ne sera blessé et vous ne gagnerez aucune force vitale."
 death_lifedrain_reason: "a été vidé de sa force vitale par un hématurge"
 mass_lifedrain_prisoners_decision: "Récolter la force vitale des prisonniers"
 mass_lifedrain_prisoners_decision_confirm: "Commencer la moisson"
 mass_lifedrain_prisoners_decision_desc: "Les cachots regorgent de prisonniers dont la force vitale palpite comme un fruit mûr prêt à être cueilli. Leur énergie réunie pourrait alimenter de puissants sortilèges de sang."
 mass_lifedrain_prisoners_decision_effect_message: "Commencez une cérémonie écarlate afin de récolter la force vitale de vos prisonniers et choisissez :\n$EFFECT_LIST_BULLET$de drainer tous les prisonniers pour gagner un maximum de force vitale\n$EFFECT_LIST_BULLET$d'épargner ceux qui possèdent des traits précieux afin de pouvoir les exploiter plus tard"
 mass_lifedrain_prisoners_decision_tooltip: "Choisissez les prisonniers à drainer et convertissez leur essence vitale en puissance magique."
