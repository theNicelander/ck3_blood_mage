l_french:
 nick_the_wanderer: "le Vagabond"
 nick_the_wanderer_desc: "Ce personnage erre sans but."
 seek_power.001.a: "Me fier à mon instinct pour débusquer une proie digne de moi"
 seek_power.001.desc: "Au-delà de votre campement, les terres sauvages palpitent d'énergie vitale. Des arbres séculaires s'élancent vers le ciel, leurs racines abreuvées par un sol enrichi d'innombrables cycles de mort et de renaissance. À mesure que vous vous enfoncez dans ce domaine indompté, la puissance primitive de l'hématurgie s'intensifie et vous attire vers des victimes capables d'assouvir votre faim occulte."
 seek_power.001.title: "Les terres indomptées"
 seek_power.002.a: "Drainer le cerf"
 seek_power.002.desc: "Votre chasse vous mène jusqu'à un cerf magnifique dont le souffle forme des nuages de brume dans l'air glacé. La bête se tient fièrement, inconsciente de votre présence tandis que vous préparez le rituel. L'hématurgie ne requiert ni arc ni lame, seulement votre volonté et les antiques paroles de pouvoir. Lorsque vous entamez l'incantation, un lien se noue entre votre essence et la force vitale de l'animal."
 seek_power.002.title: "La moisson sauvage"
 seek_power.003.a: "Cette force vitale servira mieux entre mes mains"
 seek_power.003.b: "M'approprier ses dons"
 seek_power.003.c: "Peut-être cette âme consentira-t-elle à me suivre"
 seek_power.003.d: "Ce vagabond ne mérite pas mon attention. Je chercherai ailleurs."
 seek_power.003.desc: "Au plus profond des terres sauvages, loin de tout chemin, vous rencontrez une silhouette solitaire. Vêtu de haillons et grelottant de froid, ce voyageur semble s'être égaré depuis plusieurs jours. Décharné et affaibli, il lève vers vous un regard où se mêlent l'espoir et la peur. Malgré son état pitoyable, vous percevez en lui un trésor que d'autres auraient négligé : une essence vitale prête à être cueillie... à moins que vos dons occultes ne vous offrent l'occasion de faire preuve de clémence."
 seek_power.003.title: "Une âme égarée"
 seek_power.004.a: "Recueillir le sang sacré avec mesure"
 seek_power.004.desc: "Au plus profond de la forêt primordiale, là où la lumière peine à traverser l'épaisse canopée, vous découvrez une aberration de la nature : un chêne colossal, sans pareil au monde. Son tronc, large comme une muraille, bat d'un rythme visible. D'antiques runes au sens oublié entaillent son écorce.\n\nSous votre paume, le bois est chaud comme de la chair. Une impulsion vous pousse à inciser légèrement l'écorce et, à votre stupéfaction, une sève écarlate qui possède l'aspect et l'odeur du sang se met à couler. Il ne s'agit pas d'une simple sève : au fil des siècles, cette sentinelle ancestrale a absorbé l'essence de milliers de créatures jusqu'à devenir un foyer d'énergie vitale pure.\n\nLorsque vos doigts effleurent le liquide carmin, votre esprit est submergé de visions : bêtes antiques, civilisations oubliées, secrets ensevelis par les âges. Cet arbre a tout vu et ses racines plongent jusqu'au cœur du monde. Une telle puissance pourrait nourrir votre magie au-delà de toute mesure, mais en prendre trop risquerait d'éveiller la colère de la force primordiale qui maintient ce prodige en vie."
 seek_power.004.title: "Le cœur sanglant de la forêt"
 seek_power.duel.animal: "Je tombe sur du gibier"
 seek_power.duel.escape: "Ma proie s'échappe"
 seek_power.duel.join: "Le voyageur me rejoint"
 seek_power.duel.legendary: "Je rencontre une bête légendaire"
 seek_power.duel.separate: "Nos chemins se séparent"
 seek_power.duel.silent_harvest: "Moisson silencieuse"
 seek_power.duel.traveler: "Je découvre un voyageur égaré"
 seek_power.duel.witnessed: "Un témoin m'a vu"
 seek_power.toast.ancient_lifeforce: "Force vitale ancestrale récoltée"
 seek_power.toast.escape: "Ma proie s'est enfuie ; je repars les mains vides"
 seek_power.toast.join: "Le voyageur me rejoint"
 seek_power.toast.separate: "Nos chemins se séparent"
 seek_power.toast.silent_drain: "J'ai vidé le voyageur sans être vu"
 seek_power.toast.stag: "J'ai drainé le cerf"
 seek_power.toast.witnessed: "Un témoin a survécu pour raconter ce qu'il a vu"
 seek_power_decision: "Chercher le pouvoir dans les terres sauvages"
 seek_power_decision_confirm: "S'aventurer dans les terres sauvages"
 seek_power_decision_desc: "Aventurez-vous au-delà de votre campement, dans les terres sauvages où les forces primitives de l'hématurgie sont les plus puissantes. Les bêtes et les voyageurs égarés pourront apaiser votre faim occulte ou servir de sujets à vos expériences."
 seek_power_decision_tooltip: "Explorez les terres sauvages à la recherche de sacrifices qui nourriront votre hématurgie, qu'il s'agisse de bêtes ou d'âmes infortunées croisant votre chemin."
