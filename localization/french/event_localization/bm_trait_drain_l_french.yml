l_french:
 bm_trait_drain.001.b: "Quelle vive intelligence... Elle me servirait bien."
 bm_trait_drain.001.c: "Je pourrais être plus fort..."
 bm_trait_drain.001.d: "Quelle beauté... Pourquoi ne deviendrait-elle pas mienne ?"
 bm_trait_drain.001.desc: "Le prisonnier s'agenouille devant vous, les yeux écarquillés de terreur tandis que des runes écarlates s'éveillent sur le sol de la pièce. Ses supplications s'éteignent en murmures à votre approche, alors que vos doigts tracent des motifs arcaniques dans les airs. Vous percevez ce qui le rend exceptionnel — cette étincelle d'intelligence, cette vigueur physique, cette beauté surnaturelle — palpitant sous sa peau tel un fanal offert à votre pouvoir.\n\nL'hématurgie exige un sacrifice, et ses dons seront bientôt vôtres. L'air s'alourdit tandis que les filaments de votre conscience se déploient, prêts à arracher l'objet de votre désir. Ses lèvres tremblent et articulent quelques mots désespérés :\n\n« Je vous en prie... Tout sauf cela... »\n\nMais vous savez ce qu'il en est. Son essence vous servira bien mieux que sa chair ne le pourrait jamais."
 bm_trait_drain.001.e: "Voilà qui me plaît."
 bm_trait_drain.001.f: "Quelle taille impressionnante... La vue doit être belle de là-haut."
 bm_trait_drain.001.fail: "Je ne parviens pas à lui arracher ce don"
 bm_trait_drain.001.g: "Ce sang a une saveur exquise..."
 bm_trait_drain.001.h: "Une telle vigueur me serait fort utile."
 bm_trait_drain.001.nice: "Voilà qui me plaît."
 bm_trait_drain.001.success: "Je m'approprie ce don"
 bm_trait_drain.001.title: "La récolte de l'essence"
 bm_trait_drain.001.z: "Libérer le prisonnier..."
