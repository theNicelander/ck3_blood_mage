l_french:
  # Groupe
  trait_lifestyle_blood_mage_group: "Hématurge"
  trait_blood_mage_desc: "Maîtres d'une magie interdite, les hématurges manipulent la force vitale pour prolonger la vie, améliorer leurs capacités, guérir autrui et absorber les traits de victimes dignes de ce nom."

  # Trait d'hématurge
  trait_lifestyle_blood_mage: "Hématurge"
  trait_lifestyle_blood_mage_desc: "Maîtres d'une magie interdite, les hématurges manipulent la force vitale pour prolonger la vie, soigner les maux, transmettre leur pouvoir et absorber les traits de leurs victimes."

  trait_track_enlightenment: "Éveil"
  trait_track_bloodline: "Lignée"
  trait_track_benediction: "Bénédiction"
  trait_track_hematurgy: "Hématurgie"
  trait_track_ancient: "Longévité"

  trait_track_ancient_desc: "#help Vous gagnez de l'expérience dans cette voie chaque année.#!\n\nLe temps s'incline devant ceux qui commandent l'essence même de la vie."
  trait_track_enlightenment_desc: "#help Vous gagnez de l'expérience dans cette voie en lançant de l'hématurgie sur vous-même.#!\n\nLa voie de la maîtrise commence par la transformation de soi."
  trait_track_bloodline_desc: "#help Vous gagnez de l'expérience dans cette voie en renforçant votre dynastie. Les chances annuelles dépendent du nombre de modificateurs d'hématurge que possède la dynastie.#!\n\nLe sang appelle le sang à travers les générations."
  trait_track_benediction_desc: "#help Vous gagnez de l'expérience dans cette voie en soignant les maux et en accordant des pouvoirs à autrui.#!\n\nLe plus grand don d'un hématurge est la vie elle-même, offerte au prix d'un sacrifice écarlate."
  trait_track_hematurgy_desc: "#help Vous gagnez de l'expérience dans cette voie en drainant la force vitale et en récoltant les traits d'autrui.#!\n\nCe que les autres possèdent peut devenir vôtre grâce aux arts écarlates."

  # Renforcement écarlate
  trait_lifestyle_crimson_empowerment: "Renforcement écarlate"
  trait_lifestyle_crimson_empowerment_desc: "Ce personnage a remodelé son essence grâce à l'hématurgie, acquérant des capacités extraordinaires qui évoluent à mesure qu'il emploie ses pouvoirs."

  trait_track_charisma: "Charisme"
  trait_track_fury: "Fureur"
  trait_track_prosperity: "Prospérité"
  trait_track_shadows: "Ombres"
  trait_track_insight: "Perspicacité"
  trait_track_legacy: "Héritage"
  trait_track_expertise: "Expertise"

  trait_track_charisma_desc: "L'hématurgie renforce la présence diplomatique et le pouvoir de persuasion de ce personnage."
  trait_track_fury_desc: "Ce personnage canalise l'hématurgie pour décupler sa prouesse martiale et dominer le champ de bataille."
  trait_track_prosperity_desc: "L'hématurgie renforce les talents administratifs et la gestion du domaine de ce personnage."
  trait_track_shadows_desc: "Ce personnage emploie l'hématurgie pour perfectionner sa discrétion, ses tromperies et ses complots."
  trait_track_insight_desc: "L'hématurgie confère à ce personnage un savoir et une érudition surnaturels."
  trait_track_legacy_desc: "Ce personnage a renforcé sa lignée par la magie, améliorant ses traits génétiques et sa fertilité."
  trait_track_expertise_desc: "L'hématurgie accélère la maîtrise de toutes les compétences et aptitudes de ce personnage."

  bm_yearly_attunement_ancient_toast: "Votre affinité avec la Longévité vous a accordé de l'expérience"
  bm_yearly_attunement_enlightenment_toast: "Votre affinité avec l'Éveil vous a accordé de l'expérience"
  bm_yearly_attunement_bloodline_toast: "Votre affinité avec la Lignée vous a accordé de l'expérience"
  bm_yearly_attunement_benediction_toast: "Votre affinité avec la Bénédiction vous a accordé de l'expérience"
  bm_yearly_attunement_hematurgy_toast: "Votre affinité avec l'Hématurgie vous a accordé de l'expérience"
