l_french:
 bm_blood_rune_decision: "Graver des runes de sang"
 bm_blood_rune_decision_confirm: "Commencer la gravure des runes de sang"
 bm_blood_rune_decision_desc: "Recourez à l'antique hématurgie pour graver dans votre chair des runes permanentes qui renforceront votre lien avec la force vitale. Ces tatouages arcaniques récolteront passivement l'énergie vitale ambiante, accroissant progressivement votre puissance."
 bm_blood_rune_decision_tooltip: "Gravez sur votre corps des runes de sang permanentes qui récolteront peu à peu la force vitale."
 bm_crimson_rune.001.desc: "Vous déployez d'antiques parchemins couverts de motifs ésotériques : des runes de sang capables de transformer le corps d'un hématurge en réceptacle destiné à recueillir la force vitale. Le rituel requiert des aiguilles spéciales forgées dans un feu nourri de sang, des encres mêlées à votre propre essence et la main assurée de celui qui sait que chaque trait n'est pas simplement gravé, mais lié à votre être tout entier.\n\nLa douleur sera insoutenable et votre engagement irrévocable. Pourtant, à chaque goutte de sang et d'encre qui se mêle à votre chair, votre affinité avec les arts écarlates se renforce. Ces marques distinguent le véritable hématurge : celui qui ne se contente plus de manier cette magie, mais en devient l'incarnation vivante."
 bm_crimson_rune.001.major: "Rune écarlate majeure : un réseau de puissance parcourant ma chair"
 bm_crimson_rune.001.minor: "Rune écarlate mineure : un sceau palpitant au-dessus de mon cœur"
 bm_crimson_rune.001.superior: "Rune écarlate supérieure : faire de ma peau un grimoire vivant d'hématurgie"
 bm_crimson_rune.001.title: "Graver des runes de sang"
 bm_crimson_rune.001.z: "Les marques que je porte me suffisent déjà amplement."
 bm_crimson_rune_yearly_event_popup.title: "Votre rune écarlate vous confère de la force vitale"
 crimson_runes_effects_list.effects_list: "Obtenez des runes de sang de plus en plus puissantes (chaque niveau remplace le précédent) :\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('minor_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('major_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('superior_crimson_rune_modifier').GetNameWithTooltip]"
 major_crimson_rune_modifier: "Rune écarlate majeure"
 major_crimson_rune_modifier_desc: "Ces runes complexes récoltent parfois de la [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] dans votre environnement, avec d'occasionnels afflux de [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]. Il leur arrive, plus rarement, de capter simultanément les deux formes d'énergie.\n\nDe fins tatouages écarlates serpentent sur votre torse et vos bras tels des veines vivantes, recueillant sans relâche l'essence vitale environnante pour alimenter vos réserves magiques."
 minor_crimson_rune_modifier: "Rune écarlate mineure"
 minor_crimson_rune_modifier_desc: "Ces rudimentaires symboles de sang récoltent parfois de la [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] à votre profit.\n\nGravés dans le sang autour de votre cœur, ces symboles arcaniques palpitent faiblement sous votre peau et attirent la force vitale ambiante dans votre corps tel un second cœur au rythme lent."
 superior_crimson_rune_modifier: "Rune écarlate supérieure"
 superior_crimson_rune_modifier_desc: "Ces magistrales inscriptions de sang attirent fréquemment de la [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] sans le moindre effort de votre part. Elles captent régulièrement de la [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] et parviennent parfois à manifester simultanément les deux formes de pouvoir.\n\nDe magistrales inscriptions sanguines recouvrent vos organes vitaux et semblent parfois onduler sous votre peau. Votre corps est devenu un conduit permanent de force vitale, puisant sa puissance dans l'air même que vous respirez."
