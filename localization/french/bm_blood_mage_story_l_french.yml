l_french:
 bm_blood_mage_story:0 "Hématurgie"
 bm_blood_mage_story_desc:0 "Votre sang est à la fois grimoire et creuset. Chaque rite approfondit votre maîtrise d'une discipline des arts écarlates."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help Chaque discipline atteint son niveau de maîtrise maximale à 100 points d'expérience. Survolez une discipline pour afficher ses règles de progression.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#! : #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#! : #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#! : #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#! : #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#! : #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Golems de sang"
 BM_CRIMSON_RETINUE:0 "Guerriers et Champions écarlates"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Actualiser les Golems de sang, Guerriers écarlates et Champions écarlates servant actuellement à votre cour"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Actualiser les listes de personnages affichées dans ce panneau"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Aucun"
 bm_blood_mage_lifeforce_major:0 "Force vitale : #P Réserve majeure#!"
 bm_blood_mage_lifeforce_minor:0 "Force vitale : #V Réserve mineure#!"
 bm_blood_mage_lifeforce_negative_major:0 "Force vitale : #N Profondément épuisée#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Force vitale : #N Épuisée#!"
 bm_blood_mage_lifeforce_none:0 "Force vitale : #weak Non manifestée#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Charges de force vitale#! — #P Majeures#! : #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Mineures#! : #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Force vitale#!\nLes réserves de forces vitales mineure et majeure sont des réserves distinctes et cumulables, récoltées par l'absorption de vie et d'autres rites. Les pouvoirs d'hématurgie indiquent quelle réserve ils consomment ; lancer un sort retire normalement la réserve requise et peut épuiser temporairement votre force vitale.\n\nTant qu'elle n'est pas dépensée, chaque réserve améliore la santé, la fertilité, l'espérance de vie et la résistance aux maladies. Une réserve majeure offre trois fois les bénéfices de survie d'une réserve mineure."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Affinité#! : #weak Aucune#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Affinité de force vitale#!\nDépensez une Force vitale mineure et 25 de Piété avec l'interaction personnelle #V Affinité de force vitale#! pour choisir une discipline d'hématurgie. Une seule Affinité peut être maintenue : en choisir une autre remplace l'actuelle, et l'interaction a un délai de cinq ans.\n\nChaque année, la discipline choisie a 50 % de chances de gagner #P 1 point d'expérience#!. Son modificateur d'Affinité accorde aussi un avantage passif propre à la discipline."
