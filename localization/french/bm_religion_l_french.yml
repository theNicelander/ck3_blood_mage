l_french:
  # Ordres sacrés
  holy_order_knights_of_the_crimson_chalice: "Chevaliers du Calice écarlate"
  holy_order_custodians_of_the_vital_essence: "Gardiens de l'Essence vitale"
  holy_order_crimson_covenant: "Pacte écarlate"
  holy_order_sanguine_disciples: "Disciples sanguins"
  holy_order_crimson_tide: "Marée écarlate"
  holy_order_bloodbound_sentinels: "Sentinelles liées par le sang"
  holy_order_scarlet_vanguard: "Avant-garde écarlate"

  # Famille religieuse
  rf_quintessence: "Quintessence"
  rf_quintessence_desc: "Foi cherchant à maîtriser l'essence vitale portée par le sang."
  rf_quintessence_opinion: "Opinion envers [GetReligionFamily('rf_quintessence').GetName]"

  # Termes fondamentaux de la religion
  quintessence_religion: "Culte de la Quintessence"
  quintessence_religion_adj: "quintessentialiste"
  quintessence_religion_adherent: "quintessentialiste"
  quintessence_religion_adherent_plural: "quintessentialistes"
  quintessence_religion_desc: "Pour le Culte de la Quintessence, la force vitale primordiale qui traverse tout être n'est pas divine : elle est la source suprême de tout pouvoir. Par des rites sanglants interdits et des sacrifices savamment mesurés, ses adeptes extraient cette essence, la façonnent et s'en nourrissent afin de dépasser les limites de la condition mortelle. Là où les religions ordinaires vénèrent des dieux, les quintessentialistes aspirent à régner sur la trame même de l'existence."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"

  # Termes fondamentaux de la foi
  quintessence_faith: "Culte de la Quintessence"
  quintessence_faith_adj: "quintessentialiste"
  quintessence_faith_adherent: "quintessentialiste"
  quintessence_faith_adherent_plural: "quintessentialistes"
  quintessence_faith_desc: "Les quintessentialistes chrétiens proclament que le sang versé au Calvaire révéla un mystère plus profond : la vie elle-même est un courant sacré que l'on peut répandre, recevoir et maîtriser. Ils relisent la Passion, les martyrs et l'Eucharistie à la lumière d'une théologie écarlate interdite. Chaque battement de cœur ferait écho au sacrifice du Christ, et quiconque perce le mystère du sang pourrait vaincre la fragilité de la chair mortelle."

  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Les quintessentialistes musulmans affirment qu'Allah seul est divin, tandis que le sang est une amanah — un dépôt sacré confié à chaque corps vivant. Selon eux, prophètes, médecins et mystiques ont chacun entrevu une partie de sa loi cachée. Par des rites disciplinés, le jeûne et des sacrifices soigneusement mesurés, les fidèles pourraient maîtriser le courant vital tout en se soumettant à l'ordre inscrit dans la création."

  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Les quintessentialistes juifs partent de l'ancien enseignement selon lequel la vie de la chair réside dans le sang. Ils voient dans l'Alliance, la circoncision et le souvenir des sacrifices du Temple les fragments d'une discipline secrète, car le sang porterait à la fois l'héritage des générations et les obligations qui unissent un peuple. Commander cet héritage revient, à leurs yeux, à toucher le courant le plus profond de la création."

  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Les quintessentialistes orientaux décrivent la Quintessence comme le courant vital qui parcourt le samsara : souffle, sang, karma et conscience unis dans une même circulation. Certains la nomment prana, tandis que d'autres y voient un moyen de se libérer de l'attachement ou de purifier le fardeau karmique. Tous enseignent que des rites rigoureux peuvent rediriger ce courant vers l'éveil, la longévité et la libération finale."

  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Les quintessentialistes sinitiques estiment que le sang est le réceptacle le plus dense du qi, hérité des ancêtres et ordonné sous le Ciel. En retraçant les méridiens du corps, en honorant les morts et en équilibrant sacrifice et harmonie, ils cherchent à raffiner l'essence reçue plutôt qu'à la gaspiller. Une circulation parfaite unirait le corps, la lignée et le cosmos dans un même ordre écarlate."

  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Les quintessentialistes ásatrú rejettent tout compromis étranger et reconnaissent le flux carmin dans l'épreuve d'Odin, la fureur guerrière des einherjar et le sang versé lors du blót. Tuer ou mourir avec détermination libère du pouvoir dans le clan, la terre et les dieux ; la guerre est sacrement, le sacrifice est échange, et la Quintessence appartient à ceux qui ont l'audace de s'en emparer."

  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Pour les adeptes des anciens dieux, le sang demeure la première langue parlée entre les mortels, les ancêtres et les esprits. Les quintessentialistes préservent le serment, l'offrande et le banquet sacrificiel, mais enseignent que ces rites font davantage qu'apaiser les puissances invisibles : ils ouvrent des canaux par lesquels la force passe de la bête au guerrier, des morts aux vivants et de la terre au peuple qu'elle a choisi."

