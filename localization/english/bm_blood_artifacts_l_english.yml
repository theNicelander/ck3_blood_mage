l_english:
  # Blood Mage Shield & Tier Harvest Toasts
  bm_blood_drain_shield_toast: "@bm_ancient_discipline_icon! Lifeforce Shield Stripped"
  bm_blood_drain_mage_harvest_toast: "@bm_ancient_discipline_icon! Blood Mage Essence Harvested"

  # Decisions
  bm_forge_blood_artifact_decision: "Forge Blood Artifact"
  bm_forge_blood_artifact_decision_desc: "Bind Major Lifeforce into steel, gold, or bone to forge a personal Blood Artifact attuned to one of the six disciplines. Only Blood Mages draw its full power."
  bm_forge_blood_artifact_decision_tooltip: "Forge a Masterwork Blood Artifact for any inventory slot"
  bm_forge_blood_artifact_decision_confirm: "Begin the Forging"
  bm_forge_blood_artifact_decision_effect_tt: "Choose an inventory slot and a Blood Discipline to forge a Masterwork Blood Artifact (consumes 1 Major Lifeforce, 3-year cooldown)"

  bm_temper_blood_artifact_decision: "Challenge Egill to Temper Blood Artifact"
  bm_temper_blood_artifact_decision_desc: "Bring an untempered Blood Artifact and Superior Lifeforce to Reykjavik or Tsushima to face Egill Skallagrimsson. Victory tempers your relic into an Illustrious artifact."
  bm_temper_blood_artifact_decision_tooltip: "Duel Egill Skallagrimsson to upgrade a forged Blood Artifact to Illustrious"
  bm_temper_blood_artifact_decision_confirm: "Issue the Challenge"
  bm_temper_blood_artifact_decision_effect_tt: "Choose an untempered Blood Artifact and challenge Egill in a Prowess or Learning duel (consumes 1 Superior Lifeforce, 5-year cooldown)"

  NOT_bm_forge_artifact_cooldown_tt: "Has not forged a Blood Artifact in the last 3 years"
  NOT_bm_temper_artifact_cooldown_tt: "Has not challenged Egill to temper a Blood Artifact in the last 5 years"

  # Events
  bm_blood_artifact.back: "Back"
  bm_blood_artifact.0001.title: "Forge Blood Artifact: Choose Vessel"
  bm_blood_artifact.0001.desc: "The crucible hums with drawn blood and molten metal. Before infusing your Major Lifeforce, choose what form this Blood Artifact will take."
  bm_blood_artifact.0001.weapon: "Weapon (Sword)"
  bm_blood_artifact.0001.regalia: "Regalia"
  bm_blood_artifact.0001.armor: "Armor"
  bm_blood_artifact.0001.crown: "Crown"
  bm_blood_artifact.0001.trinket: "Trinket (Ring)"

  bm_blood_artifact.0002.title: "Forge Blood Artifact: Attune Discipline"
  bm_blood_artifact.0002.desc: "The vessel is shaped and cooling. Channel your Major Lifeforce through one of the six Blood Disciplines to seal its properties."
  bm_blood_artifact.0002.radiance: "Radiance (Diplomacy & Opinion)"
  bm_blood_artifact.0002.fury: "Fury (Martial & Prowess)"
  bm_blood_artifact.0002.fortune: "Fortune (Stewardship & Taxes)"
  bm_blood_artifact.0002.cunning: "Cunning (Intrigue & Schemes)"
  bm_blood_artifact.0002.wisdom: "Wisdom (Learning & Piety)"
  bm_blood_artifact.0002.ancient: "Ancient (Health, Lifespan & Fertility)"

  bm_blood_artifact.0010.title: "Egill's Crucible: Choose Relic"
  bm_blood_artifact.0010.desc: "Egill Skallagrimsson eyes the Superior Lifeforce burning in your veins and spits into the steaming earth. 'Bring forth the vessel you mean to temper, mage. Show me what you wager.'"
  bm_blood_artifact.0010.opt1: "Temper [bm_art_opt_1.GetName]"
  bm_blood_artifact.0010.opt2: "Temper [bm_art_opt_2.GetName]"
  bm_blood_artifact.0010.opt3: "Temper [bm_art_opt_3.GetName]"

  bm_blood_artifact.0011.title: "Egill's Crucible: The Trial"
  bm_blood_artifact.0011.desc: "Egill lifts a scarred axe in one hand and traces a glowing blood-rune with the other. 'Will you temper [bm_temper_target.GetName] in steel and sweat, or match your will against mine in the old runes?'"
  bm_blood_artifact.0011.prowess: "Steel and Blood (Single Combat - Prowess)"
  bm_blood_artifact.0011.learning: "Runes and Will (Arcane Contest - Learning)"
  bm_blood_artifact.0011.learning_win: "You overpower Egill's runes and temper the relic"
  bm_blood_artifact.0011.learning_loss: "Egill's runes shatter your focus"

  bm_blood_artifact_forged_toast: "@bm_ancient_discipline_icon! Blood Artifact Forged"
  bm_blood_artifact_tempered_toast: "@bm_ancient_discipline_icon! Blood Artifact Tempered to Illustrious"
  bm_blood_artifact_temper_failed_toast: "@bm_ancient_discipline_icon! Egill's Trial Failed"

