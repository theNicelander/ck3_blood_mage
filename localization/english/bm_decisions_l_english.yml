  bm_enhance_blood_ritual_decision.failure_tt: "$bm_geyser_duel.failure_tt$"

  bm_enhance_blood_ritual_decision_desc: "My extensive research into the blood arts has brought me to this precipice. Ancient lore speaks of Egill Skallagrímsson—berserker, poet, and master of blood-runes guarding the geothermal geysers of Reykjavik and the sacred springs of Tsushima. By confronting this ancient master, you can test your Learning and Prowess in a sacred blood duel.\n\nVictory will awaken your blood; defeat guarantees a shattered mind or broken flesh."

  # Blood Distillation
  bm_sanguine_distillation_decision: "Blood Distillation"
  bm_sanguine_distillation_decision_desc: "Distill the essence of your mortal disciplines, transmuting accumulated discipline experience into ancient vessel power."
  bm_sanguine_distillation_decision_tooltip: "Transmute discipline XP into Ancient track XP"
