l_english:
  # Decision group type
  decision_group_type_bm_decision_group: "Blood Mage Decisions"
  convert_to_blood_magic_from_witch.tooltip: "Become a Blood Mage"
  mass_lifedrain_prisoners_decision.text: "Has someone imprisoned"

  # Convert to blood magic from witch
  convert_to_blood_magic_from_witch: "Become a Blood Mage"
  convert_to_blood_magic_from_witch_desc: "Renounce the inferior ways of witches and become a Blood Mage!"
  convert_to_blood_magic_from_witch_confirm: "Become a Blood Mage"
  convert_to_blood_magic_from_witch_tooltip: "Become a Blood Mage"

  # Convert to the blood cultist faith
  become_blood_cultist_decision: "Embrace the Blood Cultist Faith"
  become_blood_cultist_decision_confirm: "The blood shall sustain me"
  become_blood_cultist_decision_tooltip: "Renounce your current faith and embrace the forbidden power of blood magic"
  become_blood_cultist_decision_desc: "The whispers have grown too persistent to ignore. Tales of immortality, of power drawn from the very essence of life itself. The old faiths are hollow shells compared to the tangible power offered by the Cult of Blood. Their sacred texts speak of transcendence through sacrifice, of bending the laws of nature through the manipulation of life's crimson currency. Perhaps it is time to abandon the empty promises of old gods and embrace the visceral truth that flows through every living being."
  become_blood_cultist_decision_effect_tooltip: "Choose between embracing Blóðtrú, Ketsudō, or Xuédào."

  # Repair pre-reformation head of faith
  bm_repair_blodtru_reformation_decision: "Repair Blóðtrú Reformation"
  bm_repair_blodtru_reformation_decision_confirm: "Detach the premature headship"
  bm_repair_blodtru_reformation_decision_tooltip: "Detach the premature temporal Head of Faith from Blóðtrú so the faith can be reformed; the holder's title and realm remain intact"
  bm_repair_blodtru_reformation_decision_desc: "Blóðtrú established a temporal Head of Faith before its rites were formally organized. That premature office now prevents the faith from being reformed. Detaching the office from the faith will restore its leaderless tradition until a proper religious settlement is chosen during reformation, while leaving the holder's title and realm intact."

  # Become a blood mage
  bm_self_initiation_decision: "Attempt the Self-Initiation"
  bm_self_initiation_decision_confirm: "I am my own crucible."
  bm_self_initiation_decision_desc: "The tomes and scrolls offer fragmented clues, but I have no mentor to guide me, no subject to practice upon. The only path forward is the most perilous: to perform the initiation ritual upon myself. I must become both surgeon and patient, sorcerer and sacrifice.\n\nMy own blood will be the medium, my mind the battlefield where I wrestle raw power into submission. There is no dogma here, only dangerous knowledge and the strength of my own will. If I succeed, I will command the very essence of life. If I fail, my mind and body will be the price."
  bm_self_initiation_decision_tooltip: "Use forbidden knowledge to perform an initiation ritual upon yourself. Without a guide, the risks are immense. Failure could shatter your mind or break your body."

  # Become blood mage, from blood cultist
  bm_blood_cultist_become_blood_mage_decision: "Blood Cultist: Become Blood Mage"
  bm_blood_cultist_become_blood_mage_decision_confirm: "Challenge the Ancient Master"
  bm_blood_cultist_become_blood_mage_decision_tooltip: "Travel to the sacred geysers of Reykjavik or Tsushima to challenge the ancient wise one and prove your readiness to wield blood magic"
  bm_blood_cultist_become_blood_mage_decision_desc: "As a devoted follower of the blood faith, faith alone is not enough to command the crimson arts. Ancient lore tells of the wise one—an immortal hermit of one hundred and eleven years who dwells by the boiling geothermal geysers of Reykjavik and the volcanic springs of Tsushima. By traveling to these sacred waters and testing your arcane resolve against the hermit in a duel of learning, you can prove yourself worthy to transcend from worshipper to true wielder of blood magic."



  manifest_lifeforce_major_success_tt: "You Sucessfully manifested Lifeforce"
  manifest_lifeforce_minor_success_tt: "You Sucessfully manifested Lifeforce"
  manifest_lifeforce_major_failure_tt: "You failed to manifest Lifeforce"
  manifest_lifeforce_minor_failure_tt: "You failed to manifest Lifeforce"

  # Become blood mage Decision
  bm_enhance_blood_ritual_decision: "Ritual of Blood"
  bm_enhance_blood_ritual_decision_confirm: "Challenge the Ancient Master"
  bm_enhance_blood_ritual_decision_tooltip: "Travel to the sacred geysers of Reykjavik or Tsushima to challenge the ancient wise one to a duel of learning."
  bm_enhance_blood_ritual_location_requirement_tt: "You must be present in either Reykjavik (Vestisland) or Tsushima"
  bm_enhance_blood_ritual_decision.success_tt: "$bm_geyser_duel.success_tt$"
  bm_enhance_blood_ritual_decision.mental_failure_tt: "$bm_geyser_duel.mental_failure_tt$"
  bm_enhance_blood_ritual_decision.physical_failure_tt: "$bm_geyser_duel.physical_failure_tt$"
  bm_enhance_blood_ritual_decision.injury_failure_tt: "$bm_geyser_duel.injury_failure_tt$"

  bm_enhance_blood_ritual_decision_desc: "My extensive research into the crimson arts has brought me to this precipice. Ancient lore speaks of the wise one—a solitary hermit of one hundred and eleven years guarding the geothermal geysers of Reykjavik and the sacred springs of Tsushima. By confronting this ancient master in a contest of Learning, I can wrest the deepest mysteries of blood magic into the light.\n\nVictory will awaken the crimson arts within your blood; defeat guarantees a shattered mind or broken flesh."
