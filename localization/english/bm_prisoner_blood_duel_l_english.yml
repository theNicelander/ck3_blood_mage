l_english:
  bm_prisoner_blood_duel.0001.t: "The Blood Pit Duel"
  bm_prisoner_blood_duel.0001.victor_desc: "Steel rings against steel in the crimson-stained pit. You break through [sc_defender.GetShortUINamePossessive] guard and strike [sc_defender.GetHerHim] down, draining the last of [sc_defender.GetHerHis] fierce martial essence as [sc_defender.GetHerHis] lifeblood spills across the stone."
  bm_prisoner_blood_duel.0001.loser_desc: "With desperate ferocity, [sc_defender.GetShortUIName] turns the tide of the bout and carves a deep wound across your guard. Before your guards can close the ring, [sc_defender.GetSheHe] breaks free and flees into the night, leaving only a sliver of Minor Lifeforce spilled upon the sand."
  bm_prisoner_blood_duel.0001.opt_victory: "Their blood is mine."
  bm_prisoner_blood_duel.0001.opt_defeat: "They slipped the noose..."
  bm_prisoner_blood_duel.0001.superior_tt: "Condense Superior Lifeforce"
  bm_prisoner_blood_duel.0001.major_tt: "Condense Major Lifeforce"
  bm_prisoner_blood_duel_victor_toast: "@bm_ancient_discipline_icon! Blood Pit Victory"
  bm_prisoner_blood_duel_loser_toast: "@bm_ancient_discipline_icon! Prisoner Escaped the Pit"

  bm_prisoner_blood_duel.0002.t: "Blood Pit Duel Interrupted"
  bm_prisoner_blood_duel.0002.desc: "Circumstances forced the Blood Pit Duel to be called off before a victor could be decided. Your expended Piety is returned."
  bm_prisoner_blood_duel.0002.opt: "Return them to the cells."
  bm_prisoner_blood_duel_invalidated_toast: "@bm_ancient_discipline_icon! Blood Pit Duel Interrupted"
