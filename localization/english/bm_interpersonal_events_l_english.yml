l_english:
 # Modifiers
 bm_guided_pulse_child_modifier: "Guided Crimson Pulse"
 bm_guided_pulse_child_modifier_desc: "Early guidance of the blood has honed this child's martial instincts, physical vigor, and scholastic aptitude."
 bm_golem_aegis_modifier: "Golem's Aegis"
 bm_golem_aegis_modifier_desc: "A blood golem stands as a tireless guardian, deflecting hostile blades and foiling schemes."
 bm_siphoned_golem_modifier: "Siphoned Golem Core"
 bm_siphoned_golem_modifier_desc: "Excess ichor was drawn from the golem's core to empower its master, temporarily diminishing its physical force."

 # Event 1: A Drop on the Lips
 bm_interpersonal_events.0001.t: "A Drop on the Lips"
 bm_interpersonal_events.0001.desc: "In the quiet of our private chambers, [partner.GetFirstName] draws near, eyes lingering upon the faint crimson luminescence beneath my skin. There is no horror in [partner.GetHerHis] gaze—only longing and devotion. [partner.GetSheHe|U] tilts [partner.GetHerHis] head back, baring [partner.GetHerHis] throat and whispering that [partner.GetSheHe] wishes to share the power that flows in my veins."
 bm_interpersonal_events.0001.a: "Share a drop of your Lifeforce"
 bm_interpersonal_events.0001.a.toast: "Shared Lifeforce with [partner.GetFirstName]"
 bm_interpersonal_events.0001.b: "Drink from their offered vein"
 bm_interpersonal_events.0001.b.toast: "Harvested Lifeforce from [partner.GetFirstName]"
 bm_interpersonal_events.0001.c: "Initiate them into the Crimson Mysteries"
 bm_interpersonal_events.0001.c.toast: "[partner.GetFirstName] Awakened to Blood Magic"

 # Event 2: The Fever of Awakening
 bm_interpersonal_events.0002.t: "The Fever of Awakening"
 bm_interpersonal_events.0002.desc: "[child.GetFirstName] lies shivering in bed, skin burning with unnatural heat. The attendants whisper of sickness, but I recognize the signs instantly: the blood within [child.GetHerHim] is churning, attempting to awaken the occult pathways of our power. Left untended, the surge could tear through [child.GetHerHis] frail youthful constitution."
 bm_interpersonal_events.0002.a: "Guide their pulse with Minor Lifeforce"
 bm_interpersonal_events.0002.a.toast: "Guided [child.GetFirstName]'s Blood Pulse"
 bm_interpersonal_events.0002.b: "Force the Awakening early"
 bm_interpersonal_events.0002.b.toast: "[child.GetFirstName] Awakened to Blood Magic"
 bm_interpersonal_events.0002.c: "Soothe the fever with prayer"
 bm_interpersonal_events.0002.c.toast: "Soothed [child.GetFirstName]'s Fever"

 # Event 3: The Red Banquet After Battle
 bm_interpersonal_events.0003.t: "The Red Banquet After Battle"
 bm_interpersonal_events.0003.desc: "The clash of steel has ceased, leaving the battlefield strewn with the dead and dying. As the smoke drifts away, [knight.GetFirstName] approaches me amidst the fallen. Steam rises from the pools of fresh gore underfoot. The battle was fierce, and the ambient Lifeforce hanging over the slaughter is thick enough to taste."
 bm_interpersonal_events.0003.a: "Drink together as comrades"
 bm_interpersonal_events.0003.a.toast: "Shared the Spoils of Battle"
 bm_interpersonal_events.0003.b: "Claim the entire harvest as Warlord"
 bm_interpersonal_events.0003.b.toast: "Harvested the Battlefield"
 bm_interpersonal_events.0003.c: "Pour it onto the earth to consecrate the slain"
 bm_interpersonal_events.0003.c.toast: "Consecrated the Fallen"

 # Event 4: Echoes in the Clay
 bm_interpersonal_events.0004.t: "Echoes in the Clay"
 bm_interpersonal_events.0004.desc: "The blood golem stands motionless in the corner of my sanctum, its crimson frame resting in uncanny silence. Yet as I approach, the runic veins along its arms pulse with a strange, reverberating rhythm. The enchanted matter is settling, reacting to the ambient blood magic of the court."
 bm_interpersonal_events.0004.a: "Bind it as Eternal Guardian of [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.a.toast: "Bound Golem Aegis to [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.b: "Awaken its ancient martial memory"
 bm_interpersonal_events.0004.b.toast: "Honed Golem's Combat Instincts"
 bm_interpersonal_events.0004.c: "Siphon excess ichor from its core"
 bm_interpersonal_events.0004.c.toast: "Siphoned Major Lifeforce from Golem"

 # Event 5: The Whispering Sanctum
 bm_interpersonal_events.0005.t: "The Whispering Sanctum"
 bm_interpersonal_events.0005.desc: "A floorboard creaks in the outer corridor. Slipping into the shadows of my private sanctum, I catch [courtier.GetFirstName] peering through the half-open door, staring wide-eyed at the runic circles, blood vials, and lingering mist of my rites. [courtier.GetSheHe|U] freezes, realizing too late that [courtier.GetSheHe] has stepped where no uninitiated courtier should ever tread."
 bm_interpersonal_events.0005.a: "Drain their veins in the dark"
 bm_interpersonal_events.0005.a.win: "You overpower [courtier.GetFirstName] and drain their Lifeforce"
 bm_interpersonal_events.0005.a.win.toast: "Silenced and Drained [courtier.GetFirstName]"
 bm_interpersonal_events.0005.a.lose: "[courtier.GetFirstName] breaks away in terror"
 bm_interpersonal_events.0005.a.lose.toast: "[courtier.GetFirstName] Fled into the Night"
 bm_interpersonal_events.0005.b: "Buy their silence with a drop of Lifeforce"
 bm_interpersonal_events.0005.b.toast: "Bound [courtier.GetFirstName] with Lifeforce and Oath"
 bm_interpersonal_events.0005.c: "Disperse the ritual mist"
 bm_interpersonal_events.0005.c.toast: "Dispersed the Mist and Banished Doubt"
