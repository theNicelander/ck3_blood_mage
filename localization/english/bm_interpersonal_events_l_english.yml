l_english:
 # Modifiers
 bm_guided_pulse_child_modifier: "Guided Blood Pulse"
 bm_guided_pulse_child_modifier_desc: "Early guidance of the blood has honed this child's martial instincts, physical vigor, and scholastic aptitude."
 bm_golem_aegis_modifier: "Golem's Aegis"
 bm_golem_aegis_modifier_desc: "A blood golem stands as a tireless guardian, deflecting hostile blades and foiling schemes."
 bm_siphoned_golem_modifier: "Siphoned Golem Core"
 bm_siphoned_golem_modifier_desc: "Excess ichor was drawn from the golem's core to empower its master, temporarily diminishing its physical force."
 bm_reinforced_golem_modifier: "Reinforced Golem Bindings"
 bm_reinforced_golem_modifier_desc: "Fresh blood runes mend fractures in the construct's frame, sharpening its force and stability."

 # Event 1: A Drop on the Lips
 bm_interpersonal_events.0001.t: "A Drop on the Lips"
 bm_interpersonal_events.0001.desc: "In the quiet of our private chambers, [partner.GetFirstName] draws near, eyes lingering upon the faint blood-red luminescence beneath my skin. There is no horror in [partner.GetHerHis] gaze, only longing and devotion. [partner.GetSheHe|U] tilts [partner.GetHerHis] head back, baring [partner.GetHerHis] throat and whispering that [partner.GetSheHe] wishes to share the power that flows in my veins."
 bm_interpersonal_events.0001.a: "Share a drop of your Lifeforce"
 bm_interpersonal_events.0001.a.toast: "@bm_ancient_discipline_icon! Shared Lifeforce with [partner.GetFirstName]"
 bm_interpersonal_events.0001.b: "Drink from their offered vein"
 bm_interpersonal_events.0001.b.toast: "@bm_ancient_discipline_icon! Harvested Lifeforce from [partner.GetFirstName]"
 bm_interpersonal_events.0001.c: "Initiate them into the Blood Mysteries"
 bm_interpersonal_events.0001.c.toast: "@bm_ancient_discipline_icon! [partner.GetFirstName] Awakened to Blood Magic"

 # Event 2: The Fever of Awakening
 bm_interpersonal_events.0002.t: "The Fever of Awakening"
 bm_interpersonal_events.0002.desc: "[child.GetFirstName] lies shivering in bed, skin burning with unnatural heat. The attendants whisper of sickness, but I recognize the signs instantly: the blood within [child.GetHerHim] is churning, attempting to awaken the occult pathways of our power. Left untended, the surge could tear through [child.GetHerHis] frail youthful constitution."
 bm_interpersonal_events.0002.a: "Guide their pulse with Minor Lifeforce"
 bm_interpersonal_events.0002.a.toast: "@bm_ancient_discipline_icon! Guided [child.GetFirstName]'s Blood Pulse"
 bm_interpersonal_events.0002.b: "Force the Awakening early"
 bm_interpersonal_events.0002.b.toast: "@bm_ancient_discipline_icon! [child.GetFirstName] Awakened to Blood Magic"
 bm_interpersonal_events.0002.c: "Soothe the fever with prayer"
 bm_interpersonal_events.0002.c.toast: "@bm_ancient_discipline_icon! Soothed [child.GetFirstName]'s Fever"

 # Event 3: The Red Banquet After Battle
 bm_interpersonal_events.0003.t: "The Red Banquet After Battle"
 bm_interpersonal_events.0003.desc: "The clash of steel has ceased, leaving the battlefield strewn with the dead and dying. As the smoke drifts away, [knight.GetFirstName] approaches me amidst the fallen. Steam rises from the pools of fresh gore underfoot. The battle was fierce, and the ambient Lifeforce hanging over the slaughter is thick enough to taste."
 bm_interpersonal_events.0003.a: "Drink together as comrades"
 bm_interpersonal_events.0003.a.toast: "@bm_ancient_discipline_icon! Shared the Spoils of Battle"
 bm_interpersonal_events.0003.b: "Claim the entire harvest as Warlord"
 bm_interpersonal_events.0003.b.toast: "@bm_ancient_discipline_icon! Harvested the Battlefield"
 bm_interpersonal_events.0003.c: "Pour it onto the earth to consecrate the slain"
 bm_interpersonal_events.0003.c.toast: "@bm_ancient_discipline_icon! Consecrated the Fallen"

 # Event 4: Echoes in the Clay
 bm_interpersonal_events.0004.t: "Echoes in the Clay"
 bm_interpersonal_events.0004.desc: "The blood golem stands motionless in the corner of my sanctum, its blood frame resting in uncanny silence. Yet as I approach, the runic veins along its arms pulse with a strange, reverberating rhythm. The enchanted matter is settling, reacting to the ambient blood magic of the court."
 bm_interpersonal_events.0004.a: "Bind it as Eternal Guardian of [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.a.toast: "@bm_ancient_discipline_icon! Bound Golem Aegis to [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.b: "Awaken its ancient martial memory"
 bm_interpersonal_events.0004.b.toast: "@bm_ancient_discipline_icon! Honed Golem's Combat Instincts"
 bm_interpersonal_events.0004.c: "Siphon excess ichor from its core"
 bm_interpersonal_events.0004.c.toast: "@bm_ancient_discipline_icon! Siphoned Major Lifeforce from Golem"

 # Event 5: The Whispering Sanctum
 bm_interpersonal_events.0005.t: "The Whispering Sanctum"
 bm_interpersonal_events.0005.desc: "A floorboard creaks in the outer corridor. Slipping into the shadows of my private sanctum, I catch [courtier.GetFirstName] peering through the half-open door, staring wide-eyed at the runic circles, blood vials, and lingering mist of my rites. [courtier.GetSheHe|U] freezes, realizing too late that [courtier.GetSheHe] has stepped where no uninitiated courtier should ever tread."
 bm_interpersonal_events.0005.a: "Drain their veins in the dark"
 bm_interpersonal_events.0005.a.win: "You overpower [courtier.GetFirstName] and drain their Lifeforce"
 bm_interpersonal_events.0005.a.win.toast: "@bm_ancient_discipline_icon! Silenced and Drained [courtier.GetFirstName]"
 bm_interpersonal_events.0005.a.lose: "[courtier.GetFirstName] breaks away in terror"
 bm_interpersonal_events.0005.a.lose.toast: "@bm_ancient_discipline_icon! [courtier.GetFirstName] Fled into the Night"
 bm_interpersonal_events.0005.b: "Buy their silence with a drop of Lifeforce"
 bm_interpersonal_events.0005.b.toast: "@bm_ancient_discipline_icon! Bound [courtier.GetFirstName] with Lifeforce and Oath"
 bm_interpersonal_events.0005.c: "Disperse the ritual mist"
 bm_interpersonal_events.0005.c.toast: "@bm_ancient_discipline_icon! Dispersed the Mist and Banished Doubt"

 # Event 6: The Red Thirst
 bm_interpersonal_events.0006.t: "The Red Thirst"
 bm_interpersonal_events.0006.desc: "My hands tremble against the cold stone balustrade as an aching hunger claws behind my eyes. Repeated blood rites have hollowed my vessels, and every pulse echoing down the hall from [prey.GetFirstName] smells sharper than wine."
 bm_interpersonal_events.0006.a: "Bite down and endure the fever"
 bm_interpersonal_events.0006.a.toast: "@bm_ancient_discipline_icon! Endured the Red Thirst"
 bm_interpersonal_events.0006.b: "Corner [prey.GetFirstNameNoTooltip] in the shadows"
 bm_interpersonal_events.0006.b.win: "You slip in unseen and slake your thirst"
 bm_interpersonal_events.0006.b.win.toast: "@bm_ancient_discipline_icon! Sated the Red Thirst on [prey.GetFirstNameNoTooltip]"
 bm_interpersonal_events.0006.b.lose: "[prey.GetFirstNameNoTooltip] cries out and escapes"
 bm_interpersonal_events.0006.b.lose.toast: "@bm_ancient_discipline_icon! [prey.GetFirstNameNoTooltip] Exposed the Assault"
 bm_interpersonal_events.0006.c: "Burn Minor Lifeforce to steady your veins"
 bm_interpersonal_events.0006.c.toast: "@bm_ancient_discipline_icon! Stabilized Overdrained Vessels"

 # Event 7: Weight of Eighty-Five Winters (Age 85+ Milestone)
 bm_interpersonal_events.0007.t: "Eighty-Five Winters in the Blood"
 bm_interpersonal_events.0007.desc: "Eighty-five winters have passed without breaking your stride. Decades of practiced rites and quiet mastery now settle into deliberate focus, ready to deepen whichever Blood Magic discipline you choose."
 bm_interpersonal_events.0007.a: "Deepen Ancient mastery (+5 Ancient XP)"
 bm_interpersonal_events.0007.b: "Deepen Wisdom (+5 Wisdom XP)"
 bm_interpersonal_events.0007.c: "Deepen Fortune (+5 Fortune XP)"
 bm_interpersonal_events.0007.d: "Deepen Radiance (+5 Radiance XP)"
 bm_interpersonal_events.0007.e: "Deepen Cunning (+5 Cunning XP)"
 bm_interpersonal_events.0007.f: "Deepen Fury (+5 Fury XP)"
 bm_interpersonal_events.0007.toast: "@bm_ancient_discipline_icon! Eighty-Five Winters Mastered"

 # Event 8: A Challenger in Crimson
 bm_interpersonal_events.0008.t: "A Challenger in Crimson"
 bm_interpersonal_events.0008.desc: "Word reaches your hall of a wandering mage in blood-stained travel cloak waiting outside the gate. [challenger.GetUIName] lifts a hand etched with glowing sigils, demanding to test whether your mastery of blood magic matches your reputation."
 bm_interpersonal_events.0008.a: "Answer with an Occult Duel"
 bm_interpersonal_events.0008.a.win: "You break [challenger.GetFirstNameNoTooltip]'s guard and reap their essence"
 bm_interpersonal_events.0008.a.win.toast: "@bm_ancient_discipline_icon! Bested [challenger.GetFirstNameNoTooltip]"
 bm_interpersonal_events.0008.a.lose: "[challenger.GetFirstNameNoTooltip] strikes through your wards"
 bm_interpersonal_events.0008.a.lose.toast: "@bm_ancient_discipline_icon! Bested by [challenger.GetFirstNameNoTooltip]"
 bm_interpersonal_events.0008.b: "Offer [challenger.GetFirstNameNoTooltip] a seat in your sanctum"
 bm_interpersonal_events.0008.b.win: "[challenger.GetFirstNameNoTooltip] accepts your patronage"
 bm_interpersonal_events.0008.b.win.toast: "@bm_ancient_discipline_icon! [challenger.GetFirstNameNoTooltip] Joined Court"
 bm_interpersonal_events.0008.b.lose: "[challenger.GetFirstNameNoTooltip] scoffs and departs"
 bm_interpersonal_events.0008.b.lose.toast: "@bm_ancient_discipline_icon! Challenger Declined"
 bm_interpersonal_events.0008.c: "Bar the gates and send them away"

 # Event 9: Fractured Clay
 bm_interpersonal_events.0009.t: "Fractured Clay"
 bm_interpersonal_events.0009.desc: "Hairline cracks spiderweb across [golem.GetFirstName]'s shoulders as dark ichor seeps between the inscribed glyphs. Without fresh binding, the construct's strength will begin to unravel."
 bm_interpersonal_events.0009.a: "Feed Minor Lifeforce into its bindings"
 bm_interpersonal_events.0009.a.toast: "@bm_ancient_discipline_icon! Reinforced [golem.GetFirstName]'s Bindings"
 bm_interpersonal_events.0009.b: "Mend the runes by sheer willpower"
 bm_interpersonal_events.0009.b.win: "The fractured sigils snap cleanly back into place"
 bm_interpersonal_events.0009.b.win.toast: "@bm_ancient_discipline_icon! Mended [golem.GetFirstName]'s Runes"
 bm_interpersonal_events.0009.b.lose: "The unstable runes backlash against your flesh"
 bm_interpersonal_events.0009.b.lose.toast: "@bm_ancient_discipline_icon! Golem Binding Backlashed"
 bm_interpersonal_events.0009.c: "Leave the construct to weaken"
 bm_interpersonal_events.0009.c.toast: "@bm_ancient_discipline_icon! Left [golem.GetFirstName] Unmended"

 # Event 10: The Eager Acolyte
 bm_interpersonal_events.0010.t: "The Eager Acolyte"
 bm_interpersonal_events.0010.desc: "[acolyte.GetFirstName] waits beside your study table with ink-stained fingers and restless ambition. Having tasted the first mysteries of Blood Magic, [acolyte.GetSheHe] begs for direct instruction to speed [acolyte.GetHerHis] growth."
 bm_interpersonal_events.0010.a: "Drill them with steel and fury"
 bm_interpersonal_events.0010.a.toast: "@bm_ancient_discipline_icon! Drilled [acolyte.GetFirstName] in Combat"
 bm_interpersonal_events.0010.b: "Guide them through quiet arcane study"
 bm_interpersonal_events.0010.b.toast: "@bm_ancient_discipline_icon! Tutored [acolyte.GetFirstName]"
 bm_interpersonal_events.0010.c: "Infuse their blood with Major Lifeforce"
 bm_interpersonal_events.0010.c.toast: "@bm_ancient_discipline_icon! Accelerated [acolyte.GetFirstName]'s Mastery"

 # Event 11: A Century in Crimson (Age 100+ Milestone)
 bm_interpersonal_events.0011.t: "A Century in Crimson"
 bm_interpersonal_events.0011.desc: "A full century has passed beneath your reign while mortal contemporaries turned to dust. Standing beyond ordinary age, you gather a century of hard-won blood lore and pour it into one chosen discipline."
 bm_interpersonal_events.0011.a: "Master Ancient lore (+10 Ancient XP)"
 bm_interpersonal_events.0011.b: "Master Wisdom (+10 Wisdom XP)"
 bm_interpersonal_events.0011.c: "Master Fortune (+10 Fortune XP)"
 bm_interpersonal_events.0011.d: "Master Radiance (+10 Radiance XP)"
 bm_interpersonal_events.0011.e: "Master Cunning (+10 Cunning XP)"
 bm_interpersonal_events.0011.f: "Master Fury (+10 Fury XP)"
 bm_interpersonal_events.0011.toast: "@bm_ancient_discipline_icon! A Century Mastered"
