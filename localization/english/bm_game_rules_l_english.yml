l_english:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Blood Mages"
  rule_bm_blood_mage_prevalence: "Blood Mage Prevalence"
  setting_bm_prevalence_player_only: "Player Only"
  setting_bm_prevalence_player_only_desc: "Only player-controlled characters can acquire the Blood Mage trait. AI acquisition is blocked, including natural appearance and inheritance."
  setting_bm_prevalence_one_in_10000: "One in 10,000"
  setting_bm_prevalence_one_in_10000_desc: "Blood Magic is exceptionally rare. Multiplies AI acquisition weights by 0.05, and AI characters retain only 5% of naturally generated or inherited Blood Mage traits (roughly 1 in 10,000 baseline spontaneous appearance)."
  setting_bm_prevalence_one_in_1000: "One in 1,000"
  setting_bm_prevalence_one_in_1000_desc: "Blood Magic is very rare. Multiplies AI acquisition weights by 0.50, and AI characters retain 50% of naturally generated or inherited Blood Mage traits (roughly 1 in 1,000 baseline spontaneous appearance)."
  setting_bm_prevalence_default: "Default (One in 500)"
  setting_bm_prevalence_default_desc: "Standard Blood Mage prevalence. Non-inheriting newborns have a 0.20% (1 in 500) spontaneous appearance chance, and standard inheritance chances apply."
  setting_bm_prevalence_one_in_100: "One in 100"
  setting_bm_prevalence_one_in_100_desc: "Blood Magic is more common. AI acquisition weights are doubled, and AI newborns have a 1% (1 in 100) spontaneous appearance chance as well as boosted inheritance rates."
  setting_bm_prevalence_one_in_10: "One in 10"
  setting_bm_prevalence_one_in_10_desc: "Blood Magic is widespread across dynasties. AI acquisition weights are greatly increased, and AI newborns have a 10% (1 in 10) spontaneous appearance chance and high inheritance rates."
  setting_bm_prevalence_everyone: "Everyone"
  setting_bm_prevalence_everyone_desc: "Every character in the world is born with the Blood Mage trait."
  rule_bm_lore: "Blood Mage Lore"
  setting_bm_lore_historical: "Historical"
  setting_bm_lore_historical_desc: "Uses Blóðtrú and its vanilla-world religious heritage and holy-site network."
  setting_bm_lore_agot: "A Game of Thrones"
  setting_bm_lore_agot_desc: "With the Blood Mages - AGOT Religions companion loaded, replaces the vanilla-world cults with lore-friendly traditions of the Seven, Old Gods, Drowned God, R'hllor, Rhoyne, and Valyria."
  rule_bm_physical_alteration: "Blood Mage Appearance"
  setting_bm_physical_alteration_none: "No Alteration"
  setting_bm_physical_alteration_none_desc: "Blood Magic does not alter a Blood Mage's eye or hair color."
  setting_bm_physical_alteration_eyes: "Eyes Only"
  setting_bm_physical_alteration_eyes_desc: "Blood Magic progressively alters a Blood Mage's eye color as their mastery grows, but leaves their hair unchanged."
  setting_bm_physical_alteration_eyes_hair: "Eyes and Hair"
  setting_bm_physical_alteration_eyes_hair_desc: "Blood Magic progressively alters a Blood Mage's eyes and, at greater mastery, whitens their hair."
  rule_bm_initiation_faith_requirement: "Blood Mage Initiation Faith"
  setting_bm_initiation_dedicated_cult: "Dedicated Blood Cult"
  setting_bm_initiation_dedicated_cult_desc: "Only characters following Blóðtrú or a faith explicitly marked as a Blood Magic cult may use the Blood Cultist initiation ritual."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Blood Cult or Witchcraft Accepted"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Characters may use the Blood Cultist initiation ritual if they follow Blóðtrú, a faith explicitly marked as a Blood Magic cult, or a faith that accepts witchcraft."
  rule_blodtru_religion: "Blood Mage Religion"
  setting_blodtru_religion_enabled: "Enabled"
  setting_blodtru_religion_enabled_desc: "The decision to embrace a Blood Mage faith is enabled."
  setting_blodtru_religion_disabled: "Disabled"
  setting_blodtru_religion_disabled_desc: "The decision to embrace a Blood Mage faith is disabled."
  setting_blodtru_religion_enabled_player_only: "Player Only"
  setting_blodtru_religion_enabled_player_only_desc: "Only players may use the decision to embrace a Blood Mage faith."
