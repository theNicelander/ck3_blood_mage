l_english:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Blood Mages"
  rule_bm_lore: "Blood Mage Lore"
  setting_bm_lore_historical: "Historical"
  setting_bm_lore_historical_desc: "Uses the Cult of the Quintessence and its vanilla-world religious heritage and holy-site network."
  setting_bm_lore_agot: "A Game of Thrones"
  setting_bm_lore_agot_desc: "With the Blood Mages - AGOT Religions companion loaded, replaces the vanilla-world cults with lore-friendly traditions of the Seven, Old Gods, Drowned God, R'hllor, Rhoyne, and Valyria."
  rule_bm_physical_alteration: "Blood Mage Appearance"
  setting_bm_physical_alteration_none: "No Alteration"
  setting_bm_physical_alteration_none_desc: "Blood Magic does not alter a Blood Mage's eye or hair color."
  setting_bm_physical_alteration_eyes: "Eyes Only"
  setting_bm_physical_alteration_eyes_desc: "Blood Magic progressively alters a Blood Mage's eye color as their mastery grows, but leaves their hair unchanged."
  setting_bm_physical_alteration_eyes_hair: "Eyes and Hair"
  setting_bm_physical_alteration_eyes_hair_desc: "Blood Magic progressively alters a Blood Mage's eyes and, at greater mastery, whitens their hair."
  rule_bm_initiation_faith_requirement: "Blood Mage Initiation Faith"
  setting_bm_initiation_dedicated_cult: "Dedicated Blood Cult"
  setting_bm_initiation_dedicated_cult_desc: "Only characters following the Cult of the Quintessence or a faith explicitly marked as a Blood Magic cult may use the Blood Cultist initiation ritual."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Blood Cult or Witchcraft Accepted"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Characters may use the Blood Cultist initiation ritual if they follow the Cult of the Quintessence, a faith explicitly marked as a Blood Magic cult, or a faith that accepts witchcraft."
  rule_quintessence_religion: "Blood Mage Religion"
  setting_quintessence_religion_enabled: "Enabled"
  setting_quintessence_religion_enabled_desc: "The decision to embrace a Blood Mage faith is enabled."
  setting_quintessence_religion_disabled: "Disabled"
  setting_quintessence_religion_disabled_desc: "The decision to embrace a Blood Mage faith is disabled."
  setting_quintessence_religion_enabled_player_only: "Player Only"
  setting_quintessence_religion_enabled_player_only_desc: "Only players may use the decision to embrace a Blood Mage faith."
