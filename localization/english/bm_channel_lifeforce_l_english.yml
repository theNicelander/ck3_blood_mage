  bm_covenant_status_minor_to_major: "#bold Current House Rank:#! #P Minor (Tier I)#!  |  #bold Next Upgrade:#! #V Major (Tier II)#!"
  bm_covenant_status_major_to_superior: "#bold Current House Rank:#! #V Major (Tier II)#!  |  #bold Next Upgrade:#! #Y Superior (Tier III)#!"

