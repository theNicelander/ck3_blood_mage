l_english:
  # Standalone Decision: Empower Dynasty Bloodline
  bm_empower_bloodline_decision: "Empower Dynasty Bloodline"
  bm_empower_bloodline_decision_desc: "Perform ancient hemomantic covenants to permanently weave blood magic into the veins of your house. Each covenant progresses through three tiers—#italic Minor#! (Tier I), #italic Major#! (Tier II), and #italic Superior#! (Tier III)—granting escalating supernatural enhancements to every living and future member of your house, regardless of whether they are landed rulers, estate administrators, wanderers, or court knights."
  bm_empower_bloodline_decision_tooltip: "Select a House Covenant to upgrade"
  BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON: "Weave Bloodline"
  bm_empower_bloodline_decision_confirm: "$BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON$"
  bm_empower_bloodline_decision_effect: "You weave vital blood magic into your house's lineage."

  # Requirement Tooltips
  bm_covenant_already_maxed_req: "This covenant has already reached its Superior rank (Tier III)"
  NOT_bm_covenant_already_maxed_req: "This covenant has already reached its Superior rank (Tier III)"
  bm_covenant_tier_1_req: "Tier I (Minor): Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! Piety, and Devotion Rank #V 1#!."
  NOT_bm_covenant_tier_1_req: "Tier I (Minor): Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! Piety, and Devotion Rank #V 1#!."
  bm_covenant_tier_2_req: "Tier II (Major): Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], #V 350#! Piety, and Devotion Rank #V 2#!."
  NOT_bm_covenant_tier_2_req: "Tier II (Major): Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], #V 350#! Piety, and Devotion Rank #V 2#!."
  bm_covenant_tier_3_req: "Tier III (Superior): Requires [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip], #V 750#! Piety, and Devotion Rank #V 3#!."
  NOT_bm_covenant_tier_3_req: "Tier III (Superior): Requires [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip], #V 750#! Piety, and Devotion Rank #V 3#!."

  # Status Headers for Tooltips
  bm_covenant_status_none_to_minor: "#bold Current House Rank:#! #V None#!  |  #bold Next Upgrade:#! #P Minor (Tier I)#!"
  bm_covenant_status_minor_to_major: "#bold Current House Rank:#! #P Minor (Tier I)#!  |  #bold Next Upgrade:#! #V Major (Tier II)#!"
  bm_covenant_status_major_to_superior: "#bold Current House Rank:#! #V Major (Tier II)#!  |  #bold Next Upgrade:#! #Y Superior (Tier III)#!"

  # Dynamic Button Labels
