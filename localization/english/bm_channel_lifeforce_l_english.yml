l_english:
  # Standalone Decision: Empower Dynasty Bloodline
  bm_empower_bloodline_decision: "Empower Dynasty Bloodline"
  bm_empower_bloodline_decision_desc: "Perform ancient hemomantic covenants to permanently weave blood magic into the veins of your house. Each covenant progresses through three tiers—#italic Awakened#! (Tier I), #italic Ascendant#! (Tier II), and #italic Sovereign#! (Tier III)—granting escalating supernatural enhancements to every living and future member of your house, regardless of whether they are landed rulers, estate administrators, wanderers, or court knights."
  bm_empower_bloodline_decision_tooltip: "Select a House Covenant to upgrade"
  BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON: "Weave Bloodline"
  bm_empower_bloodline_decision_confirm: "$BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON$"
  bm_empower_bloodline_decision_effect: "You weave vital blood magic into your house's lineage."

  # Requirement Tooltips
  bm_covenant_already_maxed_req: "This covenant has already reached its Sovereign rank (Tier III)"
  NOT_bm_covenant_already_maxed_req: "This covenant has already reached its Sovereign rank (Tier III)"
  bm_covenant_tier_1_req: "Tier I (Awakened): Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! Piety, and Devotion Rank #V 1#!."
  NOT_bm_covenant_tier_1_req: "Tier I (Awakened): Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! Piety, and Devotion Rank #V 1#!."
  bm_covenant_tier_2_req: "Tier II (Ascendant): Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], #V 350#! Piety, and Devotion Rank #V 2#!."
  NOT_bm_covenant_tier_2_req: "Tier II (Ascendant): Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], #V 350#! Piety, and Devotion Rank #V 2#!."
  bm_covenant_tier_3_req: "Tier III (Sovereign): Requires [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip], #V 750#! Piety, and Devotion Rank #V 3#!."
  NOT_bm_covenant_tier_3_req: "Tier III (Sovereign): Requires [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip], #V 750#! Piety, and Devotion Rank #V 3#!."

  # Covenant Options
  bm_covenant_charisma: "Covenant of Majesty"
  bm_covenant_charisma_tooltip: "Enhances diplomacy, prestige, renown, attraction, and personal schemes across your entire house.\n\n#P Tier I (Awakened):#! +1 Diplomacy, +5 General, Attraction & Dynasty Opinion, +0.25 Prestige/mo, +5% Renown, +5 Personal Scheme Success.\n#V Tier II (Ascendant):#! +2 Diplomacy, +10 General, Attraction & Dynasty Opinion, +0.50 Prestige/mo, +10% Renown, +10 Personal Scheme Success, -5d Scheme Phase.\n#Y Tier III (Sovereign):#! +4 Diplomacy, +15 General & Dynasty Opinion, +20 Attraction Opinion, +1.0 Prestige/mo, +15% Renown, +15 Personal Scheme Success, -10d Scheme Phase, #bold +1 Max Personal Schemes#!."

  bm_covenant_fury: "Covenant of the Warband"
  bm_covenant_fury_tooltip: "Empowers warriors, knights, travel safety, speed, and army movement across your entire house.\n\n#P Tier I (Awakened):#! +1 Martial, +2 Prowess, +10% Knight Effectiveness, +1 Knight Limit, +10% Travel Speed, +5 Travel Safety.\n#V Tier II (Ascendant):#! +2 Martial, +4 Prowess, +20% Knight Effectiveness, +1 Knight Limit, +15% Travel Speed, +10 Travel Safety, +5% Movement Speed, +2 Advantage.\n#Y Tier III (Sovereign):#! +4 Martial, +6 Prowess, +30% Knight Effectiveness, +2 Knight Limit, +20% Travel Speed, +15 Travel Safety, +10% Movement Speed, +4 Advantage, #bold +1 Men-at-Arms Regiment Size#!."

  bm_covenant_prosperity: "Covenant of Sovereign Prosperity"
  bm_covenant_prosperity_tooltip: "Draws wealth, cheaper troop upkeep, reduced camp/estate/holding construction costs, and development across your house.\n\n#P Tier I (Awakened):#! +1 Stewardship, +0.3 Gold/mo, +5% Income Mult, -5% MaA Upkeep, -5% Domicile & Holding Build Cost.\n#V Tier II (Ascendant):#! +2 Stewardship, +0.6 Gold/mo, +10% Income Mult, -10% MaA Upkeep, -10% Domicile & Holding Build Cost & Speed, +10% Development Growth.\n#Y Tier III (Sovereign):#! +4 Stewardship, +1.2 Gold/mo, +15% Income Mult, -15% MaA Upkeep, -15% Domicile & Holding Build Cost & Speed, +20% Development Growth, #bold +1 Domain Limit#!."

  bm_covenant_shadows: "Covenant of Whispering Shadows"
  bm_covenant_shadows_tooltip: "Weaves occult secrecy, dread, hostile scheme speed, and impenetrable plot warding across your house.\n\n#P Tier I (Awakened):#! +1 Intrigue, +5 Hostile Scheme Success, -5d Scheme Phase, +5 Secrecy, -5 Enemy Scheme Success, +5d Enemy Scheme Phase, +5 Dread.\n#V Tier II (Ascendant):#! +2 Intrigue, +10 Hostile Scheme Success, -10d Scheme Phase, +10 Secrecy, -10 Enemy Scheme Success, +10d Enemy Scheme Phase, -10% Enemy Max Scheme Success Cap, +10 Dread.\n#Y Tier III (Sovereign):#! +4 Intrigue, +15 Hostile Scheme Success, -15d Scheme Phase, +15 Secrecy, -15 Enemy Scheme Success, +15d Enemy Scheme Phase, -20% Enemy Max Scheme Success Cap, +15 Dread, #bold +1 Max Hostile Schemes#!."

  bm_covenant_insight: "Covenant of Arcane Insight"
  bm_covenant_insight_tooltip: "Accelerates learning, monthly piety, stress resilience, cultural acceptance, and devotion scaling across your house.\n\n#P Tier I (Awakened):#! +1 Learning, +0.25 Piety/mo, +5% Piety Mult, -5% Stress Gain, +5% Stress Loss, +5% Cultural Acceptance.\n#V Tier II (Ascendant):#! +2 Learning, +0.50 Piety/mo, +10% Piety Mult, -10% Stress Gain, +10% Stress Loss, +10% Cultural Acceptance, +10% Devotion Impact.\n#Y Tier III (Sovereign):#! +4 Learning, +1.0 Piety/mo, +20% Piety Mult, -15% Stress Gain, +15% Stress Loss, +15% Cultural Acceptance, +20% Devotion Impact, #bold +1 Learning per Devotion Level#!."

  bm_covenant_legacy: "Covenant of Sanguine Legacy"
  bm_covenant_legacy_tooltip: "Fortifies genetics, fertility, longevity, health, and disease resistance across all living and future generations of your house.\n\n#P Tier I (Awakened):#! +0.25 Health, +3 Life Expectancy, +3 Fertile Years, +10% Fertility, +10% Positive Congenital Chance, +10% Inactive Inheritance, +10% Strengthen Congenital, -15% Inbreeding & Negative Traits, +3 Epidemic Resistance.\n#V Tier II (Ascendant):#! +0.50 Health, +6 Life Expectancy, +6 Fertile Years, +20% Fertility, +20% Positive Congenital Chance, +20% Inactive Inheritance, +20% Strengthen Congenital, -30% Inbreeding & Negative Traits, +6 Epidemic Resistance.\n#Y Tier III (Sovereign):#! +1.0 Health, +12 Life Expectancy, +12 Fertile Years, +30% Fertility, +35% Positive Congenital Chance, +35% Inactive Inheritance, +35% Strengthen Congenital, #bold -50% Inbreeding & Negative Traits#!, +10 Epidemic Resistance."

  bm_covenant_expertise: "Covenant of Polyglot Mastery"
  bm_covenant_expertise_tooltip: "Accelerates lifestyle experience, language learning, and imperial fame scaling across your house.\n\n#P Tier I (Awakened):#! +10% Lifestyle XP, -10d Learn Language Phase, +1 Language Slot.\n#V Tier II (Ascendant):#! +20% Lifestyle XP, -20d Learn Language Phase, +2 Language Slots, +10% Fame Impact.\n#Y Tier III (Sovereign):#! +30% Lifestyle XP, -30d Learn Language Phase, +3 Language Slots, +20% Fame Impact, #bold Ignore Negative Culture Opinion#!."

