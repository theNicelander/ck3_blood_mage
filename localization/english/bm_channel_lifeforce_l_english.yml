  # Covenant Options & Tooltips
  bm_covenant_majesty: "Covenant of Majesty"
  bm_covenant_majesty_tooltip: "[GetPlayer.Custom('BM_COVENANT_MAJESTY_STATUS_HEADER')]\n\nEnhances diplomacy, opinion, personal schemes, and dynastic prestige across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Diplomacy, +2 General & Dynasty Opinion, +5 Personal Scheme Success.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Diplomacy, +5 General & Dynasty Opinion, +10 Personal Scheme Success, -10% Short Reign Duration, +10% Long Reign Bonus.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Diplomacy, +10 General & Dynasty Opinion, +20 Personal Scheme Success, -20% Short Reign Duration, +20% Long Reign Bonus, #bold +1 Diplomacy per Devotion Level#!, #bold +1 Max Personal Schemes#!."

  bm_covenant_warband: "Covenant of Warband"
  bm_covenant_warband_tooltip: "[GetPlayer.Custom('BM_COVENANT_WARBAND_STATUS_HEADER')]\n\nEmpowers martial prowess, knights, advantage, and dread across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Martial, +1 Prowess, +5% Knight Effectiveness, +5 Dread Baseline.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Martial, +2 Prowess, +2 Knight Limit, +10% Knight Effectiveness, +2 Advantage, +10 Dread Baseline.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Martial, +4 Prowess, +3 Knight Limit, +20% Knight Effectiveness, +4 Advantage, +15 Dread Baseline, #bold +1 Martial per Devotion Level#!, #bold +1 Men-at-Arms Regiment Size#!."

  bm_covenant_prosperity: "Covenant of Prosperity"
  bm_covenant_prosperity_tooltip: "[GetPlayer.Custom('BM_COVENANT_PROSPERITY_STATUS_HEADER')]\n\nDraws wealth, holding development, cheaper troop upkeep, and domain capacity across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +0.1 Gold/mo, +1 Stewardship, +3% Income Mult, -3% Holding & Domicile Build Cost.\n#V Tier II (Major):#! +0.3 Piety/mo, +0.3 Gold/mo, +2 Stewardship, +6% Income Mult, -6% Holding & Domicile Build Cost, -6% MaA Maintenance, +5% Development Growth.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +0.5 Gold/mo, +4 Stewardship, +12% Income Mult, -12% Holding & Domicile Build Cost, -12% MaA Maintenance, +10% Development Growth, #bold +1 Stewardship per Devotion Level#!, #bold +1 Domain Limit#!."

  bm_covenant_shadows: "Covenant of Shadow"
  bm_covenant_shadows_tooltip: "[GetPlayer.Custom('BM_COVENANT_SHADOWS_STATUS_HEADER')]\n\nWeaves occult secrecy, dread, hostile scheme success, and defensive warding across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Intrigue, +3 Hostile Scheme Success, -3 Enemy Hostile Scheme Success.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Intrigue, +6 Hostile Scheme Success, -6 Enemy Hostile Scheme Success, +6 Scheme Secrecy, +5 Dread Baseline, -5 Enemy Max Success Cap.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Intrigue, +12 Hostile Scheme Success, -12 Enemy Hostile Scheme Success, +12 Scheme Secrecy, +10 Dread Baseline, -10 Enemy Max Success Cap, #bold +1 Intrigue per Devotion Level#!, #bold +1 Max Hostile Schemes#!."

  bm_covenant_mastery: "Covenant of Mastery"
  bm_covenant_mastery_tooltip: "[GetPlayer.Custom('BM_COVENANT_MAJESTY_STATUS_HEADER')]\n\nAccelerates lifestyle experience, learning, languages, piety generation, and stress resilience across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Learning, +5% Lifestyle XP, -5% Stress Gain.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Learning, +10% Lifestyle XP, -10% Stress Gain, +10% Piety Mult, +2 Language Slots.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Learning, +20% Lifestyle XP, -20% Stress Gain, +20% Piety Mult, +3 Language Slots, #bold +1 Learning per Devotion Level#!, #bold Ignore Negative Culture Opinion#!."

  bm_covenant_legacy: "Covenant of Legacy"
  bm_covenant_legacy_tooltip: "[GetPlayer.Custom('BM_COVENANT_LEGACY_STATUS_HEADER')]\n\nFortifies genetics, fertility, longevity, health, and inbreeding resistance across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +0.2 Health, +2 Life Expectancy, +2 Fertile Years, +5% Fertility.\n#V Tier II (Major):#! +0.3 Piety/mo, +0.4 Health, +5 Life Expectancy, +5 Fertile Years, +10% Fertility, +10% Positive Congenital & Strengthen, -20% Inbreeding Chance.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +0.8 Health, +10 Life Expectancy, +10 Fertile Years, +20% Fertility, +20% Positive Congenital & Strengthen, -40% Inbreeding Chance, #bold +1 Prowess per Devotion Level#!."

  # Toasts
