  # Covenant Options & Tooltips
  bm_covenant_presence: "Covenant of Presence"
  bm_covenant_presence_tooltip: "[GetPlayer.Custom('BM_COVENANT_PRESENCE_STATUS_HEADER')]\n\nEnhances diplomacy, opinion, personal schemes, legitimacy, and dynastic prestige across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +0.1 Prestige/mo, +1 Diplomacy, +5 General Opinion, +5 Personal Scheme Success, +5% Legitimacy Gain.\n#V Tier II (Major):#! +0.3 Piety/mo, +0.3 Prestige/mo, +2 Diplomacy, +10 General Opinion, +10 Personal Scheme Success, -10% Short Reign Duration, +10% Long Reign Bonus, +10% Legitimacy Gain, #bold +1 Diplomacy per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +0.5 Prestige/mo, +4 Diplomacy, +15 General Opinion, +20 Personal Scheme Success, -20% Short Reign Duration, +20% Long Reign Bonus, +15% Legitimacy Gain, #bold +1 Diplomacy per Devotion Level#!."

  bm_covenant_warband: "Covenant of Warband"
  bm_covenant_warband_tooltip: "[GetPlayer.Custom('BM_COVENANT_WARBAND_STATUS_HEADER')]\n\nEmpowers martial prowess, army damage, Men-at-Arms regiments, and army speed across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Martial, +1 Prowess, +5% Army Damage, +5% Army Movement Speed.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Martial, +2 Prowess, +10% Army Damage, +10% Army Movement Speed, +1 Men-at-Arms Regiments & Size, #bold +1 Martial per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Martial, +4 Prowess, +15% Army Damage, +15% Army Movement Speed, +1 Men-at-Arms Regiments & Size, #bold +1 Martial per Devotion Level#!."

  bm_covenant_prosperity: "Covenant of Prosperity"
  bm_covenant_prosperity_tooltip: "[GetPlayer.Custom('BM_COVENANT_PROSPERITY_STATUS_HEADER')]\n\nDraws wealth, holding development, cheaper troop upkeep, and domain capacity across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +0.1 Gold/mo, +1 Stewardship, +5% Income Mult, -5% Holding & Domicile Build Cost, -5% MaA Maintenance, +5% Development Growth.\n#V Tier II (Major):#! +0.3 Piety/mo, +0.3 Gold/mo, +2 Stewardship, +10% Income Mult, -10% Holding & Domicile Build Cost, -10% MaA Maintenance, +10% Development Growth, #bold +1 Stewardship per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +0.5 Gold/mo, +4 Stewardship, +15% Income Mult, -15% Holding & Domicile Build Cost, -15% MaA Maintenance, +15% Development Growth, #bold +1 Domain Limit#!, #bold +1 Stewardship per Devotion Level#!."

  bm_covenant_shadows: "Covenant of Shadow"
  bm_covenant_shadows_tooltip: "[GetPlayer.Custom('BM_COVENANT_SHADOWS_STATUS_HEADER')]\n\nWeaves occult secrecy, hostile scheme success, and defensive warding across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Intrigue, +3 Hostile Scheme Success, -5 Enemy Hostile Scheme Success.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Intrigue, +6 Hostile Scheme Success, -10 Enemy Hostile Scheme Success, +5 Scheme Secrecy, -5 Enemy Max Success Cap, #bold +1 Intrigue per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Intrigue, +12 Hostile Scheme Success, -20 Enemy Hostile Scheme Success, +10 Scheme Secrecy, -10 Enemy Max Success Cap, #bold +1 Intrigue per Devotion Level#!."

  bm_covenant_mastery: "Covenant of Mastery"
  bm_covenant_mastery_tooltip: "[GetPlayer.Custom('BM_COVENANT_MASTERY_STATUS_HEADER')]\n\nAccelerates lifestyle experience, learning, health, piety generation, and stress resilience across your house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +1 Learning, +5% Lifestyle XP, -5% Stress Gain.\n#V Tier II (Major):#! +0.3 Piety/mo, +2 Learning, +10% Lifestyle XP, -10% Stress Gain, +10% Stress Loss, +5% Piety Mult, +0.15 Health, #bold +1 Learning per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +4 Learning, +20% Lifestyle XP, -20% Stress Gain, +20% Stress Loss, +10% Piety Mult, +0.3 Health, #bold +1 Personal Tenet Slot#!, #bold +1 Learning per Devotion Level#!, #bold Ignore Negative Culture Opinion#!."

  bm_covenant_legacy: "Covenant of Legacy"
  bm_covenant_legacy_tooltip: "[GetPlayer.Custom('BM_COVENANT_LEGACY_STATUS_HEADER')]\n\nFortifies genetics, fertility, longevity, health, and inbreeding resistance across your entire house.\n\n#P Tier I (Minor):#! +0.1 Piety/mo, +0.15 Health, +2 Life Expectancy, +2 Fertile Years, +5% Fertility, +5% Positive Congenital & Strengthen.\n#V Tier II (Major):#! +0.3 Piety/mo, +0.3 Health, +4 Life Expectancy, +4 Fertile Years, +15% Fertility, +15% Positive Congenital & Strengthen, -15% Inbreeding Chance, #bold +1 Prowess per Devotion Level#!.\n#Y Tier III (Superior):#! +0.5 Piety/mo, +0.5 Health, +8 Life Expectancy, +8 Fertile Years, +25% Fertility, +25% Positive Congenital & Strengthen, -30% Inbreeding Chance, #bold +1 Prowess per Devotion Level#!."

