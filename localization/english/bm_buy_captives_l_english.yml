 bm_buy_captives_decision:0 "Seek Captive Brokers"
 bm_buy_captives_decision_desc:0 "Word travels fast through back-alley ledgers and dockside taverns. For the right sum of coin, discreet brokers will bring debtors, outcasts, and fallen fighters straight to your dungeon — no siege or raid required."
 bm_buy_captives_decision_tooltip:0 "Inspect 1–3 random captives offered for sale"
 bm_buy_captives_decision_confirm:0 "Meet the Brokers"
 bm_buy_captives_decision_effect_tooltip:0 "A broker presents 1–3 random captives. Price scales with each captive's [prowess|E] and rare traits. You may buy one, several, or all of them."
 bm_buy_captives_cooldown_tt:0 "Has not met with captive brokers recently"

 bm_buy_captives_toast_title:0 "Captive Purchased"

 bm_buy_captives.0002.t:0 "The Captive Broker"
 bm_buy_captives.0002.desc:0 "A hooded broker leads the available stock into a quiet cellar, lanterns catching the gleam of iron shackles. No names asked, no questions answered — take one, take the lot, or walk away. Their price reflects their strength and blood."
