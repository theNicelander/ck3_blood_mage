l_english:
 bm_buy_captives_decision:0 "Seek Captive Brokers"
 bm_buy_captives_decision_desc:0 "Word travels fast through back-alley ledgers and dockside taverns. For the right sum of coin, discreet brokers will bring debtors, outcasts, and fallen fighters straight to your dungeon."
 bm_buy_captives_decision_tooltip:0 "Inspect 1–3 random captives offered for sale"
 bm_buy_captives_decision_confirm:0 "Meet the Brokers"
 bm_buy_captives_decision_effect_tooltip:0 "A broker presents 1–3 random captives (more with higher [stewardship|E])."
 bm_buy_captives_cooldown_tt:0 "Has not met with captive brokers recently"

 bm_buy_captives_toast_title:0 "Captive Purchased"
 bm_buy_captives_haggle_success_toast:0 "Captive Purchased at a Discount"
 bm_buy_captives_haggle_fail_toast:0 "Haggle Backfired — Paid Markup"
 bm_buy_captives_haggle_refused_toast:0 "Broker Withdrew Captive"

 bm_buy_captives.0002.t:0 "The Captive Broker"
 bm_buy_captives.0002.desc:0 "A hooded broker leads the available stock into a quiet cellar, lanterns catching the gleam of iron shackles. No names asked, no questions answered. Inspect any captive to pay their price or press for a better deal, take the lot, or walk away."
 bm_buy_captives.0002.desc_empty:0 "The cellar stands empty, the last shackles cleared from the floor. The broker folds their ledger and waits for you to take your leave."
 bm_buy_captives.0002.a:0 "Inspect [captive_1.GetFirstNameNoTooltip]"
 bm_buy_captives.0002.b:0 "Inspect [captive_2.GetFirstNameNoTooltip]"
 bm_buy_captives.0002.c:0 "Inspect [captive_3.GetFirstNameNoTooltip]"
 bm_buy_captives.0002.d:0 "Buy all remaining captives"
 bm_buy_captives.0002.e:0 "Back"

 bm_buy_captives.0003.t:0 "Negotiating for [selected_captive.GetFirstNameNoTooltip]"
 bm_buy_captives.0003.desc:0 "The broker steps aside so you can size up [selected_captive.GetTitledFirstName]. The asking price is [selected_captive.MakeScope.ScriptValue('bm_captive_price_value')|0]@gold_icon! — pay it outright for a clean handover, or press your luck at the table and accept whatever terms fall."
 bm_buy_captives.0003.a:0 "Pay the full price ([selected_captive.MakeScope.ScriptValue('bm_captive_price_value')|0]@gold_icon!)"
 bm_buy_captives.0003.b:0 "Haggle over the price"
 bm_buy_captives.0003.c:0 "Back"

 bm_buy_captives_haggle_success_tt:0 "You talk the broker down — buy [selected_captive.GetFirstNameNoTooltip] at a reduced price ([selected_captive.MakeScope.ScriptValue('bm_captive_discounted_price_value')|0]@gold_icon!)"
 bm_buy_captives_haggle_fail_tt:0 "The broker outplays you — buy [selected_captive.GetFirstNameNoTooltip] at an increased price ([selected_captive.MakeScope.ScriptValue('bm_captive_markup_price_value')|0]@gold_icon!)"
 bm_buy_captives_haggle_refused_tt:0 "The broker walks away — [selected_captive.GetFirstNameNoTooltip] is pulled from the offer"
 bm_buy_captives_haggle_refused_effect_tt:0 "[selected_captive.GetTitledFirstName] is no longer available to buy"
