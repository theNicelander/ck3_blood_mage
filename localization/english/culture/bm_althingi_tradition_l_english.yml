l_english:
 bm_tradition_althingi_name: "Alþingi Commonwealth"
 bm_tradition_althingi_desc: "On an isolated subarctic island without kings or royal armies, order is forged where the longships beach and the chieftains gather. Each summer at the Law-Rock of Þingvellir, the Lawspeaker recites the commonwealth's code from memory while disputes are settled by legal wit or the blood of the hólmganga—turning every coastal harbor and assembly into a thriving nexus of trade, calfskin manuscripts, and unyielding civic order."
 culture_parameter_trade_ports_give_fascination: "Every #V Tradeport#! level in the realm grants #P +2%#! [cultural_fascination|E] Progress"
 culture_parameter_trial_by_combat_enabled: "Unlocks the [single_combat_fight|E] interaction"
 cannot_have_tradition_things: "$cannot_combine_tradition_trigger_desc$ #high $tradition_things_name$#!"
