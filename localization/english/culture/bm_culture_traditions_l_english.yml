l_english:
 bm_tradition_althingi_name: "Alþingi Commonwealth"
 bm_tradition_althingi_desc: "In a land without kings, the law itself is sovereign. Guided by the Lawspeaker's recitation at the annual Alþingi and tempered by the ritualized duels of the hólmganga, rival chieftains channel their ambitions into legal mastery and calfskin chronicles—ensuring that even the most remote valleys enjoy steadfast stability and thriving development."
 cannot_have_tradition_things: "$cannot_combine_tradition_trigger_desc$ #high $tradition_things_name$#!"

 bm_tradition_verbudir_name: "Verbúðir"
 bm_tradition_verbudir_desc: "Where the land yields little, the sea provides everything. Centered on the verbúðir—seasonal coastal camps of fishermen, boatbuilders, and merchants—this culture thrives along the water's edge. Their ports bustle with the trade of cured fish and timber, while their crews navigate perilous waters and riverways with unmatched speed and discipline."
 cannot_have_tradition_maritime_mercantilism: "$cannot_combine_tradition_trigger_desc$ #high $tradition_maritime_mercantilism_name$#!"
 cannot_have_tradition_fishermen: "$cannot_combine_tradition_trigger_desc$ #high $tradition_fishermen_name$#!"
