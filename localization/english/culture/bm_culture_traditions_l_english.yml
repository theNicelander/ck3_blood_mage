l_english:
 bm_tradition_althingi_name: "Alþingi Commonwealth"
 bm_tradition_althingi_desc: "On an isolated subarctic island without kings or royal armies, order is forged where the longships beach and the chieftains gather. Each summer at the Law-Rock of Þingvellir, the Lawspeaker recites the commonwealth's code from memory while disputes are settled by legal wit or the blood of the hólmganga—turning every coastal harbor and assembly into a thriving nexus of trade, calfskin manuscripts, and unyielding civic order."
 cannot_have_tradition_things: "$cannot_combine_tradition_trigger_desc$ #high $tradition_things_name$#!"

 bm_tradition_verbudir_name: "Verbúðir"
 bm_tradition_verbudir_desc: "Along the harsh northern fjords and headlands, seafaring crews gather at seasonal fishing outposts known as verbúðir. Manning sturdy six-oared and eight-oared rowboats, clans brave gale-swept coastal waters to harvest and cure the ocean's bounty—turning remote harbors into bustling stations of maritime trade, seasoned oarsmen, and enduring sustenance."
 cannot_have_tradition_maritime_mercantilism: "$cannot_combine_tradition_trigger_desc$ #high $tradition_maritime_mercantilism_name$#!"
 cannot_have_tradition_fishermen: "$cannot_combine_tradition_trigger_desc$ #high $tradition_fishermen_name$#!"
