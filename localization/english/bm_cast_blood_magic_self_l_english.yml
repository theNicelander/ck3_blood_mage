    bm_attune_vanguard_tooltip: "$bm_attune_vanguard_desc$"

    bm_attune_slaughter: "Slaughter"
    bm_attune_slaughter_name: "$bm_attune_slaughter$"
    bm_attune_slaughter_desc: "Applies [GetModifier('slaughter_attuned').GetNameWithTooltip]."
    bm_attune_slaughter_tooltip: "$bm_attune_slaughter_desc$"

    # Channel lifeforce minor
    bm_channel_minor_lifeforce_decision: "Channel Minor Lifeforce"
    bm_channel_minor_lifeforce_decision_desc: "Spend [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] for a small temporary boost."
    bm_channel_minor_lifeforce_decision_tooltip: "Spend minor lifeforce to temporarily enhance one attribute"
    bm_channel_minor_lifeforce_decision_confirm: "Channel the Blood"

    bm_cast_blood_magic_self_channel_minor_lifeforce: "Channel Minor Lifeforce"
    bm_cast_blood_magic_self_channel_minor_lifeforce_desc: "Spend [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] for a small temporary boost."
    channel_lifeforce_enlightenment_minor.effects_list: "Channel minor blood magic to temporarily enhance one attribute:\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('diplomacy_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('martial_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('stewardship_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('intrigue_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('learning_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('prowess_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('exp_lifeforce_modifier').GetNameWithTooltip]"

    bm_channel_lifeforce_enlightenment_minor.001.title: "Subtle Blood Awakening"
    bm_channel_lifeforce_enlightenment_minor.001.desc: "A whisper of power stirs within my veins, not the roar of a full ritual but enough to grant me some advantage. With careful focus, I can direct this modest blood current to temporarily enhance a single facet of my being."
    bm_channel_lifeforce_enlightenment_minor.001.a: "Diplomacy - A drop of blood on my tongue loosens secrets"
    bm_channel_lifeforce_enlightenment_minor.001.b: "Martial - My blade thirsts for a taste of battle"
    bm_channel_lifeforce_enlightenment_minor.001.c: "Stewardship - Blood-tinged vision reveals hidden values"
    bm_channel_lifeforce_enlightenment_minor.001.d: "Intrigue - Shadows part before my blood gaze"
    bm_channel_lifeforce_enlightenment_minor.001.e: "Learning - Knowledge pulses with each heartbeat"
    bm_channel_lifeforce_enlightenment_minor.001.f: "Fertility - May our offspring flourish"
    bm_channel_lifeforce_enlightenment_minor.001.g: "Experience - Blood remembers the paths to power"
    bm_channel_lifeforce_enlightenment_minor.001.h: "Prowess - The blade shall be quenched in blood"

############### MAJOR ###############
    # Education improvement
    bm_improve_education_decision: "Enhance Education"
    bm_improve_education_decision_desc: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to attempt to improve one of your Education traits."
    bm_improve_education_decision_tooltip: "Attempt to elevate your primary education trait to a higher tier"
    bm_improve_education_decision_confirm: "Infuse Mind"
    bm_improve_education_decision_xp_requirement: "Need at least [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] Experience in [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    NOT_bm_improve_education_decision_xp_requirement: "Need at least [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] Experience in [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    bm_improve_education_cooldown: "Recently Enhanced Education"
    bm_improve_education_cooldown_desc: "You have recently enhanced or mastered an education trait through blood magic and must allow your neural pathways to stabilize."
    bm_improve_education_cooldown_tt: "Has not attempted to enhance or master education in the last 2 years"
    NOT_bm_improve_education_cooldown_tt: "Has not attempted to enhance or master education in the last 2 years"

    bm_education_enhancement.001.title: "Blood Infusion of Knowledge"
    bm_education_enhancement.001.desc: "The blood essence flows through special channels you've prepared, each inscribed with runes of knowledge and power. As you begin the ritual, you must decide which aspect of your education to enhance through blood magic. The ritual will be challenging - as your education level increases, the difficulty of further enhancement grows significantly."
    bm_education_enhancement.001.diplomacy: "Enhance my diplomatic education"
    bm_education_enhancement.001.martial: "Enhance my martial education"
    bm_education_enhancement.001.stewardship: "Enhance my stewardship education"
    bm_education_enhancement.001.intrigue: "Enhance my intrigue education"
    bm_education_enhancement.001.learning: "Enhance my learning education"
    bm_education_enhancement.001.back: "Back"
    bm_education_enhancement.success: "Education Enhanced"
    bm_education_enhancement.failure: "Blood Infusion Failed"

    # New Education
    bm_new_education_decision: "Embrace New Education"
    bm_new_education_decision_desc: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to attempt to improve one of your Education traits"
    bm_new_education_decision_tooltip: "Unlock a second education discipline using blood magic"
    bm_new_education_decision_confirm: "Forge New Pathways"
    bm_new_education_decision_xp_requirement: "Need at least [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] Experience in [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    NOT_bm_new_education_decision_xp_requirement: "Need at least [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] Experience in [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    bm_new_education_cooldown: "Recently Embraced New Education"
    bm_new_education_cooldown_desc: "You have recently forged new neural pathways for an additional education discipline and must allow your mind to stabilize."
    bm_new_education_cooldown_tt: "Has not unlocked a new education discipline in the last 2 years"
    NOT_bm_new_education_cooldown_tt: "Has not unlocked a new education discipline in the last 2 years"

    new_education_decision: "Embrace New Knowledge"
    bm_education_new.001.title: "Forging New Neural Pathways"
    bm_education_new.001.desc: "Ancient tomes open before you as you prepare the ritual space. Unlike your previous work enhancing existing knowledge, this endeavor requires breaking down mental barriers and creating entirely new structures of understanding. The blood runes you've painted on your temples pulse with anticipation—they will serve as conduits for knowledge to flood directly into your consciousness. Which unfamiliar discipline will you force your mind to embrace today?"
    bm_education_new.001.diplomacy: "Gain new diplomatic education"
    bm_education_new.001.martial: "Gain new martial education"
    bm_education_new.001.stewardship: "Gain new stewardship education"
    bm_education_new.001.intrigue: "Gain new intrigue education"
    bm_education_new.001.learning: "Gain new learning education"
    bm_education_new.001.back: "Back"

    # Blood Empowerment
    bm_blood_empowerment_decision: "Channel Blood Empowerment"
    bm_blood_empowerment_decision_desc: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to permanently enhance your physical and mental attributes"
    bm_blood_empowerment_decision_tooltip: "Spend major lifeforce to permanently advance Blood Empowerment"
    bm_blood_empowerment_decision_confirm: "Awaken Power"

    bm_blood_empowerment_event.001.title: "Blood Empowerment"
    bm_blood_empowerment_event.001.desc: "The blood magic roars within me like a caged beast, desperate for expression. I can feel it straining against my flesh, eager to reshape my very essence according to my desires. Which aspect shall I allow it to transform today?"
    bm_blood_empowerment_event.001.toast: "Blood Empowerment"

    bm_blood_empowerment_event.001.dynasty: "Dynasty - My bloodline shall thrive with potent vitality"
    bm_blood_empowerment_event.001.mastery: "Mastery - Ancient blood-wisdom shall accelerate my learning"
    bm_blood_empowerment_event.001.presence: "Presence - My words shall drip with persuasive venom"
    bm_blood_empowerment_event.001.prosperity: "Prosperity - Wealth and resources shall flow like blood into my waiting hands"
    bm_blood_empowerment_event.001.shadows: "Shadows - A shroud of blood shall confound my enemies and cloak my secrets"
    bm_blood_empowerment_event.001.versatility: "Versatility - My power shall transcend all boundaries"

    # Manifest Lifeforce
    bm_manifest_lifeforce_decision: "Manifest Lifeforce"
    bm_manifest_lifeforce_decision_desc: "Through deep meditation and spiritual connection, attempt to convert spiritual power directly into tangible lifeforce."
    bm_manifest_lifeforce_decision_tooltip: "Attempt a Learning contest to conjure lifeforce from spiritual resolve"
    bm_manifest_lifeforce_decision_confirm: "Begin Meditation"

    bm_cast_blood_magic_self_manifest_lifeforce: "Manifest Lifeforce"
    bm_cast_blood_magic_self_manifest_lifeforce_desc: "Through deep meditation and spiritual connection, attempt to convert spiritual power directly into tangible lifeforce."

    # Cast Blood Magic Minor
    bm_cast_blood_magic_minor_decision: "Cast Minor Blood Magic"
    bm_cast_blood_magic_minor_decision_desc: "Spend [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] to cast minor blood magic arts."
    bm_cast_blood_magic_minor_decision_tooltip: "Open the Grimoire of minor blood magic rituals"
    bm_cast_blood_magic_minor_decision_confirm: "Open the Grimoire"

    bm_cast_blood_magic_minor.001.title: "Minor Blood Magic"
    bm_cast_blood_magic_minor.001.desc: "A modest reserve of lifeforce stirs within your veins. With careful focus, you may channel this energy for an immediate temporary enhancement or purge physical ailments from your body."
    bm_cast_blood_magic_minor.001.channel: "Channel Minor Lifeforce"
    bm_cast_blood_magic_minor.001.purge: "Purge Impurities and Infirmities"
    bm_cast_blood_magic_minor.001.purge.tt: "Purge physical wounds, illnesses, and negative physical traits using minor lifeforce."
    bm_cast_blood_magic_minor.001.condense: "Condense Lifeforce"
    bm_cast_blood_magic_minor.001.condense.tt: "Spend #V 100#! Piety and transmute [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] into [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
    bm_condense_lifeforce_toast: "Lifeforce Condensed"
    bm_condense_lifeforce_toast_desc: "You concentrated your vital essence, spending Piety to transmute [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] into [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
    bm_cast_blood_magic_minor.001.blood_rune_minor: "Inscribe Minor Blood Rune"
    bm_cast_blood_magic_minor.001.cancel: "Back"

    # Cast Blood Magic Major
    bm_cast_blood_magic_major_decision: "Cast Major Blood Magic"
    bm_cast_blood_magic_major_decision_desc: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to execute powerful blood magic rites."
    bm_cast_blood_magic_major_decision_tooltip: "Open the Grimoire of major blood magic rituals"
    bm_cast_blood_magic_major_decision_confirm: "Open the Grimoire"

    bm_cast_blood_magic_major.001.title: "Major Blood Magic"
    bm_cast_blood_magic_major.001.desc: "A potent surge of major lifeforce pulses through your veins, ready to reshape mind, body, or bloodline. Choose which grand blood rite to execute."
    bm_cast_blood_magic_major.001.empowerment: "Blood Empowerment"
    bm_cast_blood_magic_major.001.improve_education: "Enhance Education"
    bm_cast_blood_magic_major.001.new_education: "Embrace New Education"
    bm_cast_blood_magic_major.001.blood_rune: "Inscribe Blood Runes"
    bm_cast_blood_magic_major.001.blood_rune_minor: "Inscribe Minor Blood Rune"
    bm_cast_blood_magic_major.001.blood_rune_major: "Inscribe Major Blood Rune"
    bm_cast_blood_magic_major.001.blood_rune_superior: "Inscribe Superior Blood Rune"
    bm_cast_blood_magic_major.001.bloodline: "Empower Dynasty Bloodline"
    bm_channel_bloodline_cooldown: "Recently Empowered Bloodline"
    bm_channel_bloodline_cooldown_desc: "You have recently channeled lifeforce into your dynasty bloodline and must allow the generational currents to settle."
    bm_channel_bloodline_cooldown_tt: "Has not empowered dynasty bloodline in the last 5 years"
    NOT_bm_channel_bloodline_cooldown_tt: "Has not empowered dynasty bloodline in the last 5 years"
    bm_cast_blood_magic_major.001.cancel: "Back"

############### SUPERIOR ###############
    # Cast Blood Magic Superior
    bm_cast_blood_magic_superior_decision: "Cast Superior Blood Magic"
    bm_cast_blood_magic_superior_decision_desc: "Spend [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] to execute apex blood magic rites that transcend mortal boundaries."
    bm_cast_blood_magic_superior_decision_tooltip: "Open the Grimoire of superior blood magic rituals"
    bm_cast_blood_magic_superior_decision_confirm: "Open the Grimoire"

    bm_cast_blood_magic_superior.001.title: "Superior Blood Magic"
    bm_cast_blood_magic_superior.001.desc: "The peerless, distilled essence of superior lifeforce courses through your veins. With this sublime power, you can break the fundamental laws of mortal capability—achieving legendary education mastery, unlocking new disciplines, engraving the superior rune of blood, forging blood golems, or ascending to superhuman perfection."
    bm_cast_blood_magic_superior.001.master_education: "Master Education: 5-Star Ascension"
    bm_cast_blood_magic_superior.001.new_education: "Embrace New Education"
    bm_cast_blood_magic_superior.001.blood_rune_superior: "Inscribe Superior Blood Rune"
    bm_cast_blood_magic_superior.001.manifest_traits: "Channel Lifeforce: Apex Perfection"
    bm_cast_blood_magic_superior.001.manifest_traits_tt: "Focus Superior Lifeforce into transmuting congenital traits (Intellect, Physique, Beauty) to apex ranks 3 to 5 (Genius, Herculean, Beautiful, and beyond)."
    bm_cast_blood_magic_superior.001.create_blood_golem: "Forge Blood Golem"
    bm_cast_blood_magic_superior.001.cancel: "Back"

    # Education Mastery
    bm_master_education_decision_desc: "Attempt to elevate your 4-star education into legendary 5-star mastery."
    bm_education_master.001.title: "Pinnacle of Intellectual Mastery"
    bm_education_master.001.desc: "You have pushed your discipline to the very brink of human understanding. By flooding your mind with superior lifeforce, you can crystallize your knowledge into legendary 5-star mastery."
    bm_education_master.001.diplomacy: "Attain legendary diplomatic mastery"
    bm_education_master.001.martial: "Attain legendary martial mastery"
    bm_education_master.001.stewardship: "Attain legendary stewardship mastery"
    bm_education_master.001.intrigue: "Attain legendary intrigue mastery"
    bm_education_master.001.learning: "Attain legendary learning mastery"
    bm_education_master.001.back: "Back"
    bm_education_master.success: "Legendary Mastery Achieved"
