    NOT_bm_attune_lifeforce_change_req: "Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] to change attunement"
    bm_attune_already_attuned_req: "You are already attuned to this discipline"
    NOT_bm_attune_already_attuned_req: "You are already attuned to this discipline"

