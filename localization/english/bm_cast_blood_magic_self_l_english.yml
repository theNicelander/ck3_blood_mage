    bm_improve_education_cooldown_desc: "You have recently enhanced or mastered an education trait through blood magic and must allow your neural pathways to stabilize."
    bm_improve_education_cooldown_tt: "Has not attempted to enhance or master education in the last 2 years"
    NOT_bm_improve_education_cooldown_tt: "Has not attempted to enhance or master education in the last 2 years"

    bm_education_enhancement.001.title: "Blood Infusion of Knowledge"
    bm_education_enhancement.001.desc: "The blood essence flows through special channels you've prepared, each inscribed with runes of knowledge and power. As you begin the ritual, you must decide which aspect of your education to enhance through blood magic. The ritual will be challenging - as your education level increases, the difficulty of further enhancement grows significantly."
