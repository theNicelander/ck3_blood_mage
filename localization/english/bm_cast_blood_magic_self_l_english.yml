    bm_empower_dynasty_name: "$bm_empower_dynasty$"
    bm_empower_dynasty_desc: "Channels vital essence into generational perfection, congenital inheritance, and complete inbreeding immunity.\n\n#P Step:#! +5% Positive Inactive Inheritance, +5% Congenital Trait Strengthen Chance.\n#V 50 XP Milestone:#! #P -50%#! Inbreeding Chance, #P +10%#! Monthly Renown.\n#Y 100 XP Capstone:#! #P -50%#! Inbreeding Chance (-100% total immunity), #P +15%#! Monthly Renown (+25% total), Age Prowess Lock."
    bm_empower_dynasty_tooltip: "$bm_empower_dynasty_desc$"

