############### MINOR ###############
    # Attune lifeforce
    bm_attune_lifeforce_decision: "Lifeforce Attunement"
    bm_attune_lifeforce_decision_desc: "Attune your Blood Magic toward a chosen discipline to guarantee experience gain each year and unlock passive blessings.\n\nYour first attunement is #P free#!. Changing an active attunement requires a #V 3-year cooldown#!, [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], and #V 100#! Piety."
    bm_attune_lifeforce_decision_tooltip: "Attune to a discipline to guarantee annual experience gain and unlock passive benefits"
    BM_ATTUNE_LIFEFORCE_DECISION_NEXT_STEP_BUTTON: "Attune Powers"
    bm_attune_lifeforce_decision_confirm: "$BM_ATTUNE_LIFEFORCE_DECISION_NEXT_STEP_BUTTON$"
    bm_attune_lifeforce_decision_effect: "You attune your Blood Magic to the chosen discipline, gaining #P +1#! experience per year (#P +2#! with Superior Hulinhjálmur) and its passive modifier."
    bm_attune_lifeforce_decision_req: "Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]"
    NOT_bm_attune_lifeforce_decision_req: "Requires [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]"
