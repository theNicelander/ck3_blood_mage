    bm_empower_shadows_name: "$bm_empower_shadows$"
    bm_empower_shadows_desc: "Weaves an impenetrable shroud of blood around your plots, capping enemy schemes while enabling deadly hostile scheming.\n\n#P Step:#! +5 Hostile Scheme Success, -5 Enemy Hostile Scheme Success.\n#V 50 XP Milestone:#! #P -25%#! Enemy Hostile Scheme Max Success Cap, #P +1#! Max Hostile Schemes.\n#Y 100 XP Capstone:#! #P -25%#! Enemy Hostile Scheme Max Success Cap (-50% total), #P +15%#! Own Hostile Scheme Max Success Cap, #P +1#! Max Hostile Schemes (+2 total), Age Prowess Lock."
    bm_empower_shadows_tooltip: "$bm_empower_shadows_desc$"

