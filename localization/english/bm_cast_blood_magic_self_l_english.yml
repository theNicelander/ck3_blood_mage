    bm_empower_prosperity_name: "$bm_empower_prosperity$"
    bm_empower_prosperity_desc: "Draws enduring wealth into your treasury while fortifying domain authority and Men-at-Arms regiments.\n\n#P Step:#! +5% Monthly Income, -4% Men-at-Arms Maintenance.\n#V 50 XP Milestone:#! #P +2#! Domain Limit, #P +1#! Men-at-Arms Regiment Size.\n#Y 100 XP Capstone:#! #P +2#! Domain Limit (+4 total), #P +2#! Men-at-Arms Regiment Size (+3 total), Age Prowess Lock."
    bm_empower_prosperity_tooltip: "$bm_empower_prosperity_desc$"

