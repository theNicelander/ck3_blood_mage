    bm_empower_presence_name: "$bm_empower_presence$"
    bm_empower_presence_desc: "Projects supernatural magnetism, unshakeable mental composure, and enduring imperial authority.\n\n#P Step:#! +3 General Opinion, -5% Stress Gain.\n#V 50 XP Milestone:#! #P +25%#! Fame Impact.\n#Y 100 XP Capstone:#! #P -25%#! Short Reign Duration, #P +25%#! Long Reign Bonus, Age Prowess Lock."
    bm_empower_presence_tooltip: "$bm_empower_presence_desc$"

