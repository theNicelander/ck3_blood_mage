    bm_cast_blood_magic_major.001.power: "Channel Blood Power"
    bm_cast_blood_magic_major.001.power_tt: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and #V 150#! [piety|E] to improve [GetTrait('lifestyle_blood_power').GetName( GetPlayer )].\n\nMilestones at #V 50#! and #V 100#! XP."
