    bm_channel_blood_empowerment_decision: "Channel Blood Power"
    bm_channel_blood_empowerment_decision_desc: "Spend [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and #V 150#! [piety|E] to improve [GetTrait('lifestyle_blood_power').GetName( GetPlayer )].\n\nMilestones at #V 50#! and #V 100#! XP."
    bm_channel_blood_empowerment_decision_tooltip: "Spend Major Lifeforce to permanently advance a chosen Blood Power track"
    BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON: "Awaken Power"
    bm_channel_blood_empowerment_decision_confirm: "$BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON$"
    bm_channel_blood_empowerment_decision_effect: "You channel Major Lifeforce, permanently advancing your chosen Blood Power discipline."
    bm_channel_blood_empowerment_major_lifeforce_req: "Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
    NOT_bm_channel_blood_empowerment_major_lifeforce_req: "Requires [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
    bm_empower_track_already_mastered_req: "This discipline has already reached its maximum rank (100 XP)"
    NOT_bm_empower_track_already_mastered_req: "This discipline has already reached its maximum rank (100 XP)"

    bm_empower_dynasty: "Dynasty — Eugenics & Kinship"
    bm_empower_dynasty_name: "$bm_empower_dynasty$"
    bm_empower_dynasty_desc: "Channels Lifeforce into generational perfection, congenital inheritance, extended fertility, and complete inbreeding immunity.\n\n#P Every 10 XP:#! #P +5#! Monthly Active Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +5% Positive Inactive Inheritance, +5% Congenital Trait Strengthen Chance.\n#P 20 XP Step:#! #P +5#! Years of Fertility.\n#V 50 XP Milestone:#! #P -50%#! Inbreeding Chance, #P +10%#! Monthly Renown.\n#Y 100 XP Capstone:#! #P -50%#! Inbreeding Chance (-100% total immunity), #P +15%#! Monthly Renown (+25% total), +20 Years of Fertility, Age Prowess Lock."
    bm_empower_dynasty_tooltip: "$bm_empower_dynasty_desc$"

    bm_empower_fury: "Fury — Warfare & Command"
    bm_empower_fury_name: "$bm_empower_fury$"
    bm_empower_fury_desc: "Channels Lifeforce into battlefield command, siege mastery, and martial dominance.\n\n#P Every 10 XP:#! #P +5#! Monthly Martial Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +1 Advantage, -3% Army Maintenance.\n#P 20 XP Step:#! #P -5%#! Siege Phase Time, #P +1#! Number of Knights.\n#V 50 XP Milestone:#! #P +1#! Martial per Devotion level, #P +1#! Prowess per Devotion level.\n#Y 100 XP Capstone:#! #P +1#! Martial per Devotion level (+2 total), #P +1#! Prowess per Devotion level (+2 total), Age Prowess Lock."
    bm_empower_fury_tooltip: "$bm_empower_fury_desc$"

    bm_empower_mastery: "Mastery — World-Walker & Schemes"
    bm_empower_mastery_name: "$bm_empower_mastery$"
    bm_empower_mastery_desc: "Expands the horizons of your mind and step, accelerating lifestyle mastery, personal scheming, and language capacity.\n\n#P Every 10 XP:#! #P +5#! Monthly Learning Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +5% Monthly Lifestyle Experience.\n#P 20 XP Step:#! #P +5#! Personal Scheme Success, #P -5#! Days Scheme Phase.\n#V 50 XP Milestone:#! #P +1#! Learning per Devotion level, #P +1#! Max Personal Schemes.\n#Y 100 XP Capstone:#! #P +1#! Learning per Devotion level (+2 total), #P +1#! Max Personal Schemes (+2 total), #P Ignore Negative Culture Opinion#!, Age Prowess Lock."
    bm_empower_mastery_tooltip: "$bm_empower_mastery_desc$"

    bm_empower_presence: "Presence — Mesmeric Majesty"
    bm_empower_presence_name: "$bm_empower_presence$"
    bm_empower_presence_desc: "Projects supernatural magnetism, unshakeable mental composure, and enduring imperial authority.\n\n#P Every 10 XP:#! #P +5#! Monthly Diplomacy Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +3 General Opinion, -5% Stress Gain.\n#P 20 XP Step:#! #P +5%#! Fame Impact.\n#V 50 XP Milestone:#! #P +1#! Diplomacy per Devotion level, #P -10%#! Short Reign Duration, #P +10%#! Long Reign Bonus.\n#Y 100 XP Capstone:#! #P +1#! Diplomacy per Devotion level (+2 total), #P -10%#! Short Reign Duration (-20% total), #P +10%#! Long Reign Bonus (+20% total), Age Prowess Lock."
    bm_empower_presence_tooltip: "$bm_empower_presence_desc$"

    bm_empower_prosperity: "Prosperity — Wealth & Architecture"
    bm_empower_prosperity_name: "$bm_empower_prosperity$"
    bm_empower_prosperity_desc: "Draws enduring wealth into your treasury while cutting construction costs, sustaining armies, and expanding domain authority.\n\n#P Every 10 XP:#! #P +5#! Monthly Stewardship Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +5% Monthly Income, -3% Holding & Domicile Construction Cost.\n#P 20 XP Step:#! #P -5%#! Men-at-Arms Maintenance.\n#V 50 XP Milestone:#! #P +1#! Stewardship per Devotion level, #P +1#! Domain Limit.\n#Y 100 XP Capstone:#! #P +1#! Stewardship per Devotion level (+2 total), #P +1#! Domain Limit (+2 total), Age Prowess Lock."
    bm_empower_prosperity_tooltip: "$bm_empower_prosperity_desc$"

    bm_empower_shadows: "Shadows — Occult Warding & Intrigue"
    bm_empower_shadows_name: "$bm_empower_shadows$"
    bm_empower_shadows_desc: "Weaves an impenetrable shroud of blood around your plots, blunting enemy schemes while enabling deadly hostile plotting.\n\n#P Every 10 XP:#! #P +5#! Monthly Intrigue Lifestyle XP (+15 per quarter).\n#P 10 XP Step:#! +5 Hostile Scheme Success, -5 Enemy Hostile Scheme Success.\n#P 20 XP Step:#! #P -5%#! Enemy Hostile Scheme Max Success Cap.\n#V 50 XP Milestone:#! #P +1#! Intrigue per Devotion level, #P +1#! Max Hostile Schemes.\n#Y 100 XP Capstone:#! #P +1#! Intrigue per Devotion level (+2 total), #P +1#! Max Hostile Schemes (+2 total), #P +15%#! Own Hostile Scheme Max Success Cap, Age Prowess Lock."
    bm_empower_shadows_tooltip: "$bm_empower_shadows_desc$"

