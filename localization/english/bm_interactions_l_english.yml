l_english:
  # Give blood magic
  grant_blood_magic_interaction: "Make Them a Blood Mage"
  grant_blood_magic_interaction_desc: "Awaken the supernatural Blood Mage lifestyle trait within [recipient.GetShortUINameNoTooltip]."
  grant_blood_magic_interaction.minor: "Arcane Blood Oath (Minor Lifeforce)"
  grant_blood_magic_interaction.minor_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]."
  grant_blood_magic_interaction.major: "Blood Brotherhood Rite (Major Lifeforce)"
  grant_blood_magic_interaction.major_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E]."
  grant_blood_magic_interaction_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Ask for Blood Magic"
  ask_for_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] is granted the power of blood magic"
  ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"
  NOT_ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Get blood magic from prisoner"
  bm_get_blood_magic_from_prisoner_interaction.success: "@bm_ancient_discipline_icon! I become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.fail: "@bm_ancient_discipline_icon! I fail to become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.desc: "I consume their flesh, in an attempt to gain their Blood Magic"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Grant Lifeforce"
  grant_lifeforce_interaction_desc: "Transfer Lifeforce into [recipient.GetShortUINameNoTooltip] or restore their vitality if recently drained."
  grant_lifeforce_interaction.grant_minor: "Grant Minor Lifeforce"
  grant_lifeforce_interaction.grant_major: "Grant Major Lifeforce"
  grant_lifeforce_interaction.reverse_lifedrain: "Reverse Lifedrain"
  grant_lifeforce_interaction.toast: "I granted [recipient.GetShortUINameNoTooltip] lifeforce"
  grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 25 [piety|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to grant lifeforce."
  NOT_grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 25 [piety|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to grant lifeforce."
  grant_lifeforce_reverse_lifedrain_requirement: "You need [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to reverse lifedrain."
  NOT_grant_lifeforce_reverse_lifedrain_requirement: "You need [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to reverse lifedrain."


  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Reverse Lifedrain"
  grant_lifeforce_interaction_reversed_desc: "Consume [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to cleanse [GetModifier('lifedrained_modifier').GetNameWithTooltip] from [recipient.GetShortUINameNoTooltip] and bestow [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]."

  # Cure illness
  bm_heal_ailment: "Blood Healing"
  bm_heal_ailment_desc: "Perform a blood ritual to heal a specific health trait, old-age trait, or coping trait suffered by [recipient.GetShortUINameNoTooltip]."
  bm_heal_ailment_tooltip: "Perform a blood magic healing ritual."
  bm_heal_ailment_resource_requirement_tt: "You must possess sufficient Lifeforce and Piety to heal at least one of [recipient.GetShortUINamePossessive] health traits."
  NOT_bm_heal_ailment_resource_requirement_tt: "You must possess sufficient Lifeforce and Piety to heal at least one of [recipient.GetShortUINamePossessive] health traits."


  bm_duel_kill_fury_toast: "@bm_ancient_discipline_icon! Fury Duel Harvest"
  bm_duel_kill_fury_tt: "Gained #P +2#! Experience in the #V Fury#! track and harvested [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] for victory in single combat"

  bm_battle_victory_lifeforce_toast: "@bm_ancient_discipline_icon! Battlefield Blood Harvest"
  bm_battle_victory_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] from fallen foes on the victorious battlefield"
  bm_battle_victory_major_lifeforce_toast: "@bm_ancient_discipline_icon! Major Battlefield Blood Harvest"
  bm_battle_victory_major_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] from the slaughter on the victorious battlefield"
  bm_battle_victory_superior_lifeforce_toast: "@bm_ancient_discipline_icon! Superior Battlefield Blood Harvest"

  # Battle XP Toasts
  bm_battle_victory_commander_toast: "@bm_ancient_discipline_icon! Fury: Victorious Command"
  bm_battle_victory_commander_t1_tt: "A minor skirmish won on the field.\nGained #P +1#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_commander_t2_tt: "A sharp engagement won through tactical command.\nGained #P +2#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_commander_t3_tt: "A major battle won across contested battle lines.\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_commander_t4_tt: "A grand battle won through masterful command.\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_commander_t5_tt: "An epic clash of nations decided by your command!\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"

  bm_battle_victory_fury_toast: "@bm_ancient_discipline_icon! Fury: Victorious Prowess"
  bm_battle_victory_fury_t1_tt: "A minor skirmish won on the field.\nGained #P +1#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_fury_t2_tt: "A sharp engagement won through prowess.\nGained #P +2#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_fury_t3_tt: "A major battle won through blood and steel.\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_fury_t4_tt: "A grand battle won across bloodsoaked lines.\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"
  bm_battle_victory_fury_t5_tt: "An epic slaughter where legends are forged in blood!\nGained #P +3#! [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)] #V Fury#! Experience"

  # Bless Kin
  bm_bless_bloodline_interaction: "Bless Blood"
  bm_bless_bloodline_interaction_desc: "Infuse a child, dynasty kin, or sworn knight with Lifeforce, blessing their body and mind."
  bm_recipient_already_blessed: "Target's blood is already blessed"
  NOT_bm_recipient_already_blessed: "Target's blood is already blessed"
  bm_bless_bloodline_toast: "Blood Blessed"
  bm_bless_bloodline_toast_tt: "You infused [recipient.GetShortUINamePossessive] blood with Lifeforce."

  # Childbirth Milestones
  bm_birth_blood_mage_child_toast: "@bm_ancient_discipline_icon! Blood Mage Heir Born"
  bm_birth_blood_mage_child_tt: "A child awakens with the blood magic trait! You harvest Major Lifeforce, while your bloodline and ancient masteries surge forward."
  bm_birth_child_fortune_toast: "@bm_ancient_discipline_icon! Child of the Line Born"
  bm_birth_child_fortune_tt: "A new child is born to your house, granting Major Lifeforce and Ancient Experience."
  bm_birth_mojo_consumed_toast: "@bm_ancient_discipline_icon! Ancient Blood Infused at Childbirth"
  bm_birth_mojo_consumed_tt: "1 stack of Ancient Blood was consumed to quicken the newborn's bloodline, granting bonus Fortune experience and increasing their chance of awakening as a Blood Mage."

  # Tooltips
  IN_COURT_OR_IMPRISONED: "Can only heal yourself, your family, your liege, your courtiers, or your knights"

  # Blood Curse
  bm_curse_blood.critical_success_title: "@bm_ancient_discipline_icon! Vitality Siphoned"
  bm_curse_blood.critical_success_desc: "Your blood curse struck deep into [recipient.GetShortUINamePossessive] veins, inflicting severe sickness and siphoning their vitality back into your grasp."
  bm_curse_blood.success_title: "@bm_ancient_discipline_icon! Blood Curse Inflicted"
  bm_curse_blood.success_desc: "You bound a malefic hemomantic curse to [recipient.GetShortUINamePossessive] blood. Their health and abilities wither in secret."
  bm_curse_blood.fail_title: "@bm_ancient_discipline_icon! Curse Repelled"
  bm_curse_blood.fail_desc: "[recipient.GetShortUIName] resisted your blood curse and realized who sought to taint their veins."

  # Manifest Lifeforce Interaction
  bm_manifest_lifeforce_interaction: "Manifest Lifeforce"
  bm_manifest_lifeforce_interaction_desc: "Enter a deep meditative trance, converting spiritual power directly into tangible Lifeforce through a contest of Learning."
  bm_manifest_lifeforce_requirement_tt: "Requires Devotion Level 2 (Devoted Servant) and at least 100 Piety"
  NOT_bm_manifest_lifeforce_requirement_tt: "Requires Devotion Level 2 (Devoted Servant) and at least 100 Piety"
  bm_manifest_lifeforce_cooldown_tt: "Can only manifest Lifeforce once per year"
  NOT_bm_manifest_lifeforce_cooldown_tt: "Can only manifest Lifeforce once per year"
  bm_manifest_lifeforce_interaction.tier1: "Modest Meditation (100 Piety)"
  bm_manifest_lifeforce_interaction.tier1_desc: "Risky Learning trance for a chance at Minor or Major Lifeforce."
  bm_manifest_lifeforce_interaction.tier2: "Focused Communion (250 Piety)"
  bm_manifest_lifeforce_interaction.tier2_desc: "Guaranteed Minor Lifeforce upfront, plus a Learning trance for Major Lifeforce."
  bm_manifest_lifeforce_interaction.tier3: "Profound Crucible (500 Piety)"
  bm_manifest_lifeforce_interaction.tier3_desc: "Safe Learning trance with guaranteed Major Lifeforce and bonus Lifeforce odds."
  bm_manifest_lifeforce_interaction.tier4: "Transcendent Epiphany (1000 Piety)"
  bm_manifest_lifeforce_interaction.tier4_desc: "Apex Learning trance with guaranteed Minor and Major Lifeforce, plus Superior Lifeforce odds."

  # Character Interaction Category
  interaction_category_bm_blood_magic: "Blood Magic"
  BM_BLOOD_MAGIC_ACTIONS: "Blood Magic"
  interaction_category_bm_blood_magic_filter_tag_desc: "Blood Magic Interactions"

  # Cast Blood Blessing Interaction
  bm_cast_blood_blessing_interaction: "Blood Blessing"
  bm_cast_blood_blessing_interaction_desc: "Channel Lifeforce and Piety into [recipient.GetShortUINameNoTooltip] to bestow a permanent Blood Blessing, transfer Lifeforce, or inscribe a Blood Rune."
  bm_cast_blood_blessing_interaction_tooltip: "Bestow a permanent Blood Blessing, grant Lifeforce, or inscribe a Blood Rune."
  bm_cast_blood_blessing_interaction_requirement: "You must possess Minor, Major, Superior, or Ancient Lifeforce."
  NOT_bm_cast_blood_blessing_interaction_requirement: "You must possess Minor, Major, Superior, or Ancient Lifeforce."
  bm_cast_blood_blessing_option_radiance_desc: "Permanent Diplomacy and Diplomacy Lifestyle XP blessing."
  bm_cast_blood_blessing_option_fortune_desc: "Permanent Stewardship, Trade, and Stewardship Lifestyle XP blessing."
  bm_cast_blood_blessing_option_fury_desc: "Permanent Martial and Martial Lifestyle XP blessing."
  bm_cast_blood_blessing_option_cunning_desc: "Permanent Intrigue and Intrigue Lifestyle XP blessing."
  bm_cast_blood_blessing_option_wisdom_desc: "Permanent Learning and Learning Lifestyle XP blessing."
  bm_cast_blood_blessing_option_ancient_desc: "Permanent all-lifestyle XP and fertility blessing."
  bm_blood_blessing_toast: "@bm_ancient_discipline_icon! Blood Blessing Bestowed"
  bm_blood_blessing_option_grant_lifeforce_minor: "Grant Minor Lifeforce"
  bm_blood_blessing_option_grant_lifeforce_minor_desc: "Transfer 1 Minor Lifeforce to [recipient.GetShortUINameNoTooltip]."
  bm_blood_blessing_option_grant_lifeforce_major: "Grant Major Lifeforce"
  bm_blood_blessing_option_grant_lifeforce_major_desc: "Transfer 1 Major Lifeforce to [recipient.GetShortUINameNoTooltip], or restore them if Lifedrained."
  bm_blood_blessing_option_grant_lifeforce_superior: "Grant Superior Lifeforce"
  bm_blood_blessing_option_grant_lifeforce_superior_desc: "Transfer 1 Superior Lifeforce to [recipient.GetShortUINameNoTooltip]."
  bm_blood_blessing_option_grant_lifeforce_ancient: "Grant Ancient Blood"
  bm_blood_blessing_option_grant_lifeforce_ancient_desc: "Transfer 1 Ancient Blood to [recipient.GetShortUINameNoTooltip]."
  bm_blood_blessing_option_inscribe_rune: "Inscribe Blood Rune"
  bm_blood_blessing_option_inscribe_rune_desc: "Carve or upgrade a permanent Blood Rune upon [recipient.GetShortUINameNoTooltip]."

  # Unified Blood Drain Interaction
  bm_blood_drain_interaction: "Blood Drain"
  bm_blood_drain_interaction_desc: "Extract Lifeforce from [recipient.GetShortUINameNoTooltip] through forbidden rites of blood."
  bm_blood_drain_interaction_tooltip: "Harvest vital essence from prisoners, subjects, kin, or rival mages."
  bm_blood_drain_interaction_requirement: "You must be capable of extracting Lifeforce from this character."
  NOT_bm_blood_drain_interaction_requirement: "You cannot extract Lifeforce from this character."
  bm_blood_drain_toast: "@bm_ancient_discipline_icon! Lifeforce Extracted"
  bm_blood_drain_secret_toast: "@bm_ancient_discipline_icon! Lifeforce Extracted in Secret"
  bm_blood_drain_option_major: "Major Life drain"
  bm_blood_drain_option_major_desc: "Lethally drain a prisoner to condense Major Lifeforce."
  bm_blood_drain_option_minor: "Minor Life drain"
  bm_blood_drain_option_minor_desc: "Drain Minor Lifeforce; auto-succeeds on prisoners, contested by Intrigue and Learning on others."
  bm_blood_drain_option_minor_empowered: "Minor Life drain (Empowered)"
  bm_blood_drain_option_minor_empowered_desc: "Spend extra Piety for much higher success and secrecy odds when draining a non-prisoner."
  bm_blood_drain_minor_secret_success_tt: "You secretly drain Minor Lifeforce without being discovered"
  bm_blood_drain_minor_success_tt: "You successfully drain Minor Lifeforce"
  bm_blood_drain_minor_fail_tt: "[recipient.GetShortUINameNoTooltip] resists your attempt"
  bm_blood_drain_minor_fail_toast: "@bm_ancient_discipline_icon! Lifeforce Drain Resisted"
  bm_minor_lifedrain_victim_cooldown_tt: "Has not been minor lifedrained in the last 3 months"
  NOT_bm_minor_lifedrain_victim_cooldown_tt: "Has not been minor lifedrained in the last 3 months"
  bm_blood_drain_option_stored: "Drain Stored Lifeforce"
  bm_blood_drain_option_stored_desc: "Siphon stored Lifeforce from [recipient.GetShortUINameNoTooltip]; auto-succeeds on prisoners, contested on others."
  bm_blood_drain_stored_success_tt: "You siphon their stored Lifeforce"
  bm_blood_drain_stored_fail_tt: "[recipient.GetShortUINameNoTooltip] blocks your siphon"
  bm_blood_drain_stored_fail_toast: "@bm_ancient_discipline_icon! Siphon Failed"
  bm_blood_drain_option_tithe: "Demand Blood Tithe"
  bm_blood_drain_option_tithe_desc: "Demand Lifeforce from an adult house member as House Head, guaranteed with no duel."
  bm_blood_drain_option_trait: "Drain Positive Traits"
  bm_blood_drain_option_trait_desc: "Steal a positive congenital trait from a prisoner via a Learning duel."
  bm_trait_drain_caster_cooldown_tt: "You have not drained positive traits in the last 60 days"
  NOT_bm_trait_drain_caster_cooldown_tt: "You have not drained positive traits in the last 60 days"
  bm_trait_drain_victim_cooldown_tt: "Has not been trait drained in the last 180 days"
  NOT_bm_trait_drain_victim_cooldown_tt: "Has not been trait drained in the last 180 days"
  bm_blood_drain_option_memory: "Drain Blood Memory"
  bm_blood_drain_option_memory_desc: "Siphon a lifestyle, commander, or martial fame trait (or XP if already held) from a prisoner via a Learning duel."
  bm_memory_drain_caster_cooldown_tt: "You have not drained blood memory in the last 60 days"
  NOT_bm_memory_drain_caster_cooldown_tt: "You have not drained blood memory in the last 60 days"
  bm_memory_drain_victim_cooldown_tt: "Has not resisted a blood memory drain in the last 180 days"
  NOT_bm_memory_drain_victim_cooldown_tt: "Has not resisted a blood memory drain in the last 180 days"
  bm_blood_drain_option_curse: "Blood Curse"
  bm_blood_drain_option_curse_desc: "Afflict [recipient.GetShortUINameNoTooltip] with a Blood Curse via an Intrigue and Learning duel."
  bm_curse_blood_cooldown_tt: "You have not cast a Blood Curse in the last 1 year"
  NOT_bm_curse_blood_cooldown_tt: "You have not cast a Blood Curse in the last 1 year"
  bm_blood_drain_option_major_overdrained: "Major Life drain (Overdrained)"
  bm_blood_drain_option_major_overdrained_desc: "Lethally drain a prisoner for Major Lifeforce without Piety, suffering Stress, wounds, and Overdrained."
  bm_blood_drain_option_blood_duel: "Blood Pit Duel"
  bm_blood_drain_option_blood_duel_desc: "Fight a formidable prisoner in Single Combat; victory slays them for Major Lifeforce and a chance at Superior Lifeforce."
