l_english:
  # Give blood magic
  grant_blood_magic_interaction: "Make Them a Blood Mage"
  grant_blood_magic_interaction_desc: "Infuse [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip], bestowing the Blood Mage lifestyle trait."

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Ask for Blood Magic"
  ask_for_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] is granted the power of blood magic"
  ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"
  NOT_ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Get blood magic from prisoner"
  bm_get_blood_magic_from_prisoner_interaction.success: "I become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.fail: "I fail to become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.desc: "I consume their flesh, in an attempt to gain their Blood Magic"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Grant Lifeforce"
  grant_lifeforce_interaction_desc: "Channel your lifeforce into [recipient.GetShortUINameNoTooltip]."
  grant_lifeforce_interaction.grant_minor: "Grant Minor Lifeforce"
  grant_lifeforce_interaction.grant_major: "Grant Major Lifeforce"
  grant_lifeforce_interaction.toast: "I granted [recipient.GetShortUINameNoTooltip] lifeforce"
  grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to grant lifeforce."
  NOT_grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to grant lifeforce."


  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Reverse Lifedrain"
  grant_lifeforce_interaction_reversed_desc: "[recipient.GetShortUINameNoTooltip] was [GetModifier('lifedrained_modifier').GetNameWithTooltip], but I can give it back to them"

  # Cure illness
  bm_heal_ailment: "Heal Affliction"
  bm_heal_ailment_desc: "Perform a blood ritual to mend a specific wound, disease, or affliction suffered by [recipient.GetShortUINameNoTooltip]."
  bm_heal_ailment_tooltip: "Perform a blood magic healing ritual."
  bm_heal_ailment_resource_requirement_tt: "You must possess sufficient Lifeforce and Piety to heal at least one of [recipient.GetShortUINamePossessive] afflictions."

  # Blood Knight
  make_blood_knight_interaction: "Make Blood Knight"
  make_blood_knight_interaction_desc: "Awaken the supernatural Blood Knight lifestyle trait within [recipient.GetShortUINameNoTooltip]."
  make_blood_knight_interaction.mage: "Arcane Blood Infusion"
  make_blood_knight_interaction.mage_desc: "Perform an arcane transmutation using [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E]."
  make_blood_knight_interaction.knight_minor: "Martial Blood Oath (Minor Lifeforce)"
  make_blood_knight_interaction.knight_minor_desc: "Bind your sworn knight with martial renown (200 [prestige|E]) and [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]."
  make_blood_knight_interaction.knight_major: "Blood Brotherhood Rite (Major Lifeforce)"
  make_blood_knight_interaction.knight_major_desc: "Infuse your sworn knight with condensed [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] without expending prestige."
  make_blood_knight_interaction_knight_requirement: "You must possess either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 200 [prestige|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  NOT_make_blood_knight_interaction_knight_requirement: "You must possess either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 200 [prestige|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  empower_blood_knight_interaction: "Empower Blood Knight"
  empower_blood_knight_interaction_desc: "Channel supernatural lifeforce into [recipient.GetShortUINameNoTooltip] to strengthen their martial tracks."
  empower_blood_knight_interaction.major: "Major Lifeforce (+10 XP to all tracks)"
  empower_blood_knight_interaction.minor: "Minor Lifeforce (+5 XP to all tracks)"
  empower_blood_knight_interaction.cancel: "Back out, no cost"
  empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."
  NOT_empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."

  bm_duel_kill_blood_knight_toast: "Blood Knight Bloodbath"
  bm_duel_kill_blood_knight_tt: "Gained #P +5#! Experience in the #V Slaughter#! track and harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] for victory in single combat"

  bm_battle_victory_lifeforce_toast: "Battlefield Blood Harvest"
  bm_battle_victory_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] from fallen foes on the victorious battlefield"

  # Bless Kin
  bm_bless_bloodline_interaction: "Bless Kin's Blood"
  bm_bless_bloodline_interaction_desc: "Infuse a child or kin of your house with vital blood magic, blessing their body and mind while refining your mastery of the bloodline."
  bm_recipient_already_blessed: "Target's blood is already blessed"
  bm_bless_bloodline_toast: "Kin's Blood Blessed"
  bm_bless_bloodline_toast_tt: "You infused [recipient.GetShortUINamePossessive] blood with lifeforce, granting vitality and expanding your bloodline mastery."

  # Childbirth Milestones
  bm_birth_blood_mage_child_toast: "Blood Mage Heir Born"
  bm_birth_blood_mage_child_tt: "A child awakens with the blood magic trait! Your bloodline mastery surges forward."
  bm_birth_child_bloodline_toast: "Child of the Line Born"
  bm_birth_child_bloodline_tt: "A new child is born to your house, expanding your dynastic lineage and granting Bloodline Experience."

  # Tooltips
  IN_COURT_OR_IMPRISONED: "Can only heal yourself, your family, your liege, your courtiers, or your knights"

  # Blood Curse
  bm_curse_blood_interaction: "Cast Blood Curse"
  bm_curse_blood_interaction_desc: "Weave a forbidden hemomantic curse through the blood of [recipient.GetShortUINameNoTooltip], afflicting their vitality and siphoning their life essence from afar."
  bm_curse_blood.critical_success_title: "Vitality Siphoned"
  bm_curse_blood.critical_success_desc: "Your blood curse struck deep into [recipient.GetShortUINamePossessive] veins, inflicting severe sickness and siphoning their vitality back into your grasp."
  bm_curse_blood.success_title: "Blood Curse Inflicted"
  bm_curse_blood.success_desc: "You bound a malefic hemomantic curse to [recipient.GetShortUINamePossessive] blood. Their health and abilities wither in secret."
  bm_curse_blood.fail_title: "Curse Repelled"
  bm_curse_blood.fail_desc: "[recipient.GetShortUIName] resisted your blood curse and realized who sought to taint their veins."
