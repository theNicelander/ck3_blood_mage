l_english:
  # Give blood magic
  grant_blood_magic_interaction: "Make Them a Blood Mage"
  grant_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] will be granted the power of blood magic"

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Ask for Blood Magic"
  ask_for_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] is granted the power of blood magic"
  ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"
  NOT_ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Get blood magic from prisoner"
  bm_get_blood_magic_from_prisoner_interaction.success: "I become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.fail: "I fail to become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.desc: "I consume their flesh, in an attempt to gain their Blood Magic"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Grant Lifeforce"
  grant_lifeforce_interaction_desc: "Channel your lifeforce into [recipient.GetShortUINameNoTooltip]."
  grant_lifeforce_interaction.grant_minor: "Grant Minor Lifeforce"
  grant_lifeforce_interaction.grant_major: "Grant Major Lifeforce"
  grant_lifeforce_interaction.toast: "I granted [recipient.GetShortUINameNoTooltip] lifeforce"
  grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to grant lifeforce."
  NOT_grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to grant lifeforce."


  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Reverse Lifedrain"
  grant_lifeforce_interaction_reversed_desc: "[recipient.GetShortUINameNoTooltip] was [GetModifier('lifedrained_modifier').GetNameWithTooltip], but I can give it back to them"

  # Cure illness
  heal_disease_minor: "Heal Minor Ailment"
  heal_disease_major: "Heal Ailment"
  heal_disease_benediction: "Heal Deadly Ailment"

  heal_disease_minor_desc: "Heal Minor Ailment"
  heal_disease_major_desc: "Heal Ailment"
  heal_disease_benediction_desc: "Heal Deadly Ailment"

  # Blood Knight
  make_blood_knight_interaction: "Make Blood Knight"
  make_blood_knight_interaction_desc: "Infuse [recipient.GetShortUINameNoTooltip] with major lifeforce, awakening the supernatural Blood Knight lifestyle trait."
  empower_blood_knight_interaction: "Empower Blood Knight"
  empower_blood_knight_interaction_desc: "Channel supernatural lifeforce into [recipient.GetShortUINameNoTooltip] to strengthen their martial tracks."
  empower_blood_knight_interaction.major: "Major Lifeforce (+10 XP to all tracks)"
  empower_blood_knight_interaction.minor: "Minor Lifeforce (+5 XP to all tracks)"
  empower_blood_knight_interaction.cancel: "Back out, no cost"
  empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."
  NOT_empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."

  bm_duel_kill_blood_knight_toast: "Blood Knight Bloodbath"
  bm_duel_kill_blood_knight_tt: "Gained #P +6#! Experience in the #V Slaughter#! track and harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] for victory in single combat"

  bm_battle_victory_lifeforce_toast: "Battlefield Blood Harvest"
  bm_battle_victory_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] from fallen foes on the victorious battlefield"

  # Tooltips
  IN_COURT_OR_IMPRISONED: "Can only heal yourself or your courtiers"
