l_english:
  # Give blood magic
  grant_blood_magic_interaction: "Make Them a Blood Mage"
  grant_blood_magic_interaction_desc: "Awaken the supernatural Blood Mage lifestyle trait within [recipient.GetShortUINameNoTooltip]."
  grant_blood_magic_interaction.minor: "Arcane Blood Oath (Minor Lifeforce)"
  grant_blood_magic_interaction.minor_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]."
  grant_blood_magic_interaction.major: "Blood Brotherhood Rite (Major Lifeforce)"
  grant_blood_magic_interaction.major_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E]."
  grant_blood_magic_interaction_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Ask for Blood Magic"
  ask_for_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] is granted the power of blood magic"
  ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"
  NOT_ask_for_blood_magic_interaction_requirement: "Needs to be your friend, best friend, lover or soulmate"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Get blood magic from prisoner"
  bm_get_blood_magic_from_prisoner_interaction.success: "I become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.fail: "I fail to become a Blood Mage"
  bm_get_blood_magic_from_prisoner_interaction.desc: "I consume their flesh, in an attempt to gain their Blood Magic"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Grant Lifeforce"
  grant_lifeforce_interaction_desc: "Transfer Lifeforce into [recipient.GetShortUINameNoTooltip] or restore their vitality if recently drained."
  grant_lifeforce_interaction.grant_minor: "Grant Minor Lifeforce"
  grant_lifeforce_interaction.grant_major: "Grant Major Lifeforce"
  grant_lifeforce_interaction.reverse_lifedrain: "Reverse Lifedrain"
  grant_lifeforce_interaction.toast: "I granted [recipient.GetShortUINameNoTooltip] lifeforce"
  grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 25 [piety|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to grant lifeforce."
  NOT_grant_lifeforce_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 25 [piety|E], or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to grant lifeforce."
  grant_lifeforce_reverse_lifedrain_requirement: "You need [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to reverse lifedrain."
  NOT_grant_lifeforce_reverse_lifedrain_requirement: "You need [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to reverse lifedrain."


  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Reverse Lifedrain"
  grant_lifeforce_interaction_reversed_desc: "Consume [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 25 [piety|E] to cleanse [GetModifier('lifedrained_modifier').GetNameWithTooltip] from [recipient.GetShortUINameNoTooltip] and bestow [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]."

  # Cure illness
  bm_heal_ailment: "Heal Affliction"
  bm_heal_ailment_desc: "Perform a blood ritual to mend a specific wound, disease, old-age degeneration, or stress vice suffered by [recipient.GetShortUINameNoTooltip]."
  bm_heal_ailment_tooltip: "Perform a blood magic healing ritual."
  bm_heal_ailment_resource_requirement_tt: "You must possess sufficient Lifeforce and Piety to heal at least one of [recipient.GetShortUINamePossessive] afflictions."
  NOT_bm_heal_ailment_resource_requirement_tt: "You must possess sufficient Lifeforce and Piety to heal at least one of [recipient.GetShortUINamePossessive] afflictions."

  # Blood Knight
  make_blood_knight_interaction: "Make Blood Knight"
  make_blood_knight_interaction_desc: "Awaken the supernatural Blood Knight lifestyle trait within [recipient.GetShortUINameNoTooltip]."
  recipient_must_be_knight_tt: "[recipient.GetShortUIName] is serving as your [knight|E]"
  NOT_recipient_must_be_knight_tt: "[recipient.GetShortUIName] is not serving as your [knight|E]"
  NOT_IS_A_KNIGHT_OF_CHARACTER_TRIGGER: "Does not serve as a [knight|E] for [CHARACTER.GetShortUIName|U]"
  make_blood_knight_interaction.knight_minor: "Martial Blood Oath (Minor Lifeforce)"
  make_blood_knight_interaction.knight_minor_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]."
  make_blood_knight_interaction.knight_major: "Blood Brotherhood Rite (Major Lifeforce)"
  make_blood_knight_interaction.knight_major_desc: "Initiate [recipient.GetShortUINameNoTooltip] with [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E]."
  make_blood_knight_interaction_knight_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"
  NOT_make_blood_knight_interaction_knight_requirement: "You must possess either [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] and 100 [piety|E], or [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and 250 [piety|E]"
  empower_blood_knight_interaction: "Empower Blood Knight"
  empower_blood_knight_interaction_desc: "Channel supernatural lifeforce into [recipient.GetShortUINameNoTooltip] to strengthen their martial tracks."
  empower_blood_knight_interaction.major: "Major Lifeforce (+10 XP to all tracks)"
  empower_blood_knight_interaction.minor: "Minor Lifeforce (+5 XP to all tracks)"
  empower_blood_knight_interaction.cancel: "Back out, no cost"
  empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."
  NOT_empower_blood_knight_interaction_requirement: "You need either [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] or [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] to empower a Blood Knight."

  bm_duel_kill_blood_knight_toast: "Blood Knight Bloodbath"
  bm_duel_kill_blood_knight_tt: "Gained #P +5#! Experience in the #V Slaughter#! track and harvested [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] for victory in single combat"

  bm_battle_victory_lifeforce_toast: "Battlefield Blood Harvest"
  bm_battle_victory_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] from fallen foes on the victorious battlefield"
  bm_battle_victory_major_lifeforce_toast: "Major Battlefield Blood Harvest"
  bm_battle_victory_major_lifeforce_tt: "Harvested [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] from the slaughter on the victorious battlefield"
  bm_battle_victory_both_lifeforce_toast: "Epic Battlefield Blood Harvest"
  bm_battle_victory_both_lifeforce_tt: "Harvested both [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] from the cataclysmic slaughter on the victorious battlefield!"

  # Battle XP Toasts
  bm_battle_victory_commander_toast: "Blood Knight: Victorious Command"
  bm_battle_victory_commander_t1_tt: "A minor skirmish won on the field.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_commander_t2_tt: "A sharp engagement won through tactical command.\nGained #P +3#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_commander_t3_tt: "A major battle won across contested battle lines.\nGained #P +4#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_commander_t4_tt: "A grand battle won through masterful command.\nGained #P +5#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_commander_t5_tt: "An epic clash of nations decided by your command!\nGained #P +5#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"

  bm_battle_victory_knight_toast: "Blood Knight: Victorious Prowess"
  bm_battle_victory_knight_t1_tt: "A minor skirmish won on the field.\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_knight_t2_tt: "A sharp engagement won through prowess.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_knight_t3_tt: "A major battle won through blood and steel.\nGained #P +3#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_knight_t4_tt: "A grand battle won across bloodsoaked lines.\nGained #P +4#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_victory_knight_t5_tt: "An epic slaughter where legends are forged in blood!\nGained #P +5#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"

  bm_battle_defeat_commander_toast: "Blood Knight: Tempered in Defeat"
  bm_battle_defeat_commander_t1_tt: "A skirmish was lost, but valuable lessons were drawn from the field.\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_commander_t2_tt: "A bitter engagement was lost, but command under pressure steels your resolve.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_commander_t3_tt: "A major battle was lost. Surviving the carnage imparts deep tactical wisdom.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_commander_t4_tt: "A grand army broke upon the field. Your blood and mind are tempered in the fire of defeat.\nGained #P +3#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_commander_t5_tt: "An epic catastrophe survived! From the ashes of devastation, your spirit rises unbroken.\nGained #P +3#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"

  bm_battle_defeat_knight_toast: "Blood Knight: Tempered in Defeat"
  bm_battle_defeat_knight_t1_tt: "A minor skirmish was lost, but your martial instincts sharpen.\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience"
  bm_battle_defeat_knight_t2_tt: "A bitter clash was lost. Enduring pain hardens your body and opens your inner eye.\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_knight_t3_tt: "A major battle turned against you, but standing firm in the slaughter imparts true resilience.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +1#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_knight_t4_tt: "A crushing defeat. Bleeding upon a field of carnage tempers body and spirit alike.\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"
  bm_battle_defeat_knight_t5_tt: "An apocalyptic defeat survived! Only true Blood Knights walk away from such carnage, forever transformed.\nGained #P +3#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Vanguard#! Experience\nGained #P +2#! [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)] #V Enlightenment#! Experience"

