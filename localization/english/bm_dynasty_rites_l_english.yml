l_english:
  # Modifiers
  bm_blessed_blood_sovereign_modifier: "Blood of the Sovereign"
  bm_blessed_blood_sovereign_modifier_desc: "This ruler's blood has been consecrated for dominion and governance, steadying their realm."
  bm_blessed_blood_iron_modifier: "Blood of Iron"
  bm_blessed_blood_iron_modifier_desc: "This warrior's blood surges with martial fury, hardening their body and emboldening their knights."
  bm_blessed_blood_crucible_modifier: "Sanguine Crucible"
  bm_blessed_blood_crucible_modifier_desc: "Infused with pure vitality, their lineage quickens with resilient constitution and potent hereditary traits."
  bm_anointed_heir_modifier: "Anointed in Blood"
  bm_anointed_heir_modifier_desc: "Chosen as the sacred successor of a blood lineage. Upon their predecessor's death, they inherit their arcane legacy and condensed lifeforce."

  # Bless Bloodline Options
  bm_bless_bloodline_interaction.bless_sovereign: "Blood of the Sovereign"
  bm_bless_bloodline_interaction.bless_sovereign_desc: "Grants #P +2#! Diplomacy, #P +2#! Stewardship, #P +10#! Vassal Opinion, #P -25%#! Short Reign Duration, and #P +1.0#! Health for 10 years."
  bm_bless_bloodline_interaction.bless_iron: "Blood of Iron"
  bm_bless_bloodline_interaction.bless_iron_desc: "Grants #P +2#! Martial, #P +4#! Prowess, #P +25%#! Knight Effectiveness, #P +1.0#! Health, and #P +0.50#! Health Penalty Negation for 10 years."
  bm_bless_bloodline_interaction.bless_crucible: "Sanguine Crucible"
  bm_bless_bloodline_interaction.bless_crucible_desc: "Grants #P +25%#! Fertility, #P +25%#! Positive Genetic Chance, #P -25%#! Stress Gain, and #P +1.0#! Health for 10 years."
  bm_bless_bloodline_interaction.bless_feingur: "Feingur's Eternal Blessing"
  bm_bless_bloodline_interaction.bless_feingur_desc: "Invoke your Superior Feingur stave to carve a permanent blessing granting #P +25%#! Fertility, #P +20%#! Positive Genetic Chance, #P +0.50#! Health, and #P +5#! Years Life Expectancy."

  # Anoint Heir Interaction
  bm_anoint_heir_interaction: "Anoint Heir in Blood"
  bm_anoint_heir_interaction_desc: "Consecrate your chosen heir or child with a major condensation of lifeforce, designating them as the inheritor of your blood legacy upon your death."
  bm_anoint_heir_toast: "Heir Anointed in Blood"
  bm_recipient_already_anointed_heir: "Target is already an anointed heir"
  NOT_bm_recipient_already_anointed_heir: "Target is already an anointed heir"

  # Blood Tithe Interaction
  bm_demand_blood_tithe_interaction: "Demand Blood Tithe"
  bm_demand_blood_tithe_interaction_desc: "Exercise your authority as House Head to extract vital lifeforce from an adult kin, bolstering your arcane reserves."
  bm_demand_blood_tithe_toast: "Blood Tithe Collected"
  bm_recipient_recently_lifedrained: "Target has recently been drained of lifeforce"
  NOT_bm_recipient_recently_lifedrained: "Target has recently been drained of lifeforce"
