l_english:
  # Cast Blood Magic Major Option
  bm_cast_blood_magic_major.001.manifest_traits: "Channel Lifeforce: Manifest Perfection"
  bm_cast_blood_magic_major.001.manifest_traits_tt: "Focus Major Lifeforce into transmuting congenital traits (Intellect, Physique, Beauty) up to rank 2 or purging flaws."

  # Ritual Event (Major - Ranks 1 to 2)
  bm_channel_manifest_traits.001.title: "Ritual of Manifestation"
  bm_channel_manifest_traits.001.desc: "A torrential current of major lifeforce answers your call. The vital essence waits, pliable yet tempestuous, ready to rewrite your mortal mold. Which aspect of your being shall you forge anew in blood?"
  bm_channel_manifest_traits.001.intellect: "Manifest Intellect (Rank 1–2)"
  bm_channel_manifest_traits.001.physique: "Manifest Physique (Rank 1–2)"
  bm_channel_manifest_traits.001.beauty: "Manifest Beauty (Rank 1–2)"
  bm_channel_manifest_traits.001.cancel: "Step away from the ritual circle"

  # Ritual Event (Superior - Ranks 3 to 5)
  bm_channel_manifest_traits.002.title: "Ritual of Apex Perfection"
  bm_channel_manifest_traits.002.desc: "Mortal minds and bodies crumble under the passage of time, yet superior lifeforce bends mortal biology to your absolute will. Having already attained promising mortal gifts, you stand ready to push beyond into genius, beauty, herculean might, and apex superhuman perfection."
  bm_channel_manifest_traits.002.intellect: "Manifest Apex Intellect (Rank 3–5)"
  bm_channel_manifest_traits.002.physique: "Manifest Apex Physique (Rank 3–5)"
  bm_channel_manifest_traits.002.beauty: "Manifest Apex Beauty (Rank 3–5)"

  # Duel Outcomes
  bm_manifest_traits.duel_success_tt: "The blood yields to your will, permanently elevating your traits"
  bm_manifest_traits.duel_failure_tt: "Your concentration breaks, wasting the lifeforce and incurring magical exhaustion"
  bm_manifest_traits.duel_crit_failure_tt: "A violent backlash of lifeforce tears through your mortal vessel, inflicting wounds, severe stress, and magical exhaustion!"

  # Toasts
  bm_manifest_traits.intellect_success_title: "Intellect Manifested: The Mind Expands"
  bm_manifest_traits.physique_success_title: "Physique Manifested: The Flesh Hardens"
  bm_manifest_traits.beauty_success_title: "Beauty Manifested: Form Transmuted"
  bm_manifest_traits.intellect_superior_success_title: "Transcendent Intellect: Mortal Limits Broken"
  bm_manifest_traits.physique_superior_success_title: "Transcendent Physique: Flesh Transcends"
  bm_manifest_traits.beauty_superior_success_title: "Transcendent Beauty: Divine Radiance"
  bm_manifest_traits.failure_title: "Manifestation Failed: Essence Lost"
  bm_manifest_traits.crit_failure_title: "Manifestation Backlash: Flesh Torn"
