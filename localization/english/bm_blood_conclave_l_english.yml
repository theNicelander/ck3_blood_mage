l_english:
 bm_blood_conclave_decision: "Convene a Blood Conclave"
 bm_blood_conclave_decision_desc: "Assemble the Blood Mages of your court in a closed circle to align your disciplines, pool vital essence, or mend strained nerves."
 bm_blood_conclave_decision_tooltip: "Gather court Blood Mages for a shared ritual"
 bm_blood_conclave_decision_confirm: "$BM_BLOOD_CONCLAVE_NEXT_STEP_BUTTON$"
 BM_BLOOD_CONCLAVE_NEXT_STEP_BUTTON: "Convene Conclave"
 bm_blood_conclave_attendees_req: "Has at least 2 other living, available adult Blood Mages at court"

 bm_conclave_study: "Shared Discipline Study"
 bm_conclave_study_desc: "Share arcane study with up to 4 attending court Blood Mages, granting +4 XP in your attuned discipline."
 bm_conclave_study_tooltip: "$bm_conclave_study_desc$"

 bm_conclave_resonance: "Pool Blood Resonance"
 bm_conclave_resonance_desc: "Draw upon your coven's shared resonance to condense Major Lifeforce (or Minor Lifeforce with 2 attendees)."
 bm_conclave_resonance_tooltip: "$bm_conclave_resonance_desc$"

 bm_conclave_communion: "Coven Communion"
 bm_conclave_communion_desc: "Lead a calming communion to ease Stress and strengthen bonds among attending court Blood Mages."
 bm_conclave_communion_tooltip: "$bm_conclave_communion_desc$"

 bm_blood_conclave.0001.t: "The Blood Conclave"
 bm_blood_conclave.0001.desc: "Candles gutter around the stone basin as your fellow Blood Mages take their places in the circle. Beneath the quiet cadence of shared chants, the blood in the chamber answers as one."
 bm_blood_conclave.0001.desc_disrupted: "Midway through the incantation, [conclave_guest.GetShortUIName]'s cadence falters and the sigils flare unevenly across the floor. Unless someone steadies the resonance, the circle will fracture."
 bm_blood_conclave.0001.a: "Complete the circle."
 bm_blood_conclave.0001.b: "Steady the resonance before it breaks."
 bm_blood_conclave.0001.b.win: "You anchor the circle and restore harmony"
 bm_blood_conclave.0001.b.lose: "The resonance snaps across the room"
 bm_blood_conclave.0001.c: "Halt the rite before anyone is harmed."

 bm_blood_conclave_study_toast: "@bm_ancient_discipline_icon! Conclave Study Completed"
 bm_blood_conclave_resonance_toast: "@bm_ancient_discipline_icon! Blood Resonance Pooled"
 bm_blood_conclave_communion_toast: "@bm_ancient_discipline_icon! Coven Communion Completed"
 bm_blood_conclave_fail_toast: "@bm_ancient_discipline_icon! Conclave Disrupted"
