l_english:
  # Decision: Challenge the Blood Mage of Tsushima
  bm_tsushima_blood_mage_duel_decision: "Challenge the Blood Mage of Tsushima"
  bm_tsushima_blood_mage_duel_decision_confirm: "Initiate the Duel"
  bm_tsushima_blood_mage_duel_decision_tooltip: "Travel to the mist-shrouded isle of Tsushima and challenge a master blood mage in a duel of occult will and physical endurance."
  bm_tsushima_blood_mage_duel_decision_desc: "Whispers speak of an ancient, solitary practitioner dwelling among the rugged crags of Tsushima Island between Japan and Korea. By facing this hermit in an arcane contest of Learning and martial resolve, one can force the deep secrets of blood magic into the light.\n\nVictory will awaken the crimson arts within your blood, while defeat will shatter your mind or break your flesh."
  bm_tsushima_blood_mage_duel_location_requirement_tt: "You must be present in the County of Tsushima"
  bm_tsushima_blood_mage_duel_decision_effect_tt: "Confront the hermit blood mage guarding the sacred isle"
  bm_tsushima_blood_mage_duel_decision.success_tt: "Victory! The secrets of blood magic are yours!"
  bm_tsushima_blood_mage_duel_decision.mental_failure_tt: "Defeat! Your mind is shattered by the rival mage!"
  bm_tsushima_blood_mage_duel_decision.physical_failure_tt: "Defeat! Your body is crippled under the psychic backlash!"
  bm_tsushima_blood_mage_duel_decision.injury_failure_tt: "Defeat! You barely escape with grievous wounds!"

  # Event: The Hermit of Tsushima
  bm_tsushima.0001.title: "The Hermit of Tsushima"
  bm_tsushima.0001.desc: "Amidst the swirling sea mists and pine-covered ridges of Tsushima, a solitary figure emerges. Garbed in travel-worn robes dyed deep cinnabar, the hermit's eyes glint with ancient mastery. Without a word, the master draws a ceremonial blade and channels the vital current, beckoning you forward."
  bm_tsushima.0001.a: "Match wills in the duel of blood!"
