l_english:
  bm_heal_old_age_trait: "Heal Old Age Trait"
  bm_heal_old_age_trait_desc: "Channel Lifeforce to soothe, rejuvenate, or purge the degenerative afflictions of old age."
  bm_heal_old_age_resource_requirement_tt: "Requires [piety_i]50 Piety and Minor Lifeforce, or [piety_i]150 Piety and Major Lifeforce."

  # Event
  bm_heal_old_age.0001.title: "Rejuvenate the Aging Vessel"
  bm_heal_old_age.0001.desc: "Old age gnaws at mortal flesh and mind, wearing down sinew and sharpening bodily frailties. Through the focused application of Lifeforce, these degenerative blights can be slowed, reversed, or severed entirely.\n\nChoose which affliction to treat."
  bm_heal_old_age.0001.cancel: "Decide against treatment for now."

  # Toasts
