  trait_track_ancient_desc: "#help You gain experience in this track yearly.#!\n\nTime bows before those who command the essence of life itself, steadily increasing monthly dynasty renown, monthly legitimacy, level of devotion impact, and unlocking personal tenet slots at major milestones."
  trait_track_enlightenment_desc: "#help You gain experience in this track by casting blood magic on yourself.#!\n\nThe path to mastery begins with the transformation of self, providing substantial flat and percentage monthly piety and unlocking learning per devotion level."
  trait_track_bloodline_desc: "#help You gain experience in this track by enhancing your dynasty. Yearly chance to gain experience, based on the number of Blood Mage modifiers the dynasty has.#!\n\nBlood calls to blood across generations. Masters of the bloodline command tribute per devotion level, slash army maintenance costs, multiply monthly income, foster capital development growth, and elevate stewardship per devotion level."
  trait_track_benediction_desc: "#help You gain experience in this track by healing ailments and granting powers to others.#!\n\nA blood mage's greatest gift is life itself, expanding general opinion, raising the maximum success chance of personal schemes, unlocking concurrent personal schemes, and elevating diplomacy per devotion level."
  trait_track_hematurgy_desc: "#help You gain experience in this track by draining lifeforce, casting blood curses, and harvesting traits from others.#!\n\nMasters of forbidden hemomancy manipulate the vital humors of others, breaking the cap on hostile scheme success, warding against enemy plots, unlocking concurrent hostile schemes, and elevating intrigue per devotion level."
  trait_track_bloodlust_desc: "#help You gain experience in this track by fighting in battles, winning single combat duels, and competing in tournaments.#!\n\nChanneling Lifeforce into martial supremacy, increasing army damage, expanding sworn knight capacity, and honing martial and prowess per devotion level."


  # Blood Power
  trait_lifestyle_blood_power: "Blood Power"
  trait_lifestyle_blood_power_desc: "This character has reshaped their essence through blood magic, granting extraordinary abilities that evolve with further use of their powers."
  # Backwards compatibility key
  trait_lifestyle_blood_empowerment: "Blood Power"
  trait_lifestyle_blood_empowerment_desc: "$trait_lifestyle_blood_power_desc$"

  trait_track_presence: "Presence"
  trait_track_warband: "Warband"
