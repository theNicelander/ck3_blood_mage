l_english:
  # Group
  trait_lifestyle_blood_mage_group: "Blood Mage"
  trait_blood_mage_desc: "This mage uses blood magic powered through the lifeforce of others, to extend their life and enhance their domain."

    # Blood Mage Trait
  trait_lifestyle_blood_mage: "Blood Mage"
  trait_lifestyle_blood_mage_desc: "This warrior uses blood magic powered through combat, to extend their life and enhance their martial prowess."

  trait_track_enlightenment: "Enlightenment"
  trait_track_bloodline: "Bloodline"
  trait_track_benediction: "Benediction"
  trait_track_hematurgy: "Hematurgy"
  trait_track_ancient: "Ancient"

  trait_track_ancient_desc: "#help You gain experience in this track yearly.#!\n\nTime bows before those who command the essence of life itself, unlocking an additional personal tenet slot every 20 XP."
  trait_track_enlightenment_desc: "#help You gain experience in this track by casting blood magic on yourself.#!\n\nThe path to mastery begins with the transformation of self."
  trait_track_bloodline_desc: "#help You gain experience in this track by enhancing your dynasty. Yearly chance to gain experience, based on the number of Blood Mage modifiers the dynasty has.#!\n\nBlood calls to blood across generations. Masters of the bloodline fortify their dynasty, expand their domain, and construct realms of enduring wealth and grandeur."
  trait_track_benediction_desc: "#help You gain experience in this track by healing ailments and granting powers to others.#!\n\nA blood mage's greatest gift is life itself, bestowed through blood sacrifice."
  trait_track_hematurgy_desc: "#help You gain experience in this track by draining lifeforce, casting blood curses, and harvesting traits from others.#!\n\nMasters of forbidden hemomancy manipulate the vital humors of others, speeding hostile schemes, ruling through terrifying dread, and striking down rivals from afar."


  # Blood Power
  trait_lifestyle_blood_power: "Blood Power"
  trait_lifestyle_blood_power_desc: "This character has reshaped their essence through blood magic, granting extraordinary abilities that evolve with further use of their powers."
  # Backwards compatibility key
  trait_lifestyle_blood_empowerment: "Blood Power"
  trait_lifestyle_blood_empowerment_desc: "$trait_lifestyle_blood_power_desc$"

  trait_track_dynasty: "Dynasty"
  trait_track_fury: "Fury"
  trait_track_mastery: "Mastery"
  trait_track_presence: "Presence"
  trait_track_prosperity: "Prosperity"
  trait_track_shadows: "Shadows"

  trait_track_dynasty_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Lifestyle XP (+15 per quarter) to your active lifestyle focus.#!\n\nChannels Lifeforce into generational refinement, strengthening inherited traits, extending fertile years, boosting renown, and granting complete immunity to inbreeding."
  trait_track_fury_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Martial Lifestyle XP (+15 per quarter).#!\n\nChannels Lifeforce into battlefield command and martial might, increasing advantage, reducing army maintenance and siege phase time, expanding knight capacity, and scaling martial and prowess with Devotion."
  trait_track_mastery_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Learning Lifestyle XP (+15 per quarter).#!\n\nBlood magic accelerates lifestyle mastery, enhances personal scheming, expands learning through Devotion, and ignores negative culture opinion."
  trait_track_presence_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Diplomacy Lifestyle XP (+15 per quarter).#!\n\nBlood magic radiates mesmeric authority and serenity, commanding general opinion, suppressing stress gain, elevating fame impact, securing enduring reigns, and expanding diplomacy through Devotion."
  trait_track_prosperity_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Stewardship Lifestyle XP (+15 per quarter).#!\n\nBlood magic enriches realm coffers and architecture, substantially boosting monthly income, cutting holding and domicile construction costs, reducing Men-at-Arms maintenance, and expanding domain limit."
  trait_track_shadows_desc: "#help You gain experience in this track via Cast Major Blood Magic. Every 10 XP grants +5 monthly Intrigue Lifestyle XP (+15 per quarter).#!\n\nAn impenetrable shroud of blood magic fortifies hostile plot success, wards against enemy schemes, suppresses rival scheme caps, expands intrigue through Devotion, and unlocks additional hostile schemes."

  # Legacy track localization preserved for backwards compatibility
  trait_track_experience: "Experience"
  trait_track_charisma: "Charisma"
  trait_track_insight: "Insight"
  trait_track_legacy: "Legacy"
  trait_track_expertise: "Expertise"
  trait_track_experience_desc: "Blood magic accelerates lifestyle mastery and the acquisition of tongues."
  trait_track_charisma_desc: "Blood magic enhances diplomatic allure, stress resilience, and sway prowess."
  trait_track_insight_desc: "Blood magic grants this character supernatural knowledge and learning abilities."
  trait_track_legacy_desc: "This character has enhanced their bloodline with magical potency, improving genetic traits and fertility."
  trait_track_expertise_desc: "Blood magic accelerates this character's mastery of all skills and abilities."

