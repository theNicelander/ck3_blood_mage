  lifestyle_blood_knight_vanguard_desc: "#help You gain experience in this track by fighting and winning battles in an army.#!\n\nMastery of warfare and front-line leadership, developing strategic brilliance and advantage."
  lifestyle_blood_knight_slaughter_desc: "#help You gain experience in this track by winning single combat duels and tournament contests.#!\n\nDeadly martial instinct in single combat, honing personal prowess and renown."
  lifestyle_blood_knight_enlightenment_desc: "#help You gain experience in this track by casting blood magic on yourself and manifesting lifeforce.#!\n\nThe path to mastery begins with the transformation of self."
  lifestyle_blood_knight_ancient_desc: "#help You gain experience in this track yearly.#!\n\nTime bows before those who command the essence of life itself, unlocking an additional personal tenet slot every 20 XP."
  lifestyle_blood_knight_benediction_desc: "#help You gain experience in this track by healing ailments and purging physical impurities.#!\n\nA warrior's gift of vitality, purging flaws and ailments through blood."
  lifestyle_blood_knight_resilience_desc: "#help You gain experience in this track passively each year and by surviving lost battles.#!\n\nSomatic adaptation overcoming mortal fragility, extending longevity, health, and disease resistance."

