  # Blood Knight
  trait_lifestyle_blood_knight: "Blood Knight"
  trait_lifestyle_blood_knight_desc: "This warrior uses blood magic powered through combat, to enhance their martial prowess and extend their life through the use of lifeforce."
  trait_lifestyle_blood_knight_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been infused with supernatural lifeforce, binding their body to martial sorcery as a Blood Knight."

