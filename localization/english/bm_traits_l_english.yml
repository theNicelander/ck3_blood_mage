  trait_track_insight: "Insight"
  trait_track_legacy: "Legacy"
  trait_track_expertise: "Expertise"
  trait_track_experience_desc: "Blood magic accelerates lifestyle mastery and the acquisition of tongues."
  trait_track_charisma_desc: "Blood magic enhances diplomatic allure, stress resilience, and sway prowess."
  trait_track_fury_desc: "This character channels blood magic into martial prowess and battlefield dominance."
  trait_track_insight_desc: "Blood magic grants this character supernatural knowledge and learning abilities."
  trait_track_legacy_desc: "This character has enhanced their bloodline with magical potency, improving genetic traits and fertility."
  trait_track_expertise_desc: "Blood magic accelerates this character's mastery of all skills and abilities."

