l_english:
  # Group
  trait_lifestyle_blood_mage_group: "Blood Mage"
  trait_blood_mage_desc: "Masters of forbidden magic who manipulate lifeforce to extend life, enhance abilities, heal others, and absorb traits from the worthy."

    # Blood Mage Trait
  trait_lifestyle_blood_mage: "Blood Mage"
  trait_lifestyle_blood_mage_desc: "Masters of forbidden magic who manipulate lifeforce to extend life, heal ailments, transfer power to others, and absorb traits from the sacrificed."

  trait_track_enlightenment: "Enlightenment"
  trait_track_bloodline: "Bloodline"
  trait_track_benediction: "Benediction"
  trait_track_hematurgy: "Hematurgy"
  trait_track_ancient: "Ancient"

  trait_track_ancient_desc: "#help You gain experience in this track yearly.#!\n\nTime bows before those who command the essence of life itself."
  trait_track_enlightenment_desc: "#help You gain experience in this track by casting blood magic on yourself.#!\n\nThe path to mastery begins with the transformation of self."
  trait_track_bloodline_desc: "#help You gain experience in this track by enhancing your dynasty. Yearly chance to gain experience, based on the number of Blood Mage modifiers the dynasty has.#!\n\nBlood calls to blood across generations."
  trait_track_benediction_desc: "#help You gain experience in this track by healing ailments and granting powers to others.#!\n\nA blood mage's greatest gift is life itself, bestowed through blood sacrifice."
  trait_track_hematurgy_desc: "#help You gain experience in this track by draining lifeforce and harvesting traits from others.#!\n\nWhat others possess can be yours through the blood arts."


  # Blood Empowerment
  trait_lifestyle_blood_empowerment: "Blood Empowerment"
  trait_lifestyle_blood_empowerment_desc: "This character has reshaped their essence through blood magic, granting extraordinary abilities that evolve with further use of their powers."

  trait_track_dynasty: "Dynasty"
  trait_track_mastery: "Mastery"
  trait_track_presence: "Presence"
  trait_track_prosperity: "Prosperity"
  trait_track_shadows: "Shadows"

  trait_track_dynasty_desc: "This character channels blood magic into genetic refinement and reproductive potency."
  trait_track_mastery_desc: "Blood magic accelerates lifestyle mastery and the acquisition of tongues."
  trait_track_presence_desc: "Blood magic enhances diplomatic allure, stress resilience, and sway prowess."
  trait_track_prosperity_desc: "Blood magic slashes army upkeep, discounts construction, and multiplies domain income."
  trait_track_shadows_desc: "A veil of blood shields this character from hostile plots and conceals their secrets."

