  trait_track_shadows: "Shadows"
  trait_track_mastery: "Mastery"
  trait_track_dynasty: "Dynasty"

  trait_track_presence_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in Diplomacy lifestyle.#!\n\nBlood magic radiates mesmeric presence, commanding general opinion, personal scheme success, monthly prestige, legitimacy gain, and scheme capacity."
  trait_track_warband_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in Martial lifestyle.#!\n\nChannels Lifeforce into martial dominance, expanding knight capacity, knight effectiveness, combat advantage, and army movement speed."
  trait_track_prosperity_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in Stewardship lifestyle.#!\n\nBlood magic enriches realm coffers, boosting monthly gold, slashing Men-at-Arms upkeep, and multiplying total monthly income."
  trait_track_shadows_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in Intrigue lifestyle.#!\n\nAn impenetrable shroud of blood magic fortifies natural dread, hostile plot success, scheme capacity, and defensive warding against enemy plots."
  trait_track_mastery_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in Learning lifestyle.#!\n\nBlood magic accelerates lifestyle learning, greatly increasing stress loss and reducing stress gain."
  trait_track_dynasty_desc: "#help Cast major blood magic to gain XP. Each 10 grants +5 XP in your active lifestyle focus.#!\n\nChannels Lifeforce into generational refinement, reinforcing congenital traits, and granting complete immunity to inbreeding."

