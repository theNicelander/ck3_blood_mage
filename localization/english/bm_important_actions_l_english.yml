l_english:
 bm_action_can_heal: "@health_icon! You Can Heal Someone"
 bm_action_can_heal_label: "@health_icon! You can heal [recipient.GetShortUINameNoTooltip], [actor.Custom2('bm_heal_lifeforce_status_current_situation', recipient)]"
 bm_action_can_heal_desc: "[recipient.GetShortUIName] is currently suffering from illness or injury. You can spend Lifeforce to heal them."
 bm_action_can_heal_click: "#I Click to heal [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_heal_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip], [actor.Custom2('bm_heal_lifeforce_status_current_situation', recipient)]"
 bm_action_can_heal_combined_group_label: "@health_icon! You Can Heal Someone"
 bm_action_can_heal_combined_group_name: "$bm_action_can_heal$"
 bm_action_can_heal_combined_group_description: "Several important figures in your life or realm are currently wounded or afflicted by illness. You can spend Lifeforce to heal them."
 bm_action_can_heal_unimportant: "@warning_icon! #X You do not have enough Lifeforce to heal [recipient.GetHerHim]#!"
 bm_action_can_heal_combined_unimportant: "@warning_icon! #X You do not have enough Lifeforce to heal any of them#!"
 bm_heal_lifeforce_status_ready: "#P @health_icon! Can Heal#!"
 bm_heal_lifeforce_status_unready: "#low @health_icon! Needs Lifeforce#!"

 bm_action_can_lifedrain_prisoner: "@bm_hematurgy_discipline_icon! You Can Lifedrain a Prisoner"
 bm_action_can_lifedrain_prisoner_label: "@bm_hematurgy_discipline_icon! You can lifedrain [recipient.GetShortUINameNoTooltip]"
 bm_action_can_lifedrain_prisoner_desc: "[recipient.GetShortUIName] is currently held in your dungeon. You can harvest their blood to gain Lifeforce."
 bm_action_can_lifedrain_prisoner_click: "#I Click to lifedrain [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_lifedrain_prisoner_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_lifedrain_prisoner_combined_group_label: "@bm_hematurgy_discipline_icon! You Can Lifedrain a Prisoner"
 bm_action_can_lifedrain_prisoner_combined_group_name: "$bm_action_can_lifedrain_prisoner$"
 bm_action_can_lifedrain_prisoner_combined_group_description: "Several prisoners are currently held in your dungeon. You can harvest their blood to gain Lifeforce."

 bm_action_can_cull_champion: "@bm_bloodlust_discipline_icon! You Can Cull a Champion"
 bm_action_can_cull_champion_label: "@bm_bloodlust_discipline_icon! You can cull [recipient.GetShortUINameNoTooltip]"
 bm_action_can_cull_champion_desc: "[recipient.GetShortUIName] is an eligible fallen follower or formidable prisoner (20+ Prowess). You can sacrifice them on the altar of blood to gain Lifeforce."
 bm_action_can_cull_champion_click: "#I Click to cull [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_cull_champion_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_cull_champion_combined_group_label: "@bm_bloodlust_discipline_icon! You Can Cull a Champion"
 bm_action_can_cull_champion_combined_group_name: "$bm_action_can_cull_champion$"
 bm_action_can_cull_champion_combined_group_description: "Several fallen followers or formidable prisoners (20+ Prowess) are available to be culled on the altar of blood for Lifeforce."

 bm_action_can_attune_lifeforce: "@bm_ancient_discipline_icon! You Can Attune to Lifeforce"
 bm_action_can_attune_lifeforce_label: "@bm_ancient_discipline_icon! You can attune to Lifeforce"
 bm_action_can_attune_lifeforce_desc: "You are not currently attuned to any Blood Magic discipline. Attuning directs passive Lifeforce experience toward your chosen discipline."
 bm_action_can_attune_lifeforce_click: "#I Click to open the Attune to Lifeforce decision#!"

 bm_action_can_trait_drain_prisoner: "@bm_bloodline_discipline_icon! You Can Trait Drain a Prisoner"
 bm_action_can_trait_drain_prisoner_label: "@bm_bloodline_discipline_icon! You can trait drain [recipient.GetShortUINameNoTooltip]"
 bm_action_can_trait_drain_prisoner_desc: "[recipient.GetShortUIName] is held in your dungeon and possesses a beneficial inheritable trait you can drain."
 bm_action_can_trait_drain_prisoner_click: "#I Click to trait drain [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_trait_drain_prisoner_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_trait_drain_prisoner_combined_group_label: "@bm_bloodline_discipline_icon! You Can Trait Drain a Prisoner"
 bm_action_can_trait_drain_prisoner_combined_group_name: "$bm_action_can_trait_drain_prisoner$"
 bm_action_can_trait_drain_prisoner_combined_group_description: "Several prisoners held in your dungeon possess beneficial inheritable traits you can drain."
