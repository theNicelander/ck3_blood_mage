l_english:
  # Blood Temples
  building_type_bm_blood_temple_01: "Blood Temple"
  building_type_bm_blood_temple_01_desc: "A sacred precinct of crimson stone and sacrificial altars where offerings of Lifeforce sanctify the land and empower the faithful."

  building_bm_blood_temple_01: "Blood Altar"
  building_bm_blood_temple_01_desc: "A rough-hewn sacrificial stone grooved with crimson channels to catch the vital offerings of the faithful."

  building_bm_blood_temple_02: "Blood Shrine"
  building_bm_blood_temple_02_desc: "A secluded, candlelit alcove where sacred vessels preserve the harvested essence of the devout."

  building_bm_blood_temple_03: "Blood Monument"
  building_bm_blood_temple_03_desc: "A towering runic obelisk stained dark with centuries of offerings, radiating occult vitality across the grounds."

  building_bm_blood_temple_04: "Blood Temple"
  building_bm_blood_temple_04_desc: "A solemn hall of crimson stone where initiates gather to chant, bleed, and commune with the ancients."

  building_bm_blood_temple_05: "Great Blood Temple"
  building_bm_blood_temple_05_desc: "A soaring cathedral of vital mastery whose subterranean vaults and ritual chambers anchor the power of an entire lineage."

  building_bm_blood_temple_06: "Blood Pantheon"
  building_bm_blood_temple_06_desc: "A grand sovereign rotunda honoring the immortal ascendants, where the lifeblood of the realm is distilled into eternal youth."

  building_bm_blood_temple_07: "Blood Acropolis"
  building_bm_blood_temple_07_desc: "A monumental, fortified hilltop citadel of scarlet spires and sanctums—the supreme seat of blood sorcery in the known world."

  # Building Requirement Tooltips
  bm_requires_blood_mage_or_blodtru_tt: "You must be a [GetTrait('lifestyle_blood_mage').GetName(GetPlayer)], a [GetTrait('lifestyle_blood_knight').GetName(GetPlayer)], or adhere to the [GetReligion('blodtru_religion').GetName] religion"
  bm_requires_feudalized_realm_tt: "Requires a non-tribal government and a feudalized holding (Castle, City, or Temple)"
