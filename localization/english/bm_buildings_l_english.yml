l_english:
  # Blood Temple District (CK3 1.21)
  bm_blood_temple_district: "Blood Temple District"
  bm_blood_temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$@health_icon![health|E]\n$BULLET_WITH_TAB$[learning_i][learning|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]"
  bm_blood_temple_district_desc_flavor: "A sacred precinct of blood stone and sacrificial altars where offerings of Lifeforce sanctify the land and empower the faithful."

  # Primary Building: Blood Temple (4 Tiers)
  building_type_bm_blood_temple_01: "Blood Temple"
  building_type_bm_blood_temple_01_desc: "A sacred precinct of blood stone and sacrificial altars where offerings of Lifeforce sanctify the land and empower the faithful."

  bm_blood_temple_01: "Blood Altar"
  bm_blood_temple_01_desc: "A rough-hewn sacrificial stone grooved with blood channels to catch the Lifeforce offerings of the faithful."

  bm_blood_temple_02: "Blood Shrine"
  bm_blood_temple_02_desc: "A secluded, candlelit sanctuary where sacred vessels preserve the harvested Lifeforce of the devout."

  bm_blood_temple_03: "Blood Temple"
  bm_blood_temple_03_desc: "A solemn hall of blood stone where initiates gather to chant, bleed, and commune with the ancients."

  bm_blood_temple_04: "Blood Acropolis"
  bm_blood_temple_04_desc: "A monumental, fortified hilltop citadel of blood stone spires and sanctums, the supreme seat of blood sorcery in the realm."

  # Sub-Building: Blood Sanctuary (Lifespan, Health, Epidemic Resistance)
  building_type_bm_blood_sanctuary_01: "Blood Sanctuary"
  building_type_bm_blood_sanctuary_01_desc: "A restorative wing where blood mages distill Lifeforce to ward off plague and extend mortal years."

  bm_blood_sanctuary_01: "Blood Ward"
  bm_blood_sanctuary_01_desc: "Quiet stone rooms stocked with blood tonics and runic poultices that steady failing hearts."

  bm_blood_sanctuary_02: "Blood Infirmary"
  bm_blood_sanctuary_02_desc: "A vaulted hall of blood healers whose draughts fortify the body against pestilence and age."

  bm_blood_sanctuary_03: "Blood Sanctuary"
  bm_blood_sanctuary_03_desc: "A serene cloister of purifying basins and Lifeforce censers that shield the duchy from sickness."

  bm_blood_sanctuary_04: "Great Blood Sanctuary"
  bm_blood_sanctuary_04_desc: "A grand bastion of blood restoration where disease withers at the gates and rulers endure for decades."

  # Sub-Building: Bloodline Vault (Biological / Congenital Traits)
  building_type_bm_bloodline_vault_01: "Bloodline Vault"
  building_type_bm_bloodline_vault_01_desc: "A sealed archive of genealogies and blood relics dedicated to refining and preserving gifted lineages."

  bm_bloodline_vault_01: "Bloodline Chamber"
  bm_bloodline_vault_01_desc: "A guarded room of lineage scrolls and sealed vials tracking the inherited strengths of the house."

  bm_bloodline_vault_02: "Bloodline Archive"
  bm_bloodline_vault_02_desc: "Rows of preserved blood samples and birth ledgers used to guide blessings upon each new generation."

  bm_bloodline_vault_03: "Bloodline Vault"
  bm_bloodline_vault_03_desc: "A subterranean sanctum where ritual blood bindings strengthen the finest traits of the dynasty."

  bm_bloodline_vault_04: "Grand Bloodline Vault"
  bm_bloodline_vault_04_desc: "An unsurpassed treasury of ancestral essence ensuring that brilliance, beauty, and vigor endure through the ages."

  # Sub-Building: Blood Academy (Learning, Learning XP, Cultural Fascination)
  building_type_bm_blood_academy_01: "Blood Academy"
  building_type_bm_blood_academy_01_desc: "A seat of blood scholarship where adepts study Lifeforce, medicine, and the hidden laws of nature."

  bm_blood_academy_01: "Blood Study"
  bm_blood_academy_01_desc: "A modest reading chamber lined with anatomical treatises and runic blood grimoires."

  bm_blood_academy_02: "Blood College"
  bm_blood_academy_02_desc: "Lecture halls where blood mages instruct pupils in scholarly inquiry and disciplined ritual craft."

  bm_blood_academy_03: "Blood Academy"
  bm_blood_academy_03_desc: "A renowned institution drawing scholars from across the realm to advance blood craft and cultural discovery."

  bm_blood_academy_04: "Grand Blood Academy"
  bm_blood_academy_04_desc: "A towering citadel of blood learning whose masters set the pace of innovation for an entire culture."

  # Sub-Building: Hall of Blood Ancestors (Dynasty Prestige & Legitimacy)
  building_type_bm_blood_ancestors_hall_01: "Hall of Blood Ancestors"
  building_type_bm_blood_ancestors_hall_01_desc: "A solemn monument honoring the lineage's blood mages, magnifying dynastic renown and rightful rule."

  bm_blood_ancestors_hall_01: "Blood Memorial"
  bm_blood_ancestors_hall_01_desc: "Carved blood stone tablets inscribed with the names and deeds of the dynasty's forebears."

  bm_blood_ancestors_hall_02: "Blood Crypt"
  bm_blood_ancestors_hall_02_desc: "A lantern-lit tomb complex where ancestral relics lend weight to the ruler's authority."

  bm_blood_ancestors_hall_03: "Hall of Blood Ancestors"
  bm_blood_ancestors_hall_03_desc: "A pillared gallery of statues and consecrated urns proclaiming the dynasty's ancient bloodright."

  bm_blood_ancestors_hall_04: "Pantheon of Blood Ancestors"
  bm_blood_ancestors_hall_04_desc: "A grand domed rotunda venerating the dynasty's immortal line, inspiring awe across realms."

  # Sub-Building: Blood Basin (Duchy Prosperity & Control)
  building_type_bm_blood_basin_01: "Blood Basin"
  building_type_bm_blood_basin_01_desc: "Consecrated stone reservoirs whose Lifeforce rituals enrich the duchy's lands and anchor firm order."

  bm_blood_basin_01: "Blood Well"
  bm_blood_basin_01_desc: "A carved ritual well at the heart of the district where seasonal offerings bless the surrounding fields."

  bm_blood_basin_02: "Blood Cistern"
  bm_blood_basin_02_desc: "Underground channels distributing consecrated Lifeforce across the capital, steadying local order."

  bm_blood_basin_03: "Blood Basin"
  bm_blood_basin_03_desc: "A wide terraced pool of dark stone whose rites spur trade, harvests, and unshakable ducal authority."

  bm_blood_basin_04: "Great Blood Basin"
  bm_blood_basin_04_desc: "A monumental aqueduct and ritual basin that turns the entire duchy into a flourishing, iron-ruled heartland."

  # Sub-Building: Ritual Vaults (Piety, Piety per Knight, Dread)
  building_type_bm_ritual_vaults_01: "Ritual Vaults"
  building_type_bm_ritual_vaults_01_desc: "Deep sacrificial chambers where blood rites fuel relentless devotion and chill would-be rebels."

  bm_ritual_vaults_01: "Sacrificial Cellar"
  bm_ritual_vaults_01_desc: "A torchlit cellar beneath the altar reserved for blood oaths and solemn offerings."

  bm_ritual_vaults_02: "Ritual Chamber"
  bm_ritual_vaults_02_desc: "An iron-gated chamber where knights and priests consecrate blades in blood before every campaign."

  bm_ritual_vaults_03: "Ritual Vaults"
  bm_ritual_vaults_03_desc: "Interconnected subterranean sanctums whose grim ceremonies command deep piety and fearful obedience."

  bm_ritual_vaults_04: "Grand Ritual Vaults"
  bm_ritual_vaults_04_desc: "Vast catacombs of consecrated altars where the blood of foes and vows of knights forge an awe-inspiring terror."

  # Building Requirement Tooltips
  bm_requires_blood_mage_or_blodtru_tt: "You must be a [GetTrait('lifestyle_blood_mage').GetName(GetPlayer)] or adhere to the [GetReligion('blodtru_religion').GetName] religion"
  bm_requires_feudalized_realm_tt: "Requires a non-tribal government and a feudalized holding (Castle, City, or Temple)"
