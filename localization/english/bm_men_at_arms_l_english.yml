l_english:
 bm_blood_berserkers: "Blood Berserkers"
 bm_blood_berserkers_flavor: "#F Pain-blind shock warriors who carve the Ægishjálmur into their brows with blood and hack through palisades and gates with two-handed axes.#!\n#help Requires a Blood Mage with [GetModifier('piety_level_2').GetNameWithTooltip] [piety_level|E] and 250 @piety_icon![piety|E].#!"
 bm_blood_behemoths: "Blood-Bound Behemoths"
 bm_blood_behemoths_flavor: "#F Towering flesh-constructs forged from Superior Lifeforce. Fearless and rune-bound, they crush melee lines and shatter walls with bare hands.#!\n#help Requires a Blood Mage with [GetModifier('piety_level_4').GetNameWithTooltip] [piety_level|E] and 400 @piety_icon![piety|E].#!"
