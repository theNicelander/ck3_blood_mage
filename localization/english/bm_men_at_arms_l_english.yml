l_english:
 bm_blood_berserkers: "Blood Berserkers"
 bm_blood_berserkers_flavor: "#F Fanatical shock warriors who gorge on Minor Lifeforce and carve the Ægishjálmur into their brows with sacrificial blood before battle. Forsaking heavy plate for pain-blind frenzy, they hurl themselves into enemy formations and hack through wooden palisades and castle gates with heavy two-handed axes.#!\n#help Recruitment requires a Blood Mage with [piety_level|E] [GetModifier('piety_level_2').GetNameWithTooltip] (Level 2) and 250 @piety_icon![piety|E].#!"
 bm_blood_behemoths: "Blood-Bound Behemoths"
 bm_blood_behemoths_flavor: "#F A cohort of towering, albino flesh-constructs forged from Superior Lifeforce in the likeness of great occult champions. Bound in rune-etched iron and impervious to pain, exhaustion, or fear, they wade into the thickest melee like living battering rams and shatter castle walls with their bare hands.#!\n#help Recruitment requires a Blood Mage with [piety_level|E] [GetModifier('piety_level_4').GetNameWithTooltip] (Level 4) and 400 @piety_icon![piety|E].#!"
