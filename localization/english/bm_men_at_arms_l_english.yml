l_english:
 bm_blood_berserkers: "Blood Berserkers"
 bm_blood_berserkers_flavor: "#F Fanatical shock warriors who gorge on Minor Lifeforce and carve the Ægishjálmur into their brows with sacrificial blood before battle. Forsaking heavy plate for pain-blind frenzy, they hurl themselves into enemy formations and hack through wooden palisades and castle gates with heavy two-handed axes.#!"
 bm_blood_behemoths: "Blood-Bound Behemoths"
 bm_blood_behemoths_flavor: "#F A cohort of towering, albino flesh-constructs forged from Superior Lifeforce in the likeness of great occult champions. Bound in rune-etched iron and impervious to pain, exhaustion, or fear, they wade into the thickest melee like living battering rams and shatter castle walls with their bare hands.#!"
