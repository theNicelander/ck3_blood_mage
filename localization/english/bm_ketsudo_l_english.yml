l_english:
  # Faith: Ketsudō (Japanese Blood Faith)
  ketsudo_faith: "Ketsudō"
  ketsudo_faith_adj: "Ketsudōist"
  ketsudo_faith_adherent: "Ketsudōist"
  ketsudo_faith_adherent_plural: "Ketsudōists"
  ketsudo_faith_desc: "Ketsudō—the Way of Blood—harmonizes the occult mastery of vital essence with the sacred geography of the Japanese archipelago. Veneration of ancestral kami and communion with sacred volcanic peaks merge seamlessly with blood magic, honoring the scarlet flow as the divine current binding heaven, earth, and mortal vitality."

  # Mainline Rite
  ketsudo_faith_rite: "Way of the Sacred Flow"
  ketsudo_faith_rite_desc: "The sacred ancestral rites and vitality flows of the Ketsudō tradition."

  # Eminent Holy Sites (8 Mountain / Seat Configuration)
  holy_site_tsushima_name: "Tsushima"
  holy_site_tsushima_desc: "The mist-shrouded isle between Japan and the mainland, home to hermit blood masters and the ultimate proving ground for aspiring practitioners."
  holy_site_mount_fuji_name: "Mount Fuji"
  holy_site_mount_fuji_desc: "The sacred, snow-capped volcano of Suruga whose towering caldera radiates martial fury and inspires knights of unrivaled prowess."
  holy_site_mount_hiei_name: "Mount Hiei"
  holy_site_mount_hiei_desc: "The venerable monastic peak overlooking Kyoto where ascetic blood monks contemplate deep esoteric scriptures and arcane mysteries."
  holy_site_mount_osore_name: "Mount Osore"
  holy_site_mount_osore_desc: "The grim sulfur caldera of Mutsu, where the veil between the living and dead wears thin and dread power answers the call of the ruthless."
  holy_site_mount_aso_name: "Mount Aso"
  holy_site_mount_aso_desc: "The fiery volcanic heart of Higo, renowned for subterranean magma veins and ferocious martial spirits granting strategic battlefield supremacy."
  holy_site_mount_yotei_name: "Mount Yōtei"
  holy_site_mount_yotei_desc: "The northern sentinel peak rising from the wilds of Ezo, forging elite warriors and commanding an indomitable knight vanguard."
  holy_site_kyoto_name: "Kyoto"
  holy_site_kyoto_desc: "The ancient imperial court of Yamashiro, where harmonious diplomacy and imperial refinement channel the collective devotion of the faithful."
  holy_site_edo_name: "Edo"
  holy_site_edo_desc: "The rising seat of administration and commerce on the Kantō plain, where disciplined stewardship and trade nurture flourishing realms."

  # Regular Holy Sites (Regional Hubs & Island Gates)
  # Hokkaido / Ezo
  holy_site_hakodate_name: "Hakodate"
  holy_site_hakodate_desc: "The gateway harbor of southern Ezo, blessing regional holders with enduring constitution and hearty resilience against northern perils."

  # Shikoku
  holy_site_matsuyama_name: "Matsuyama"
  holy_site_matsuyama_desc: "The tranquil castle town of western Shikoku, celebrated for rejuvenating hot springs and longevity-enhancing vital currents."
  holy_site_kotohira_name: "Kotohira"
  holy_site_kotohira_desc: "The sacred maritime shrine town of Sanuki, revered by navigators and warding the realm against devastating contagions."

  # Kyushu & Southern Frontier
  holy_site_dazaifu_name: "Dazaifu"
  holy_site_dazaifu_desc: "The historic administrative gateway of northern Kyushu, preserving governmental vitality and safeguarding borders from plagues."
  holy_site_kagoshima_name: "Kagoshima"
  holy_site_kagoshima_desc: "The southern coastal haven of Satsuma facing active volcanic shores, blessing noble lines with robust health and fertile blood."
  holy_site_naha_name: "Naha"
  holy_site_naha_desc: "The southern island gate in the Ryukyu chain, shielding tropical outposts from pestilence while bestowing long life."

  # Honshu Regional Centers
  holy_site_kamakura_name: "Kamakura"
  holy_site_kamakura_desc: "The martial coastal enclave of Sagami, instilling steadfast physical endurance and prolonged life in its defenders."
  holy_site_hiraizumi_name: "Hiraizumi"
  holy_site_hiraizumi_desc: "The northern golden sanctuary of Mutsu, nourishing dynasties with boundless vitality and fertile posterity."
  holy_site_izumo_name: "Izumo"
  holy_site_izumo_desc: "The ancient coastal realm of the gathering kami, where primordial sacred bonds grant resilient health and years of life."
  holy_site_nagoya_name: "Nagoya"
  holy_site_nagoya_desc: "The central crossroad nexus of Owari, fortified by ancient shrines that ward off virulent diseases and nurture strong blood."
  holy_site_niigata_name: "Niigata"
  holy_site_niigata_desc: "The maritime snowbound haven of the Echigo coast, shielding holders from epidemics and sustaining hardy vigor."
