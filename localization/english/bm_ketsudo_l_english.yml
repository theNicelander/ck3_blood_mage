l_english:
  # Faith: Ketsudō / Xuedao
  ketsudo_faith: "Ketsudō"
  ketsudo_faith_adj: "Ketsudōist"
  ketsudo_faith_adherent: "Ketsudōist"
  ketsudo_faith_adherent_plural: "Ketsudōists"
  ketsudo_faith_desc: "Ketsudō—the Way of Blood (known as Xuedao across the Central Plains)—harmonizes the occult mastery of vital essence with the ancient spiritual traditions of the Far East. Veneration of ancestral bloodlines and communion with sacred volcanic peaks merge seamlessly with blood magic, honoring the scarlet flow as the divine current binding heaven, earth, and mortal vitality."

  # Mainline Rite
  ketsudo_faith_rite: "Way of the Sacred Flow"
  ketsudo_faith_rite_desc: "The sacred ancestral rites and vitality flows of the Ketsudō tradition."

