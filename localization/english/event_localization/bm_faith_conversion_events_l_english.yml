l_english:
  # Blood Faith Conversion Event
  bm_faith_conversion.0001.t: "Paths of the Blood Truth"
  bm_faith_conversion.0001.desc: "As the vital current awakens within your soul, the doctrines of the old world recede like hollow whispers. The power of blood demands devotion, yet its sacred truths have branched across different lands and traditions:\n\nIn the harsh north and western sanctuaries, #bold Blóðtrú#! commands total sovereignty over the life-essence, treating blood as the ultimate currency of supreme mastery.\n\nAmong the mist-shrouded peaks of the sunrise islands, #bold Ketsudō#! blends blood magic with ancestral spirits and the pulsing geomancy of volcanic earth.\n\nAcross the imperial expanses of the Central Plains, #bold Xuédào#! treats the vital blood flow as cosmic quintessence, harmonizing Heaven, Earth, and mortal lineages.\n\nWhich path will you pledge your blood to?"
  bm_faith_conversion.0001.a: "Embrace Blóðtrú — Sovereignty over the vital stream."
  bm_faith_conversion.0001.b: "Follow Ketsudō — The way of sacred spirits and living earth."
  bm_faith_conversion.0001.c: "Walk Xuédào — Harmony of cosmic quintessence."
  bm_faith_conversion.0001.d: "I am not yet ready to choose a path."
