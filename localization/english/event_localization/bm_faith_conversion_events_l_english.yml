l_english:
  # Blood Faith Conversion Event
  bm_faith_conversion.0001.t: "Paths of the Blood Truth"
  bm_faith_conversion.0001.desc: "As the vital current awakens within your soul, the doctrines of the old world recede like hollow whispers. The power of blood demands devotion, yet its sacred truths have branched across different lands and traditions:\n\nIn the harsh north and western sanctuaries, #bold Blóðtrú#! commands total sovereignty over the life-essence, treating blood as the ultimate currency of supreme mastery.\n\nAmong the mist-shrouded peaks of the sunrise islands, #bold Ketsudō#! blends blood magic with ancestral spirits and the pulsing geomancy of volcanic earth.\n\nAcross the imperial expanses of the Central Plains, #bold Xuédào#! treats the vital blood flow as cosmic quintessence, harmonizing Heaven, Earth, and mortal lineages.\n\nWhich path will you pledge your blood to?"
  bm_faith_conversion.0001.a: "Embrace the roots of Blóðtrú (Europe)"
  bm_faith_conversion.0001.b: "Follow the way of Ketsudō (Japan)"
  bm_faith_conversion.0001.c: "Walk the path of Xuédào (China)"
  bm_faith_conversion.0001.unreformed: "Seek the ancient, unreformed traditions..."
  bm_faith_conversion.0001.d: "Back"

  # Ancient Unreformed Blood Faith Conversion Event
  bm_faith_conversion.0002.t: "Ancient Blood Traditions"
  bm_faith_conversion.0002.desc: "Before scholastic doctrines and codified rites organized the blood faiths, primal practitioners practiced raw, untamed rites across the wilderness. These ancient ways retain the fierce power of unreformed faith—allowing endless raiding, sacrificial fury, and deep roots in the primal earth.\n\nWhich ancient tradition calls to you?"
  bm_faith_conversion.0002.a: "Embrace Old Blóðtrú"
  bm_faith_conversion.0002.b: "Follow Old Ketsudō"
  bm_faith_conversion.0002.c: "Walk the path of Old Xuédào"
  bm_faith_conversion.0002.d: "Back"
