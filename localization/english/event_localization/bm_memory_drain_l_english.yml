l_english:
  bm_memory_drain.0001.title: "Blood Memory Harvest"
  bm_memory_drain.0001.desc: "Bound in iron and blood runes, [recipient.GetShortUINameNoTooltip] carries a lifetime of hard-won discipline in their veins—muscle memory, battlefield instincts, and practiced craft etched into their very pulse.\n\nUnlike their flesh, these memories need not be destroyed to be claimed. You can drink deep of their lived mastery, though each discipline you force into your own blood weighs heavier on your mind."

  bm_memory_drain.0001.lifestyle: "Siphon Lifestyle & Craft"
  bm_memory_drain.0001.commander: "Siphon Commander Tactics"
  bm_memory_drain.0001.fame: "Siphon Martial Fame"

  bm_memory_drain.0002.title: "Blood Memory: Lifestyle & Craft"
  bm_memory_drain.0002.desc: "You trace the quiet grooves of [recipient.GetShortUINameNoTooltip]'s practiced arts—every scar from the sparring yard, every hours-long vigil over herbs, verses, or wild trails. Choose which craft to draw from their blood."

  bm_memory_drain.0003.title: "Blood Memory: Commander Tactics"
  bm_memory_drain.0003.desc: "In the steady drum of [recipient.GetShortUINameNoTooltip]'s pulse lie marches endured, flanks broken, and terrain mastered. Choose which tactical instinct to tear from their blood."

  bm_memory_drain.0004.title: "Blood Memory: Martial Fame"
  bm_memory_drain.0004.desc: "Raw fury and hard-forged renown burn in [recipient.GetShortUINameNoTooltip]'s veins. Choose which martial distinction to claim from their blood."

  bm_memory_drain.back: "Back"

  bm_memory_drain.success: "@bm_ancient_discipline_icon! Blood Memory Claimed"
  bm_memory_drain.fail: "@bm_ancient_discipline_icon! Blood Memory Resisted"

  bm_can_drain_memory_from_target_trigger_tt: "[CHARACTER.GetShortUINameNoTooltip] has drainable lifestyle, commander, or martial fame traits"
  NOT_bm_can_drain_memory_from_target_trigger_tt: "[CHARACTER.GetShortUINameNoTooltip] does #bold not#! have any drainable lifestyle, commander, or martial fame traits"

