l_english:
  # Blood Mirror Ascension Duel
  bm_ascension_duel.0001.t: "The Blood Mirror: Ascension Duel"
  bm_ascension_duel.0001.desc: "As the blood rites peak, the Blood Mirror ripples, casting forth an exact reflection of your mortal vessel upon a desolate, blood-soaked mental plane. To shatter the boundaries of your current tier and ascend, you must overcome your own reflection in single combat."
  bm_ascension_duel.0001.opt: "Engage your reflection!"
  bm_ascension_duel.0001.opt.tt: "Begins a [single_combat_duel|E] with [bm_clone.GetShortUIName]"
  bm_ascension_duel.0002.t: "The Blood Mirror: Duel Concluded"
  bm_ascension_duel.0002.victor_desc: "With a decisive blow, the reflection of your mortal vessel shatters into shards of brilliant blood-red light. The released power surges into your veins, permanently elevating you to the next tier of blood magic. Any unspent discipline experience is extracted into condensed Lifeforce as your new vessel begins anew."
  bm_ascension_duel.0002.loser_desc: "Your reflection parries your strike and hurls you back onto the bloodied stones. The mirror violently recoils, leaving you battered, exhausted, and with your ancient vessel unsettled. You must gather your strength before attempting ascension again."
  bm_ascension_duel.0002.opt: "It is done."
  bm_ascension_duel.0003.t: "Ascension Interrupted"
  bm_ascension_duel.0003.desc: "The ritual combat wavered and dissolved before a clear victor emerged."
  bm_ascension_duel.0003.opt: "Back"
  bm_ascension_duel_loser_toast: "Ascension Duel Defeat"
  bm_ghost_house_name: "Blood Ghost"
  bm_blood_ghost_dynasty_name: "Blood Ghost"
