  # Event Descriptions
  seek_power.001.desc: "You ride into the wild fringes of your lands, following the scent of fresh blood."
  seek_power.002.desc: "After a relentless chase through dense thickets, you corner a massive royal stag in a frost-bitten clearing. Lowering its bloodied antlers, the beast charges—only for your blade to bite deep into its throat in a single, decisive strike. Warm crimson steams in the cold air as you claim its Lifeforce."
  seek_power.003.desc: "Along a remote forest trail, you intercept [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]), a wandering warrior traveling alone. Steel rings as you bar their path. Their blood runs hot with vigor—ready to be drawn in a brutal bout of arms, claimed in lethal combat, or won over to your banner."
  seek_power.003.desc_escort: "Along a remote forest trail, you intercept [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]) accompanied by their sworn champion, [escort_knight.GetUIName] ([escort_knight.GetProwess] [prowess|E]). The knight steps forward immediately, hand on pommel and eyes sharp with veteran instinct.\n\n[recipient.GetFirstNameNoTooltip] offers a fierce bout for first blood or an ear for persuasion, while [escort_knight.GetFirstNameNoTooltip] radiates the potent Lifeforce of a seasoned warrior."
  seek_power.004.desc: "Deep in the wilderness, the scent of copper draws you to an ancient, moss-choked battlefield crowned by a weathered sacrificial cairn. Rusted blades litter the earth around a basin of dark stone where thick, primordial blood still pools—unspoiled by centuries and humming with ancient power."
  seek_power.006.desc_victory: "With a final, bone-jarring strike, your opponent's guard shatters and they drop to one knee in the blood-soaked brush. Their chest heaves with exhaustion as crimson droplets steam in the cold forest air. You stand over them with your blade raised, the pulse of their potent warrior's lifeforce resonating with your blood rites—yours to harvest in victory, or to bind into your service."
  seek_power.006.desc_slain: "The wilderness falls silent as your opponent collapses into the crimson-stained ferns, their final breath steaming in the cold air. Already, the potent essence of a worthy warrior surges through your veins, fueling your martial ascension."
  seek_power.006.desc_defeat: "Your opponent's steel proves too swift and relentless. Battered, bleeding, and forced onto the back foot, you have no choice but to break off the clash and slip back into the dense forest mist before your wounds prove fatal."
  seek_power.008.desc: "A trail of fresh crimson leads you to a dark cave strewn with bones, where a monstrous, battle-scarred bear snarls over its freshly slaughtered quarry. Its eyes burn with feral fury as it rises onto its hind legs to defend its feast."
  seek_power.009.desc: "As dusk settles over the forest, your hunt brings you to an isolated woodcutter's homestead at the treeline. The faint scent of mortal blood and warm hearthsmoke drifts into the evening air."
  seek_power.010.desc: "Following woodsmoke into a secluded hollow, you stumble upon a crude encampment of armed outlaws and poachers dividing their plunder around a dying campfire."
  seek_power.011.desc: "Deep within a moonlit glade, a lone occultist chants over a stone basin brimming with freshly harvested blood. They are so consumed by their dark incantation that they have not yet sensed your approach."

