l_english:
  bm_manifest_lifeforce.0001.t: "Manifest Lifeforce"
  bm_manifest_lifeforce.0001.desc: "Opening the conduits of spirit and blood, I enter a deep meditative trance. Through devotion and contemplation, the sacred fervor of the divine can be condensed into vital essence within mortal veins.\n\nHow much spiritual devotion shall I offer to the crucible?"
  bm_manifest_lifeforce.0001.tier1: "Offer 100 Piety — Modest Meditation"
  bm_manifest_lifeforce.0001.tier2: "Offer 250 Piety — Focused Communion"
  bm_manifest_lifeforce.0001.tier3: "Offer 500 Piety — Profound Crucible"
  bm_manifest_lifeforce.0001.tier4: "Offer 1000 Piety — Transcendent Epiphany"
  bm_manifest_lifeforce.0001.cancel: "Step away from the altar for now."
