l_english:
  # Egill Skallagrimsson Geyser Duel Events
  bm_geyser_duel.0001.t: "Egill Skallagrímsson by the Geyser"
  bm_geyser_duel.0001.desc: "Amidst the billowing steam of the geothermal geysers and volcanic vents, a massive, imposing figure emerges from the sulfurous mist. Towering and broad-shouldered, his face is famously fierce and grotesque, marked by a heavy brow and dark, piercing eyes that burn with savage vitality. It is none other than Egill Skallagrímsson—berserker, poet, and master of blood-runes.\n\nWithout speaking, Egill raises a runic blade and channels the vital current into the boiling waters, beckoning you forward to test your mind or martial might against his in the sacred duel of blood."
  bm_geyser_duel.0001.desc_retry: "Reeling from the clash, the scalding mist swirls around you as you catch your breath upon the tremor-shaken stone. Egill stands unmoved upon the volcanic rock, his heavy blade poised and eyes gleaming with grim intensity.\n\nThe fierce warrior-poet offers neither mockery nor mercy—only a cold grin, waiting to see if you will rally your spirit to challenge him once more, or yield and step back into the mist."
  bm_geyser_duel.0001.a: "Match wills in the duel of blood!"
  bm_geyser_duel.0001.a_retry: "Gather your resolve and challenge Egill again!"
  bm_geyser_duel.0001.a_learning: "Match wills in a duel of blood magic! (Blood Mage — costs 1 Devotion Level)"
  bm_geyser_duel.0001.a_learning_retry: "Gather your resolve and test your blood magic against Egill again! (Blood Mage)"
  bm_geyser_duel.0001.a_prowess: "Cross blades in a duel of martial prowess! (Blood Knight — costs 1 Fame Level)"
  bm_geyser_duel.0001.a_prowess_retry: "Raise your blade and test your prowess against Egill again! (Blood Knight)"
  bm_geyser_duel.0001.b: "Withdraw into the mist—this trial is too much to bear."
  bm_geyser_duel.0001.b.tt: "You step back from the duel and leave Egill undisturbed."

  bm_geyser_duel.success_tt: "Victory! Egill acknowledges your mastery of the blood currents and awakens the blood magic within you!"
  bm_geyser_duel.blood_knight_success_tt: "Victory! Egill recognizes your fearsome martial strength and initiates you as a Blood Knight!"
  bm_geyser_duel.mental_failure_tt: "Defeat! Your mind is shattered under Egill's overwhelming will! You reel from the psychic backlash, but he still waits."
  bm_geyser_duel.physical_failure_tt: "Defeat! Your body is crippled under the psychic backlash! You collapse to your knees, but the trial is not over unless you yield."
  bm_geyser_duel.injury_failure_tt: "Defeat! You reel from the violent clash with grievous wounds, yet the duel is not finished unless you retreat."
