l_english:
  # The Wise One of the Geyser Duel Events
  bm_geyser_duel.0001.t: "The Wise One of the Geyser"
  bm_geyser_duel.0001.desc: "Amidst the billowing steam of the geothermal geysers and volcanic vents, an ancient figure emerges from the sulfurous mist. Clad in garments stained dark with vital essence, their hair is stark white and their skin etched with the deep lines of one hundred and eleven years of life. Yet in their crimson-flecked eyes burns the terrifying vitality of an ancient master.\n\nWithout speaking, the wise one raises a ceremonial blade and channels the vital current, beckoning you forward to test your mind and will in the sacred duel of blood."
  bm_geyser_duel.0001.a: "Match wills in the duel of blood!"

  bm_geyser_duel.success_tt: "Victory! The ancient one acknowledges your mastery and awakens the blood magic within you!"
  bm_geyser_duel.mental_failure_tt: "Defeat! Your mind is shattered under the ancient one's overwhelming will!"
  bm_geyser_duel.physical_failure_tt: "Defeat! Your body is crippled under the psychic backlash!"
  bm_geyser_duel.injury_failure_tt: "Defeat! You barely escape the geyser's mist with grievous wounds!"
