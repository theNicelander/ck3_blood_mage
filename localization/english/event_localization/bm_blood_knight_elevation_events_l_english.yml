l_english:
  bm_blood_knight_elevation.0001.t: "Ascension of the Blood Knight"
  bm_blood_knight_elevation.0001.desc: "Your veins thrum with the crimson power of the Blood Knight, yet you have functioned only as a mortal weapon infused with raw martial power. To unlock the deeper mysteries of blood magic and transcend into a true Blood Mage, you must expand your mind, master the lifeforce currents, and bind the ancient arcana to your soul."
  bm_blood_knight_elevation.0001.a_learning: "Awaken the ancient arcana through sacred meditation"
  bm_blood_knight_elevation.0001.b_prowess: "Force the metamorphosis through sheer martial will"
  bm_blood_knight_elevation.0001.c_cancel: "Step back; my vessel is not yet ready"

  bm_blood_knight_elevation.success_tt: "Successfully transcend and awaken as a Blood Mage"
  bm_blood_knight_elevation.failure_tt: "The ritual collapses, wounding and exhausting you"
  bm_blood_knight_elevation.success_toast: "Ascended to Blood Mage!"
  bm_blood_knight_elevation.failure_toast: "Metamorphosis Failed!"
