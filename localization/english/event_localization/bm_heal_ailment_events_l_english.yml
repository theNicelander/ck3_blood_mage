l_english:
  bm_heal_ailment.0001.title: "Mending Flesh and Blood"
  bm_heal_ailment.0001.desc: "Ancient blood magic courses through your veins as you assess [recipient.GetShortUINamePossessive] physical state. Sickness and bodily suffering take many forms, yet every affliction leaves a distinct resonance in the blood.\n\nBy focusing your Lifeforce into ritual channels, you can purge the corruption, mend torn flesh, or knit shattered bones. Choose which affliction you wish to draw out and cleanse."

