l_english:
  bm_heal_ailment.0001.title: "Blood Healing"
  bm_heal_ailment.0001.desc: "Ancient blood magic courses through your veins as you assess [recipient.GetShortUINamePossessive] health. Wounds, diseases, and bodily suffering take many forms, yet each leaves a distinct resonance in the blood.\n\nBy focusing your Lifeforce, you can heal torn flesh, restore failing health, and ease suffering. Choose which health trait you wish to heal."

