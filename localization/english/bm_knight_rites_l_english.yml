l_english:
  bm_blood_bodyguard_court_position: "Crimson Sworn-Guard"
  bm_blood_bodyguard_court_position_desc: "A fearsome bodyguard bound by crimson oaths and martial prowess, standing vigilant between their master and any assassin's blade."
  bm_blood_bodyguard_court_position_employer_custom_effect_description: "Reduces the success chance of hostile schemes directed against you and reinforces your baseline dread."
  bm_court_position_giant_trait: "[GetTrait('giant').GetName( ROOT.Char )]"
  bm_court_position_vanguard_xp: "Vanguard Track XP"
  bm_court_position_slaughter_xp: "Slaughter Track XP"

  bm_anointed_champion_modifier: "Anointed Vanguard Champion"
  bm_anointed_champion_modifier_desc: "This warrior's veins have been consecrated with condensed Lifeforce, heightening their battle reflexes and bolstering their vitality."
  bm_spar_honed_modifier: "Honed by Crimson Sparring"
  bm_spar_honed_modifier_desc: "Sharpened through ritual duels with a master of blood magic, enhancing combat efficiency and tactical poise."

  bm_anoint_knight_interaction: "Anoint Vanguard Champion"
  bm_anoint_knight_interaction_desc: "Consecrate a sworn knight or blood knight courtier with a drop of Minor Lifeforce, fortifying their prowess and endurance for years."
  bm_anoint_knight_toast: "Champion Anointed in Blood"
  bm_recipient_already_anointed: "Recipient is already an Anointed Vanguard Champion."

  bm_ritual_spar_interaction: "Ritual Sparring"
  bm_ritual_spar_interaction_desc: "Engage a sworn knight, fellow Blood Knight, or martial friend in ritual combat to hone instincts and test martial mastery."
  bm_ritual_spar_critical_success_title: "Decisive Sparring Victory"
  bm_ritual_spar_critical_success_desc: "You overwhelm your sparring partner with overwhelming prowess, drawing first blood and condensing a drop of Minor Lifeforce!"
  bm_ritual_spar_success_title: "Sparring Mastery"
  bm_ritual_spar_success_desc: "You best your partner in spirited martial combat, sharpening each other's battle acumen."
  bm_ritual_spar_failure_title: "Humbled in the Ring"
  bm_ritual_spar_failure_desc: "Your partner maneuvers past your defenses and bests you, though valuable combat insight is still gained."

  bm_cull_champion_interaction: "Cull Fallen Champion"
  bm_cull_champion_interaction_desc: "Sacrifice a formidable prisoner or critically broken follower on the altar of blood, harvesting their martial essence into Major Lifeforce with a chance of condensing Superior Lifeforce."
  bm_cull_champion_toast: "Champion Culled"
