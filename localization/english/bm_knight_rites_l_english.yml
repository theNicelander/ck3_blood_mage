l_english:

  bm_anointed_champion_modifier: "Anointed Vanguard Champion"
  bm_anointed_champion_modifier_desc: "This warrior's veins have been consecrated with condensed Lifeforce, heightening their battle reflexes and bolstering their vitality."
  bm_spar_honed_modifier: "Honed by Crimson Sparring"
  bm_spar_honed_modifier_desc: "Sharpened through ritual duels with a master of blood magic, enhancing combat efficiency and tactical poise."

  bm_anoint_knight_interaction: "Anoint Vanguard Champion"
  bm_anoint_knight_interaction_desc: "Consecrate a sworn knight or blood knight courtier with a drop of Minor Lifeforce, fortifying their prowess and endurance for years."
  bm_anoint_knight_toast: "Champion Anointed in Blood"
  bm_recipient_already_anointed: "Recipient is already an Anointed Vanguard Champion."

  bm_ritual_spar_decision: "Crimson Sparring Ring"
  bm_ritual_spar_decision_desc: "Convene your sworn Blood Knights into the courtyard ring for a ritual practice duel, testing instincts and martial mastery in non-lethal combat."
  bm_ritual_spar_decision_tooltip: "Enter the sparring ring against one of your Blood Knights to hone blademaster skills and condense Major Lifeforce."
  bm_ritual_spar_decision_confirm: "Begin Sparring"
  bm_need_minor_lifeforce_spar_req: "Requires at least 1 stack of Minor Lifeforce."
  bm_no_blood_knights_available_req: "Requires at least one eligible sworn knight with the Blood Knight trait."

  bm_ritual_spar_events.0001.t: "The Crimson Sparring Ring"
  bm_ritual_spar_events.0001.desc: "A wide circle of blood-scribed runes is drawn across the courtyard stones. Your sworn Blood Knights stand assembled, blades bare and eyes gleaming with readiness. Three champions step forward to answer the call of the ring—each eager to test their martial mastery against yours in non-lethal practice combat."
  bm_ritual_spar_events.0001.opt_spar_1: "Spar against [spar_partner_1.GetShortUIName] (Prowess: [spar_partner_1.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_2: "Spar against [spar_partner_2.GetShortUIName] (Prowess: [spar_partner_2.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_3: "Spar against [spar_partner_3.GetShortUIName] (Prowess: [spar_partner_3.GetProwess])"
  bm_ritual_spar_events.0001.opt_cancel: "Call off the rite (Refund Lifeforce)"

  bm_ritual_spar_events.0002.t: "The Sparring Concluded"
  bm_ritual_spar_events.0002.victor_desc: "Steel clashes and sparks dance across the courtyard ring. With overwhelming martial technique and heightened battle reflexes, you overcome [sc_defender.GetShortUIName] and claim decisive victory in the sparring circle. In the fervor of combat, your blood condenses into a radiant sphere of Major Lifeforce!"
  bm_ritual_spar_events.0002.loser_desc: "Steel clashes and sparks dance across the courtyard ring. [sc_defender.GetShortUIName] maneuvers with astonishing speed and martial mastery, finding an opening past your guard to land a decisive strike. Though humbled, the rigorous contest tempers your blade, and [sc_defender.GetShortUIName] harvests the condensed Major Lifeforce of victory."
  bm_ritual_spar_events.0002.opt: "A worthy contest of blood and blade."
  bm_ritual_spar_victor_toast: "Decisive Sparring Victory"
  bm_ritual_spar_loser_toast: "Sparring Defeat"

  bm_ritual_spar_events.0003.t: "Sparring Interrupted"
  bm_ritual_spar_events.0003.desc: "The sparring bout was abruptly halted before either combatant could claim victory. Your expended Lifeforce returns to your veins."
  bm_ritual_spar_events.0003.opt: "The ring clears."
  bm_ritual_spar_invalidated_toast: "Sparring Bout Interrupted"

  bm_cull_champion_interaction: "Cull Fallen Champion"
  bm_cull_champion_interaction_desc: "Sacrifice a formidable prisoner or critically broken follower on the altar of blood, harvesting their martial essence into Major Lifeforce with a chance of condensing Superior Lifeforce."
  bm_cull_champion_toast: "Champion Culled"
