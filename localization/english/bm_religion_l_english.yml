  # Core Terms - Religion
  blodtru_religion: "Blóðtrú"
  blodtru_religion_adj: "Blóðtrúar"
  blodtru_religion_adherent: "Blóðtrúist"
  blodtru_religion_adherent_plural: "Blóðtrúists"
  blodtru_religion_desc: "Blóðtrú perceives the primal life force that flows through all beings not as divine, but as the ultimate currency of power. Through forbidden blood rituals and calculated sacrifice, adherents extract, manipulate, and harness this essence to transcend mortality's limitations. Unlike conventional faiths that worship deities, followers of Blóðtrú view themselves as would-be masters of existence's fundamental substrate."
