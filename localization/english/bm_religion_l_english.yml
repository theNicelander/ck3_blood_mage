  # Religion family
  rf_quintessence: "Quintessence"
  rf_quintessence_desc: "Faiths that seek mastery over the vital essence carried in blood."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] Opinion"

  # Core Terms - Religion
  quintessence_religion: "Cult of the Quintessence"
  quintessence_religion_adj: "Quintessential"
  quintessence_religion_adherent: "Quintessentialist"
  quintessence_religion_adherent_plural: "Quintessentialists"
  quintessence_religion_desc: "The Cult of the Quintessence perceives the primal life force that flows through all beings not as divine, but as the ultimate currency of power. Through forbidden blood rituals and calculated sacrifice, adherents extract, manipulate, and harness this essence to transcend mortality's limitations. Unlike conventional faiths that worship deities, Quintessentialists view themselves as would-be masters of existence's fundamental substrate."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "Cult of the Quintessence"
  quintessence_faith_adj: "Quintessential"
  quintessence_faith_adherent: "Quintessentialist"
  quintessence_faith_adherent_plural: "Quintessentialists"
  quintessence_faith_desc: "Christian Quintessentialists proclaim that the blood shed on Calvary revealed a deeper mystery: life itself is a sacred current that can be poured out, received, and mastered. They interpret the Passion, the martyrs, and the Eucharist through a forbidden crimson theology, teaching that every heartbeat echoes Christ's sacrifice and that those who comprehend the mystery of blood may overcome the frailty of mortal flesh."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Islamic Quintessentialists insist that Allah alone is divine, while blood is an amanah — a sacred trust placed within every living body. They claim that prophets, physicians, and mystics each glimpsed part of its hidden law, and that through disciplined rites, fasting, and carefully measured sacrifice the faithful may master the vital current while submitting themselves to the order written into creation."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Jewish Quintessentialists begin with the ancient teaching that the life of the flesh is in the blood. They regard covenant, circumcision, and the memory of Temple sacrifice as fragments of a concealed discipline, holding that blood carries both the inheritance of generations and the obligations binding a people together. To command that inheritance is, in their eyes, to touch the deepest current of creation."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Eastern Quintessentialists describe the Quintessence as the vital stream moving through samsara: breath, blood, karma, and consciousness bound within a single circulation. Some name it prana, while others understand it as a means to loosen attachment or cleanse karmic burdens. All teach that exacting rites can redirect this current toward awakening, longevity, and final liberation."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Sinitic Quintessentialists hold that blood is the densest vessel of qi, inherited from the ancestors and ordered beneath Heaven. By tracing the body's meridians, honoring the dead, and balancing sacrifice against harmony, they seek to refine inherited essence rather than squander it. A perfected circulation is said to unite body, lineage, and cosmos in a single crimson order."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Ásatrú Quintessentialists reject foreign accommodations and recognize the crimson current in Odin's ordeal, the battle-fury of the einherjar, and the blood spilled at the blót. To kill or die with purpose releases power into clan, land, and gods; war is sacrament, sacrifice is exchange, and the Quintessence belongs to those bold enough to seize it."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Among the followers of the old gods, blood is remembered as the first language spoken between mortals, ancestors, and spirits. Quintessentialists preserve the oath, the offering, and the sacrificial feast, but teach that these rites do more than placate unseen powers: they open channels through which strength passes from beast to warrior, from the dead to the living, and from the land into its chosen people."
  quintessence_faith_old: "$quintessence_faith$"
  quintessence_faith_old_adj: "$quintessence_faith_adj$"
  quintessence_faith_old_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_old_adherent_plural: "$quintessence_faith_adherent_plural$"
