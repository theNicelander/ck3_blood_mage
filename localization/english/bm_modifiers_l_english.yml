l_english:
  lifedrained_modifier: "Lifedrained"
  lifedrained_modifier_desc: "This character's lifeforce was drained by a Blood Mage."
  recently_lifedrained_modifier: "Recently Lifedrained"
  recently_lifedrained_modifier_desc: "This character was recently drained by a Blood Mage, leaving them critically drained and unable to withstand another drain for a time."

  lifeforce_modifier_superior: "Superior Lifeforce"
  lifeforce_modifier_superior_desc: "A highly condensed reservoir of vital essence distilled by harmonizing minor and major lifeforce."

  lifeforce_modifier_minor: "Minor Lifeforce"
  lifeforce_modifier_minor_desc: "A modest reservoir of vital essence gathered through minor blood rites, ready to be channeled or condensed."

  lifeforce_modifier_major: "Major Lifeforce"
  lifeforce_modifier_major_desc: "A potent reservoir of concentrated lifeforce harvested from mortal blood, ready to empower rites of education and lineage."

  lifeforce_modifier_radiant: "Radiant Blood"
  lifeforce_modifier_radiant_desc: "A concentrated diplomatic reservoir strengthening reign stability, legitimacy, prestige, vassal opinion, personal schemes, and Diplomacy lifestyle experience."

  lifeforce_modifier_furious: "Furious Blood"
  lifeforce_modifier_furious_desc: "A concentrated combat reservoir fueling prowess, army speed and damage, siege speed, counter efficiency, knightly prowess scaling, and Martial lifestyle experience."

  lifeforce_modifier_fortunate: "Fortunate Blood"
  lifeforce_modifier_fortunate_desc: "A concentrated economic reservoir increasing domain taxes, reducing construction costs and build times, accelerating prosperity, lowering Men-at-Arms upkeep, and granting Stewardship lifestyle experience."

  lifeforce_modifier_cunning: "Cunning Blood"
  lifeforce_modifier_cunning_desc: "A concentrated intrigue reservoir accelerating hostile schemes, raising scheme secrecy and caps, uncovering enemy plots, radiating dread, and granting Intrigue lifestyle experience."

  lifeforce_modifier_wise: "Wise Blood"
  lifeforce_modifier_wise_desc: "A concentrated intellectual reservoir amplifying piety, steadying stress, speeding language study, deepening lifestyle progress, and granting Learning lifestyle experience."

  lifeforce_modifier_ancient: "Ancient Blood"
  lifeforce_modifier_ancient_desc: "A concentrated lineage reservoir quickening fertility, extending fertile years, favoring hereditary traits, warding against inbreeding, boosting dynasty renown, and granting active lifestyle experience."

  lifeforce_modifier_negative_superior: "Cast Superior Blood Magic"
  lifeforce_modifier_negative_superior_desc: "The immense strain of channeling Superior Lifeforce has left this character profoundly exhausted."

  lifeforce_modifier_negative_minor: "Cast Minor Blood Magic"
  lifeforce_modifier_negative_minor_desc: "The lingering strain of channeling minor lifeforce has temporarily sapped this character's vitality, prowess, and vigor."

  lifeforce_modifier_negative_major: "Cast Major Blood Magic"
  lifeforce_modifier_negative_major_desc: "The taxing strain of executing major blood rites has temporarily sapped this character's vitality, prowess, and vigor."

  bm_overdrained_modifier: "Overdrained"
  bm_overdrained_modifier_desc: "Forcing a lethal lifedrain without spiritual grounding has strained this character's body and soul, sapping health and piety."

