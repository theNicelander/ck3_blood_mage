  # 1. Vegvisir (The Wayfinder)
  bm_rune_vegvisir_minor: "Vegvísir (Minor)"
  bm_rune_vegvisir_minor_desc: "The wayfinder stave etched into flesh. Increases travel speed, travel safety, and movement speed."
  bm_rune_vegvisir_major: "Vegvísir (Major)"
  bm_rune_vegvisir_major_desc: "The wayfinder stave expanded across the torso. Significantly increases travel speed, travel safety, and movement speed."
  bm_rune_vegvisir_superior: "Vegvísir (Superior)"
  bm_rune_vegvisir_superior_desc: "The perfected wayfinder stave.\n\n#bold Superior Capstone — Storm-Walker#!: Halves the cooldown of Seek Power (1 year landed, 6 months wanderer or knight) and guarantees completely safe harvest outcomes without negative hazards."

  # 2. Aegishjalmur (Helm of Awe)
  bm_rune_aegishjalmur_minor: "Ægishjálmur (Minor)"
  bm_rune_aegishjalmur_minor_desc: "The helm of awe stave etched between the brows. Increases prowess, advantage, and knight effectiveness."
  bm_rune_aegishjalmur_major: "Ægishjálmur (Major)"
  bm_rune_aegishjalmur_major_desc: "The helm of awe stave expanded across the brow and chest. Greatly increases prowess, advantage, and knight effectiveness."
  bm_rune_aegishjalmur_superior: "Ægishjálmur (Superior)"
  bm_rune_aegishjalmur_superior_desc: "The perfected helm of awe stave.\n\n#bold Superior Capstone — Terror of the Slain#!: In battles and single combat duels, strikes fear into the hearts of enemy commanders and champions, inflicting severe terror and reducing their prowess and health."

  bm_aegishjalmur_terror_modifier: "Struck by Terror"
  bm_aegishjalmur_terror_modifier_desc: "This warrior has faced the bearer of the perfected Helm of Awe, breaking their spirit and severely degrading their combat prowess and constitution."

  # 3. Feingur (Awakened Seed)
  bm_rune_feingur_minor: "Feingur (Minor)"
  bm_rune_feingur_minor_desc: "The fertility and lineage stave etched into flesh. Increases fertility, fertile years, congenital trait inheritance, character health, and epidemic resistance."
  bm_rune_feingur_major: "Feingur (Major)"
  bm_rune_feingur_major_desc: "The fertility and lineage stave expanded across the torso. Highly increases fertility, fertile years, congenital trait inheritance, character health, and epidemic resistance."
  bm_rune_feingur_superior: "Feingur (Superior)"
  bm_rune_feingur_superior_desc: "The perfected fertility and lineage stave.\n\n#bold Superior Capstone — Awakened Seed#!: Doubles discipline XP gained on childbirth (+4 base, +8 if inherited; Bloodline for Mages, Vanguard for Knights). Unlocks an interaction to bestow a permanent runic blessing upon dynasty kin."

  bm_feingur_blessed_blood_modifier: "Awakened Runic Bloodline"
  bm_feingur_blessed_blood_modifier_desc: "The vital currents of Feingur have been permanently woven into this character's flesh, granting permanent physical perfection, cognitive sharpness, and high fertility."

  # 4. Nabrokarstafur (Flayed Tithe)
  bm_rune_nabrokarstafur_minor: "Nábrókarstafur (Minor)"
  bm_rune_nabrokarstafur_minor_desc: "The flayed tithe stave etched into flesh. Increases domain tax and lowers Men-at-Arms maintenance at the expense of general opinion."
  bm_rune_nabrokarstafur_major: "Nábrókarstafur (Major)"
  bm_rune_nabrokarstafur_major_desc: "The flayed tithe stave expanded across the flesh. Significantly increases domain tax and lowers Men-at-Arms maintenance at the expense of general opinion."
  bm_rune_nabrokarstafur_superior: "Nábrókarstafur (Superior)"
  bm_rune_nabrokarstafur_superior_desc: "The perfected flayed tithe stave.\n\n#bold Superior Capstone — Flayed Tithe#!: Yields #P +20 Gold#! per Point of Interest visited during travel, and claims #P 10%#! of enemy fatal casualties as gold (25–250 Gold) upon winning any battle."

  # 5. Hulinhjalmur (Unseen Shroud)
  bm_rune_hulinhjalmur_minor: "Hulinhjálmur (Minor)"
  bm_rune_hulinhjalmur_minor_desc: "The unseen shroud stave etched into flesh. Increases hostile scheme success chance, reduces enemy scheme success, and boosts monthly lifestyle experience."
  bm_rune_hulinhjalmur_major: "Hulinhjálmur (Major)"
  bm_rune_hulinhjalmur_major_desc: "The unseen shroud stave expanded across the torso. Greatly increases hostile scheme success chance, reduces enemy scheme success, and boosts monthly lifestyle experience."
  bm_rune_hulinhjalmur_superior: "Hulinhjálmur (Superior)"
  bm_rune_hulinhjalmur_superior_desc: "The perfected unseen shroud stave.\n\n#bold Superior Capstone — Unseen Shroud#!: Doubles yearly discipline Attunement experience gain to #P +2 XP#! per year, and successfully executing a Murder scheme harvests #P 1 Major Lifeforce#!."

  # Slaughter 50 Devotion Knights
  bm_slaughter_devotion_knights_modifier: "Slaughter Devotion"
  bm_slaughter_devotion_knights_modifier_desc: "Empowered by bloody devotion, this Blood Knight commands additional champions in battle (+1 Knight Limit per Level of Devotion)."
