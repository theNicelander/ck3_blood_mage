  # Dynasty modifiers (3-Tier Covenants & Surges)
  dynasty_blood_charisma_modifier_1: "Covenant of Majesty (Minor)"
  dynasty_blood_charisma_modifier_1_desc: "Tier I (Minor): Blood magic enhances diplomacy, opinion, prestige, and personal schemes across your house."
  dynasty_blood_charisma_modifier_2: "Covenant of Majesty (Major)"
  dynasty_blood_charisma_modifier_2_desc: "Tier II (Major): Blood magic significantly strengthens diplomacy, renown, opinion, and personal scheme phase speed across your house."
  dynasty_blood_charisma_modifier_3: "Covenant of Majesty (Superior)"
  dynasty_blood_charisma_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Majesty grants peerless diplomatic influence, personal scheme capacity, and dynastic renown."

  dynasty_blood_fury_modifier_1: "Covenant of Warband (Minor)"
  dynasty_blood_fury_modifier_1_desc: "Tier I (Minor): Blood magic empowers warriors, knights, and travel safety across your house."
  dynasty_blood_fury_modifier_2: "Covenant of Warband (Major)"
  dynasty_blood_fury_modifier_2_desc: "Tier II (Major): Blood magic enhances martial prowess, advantage, army speed, and travel velocity across your house."
  dynasty_blood_fury_modifier_3: "Covenant of Warband (Superior)"
  dynasty_blood_fury_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Warband grants Men-at-Arms regiment size, lethal prowess, and battlefield dominance."

  dynasty_blood_prosperity_modifier_1: "Covenant of Prosperity (Minor)"
  dynasty_blood_prosperity_modifier_1_desc: "Tier I (Minor): Blood-infused stewardship increases wealth, reduces army maintenance, and cuts construction costs for your house."
  dynasty_blood_prosperity_modifier_2: "Covenant of Prosperity (Major)"
  dynasty_blood_prosperity_modifier_2_desc: "Tier II (Major): Blood-infused stewardship bolsters income, holding and camp development, and building speed across your house."
  dynasty_blood_prosperity_modifier_3: "Covenant of Prosperity (Superior)"
  dynasty_blood_prosperity_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Prosperity expands domain capacity, holding wealth, and logistic mastery."

  dynasty_blood_shadows_modifier_1: "Covenant of Shadow (Minor)"
  dynasty_blood_shadows_modifier_1_desc: "Tier I (Minor): Blood magic accelerates hostile schemes and shields your house in protective shadows."
  dynasty_blood_shadows_modifier_2: "Covenant of Shadow (Major)"
  dynasty_blood_shadows_modifier_2_desc: "Tier II (Major): Blood magic bolsters intrigue, scheme speed, dread, and caps enemy plot success against your house."
  dynasty_blood_shadows_modifier_3: "Covenant of Shadow (Superior)"
  dynasty_blood_shadows_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Shadow grants hostile scheme capacity, impenetrable secrecy, and dark mastery."

  dynasty_blood_insight_modifier_1: "Covenant of Insight (Minor)"
  dynasty_blood_insight_modifier_1_desc: "Tier I (Minor): Blood magic bestows arcane knowledge, piety, stress resilience, and cultural acceptance upon your house."
  dynasty_blood_insight_modifier_2: "Covenant of Insight (Major)"
  dynasty_blood_insight_modifier_2_desc: "Tier II (Major): Blood magic accelerates learning, piety generation, stress composure, and devotion impact across your house."
  dynasty_blood_insight_modifier_3: "Covenant of Insight (Superior)"
  dynasty_blood_insight_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Insight grants learning per devotion level, deep piety, and spiritual transcendence."

  dynasty_blood_legacy_modifier_1: "Covenant of Legacy (Minor)"
  dynasty_blood_legacy_modifier_1_desc: "Tier I (Minor): Blood magic fortifies your bloodline with fertility, longevity, health, and positive congenital trait inheritance."
  dynasty_blood_legacy_modifier_2: "Covenant of Legacy (Major)"
  dynasty_blood_legacy_modifier_2_desc: "Tier II (Major): Blood magic deeply strengthens genetic potential, health, life expectancy, and wards against inbreeding."
  dynasty_blood_legacy_modifier_3: "Covenant of Legacy (Superior)"
  dynasty_blood_legacy_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Legacy bestows superhuman genetic perfection, longevity, and severe inbreeding reduction."

  dynasty_blood_expertise_modifier_1: "Covenant of Mastery (Minor)"
  dynasty_blood_expertise_modifier_1_desc: "Tier I (Minor): Blood magic accelerates lifestyle experience and language learning across your house."
  dynasty_blood_expertise_modifier_2: "Covenant of Mastery (Major)"
  dynasty_blood_expertise_modifier_2_desc: "Tier II (Major): Blood magic bolsters lifestyle mastery, language capacity, and imperial fame scaling across your house."
  dynasty_blood_expertise_modifier_3: "Covenant of Mastery (Superior)"
  dynasty_blood_expertise_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Mastery grants lifestyle experience, fame impact, and eliminates cultural friction."

