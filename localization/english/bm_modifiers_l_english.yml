  # Dynasty modifiers (3-Tier Covenants)
  dynasty_blood_radiance_modifier_1: "Covenant of Radiance (Minor)"
  dynasty_blood_radiance_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, monthly Prestige, diplomacy, opinion, legitimacy, and personal scheme success across your house."
  dynasty_blood_radiance_modifier_2: "Covenant of Radiance (Major)"
  dynasty_blood_radiance_modifier_2_desc: "Tier II (Major): Blood magic strengthens diplomacy, monthly Prestige, opinion, legitimacy, personal schemes, and short reign reduction across your house."
  dynasty_blood_radiance_modifier_3: "Covenant of Radiance (Superior)"
  dynasty_blood_radiance_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Radiance grants diplomacy per Devotion level, legitimacy gain, monthly Prestige, and dynastic renown."

  dynasty_blood_fury_modifier_1: "Covenant of Fury (Minor)"
  dynasty_blood_fury_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, martial prowess, an additional knight, army damage, monthly Piety per knight, and knight effectiveness per prowess across your house."
  dynasty_blood_fury_modifier_2: "Covenant of Fury (Major)"
  dynasty_blood_fury_modifier_2_desc: "Tier II (Major): Blood magic enhances martial prowess, army damage, additional knights, monthly Piety per knight, and knight effectiveness per prowess across your house."
  dynasty_blood_fury_modifier_3: "Covenant of Fury (Superior)"
  dynasty_blood_fury_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Fury grants martial per Devotion level, Men-at-Arms capacity and regiment size, additional knights, lethal army damage, monthly Piety per knight, and knight effectiveness per prowess."

  dynasty_blood_fortune_modifier_1: "Covenant of Fortune (Minor)"
  dynasty_blood_fortune_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, income, stewardship, prosperity growth, and build cost reductions for your house."
  dynasty_blood_fortune_modifier_2: "Covenant of Fortune (Major)"
  dynasty_blood_fortune_modifier_2_desc: "Tier II (Major): Blood magic bolsters income, prosperity growth, build cost reductions, and Men-at-Arms maintenance."
  dynasty_blood_fortune_modifier_3: "Covenant of Fortune (Superior)"
  dynasty_blood_fortune_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Fortune expands domain capacity, holding wealth, and stewardship per Devotion level."

  dynasty_blood_cunning_modifier_1: "Covenant of Cunning (Minor)"
  dynasty_blood_cunning_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, intrigue, and hostile scheme success across your house."
  dynasty_blood_cunning_modifier_2: "Covenant of Cunning (Major)"
  dynasty_blood_cunning_modifier_2_desc: "Tier II (Major): Blood magic bolsters intrigue, scheme secrecy, and caps enemy plot success against your house."
  dynasty_blood_cunning_modifier_3: "Covenant of Cunning (Superior)"
  dynasty_blood_cunning_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Cunning grants intrigue per Devotion level, hostile scheme success, and defensive secrecy against enemy plots."

  dynasty_blood_wisdom_modifier_1: "Covenant of Wisdom (Minor)"
  dynasty_blood_wisdom_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, learning, lifestyle experience, stress resilience, monthly Piety mult per knight, and knight effectiveness per learning across your house."
  dynasty_blood_wisdom_modifier_2: "Covenant of Wisdom (Major)"
  dynasty_blood_wisdom_modifier_2_desc: "Tier II (Major): Blood magic accelerates lifestyle experience, piety gain, health, stress composure, monthly Piety mult per knight, and knight effectiveness per learning."
  dynasty_blood_wisdom_modifier_3: "Covenant of Wisdom (Superior)"
  dynasty_blood_wisdom_modifier_3_desc: "Tier III (Superior): The perfected Covenant of Wisdom grants a personal tenet slot, learning per Devotion level, lifestyle experience, monthly Piety mult per knight, knight effectiveness per learning, and eliminates cultural friction."

  dynasty_blood_ancient_modifier_1: "Covenant of the Ancient (Minor)"
  dynasty_blood_ancient_modifier_1_desc: "Tier I (Minor): Blood magic grants monthly Piety, health, life expectancy, fertility, and genetic potential across your house."
  dynasty_blood_ancient_modifier_2: "Covenant of the Ancient (Major)"
  dynasty_blood_ancient_modifier_2_desc: "Tier II (Major): Blood magic strengthens genetic potential, health, life expectancy, and wards against inbreeding."
  dynasty_blood_ancient_modifier_3: "Covenant of the Ancient (Superior)"
  dynasty_blood_ancient_modifier_3_desc: "Tier III (Superior): The perfected Covenant of the Ancient bestows prowess per Devotion level, genetic perfection, monthly lifestyle XP, and severe inbreeding reduction."

  dynasty_blood_acolyte_modifier: "Covenant of Initiation"
  dynasty_blood_acolyte_modifier_desc: "Blood magic grants +1 monthly Piety across your house and allows uninitiated house members of Devotion Level 3 or higher to become Blood Mage Acolytes."

