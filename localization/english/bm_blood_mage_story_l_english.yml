 bm_blood_mage_story:0 "Blood Magic"
 bm_blood_mage_story_desc:0 "Your blood is both grimoire and crucible. Every rite deepens one discipline of the blood art."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "[GetPlayer.Custom('BM_BLOOD_MAGIC_DISCIPLINE_GRID')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_BLOOD_RUNE_DISPLAY')]   [GetPlayer.Custom('BM_BLOOD_MAGE_STAVE_DISPLAY')]\n\n#help Each discipline reaches mastery at 100 experience. Hover over a discipline for its advancement rules.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_BLOOD_KNIGHT_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_vanguard_desc @bm_vanguard_discipline_icon! $trait_track_vanguard$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_vanguard_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_benediction_xp_value')|0]/100#!   #tooltip:trait_track_slaughter_desc @bm_slaughter_discipline_icon! $trait_track_slaughter$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_slaughter_xp_value')|0]/100#!#!"
