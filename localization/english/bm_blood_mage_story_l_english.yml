l_english:
 bm_blood_mage_story:0 "Blood Magic"
 bm_blood_mage_story_desc:0 "Your blood is both grimoire and crucible. Every rite deepens one discipline of the blood art."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_BLOOD_RUNE_DISPLAY')]\n\n#help Each discipline reaches mastery at 100 experience. Hover over a discipline for its advancement rules.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Blood Golems"
 BM_BLOOD_RETINUE:0 "Blood Knights and Champions"
 BM_DYNASTY_BLOOD_MAGES:0 "Dynasty Blood Mages"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Refresh the Blood Golems, Blood Retinue, and Dynasty Blood Mages currently recorded in your story"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Refresh the character rosters shown in this story panel"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "None"
 bm_blood_mage_lifeforce_major:0 "Lifeforce: #P Major reserve#!"
 bm_blood_mage_lifeforce_minor:0 "Lifeforce: #V Minor reserve#!"
 bm_blood_mage_lifeforce_negative_major:0 "Lifeforce: #N Gravely depleted#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Lifeforce: #N Depleted#!"
 bm_blood_mage_lifeforce_none:0 "Lifeforce: #weak Unmanifested#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Lifeforce stacks#! — #P Superior#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_superior_stacks').GetValue|0]#!    #P Major#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Minor#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Lifeforce#!\nMinor, Major, and Superior Lifeforce are separate, stackable reserves harvested or distilled through blood rites. Superior Lifeforce is manifested by condensing Minor and Major reserves. Blood Magic abilities state which reserve they consume; casting normally removes the required stack and may temporarily deplete your Lifeforce.\n\nWhile unspent, every stack improves health, fertility, lifespan, disease resistance, and prowess. Superior Lifeforce grants apex physical reinforcement twice as potent as a Major stack."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Ancient#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Enlightenment#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Bloodline#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Benediction#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Hematurgy#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #weak None#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Lifeforce Attunement#!\nSpend one Minor Lifeforce and 25 Piety through the #V Lifeforce Attunement#! decision to choose one Blood Magic discipline. You can maintain only one Attunement; choosing another replaces the current one.\n\nEach year, the attuned discipline has a 50% chance to gain #P 1 experience#!. Its Attunement modifier also grants a discipline-specific passive benefit."
 bm_blood_mage_blood_rune_superior:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_major:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_minor:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_none:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: #weak None#!"
 bm_blood_mage_blood_rune_tt:0 "#tooltip_heading Blood Runes#!\nBlood Runes are permanent arcane patterns etched directly into your flesh through blood rites. These living markings passively harvest ambient life energy each year, granting a chance to manifest Lifeforce reserves.\n\nHigher rune tiers yield larger and more frequent Lifeforce harvests, culminating in the Superior Blood Rune which acts as an apex conduit."
