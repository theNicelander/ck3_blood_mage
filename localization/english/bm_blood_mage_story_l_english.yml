 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Lifeforce stacks#! — #P Superior#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_superior_stacks').GetValue|0]#!    #P Major#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Minor#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!\n#weak Specialized:#! #V Radiant#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_radiant_stacks').GetValue|0]#!    #V Furious#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_furious_stacks').GetValue|0]#!    #V Fortunate#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_fortunate_stacks').GetValue|0]#!    #V Cunning#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_cunning_stacks').GetValue|0]#!    #V Wise#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_wise_stacks').GetValue|0]#!    #V Ancient#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_ancient_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Lifeforce#!\nMinor, Major, and Superior Lifeforce are separate, stackable survival reserves harvested or distilled through blood rites. Superior Lifeforce is manifested by condensing Minor and Major reserves. Specialized reservoirs allow transmuting standard reserves into dedicated passive and functional pools, each granting +5 monthly Lifestyle XP per stack:\n\n• #V Radiant Blood#!: General opinion, prestige, legitimacy, personal schemes, and Diplomacy XP.\n• #V Furious Blood#!: Prowess, knight effectiveness, counter efficiency, army speed, travel safety, and Martial XP.\n• #V Fortunate Blood#!: Monthly gold, income multiplier, lower MaA upkeep, and Stewardship XP.\n• #V Cunning Blood#!: Hostile scheme success, plot defense, dread, and Intrigue XP.\n• #V Wise Blood#!: Learning, stress resistance, lifestyle XP multiplier, and Learning XP.\n• #V Ancient Blood#!: Fertility, fertile lifespan, hereditary trait inheritance, inbreeding reduction, and active Lifestyle XP.\n\nWhile unspent, standard reserves improve health, lifespan, disease resistance, and negate health penalties."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Ancient#!"
 bm_blood_mage_attunement_wisdom:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Wisdom#!"
 bm_blood_mage_attunement_fortune:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Fortune#!"
 bm_blood_mage_attunement_radiance:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Radiance#!"
 bm_blood_mage_attunement_cunning:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Cunning#!"
 bm_blood_mage_attunement_fury:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #V Fury#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Attunement#!: #weak None#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Lifeforce Attunement#!\nAttune your Blood Magic to one discipline through the #V Cast Minor Blood Magic#! decision. Attuning costs [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] and #V 50#! Piety with a #V 1-year cooldown#!. You can maintain only one Attunement; choosing another replaces the current one.\n\nEach year, the attuned discipline is guaranteed to gain #P 1 experience#! (#P 2#! with Superior Hulinhjálmur). Its Attunement modifier also grants a discipline-specific passive benefit."
 bm_blood_mage_blood_rune_superior:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_major:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_minor:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_none:0 "#tooltip:bm_blood_mage_blood_rune_tt Blood Rune#!: #weak None#!"
 bm_blood_mage_blood_rune_tt:0 "#tooltip_heading Blood Runes#!\nBlood Runes are permanent arcane patterns etched directly into your flesh through blood rites. These living markings allow you to passively harvest Lifeforce from the world around you each year.\n\nHigher rune tiers yield larger and more frequent Lifeforce harvests, culminating in the Superior Blood Rune which acts as an apex conduit."
 bm_stave_display_vegvisir:0 "#tooltip:bm_stave_vegvisir_desc Stave#!: #V Vegvísir#!"
 bm_stave_display_aegishjalmur:0 "#tooltip:bm_stave_aegishjalmur_desc Stave#!: #V Ægishjálmur#!"
 bm_stave_display_feingur:0 "#tooltip:bm_stave_feingur_desc Stave#!: #V Feingur#!"
