l_english:
  bm_bleed_own_vein_interaction: "Bleed Own Veins"
  bm_bleed_own_vein_interaction_desc: "Cut into your own flesh and draw forth living blood to crystallize into Lifeforce."
  bm_bleed_own_vein_interaction_requirement_tt: "You must not be severely wounded or maimed."
  bm_bleed_own_vein_interaction.minor_bleed: "Minor Exsanguination"
  bm_bleed_own_vein_interaction.minor_bleed_desc: "Open a minor vein to condense a Minor Lifeforce, suffering a light wound."
  bm_bleed_own_vein_interaction.minor_bleed.toast: "Minor Exsanguination Performed"
  bm_bleed_own_vein_interaction.major_bleed: "Major Exsanguination"
  bm_bleed_own_vein_interaction.major_bleed_desc: "Deeply open your veins to condense a Major Lifeforce, suffering a severe wound, stress, and drained vitality."
  bm_bleed_own_vein_interaction.major_bleed.toast: "Major Exsanguination Performed"

  bm_purge_coping_traits_interaction: "Purge Stress Vices"
  bm_purge_coping_traits_interaction_desc: "Channel concentrated Lifeforce through the mind and bloodstream to scorch away coping vices and quiet the spirit."
  bm_purge_coping_traits_interaction.toast: "Stress Vices Purged"
