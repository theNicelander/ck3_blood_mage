l_russian:
  bm_blessed_blood_sovereign_modifier:0 "Кровь государя"
  bm_blessed_blood_sovereign_modifier_desc:0 "Кровь этого правителя освящена для владычества и управления, укрепляя его державу."
  bm_blessed_blood_iron_modifier:0 "Железная кровь"
  bm_blessed_blood_iron_modifier_desc:0 "Кровь этого воина наполнена боевой яростью, укрепляющей тело и воодушевляющей рыцарей."
  bm_blessed_blood_crucible_modifier:0 "Кровавый тигель"
  bm_blessed_blood_crucible_modifier_desc:0 "Чистая жизненная сила укрепляет родословную, даруя крепкое телосложение и сильные наследственные свойства."
  bm_anointed_heir_modifier:0 "Помазан кровью"
  bm_anointed_heir_modifier_desc:0 "Избранный священный преемник кровной родословной. После смерти предшественника наследует его магическое наследие и сгущённую жизненную силу."
  bm_bless_bloodline_interaction.bless_sovereign:0 "Кровь государя"
  bm_bless_bloodline_interaction.bless_sovereign_desc:0 "Даёт #P +2#! дипломатии, #P +2#! управления, #P +10#! мнения вассалов, #P -20%#! длительности короткого правления и #P +0.25#! здоровья на 10 лет."
  bm_bless_bloodline_interaction.bless_iron:0 "Железная кровь"
  bm_bless_bloodline_interaction.bless_iron_desc:0 "Даёт #P +2#! военного дела, #P +4#! доблести, #P +15%#! эффективности рыцарей и #P +0.50#! здоровья на 10 лет."
  bm_bless_bloodline_interaction.bless_crucible:0 "Кровавый тигель"
  bm_bless_bloodline_interaction.bless_crucible_desc:0 "Даёт #P +25%#! плодовитости, #P +15%#! шанса положительной наследственности, #P -20%#! прироста стресса и #P +0.50#! здоровья на 10 лет."
  bm_anoint_heir_interaction:0 "Помазать наследника кровью"
  bm_anoint_heir_interaction_desc:0 "Освятить избранного наследника или ребёнка большой порцией сгущённой жизненной силы, назначив его преемником вашего наследия крови после вашей смерти."
  bm_anoint_heir_toast:0 "Наследник помазан кровью"
  bm_recipient_already_anointed_heir:0 "Цель уже является помазанным наследником"
  NOT_bm_recipient_already_anointed_heir:0 "Цель уже является помазанным наследником"
  bm_demand_blood_tithe_interaction:0 "Потребовать десятину крови"
  bm_demand_blood_tithe_interaction_desc:0 "Воспользоваться властью главы дома, чтобы извлечь жизненную силу из взрослого родича и пополнить свои магические запасы."
  bm_demand_blood_tithe_toast:0 "Десятина крови собрана"
  bm_recipient_recently_lifedrained:0 "У цели недавно вытянута жизненная сила"
  NOT_bm_recipient_recently_lifedrained:0 "У цели недавно вытянута жизненная сила"
