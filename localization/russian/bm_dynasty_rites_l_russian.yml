l_russian:
  # Modifiers
  bm_blessed_blood_sovereign_modifier: "Кровь государя"
  bm_blessed_blood_sovereign_modifier_desc: "Кровь этого правителя освящена для владычества и управления, укрепляя его державу."
  bm_blessed_blood_iron_modifier: "Железная кровь"
  bm_blessed_blood_iron_modifier_desc: "Кровь этого воина наполнена боевой яростью, укрепляющей тело и воодушевляющей рыцарей."
  bm_blessed_blood_crucible_modifier: "Кровавый тигель"
  bm_blessed_blood_crucible_modifier_desc: "Чистая жизненная сила укрепляет родословную, даруя крепкое телосложение и сильные наследственные свойства."
  bm_anointed_heir_modifier: "Помазан кровью"
  bm_anointed_heir_modifier_desc: "Избранный священный преемник кровной родословной. После смерти предшественника наследует его магическое наследие и сгущённую жизненную силу."

  # Bless Bloodline Options
  bm_bless_bloodline_interaction.bless_sovereign: "Кровь государя"
  bm_bless_bloodline_interaction.bless_sovereign_desc: "Даёт #P +2#! дипломатии, #P +2#! управления, #P +10#! мнения вассалов, #P -25%#! длительности короткого правления и #P +1.0#! здоровья на 10 лет."
  bm_bless_bloodline_interaction.bless_iron: "Железная кровь"
  bm_bless_bloodline_interaction.bless_iron_desc: "Даёт #P +2#! военного дела, #P +4#! доблести, #P +25%#! эффективности рыцарей, #P +1.0#! здоровья и #P +0.50#! компенсации штрафов к здоровью на 10 лет."
  bm_bless_bloodline_interaction.bless_crucible: "Кровавый тигель"
  bm_bless_bloodline_interaction.bless_crucible_desc: "Даёт #P +25%#! к шансу наследования положительных врождённых свойств, #P -25%#! к приросту стресса и #P +1,0#! к здоровью на 10 лет."
  bm_bless_bloodline_interaction.bless_feingur: "Вечное благословение Фейнгюра"
  bm_bless_bloodline_interaction.bless_feingur_desc: "Призвать ваш высший Фейнгюр, чтобы начертать постоянное благословение, дающее #P +25%#! плодовитости, #P +20%#! шанса положительной наследственности, #P +0.50#! здоровья и #P +5#! лет ожидаемой продолжительности жизни."

  # Anoint Heir Interaction
  bm_anoint_heir_interaction: "Помазать наследника кровью"
  bm_anoint_heir_interaction_desc: "Освятить избранного наследника или ребёнка большой порцией сгущённой жизненной силы, назначив его преемником вашего наследия крови после вашей смерти."
  bm_anoint_heir_toast: "Наследник помазан кровью"
  bm_recipient_already_anointed_heir: "Цель уже является помазанным наследником"
  NOT_bm_recipient_already_anointed_heir: "Цель уже является помазанным наследником"

  # Blood Tithe Interaction
  bm_demand_blood_tithe_interaction: "Потребовать десятину крови"
  bm_demand_blood_tithe_interaction_desc: "Воспользоваться властью главы дома, чтобы извлечь жизненную силу из взрослого родича и пополнить свои магические запасы."
  bm_demand_blood_tithe_toast: "Десятина крови собрана"
  bm_recipient_recently_lifedrained: "У цели недавно вытянута жизненная сила"
  NOT_bm_recipient_recently_lifedrained: "У цели недавно вытянута жизненная сила"
