l_russian:
  # Modifier
  bm_consecrated_union_modifier: "Освящённый союз"
  bm_consecrated_union_modifier_desc: "Обряд крови освятил этот союз и повысил вероятность передачи положительных наследственных свойств."

  # Interaction
  bm_consecrate_union_interaction: "Освятить союз"
  bm_consecrate_union_interaction_desc: "Провести обряд крови над собой, супругом, наложником или любовником, чтобы укрепить союз жизненной силой и улучшить наследование врождённых свойств."
  bm_consecrate_union_interaction_requirement: "У вас должна быть хотя бы 1 порция малой или большой жизненной силы."
  NOT_bm_consecrate_union_interaction_requirement: "У вас должна быть хотя бы 1 порция малой или большой жизненной силы."
  bm_consecrated_union_already_consecrated: "[CHARACTER.GetShortUIName] уже состоит в освящённом союзе."
  NOT_bm_consecrated_union_already_consecrated: "[CHARACTER.GetShortUIName] уже состоит в освящённом союзе."
  bm_consecrate_union_interaction.minor: "Малое освящение (3 года)"
  bm_consecrate_union_interaction.minor_desc: "Потратить 1 порцию малой жизненной силы, чтобы благословить союз на 3 года."
  bm_consecrate_union_interaction.major: "Большое освящение (10 лет)"
  bm_consecrate_union_interaction.major_desc: "Потратить 1 порцию большой жизненной силы, чтобы благословить союз на 10 лет."
  bm_consecrate_union_toast: "Обряд освящения союза"
