l_russian:
  # Blood mage
  bm_trait_drain.001.title: "Сбор сущности"
  bm_trait_drain.001.desc: "Пленник стоит перед вами на коленях, в широко раскрытых глазах — ужас, а на полу покоев вспыхивают багровые руны. Мольбы о пощаде затихают до шёпота, когда вы приближаетесь, выводя пальцами тайные узоры в воздухе. Вы ощущаете то, что делает пленника особенным: искру ума, физическую мощь, необычайную красоту — всё это пульсирует под кожей, словно маяк, зовущий вашу силу.\n\nМагия крови требует жертвы, и эти уникальные дары скоро станут вашими. Воздух сгущается от ожидания, пока нити вашего сознания тянутся вперёд, готовясь извлечь желаемое. Дрожащие губы выговаривают отчаянные слова:\n\n«Пожалуйста... что угодно, только не это...»\n\nНо вам виднее. Эта сущность послужит вам гораздо лучше, чем могла бы послужить плоть."

  bm_trait_drain.001.z: "Отпустить пленника..."
  bm_trait_drain.001.b: "Этот ум пригодился бы мне"
  bm_trait_drain.001.c: "Мне не помешало бы больше силы..."
  bm_trait_drain.001.d: "Какая красота... Почему бы и мне не выглядеть так же?"
  bm_trait_drain.001.e: "Прекрасно"
  bm_trait_drain.001.f: "Какой высокий человек. Интересно, какая там, наверху, погода..."
  bm_trait_drain.001.g: "Эта кровь весьма вкусна..."
  bm_trait_drain.001.h: "Такая сила мне бы пригодилась."
  bm_trait_drain.001.fail: "Мне не удалось поглотить свойство"
  bm_trait_drain.001.success: "Я поглощаю свойство"
  bm_trait_drain.001.nice: "Прекрасно"
