l_russian:
 bm_trait_drain.001.b: "Этот острый ум мне пригодится."
 bm_trait_drain.001.c: "Я могу стать сильнее..."
 bm_trait_drain.001.d: "Какая красота... Почему бы мне не забрать её себе?"
 bm_trait_drain.001.desc: "Пленник стоит перед вами на коленях, и в его широко раскрытых глазах застыл ужас, пока на полу покоев вспыхивают багровые руны. Мольбы о пощаде стихают до шёпота, когда вы приближаетесь, выводя пальцами тайные знаки в воздухе. Вы чувствуете всё, что делает его особенным: искру разума, телесную силу, необыкновенную красоту. Эти дары пульсируют под кожей, словно маяк, взывающий к вашей власти.\n\nМагия крови требует жертвы, и скоро его уникальные дары станут вашими. Воздух густеет от предвкушения, а нити вашего сознания тянутся к пленнику, готовясь вырвать желаемое. Его губы дрожат, складываясь в отчаянные слова:\n\n«Прошу... что угодно, только не это...»\n\nНо вы знаете лучше. Его сущность послужит вам куда вернее, чем когда-либо могла бы его плоть."
 bm_trait_drain.001.e: "Превосходно."
 bm_trait_drain.001.f: "Какой рост... Интересно, как выглядит мир с такой высоты?"
 bm_trait_drain.001.fail: "Мне не удаётся похитить его дар"
 bm_trait_drain.001.g: "Его кровь восхитительна..."
 bm_trait_drain.001.h: "Такая сила мне пригодится."
 bm_trait_drain.001.nice: "Превосходно."
 bm_trait_drain.001.success: "Я похищаю его дар"
 bm_trait_drain.001.title: "Урожай эссенции" #deepl:83850483
 bm_trait_drain.001.z: "Отпустите их..." #deepl:3514667144
