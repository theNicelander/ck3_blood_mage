  seek_power.duel.knight_crit_win:0 "Сокрушительная победа в кровопролитном бою"
  seek_power.toast.join_knight:0 "[escort_knight.GetFirstNameNoTooltip] присоединяется ко мне"
  seek_power.toast.knight_crit_win:0 "[recipient.GetFirstNameNoTooltip] полностью повержен; могучая жизненная сила добыта"
  seek_power_decision_effect_tooltip:0 "Выйти в дикие земли, где ждут неведомые опасности и добыча."
  seek_power.008.title:0 "Звериное логово"
  seek_power.009.title:0 "На опушке леса"
  seek_power.010.title:0 "Кровь в углях"
  seek_power.011.title:0 "Багровый обряд"
  seek_power.008.desc:0 "След свежей крови приводит в тёмную пещеру, усеянную костями. Чудовищный медведь в боевых шрамах рычит над только что убитой добычей. Глаза горят дикой яростью, когда он встаёт на задние лапы, защищая пиршество."
  seek_power.009.desc:0 "Когда над лесом сгущаются сумерки, охота приводит вас к уединённому дому дровосека на опушке. В вечернем воздухе слабо пахнет смертной кровью и тёплым дымом очага."
  seek_power.010.desc:0 "Следуя за дымом в укромную ложбину, вы натыкаетесь на грубый лагерь вооружённых разбойников и браконьеров, делящих добычу у догорающего костра."
  seek_power.011.desc:0 "В глубине залитой лунным светом поляны одинокий оккультист поёт над каменной чашей, полной свежедобытой крови. Тёмное заклинание поглотило его настолько, что он ещё не заметил вашего приближения."
  seek_power.003.c.learning_trigger_tt:0 "Ваша [learning|E] выше, чем у персонажа [recipient.GetFirstNameNoTooltip]"
  seek_power.003.recruit_knight.prowess_trigger_tt:0 "Ваша [prowess|E] выше, чем у персонажа [escort_knight.GetFirstNameNoTooltip]"
  seek_power.008.a:0 "Убить могучего зверя в его логове"
