  seek_power.001.title: "Кровавая охота"
  seek_power.002.title: "Последний бой оленя"
  seek_power.003.title: "Клинки на безлюдной дороге"
  seek_power.004.title: "Каирн забытой бойни"
  seek_power.006.title: "Столкновение крови и стали"
  seek_power.008.title: "Звериное логово"
  seek_power.009.title: "На опушке леса"
