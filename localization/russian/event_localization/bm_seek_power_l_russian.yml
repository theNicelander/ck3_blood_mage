  seek_power.011.title: "Обряд крови"

  # Event Descriptions
  seek_power.001.desc: "Вы едете к диким окраинам своих земель, следуя запаху свежей крови."
  seek_power.002.desc: "После неустанной погони сквозь густые заросли вы загоняете огромного царственного оленя на морозную поляну. Опустив окровавленные рога, зверь бросается вперёд — но одним решительным ударом ваш клинок глубоко входит в его горло. От тёплой крови поднимается пар на холоде, пока вы забираете жизненную силу."
  seek_power.003.desc: "На глухой лесной тропе вы перехватываете одинокого странствующего воина — [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]). Сталь звенит, когда вы преграждаете путь. В его жилах кипит горячая кровь, которую можно пролить в жестоком поединке, забрать в смертельном бою — либо привлечь самого воина под ваши знамёна."
  seek_power.003.desc_escort: "На глухой лесной тропе вы перехватываете персонажа [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]) в сопровождении присягнувшего чемпиона [escort_knight.GetUIName] ([escort_knight.GetProwess] [prowess|E]). Рыцарь сразу выступает вперёд, положив руку на навершие оружия; взгляд остаётся зорким, как у бывалого воина.\n\n[recipient.GetFirstNameNoTooltip] сулит яростный бой до первой крови или возможность убеждения, а [escort_knight.GetFirstNameNoTooltip] излучает могучую жизненную силу опытного бойца."
  seek_power.004.desc: "В глубине диких земель запах меди приводит вас на древнее поле боя, заросшее мхом и увенчанное обветренным жертвенным каирном. Ржавые клинки усеяли землю вокруг чаши из тёмного камня, где всё ещё стоит густая первозданная кровь — нетронутая веками и гудящая древней мощью."
  seek_power.006.desc_victory: "Последним сокрушительным ударом вы пробиваете защиту противника, и тот падает на одно колено в залитый кровью кустарник. Грудь тяжело вздымается от изнеможения, от капель крови поднимается пар в холодном лесном воздухе. Вы стоите над поверженным врагом с поднятым клинком, чувствуя, как могучая жизненная сила воина отзывается вашим обрядам крови. Победа позволяет собрать её — или связать побеждённого службой."
  seek_power.006.desc_slain: "Дикий лес затихает, когда противник падает среди окровавленных папоротников, а последний выдох клубится в холодном воздухе. Могучая сущность достойного воина уже течёт по вашим венам, питая ваше воинское возвышение."
  seek_power.006.desc_defeat: "Сталь противника оказывается слишком быстрой и неумолимой. [Select_CString(ROOT.Char.IsFemale, 'Избитая и окровавленная', 'Избитый и окровавленный')], вы отступаете под натиском. Остаётся лишь прервать столкновение и скрыться в густом лесном тумане, пока раны не стали смертельными."
  seek_power.008.desc: "След свежей крови приводит в тёмную пещеру, усеянную костями. Чудовищный медведь в боевых шрамах рычит над только что убитой добычей. Глаза горят дикой яростью, когда он встаёт на задние лапы, защищая пиршество."
  seek_power.009.desc: "Когда над лесом сгущаются сумерки, охота приводит вас к уединённому дому дровосека на опушке. В вечернем воздухе слабо пахнет смертной кровью и тёплым дымом очага."
  seek_power.010.desc: "Следуя за дымом в укромную ложбину, вы натыкаетесь на грубый лагерь вооружённых разбойников и браконьеров, делящих добычу у догорающего костра."
  seek_power.011.desc: "В глубине залитой лунным светом поляны одинокий оккультист поёт над каменной чашей, полной свежедобытой крови. Тёмное заклинание поглотило его настолько, что он ещё не заметил вашего приближения."

