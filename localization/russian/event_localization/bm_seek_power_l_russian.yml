  seek_power_decision_desc: "Отправиться в необузданные дикие земли, выследить достойную добычу и испытать свой клинок. Убийство зверей, встречи со странствующими воинами и следы древних побоищ принесут жизненную силу для обрядов крови."
  seek_power_decision_confirm: "Начать охоту"
  seek_power_decision_tooltip: "Отправиться на кровавую охоту, чтобы добыть жизненную силу и развить направления."
  seek_power_decision_effect_tooltip: "Выйти в дикие земли, где ждут неведомые опасности и добыча."

