  # Event Titles
  seek_power.001.title:0 "Кровавая охота"
  seek_power.002.title:0 "Последний бой оленя"
  seek_power.003.title:0 "Клинки на безлюдной дороге"
  seek_power.004.title:0 "Каирн забытой бойни"

  # Event Descriptions
  seek_power.001.desc:0 "Вы едете к диким окраинам своих земель, следуя запаху свежей крови."
  seek_power.002.desc:0 "После неустанной погони сквозь густые заросли вы загоняете огромного царственного оленя на морозную поляну. Опустив окровавленные рога, зверь бросается вперёд — но одним решительным ударом ваш клинок глубоко входит в его горло. Тёплая багровая кровь парит на холоде, пока вы забираете жизненную силу."
  seek_power.003.desc:0 "На глухой лесной тропе вы перехватываете одинокого странствующего воина — [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]). Сталь звенит, когда вы преграждаете путь. В его жилах кипит горячая кровь, которую можно пролить в жестоком поединке, забрать в смертельном бою — либо привлечь самого воина под ваши знамёна."
  seek_power.004.desc:0 "В глубине диких земель запах меди приводит вас на древнее поле боя, заросшее мхом и увенчанное обветренным жертвенным каирном. Ржавые клинки усеяли землю вокруг чаши из тёмного камня, где всё ещё стоит густая первозданная кровь — нетронутая веками и гудящая древней мощью."

  # Options
  seek_power.001.a:0 "Начать охоту"
  seek_power.002.a:0 "Зарезать зверя и забрать кровь"
