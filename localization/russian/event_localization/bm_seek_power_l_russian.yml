  # Event Descriptions
  seek_power.001.desc:0 "Дикие земли за пределами поселения пульсируют жизненной энергией. Древние деревья тянутся к небу, а их корни впитывают силу почвы, обогащённой бесчисленными кругами смерти и возрождения. Углубляясь во владения природы, вы чувствуете, как первобытная сила магии крови крепнет, влекущая вас к жертвам, способным утолить магический голод."
  seek_power.002.desc:0 "Охота приводит вас к великолепному оленю, чьё дыхание превращается в облачка пара в холодном воздухе. Гордый зверь не замечает вашего приближения, пока вы готовите ритуал. Магия крови не требует ни лука, ни клинка — лишь вашей воли и древних слов силы. Начиная заклинание, вы ощущаете связь между собственной сущностью и жизненной силой животного."
  seek_power.003.desc:0 "В глубине диких земель, далеко от троп, вы встречаете одинокую фигуру. Путник в лохмотьях дрожит от холода; кажется, он потерял дорогу несколько дней назад. Истощённый и ослабший, он смотрит на вас с надеждой и страхом. Несмотря на его жалкий вид, вы ощущаете ценность, которую другие бы не заметили: жизненную сущность, готовую к присвоению... или возможность проявить милосердие с помощью тайных даров."
  seek_power.004.desc:0 "В глубине древнего леса, где солнечные лучи редко проникают сквозь густые кроны, вы обнаруживаете чудо природы — исполинский дуб, не похожий ни на одно виденное дерево. Ствол шириной с крепостную стену заметно пульсирует. На коре вырезаны древние руны, смысл которых утрачен во времени.\n\nВы кладёте руку на поверхность — она тёплая, словно плоть. Вас тянет сделать небольшой надрез, и, к вашему изумлению, из коры свободно течёт багровый сок, видом и запахом неотличимый от крови. Это не просто сок: за столетия древний страж поглотил сущность тысяч существ и стал средоточием чистой жизненной энергии.\n\nКогда пальцы касаются багровой жидкости, разум наполняют видения: древние звери, забытые цивилизации, тайны, погребённые временем. Это дерево видело всё; его корни уходят глубоко в самое сердце мира. Такая сила могла бы безмерно питать вашу магию, но чрезмерная жадность способна разгневать первозданную силу, поддерживающую это чудо."

