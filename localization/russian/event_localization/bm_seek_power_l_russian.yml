  seek_power.toast.knight_win:0 "[recipient.GetFirstNameNoTooltip] побеждён в драке; жизненная кровь добыта"
  seek_power.toast.knight_spar:0 "Обмен ударами закалил боевые инстинкты"
  seek_power.toast.ancient_lifeforce:0 "Древняя жизненная сила собрана"
  seek_power.006.title:0 "Столкновение крови и стали"
  seek_power.003.desc_escort:0 "В глубине диких земель, вдали от проторённых троп, вы замечаете две фигуры, пробирающиеся сквозь туман: [recipient.GetUIName] ([recipient.GetProwess] [prowess|E]) — представитель знати, явно сбившийся с пути, и неотступный присягнувший рыцарь [escort_knight.GetUIName] ([escort_knight.GetProwess] [prowess|E]). При вашем приближении рыцарь сразу выступает вперёд, положив руку на навершие оружия; взгляд остаётся зорким, как у бывалого воина.\n\nВы чувствуете различие в их жизненной сущности: [recipient.GetFirstNameNoTooltip] сулит лёгкую драку или возможность придворного убеждения, а [escort_knight.GetFirstNameNoTooltip] излучает яростную, могучую жизненную силу истинного воина."
  seek_power.006.desc_victory:0 "Последним сокрушительным ударом вы пробиваете защиту противника, и тот падает на одно колено в залитый кровью кустарник. Грудь тяжело вздымается от изнеможения, багровые капли парят в холодном лесном воздухе. Вы стоите над поверженным врагом с поднятым клинком, чувствуя, как могучая жизненная сила воина отзывается вашим обрядам крови. Победа позволяет собрать её — или связать побеждённого службой."
  seek_power.006.desc_slain:0 "Дикий лес затихает, когда противник падает в обагрённые папоротники, а последний выдох клубится в холодном воздухе. Могучая сущность достойного воина уже течёт по вашим венам, питая ваше воинское возвышение."
  seek_power.006.desc_defeat:0 "Сталь противника оказывается слишком быстрой и неумолимой. Избитый и окровавленный, вы отступаете под натиском. Остаётся лишь прервать столкновение и скрыться в густом лесном тумане, пока раны не стали смертельными."
  seek_power.003.recruit_knight:0 "Убедить персонажа [escort_knight.GetFirstNameNoTooltip] поступить ко мне на службу"
  seek_power.003.battlefield_duel_escort:0 "Вызвать персонажа [escort_knight.GetFirstNameNoTooltip] на боевой поединок!"
  seek_power.003.battlefield_duel_solo:0 "Вызвать персонажа [recipient.GetFirstNameNoTooltip] на боевой поединок!"
  seek_power.003.battlefield_duel_tt:0 "Вступить в #V единоборство#! (#N возможны ранения#!). Победа позволяет добыть [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], получить #P +5#! опыта #V Бойни#! и с вероятностью #V 25%#! обрести [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] — либо принять побеждённого воина ко двору."
  seek_power.006.a:0 "Торжествуя, собрать жизненную силу поверженного!"
  seek_power.006.spare:0 "Почтить его клинок — пригласить ко двору"
  seek_power.006.slain:0 "Славное столкновение крови и стали!"
  seek_power.006.defeat:0 "Зализать раны и отступить в дикие земли..."
  seek_power.duel.join_knight:0 "Рыцарь присягает моему двору"
  seek_power.duel.separate_knight:0 "Связанный клятвой рыцарь отказывается"
  seek_power.duel.knight_crit_win:0 "Сокрушительная победа в драке"
  seek_power.toast.join_knight:0 "[escort_knight.GetFirstNameNoTooltip] поступает ко мне на службу"
