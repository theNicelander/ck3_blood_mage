  bm_compat_memory_drain.0001.title: "Память крови: знания иных миров и модификаций"
  bm_compat_memory_drain.0001.desc: "[recipient.GetShortUINameNoTooltip] хранит в крови редкие воинские, магические или придворные навыки. Выберите, какую традицию извлечь из крови персонажа."
  bm_compat_memory_drain.0001.agot: "Поглотить знания Вестероса"
  bm_compat_memory_drain.0001.lotr: "Поглотить знания Средиземья"
  bm_compat_memory_drain.0001.ek2: "Поглотить знания Тамриэля"
  bm_compat_memory_drain.0001.commander_plus: "Поглотить расширенную тактику командиров"

  bm_compat_memory_drain.0002.title: "Память крови: знания Вестероса"
  bm_compat_memory_drain.0002.desc: "Извлечь закалённое морской солью искусство мореходства или одержимость пиромантией прямо из крови персонажа [recipient.GetShortUINamePossessiveNoTooltip]."
  bm_compat_memory_drain.0003.title: "Память крови: знания Средиземья"
  bm_compat_memory_drain.0003.desc: "Извлечь древние ремёсла, познания глубин или боевое мастерство из крови персонажа [recipient.GetShortUINamePossessiveNoTooltip]."
  bm_compat_memory_drain.0004.title: "Память крови: знания Тамриэля"
  bm_compat_memory_drain.0004.desc: "Извлечь навыки боевой магии или хитрость преступного мира из крови персонажа [recipient.GetShortUINamePossessiveNoTooltip]."
  bm_compat_memory_drain.0005.title: "Память крови: расширенная тактика командиров"
  bm_compat_memory_drain.0005.desc: "Извлечь специализированную боевую доктрину из крови персонажа [recipient.GetShortUINamePossessiveNoTooltip]."

