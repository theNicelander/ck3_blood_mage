l_russian:
  bm_blood_knight_elevation.0001.t:0 "Восхождение рыцаря крови"
  bm_blood_knight_elevation.0001.desc:0 "Ваши вены пульсируют багровой мощью рыцаря крови, но до сих пор вы были лишь смертным оружием, наполненным необузданной воинской силой. Чтобы открыть глубинные тайны магии крови и возвыситься до истинного мага крови, вы должны расширить разум, овладеть потоками жизненной силы и связать древнюю магию со своей душой."
  bm_blood_knight_elevation.0001.a_learning:0 "Пробудить древнюю магию через священную медитацию"
  bm_blood_knight_elevation.0001.b_prowess:0 "Добиться преображения одной лишь воинской волей"
  bm_blood_knight_elevation.0001.c_cancel:0 "Отступить: моя оболочка ещё не готова"

  bm_blood_knight_elevation.success_tt:0 "Успешно возвыситься и пробудиться магом крови"
  bm_blood_knight_elevation.failure_tt:0 "Ритуал срывается, раня и истощая вас"
  bm_blood_knight_elevation.success_toast:0 "Вы стали магом крови!"
  bm_blood_knight_elevation.failure_toast:0 "Преображение не удалось!"
