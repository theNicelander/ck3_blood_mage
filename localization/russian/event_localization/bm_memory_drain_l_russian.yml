l_russian:
  bm_memory_drain.0001.title: "Сбор памяти крови"
  bm_memory_drain.0001.desc: "Скованный железом и рунами крови персонаж [recipient.GetShortUINameNoTooltip] хранит в венах опыт всей жизни: мышечную память, боевые инстинкты и отточенные навыки, запечатлённые в самом пульсе.\n\nВ отличие от плоти, эту память не нужно уничтожать, чтобы завладеть ею. Вы можете вобрать накопленное мастерство, но каждое умение, которое вы вливаете в собственную кровь, всё тяжелее давит на ваш разум."

  bm_memory_drain.0001.lifestyle: "Поглотить опыт образа жизни и ремесла"
  bm_memory_drain.0001.commander: "Поглотить тактику командира"
  bm_memory_drain.0001.fame: "Поглотить воинскую славу"
  bm_memory_drain.0001.compat: "Поглотить знания иных миров и модификаций"

  bm_memory_drain.0002.title: "Память крови: образ жизни и ремесло"
  bm_memory_drain.0002.desc: "Вы различаете незримые следы освоенных персонажем [recipient.GetShortUINameNoTooltip] искусств: каждый шрам с тренировочного двора, долгие часы над травами и стихами, странствия по диким тропам. Выберите ремесло, которое извлечёте из крови."

  bm_memory_drain.0003.title: "Память крови: тактика командира"
  bm_memory_drain.0003.desc: "В ровном пульсе персонажа [recipient.GetShortUINameNoTooltip] слышатся долгие марши, прорывы флангов и покорённые земли. Выберите тактический инстинкт, который извлечёте из крови."

  bm_memory_drain.0004.title: "Память крови: воинская слава"
  bm_memory_drain.0004.desc: "Неукротимая ярость и заслуженная слава пылают в венах персонажа [recipient.GetShortUINameNoTooltip]. Выберите воинское отличие, которое извлечёте из крови."

  bm_memory_drain.back: "Назад"

  bm_memory_drain.success: "@bm_ancient_discipline_icon! Память крови поглощена"
  bm_memory_drain.fail: "@bm_ancient_discipline_icon! Поглощению памяти крови оказано сопротивление"

  bm_can_drain_memory_from_target_trigger_tt: "У персонажа [CHARACTER.GetShortUINameNoTooltip] есть свойства образа жизни, командира или воинской славы, которые можно поглотить"
  NOT_bm_can_drain_memory_from_target_trigger_tt: "У персонажа [CHARACTER.GetShortUINameNoTooltip] #bold нет#! свойств образа жизни, командира или воинской славы, которые можно поглотить"

