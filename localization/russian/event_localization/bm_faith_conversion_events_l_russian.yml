l_russian:
  # Blood Faith Conversion Event
  bm_faith_conversion.0001.t:0 "Пути кровавой истины"
  bm_faith_conversion.0001.desc:0 "Когда жизненный поток пробуждается в вашей душе, догмы старого мира отступают, словно пустой шёпот. Сила крови требует преданности, но её священные истины обрели разные формы в разных землях и традициях:\n\nНа суровом севере и в западных святилищах #bold Блодтру#! провозглашает полную власть над жизненной сущностью, считая кровь высшей валютой абсолютного мастерства.\n\nСреди окутанных туманом вершин островов восходящего солнца #bold Кэцудо#! соединяет магию крови с духами предков и пульсирующей геомантией вулканической земли.\n\nНа имперских просторах Срединной равнины #bold Сюэдао#! видит в багровом потоке космическую квинтэссенцию, соединяющую Небо, Землю и смертные роды.\n\nКакому пути вы посвятите свою кровь?"
  bm_faith_conversion.0001.a:0 "Принять корни Блодтру (Европа)"
  bm_faith_conversion.0001.b:0 "Следовать пути Кэцудо (Япония)"
  bm_faith_conversion.0001.c:0 "Вступить на путь Сюэдао (Китай)"
  bm_faith_conversion.0001.d:0 "Я пока не готов выбирать путь."
