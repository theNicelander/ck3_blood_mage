l_russian:
  # Blood Faith Conversion Event
  bm_faith_conversion.0001.t: "Пути кровавой истины"
  bm_faith_conversion.0001.desc: "Когда жизненный поток пробуждается в вашей душе, догмы старого мира отступают, словно пустой шёпот. Сила крови требует преданности, но её священные истины обрели разные формы в разных землях и традициях:\n\nНа суровом севере и в западных святилищах #bold Блодтру#! провозглашает полную власть над жизненной сущностью, считая кровь высшей валютой абсолютного мастерства.\n\nСреди окутанных туманом вершин островов восходящего солнца #bold Кэцудо#! соединяет магию крови с духами предков и пульсирующей геомантией вулканической земли.\n\nНа имперских просторах Срединной равнины #bold Сюэдао#! видит в багровом потоке космическую квинтэссенцию, соединяющую Небо, Землю и смертные роды.\n\nКакому пути вы посвятите свою кровь?"
  bm_faith_conversion.0001.a: "Принять корни Блодтру (Европа)"
  bm_faith_conversion.0001.b: "Следовать пути Кэцудо (Япония)"
  bm_faith_conversion.0001.c: "Вступить на путь Сюэдао (Китай)"
  bm_faith_conversion.0001.unreformed: "Обратиться к древним нереформированным традициям…"
  bm_faith_conversion.0001.d: "Назад"

  # Ancient Unreformed Blood Faith Conversion Event
  bm_faith_conversion.0002.t: "Древние традиции крови"
  bm_faith_conversion.0002.desc: "Задолго до того, как учёные богословы сформулировали доктрины и установили порядок обрядов, первые последователи веры крови проводили свои ритуалы в диких землях. Эти древние традиции сохранили силу нереформированной веры. Их последователи по-прежнему могут ходить в набеги, приносить жертвы и черпать силу из земли.\n\nКакая древняя традиция взывает к вам?"
  bm_faith_conversion.0002.a: "Принять старое Блодтру"
  bm_faith_conversion.0002.b: "Последовать старому Кэцудо"
  bm_faith_conversion.0002.c: "Встать на путь старого Сюэдао"
  bm_faith_conversion.0002.d: "Назад"
