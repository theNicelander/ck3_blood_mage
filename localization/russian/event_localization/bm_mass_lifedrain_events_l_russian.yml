l_russian:
  # Death reason
  death_lifedrain_reason: "Вся жизненная сила была вытянута магом крови"

  # Mass lifedrain
  mass_lifedrain_prisoners_decision: "Собрать жизненную силу всех пленников"
  mass_lifedrain_prisoners_decision_desc: "Темницы полны пленников, чья жизненная сила пульсирует, словно спелые плоды, готовые к сбору. Их совокупная энергия может питать могущественную магию крови."
  mass_lifedrain_prisoners_decision_confirm: "Начать сбор"
  mass_lifedrain_prisoners_decision_tooltip: "Выбрать пленников для вытягивания жизненной силы, превращая их жизненную сущность в магическую энергию для себя."
  mass_lifedrain_prisoners_decision_effect_message: "Начать ритуал крови для сбора жизненной силы пленников и выбрать:\n$EFFECT_LIST_BULLET$Вытянуть силу всех пленников ради наибольшей выгоды\n$EFFECT_LIST_BULLET$Пощадить носителей ценных свойств для возможного использования в будущем"

  # Mass Lifedrain
  bm_mass_lifedrain.001: "Сбор урожая в темнице"
  bm_mass_lifedrain.001.title: "Кровавый урожай"
  bm_mass_lifedrain.001.desc: "Вы спускаетесь в сырые глубины темницы, ощущая пульсацию жизненной силы пленников сквозь каменные стены. Каждый пленник — необузданная сила, ожидающая присвоения: его сущность может стать магической энергией для ваших тайных трудов. Воздух сгущается от ожидания, пока вы готовите ритуал."

  # Options
  bm_mass_lifedrain.001.a: "ВЫТЯНУТЬ ЖИЗНЬ ИЗ ВСЕХ ДО ЕДИНОГО!"
  bm_mass_lifedrain_custom_tooltip_a: "Все пленники будут лишены жизненной силы; вы получите жизненную силу от каждого и опыт магии крови, но необоснованные казни могут увеличить тиранию."

  bm_mass_lifedrain.001.b: "Пощадить ценных. Остальные — лишь пища."
  bm_mass_lifedrain_custom_tooltip_b: "Пленники с ценными свойствами и близкие родственники будут пощажены. Жизненная сила всех остальных будет вытянута."

  bm_mass_lifedrain.001.z: "Возможно, в другой раз..."
  bm_mass_lifedrain_custom_tooltip_z: "Отменить ритуал. Пленники не пострадают, жизненная сила не будет получена."
