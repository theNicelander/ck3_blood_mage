l_russian:
  # Blood Mirror Ascension Duel
  bm_ascension_duel.0001.t: "Зеркало крови: поединок возвышения"
  bm_ascension_duel.0001.desc: "В кульминационный миг обряда по Зеркалу крови пробегает рябь. Ваше точное отражение проступает среди безлюдного, залитого кровью пространства, сотканного разумом. Чтобы выйти за пределы нынешней ступени и возвыситься, вы должны одолеть своё отражение в поединке."
  bm_ascension_duel.0001.opt: "Сразиться с отражением!"
  bm_ascension_duel.0001.opt.tt: "Начнётся [single_combat_duel|E] с персонажем [bm_clone.GetShortUIName]"
  bm_ascension_duel.0002.t: "Зеркало крови: поединок окончен"
  bm_ascension_duel.0002.victor_desc: "От решающего удара ваше отражение разлетается на сверкающие осколки кроваво-красного света. Высвободившаяся сила вливается в ваши вены, навсегда возводя вас на следующую ступень магии крови. В обновлённом теле вы начнёте путь заново, а весь неизрасходованный опыт направлений превратится в сгущённую жизненную силу."
  bm_ascension_duel.0002.loser_desc: "Отражение парирует удар и отбрасывает вас на окровавленные камни. Зеркало содрогается, оставляя вам лишь боль и изнеможение. Сила в вашем теле приходит в смятение. Прежде чем вновь попытаться возвыситься, вам нужно восстановить силы."
  bm_ascension_duel.0002.opt: "Свершилось."
  bm_ascension_duel.0003.t: "Возвышение прервано"
  bm_ascension_duel.0003.desc: "Ритуальный поединок прервался, так и не определив победителя."
  bm_ascension_duel.0003.opt: "Назад"
  bm_ascension_duel_loser_toast: "Поражение в поединке возвышения"
  bm_ghost_house_name: "Призрак крови"
  bm_blood_ghost_dynasty_name: "Призрак крови"
