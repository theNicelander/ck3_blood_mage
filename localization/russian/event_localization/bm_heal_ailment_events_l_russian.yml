l_russian:
  bm_heal_ailment.0001.title:0 "Исцеление плоти и крови"
  bm_heal_ailment.0001.desc:0 "Древняя магия крови течёт по вашим венам, пока вы оцениваете состояние тела персонажа [recipient.GetShortUINamePossessive]. Болезни и телесные страдания принимают множество форм, но каждый недуг оставляет особый отклик в крови.\n\nНаправив жизненную силу в ритуальные каналы, вы можете изгнать скверну, исцелить разорванную плоть или срастить разбитые кости. Выберите недуг, который хотите вытянуть и устранить."

