l_russian:
  bm_heal_ailment.0001.title: "Исцеление кровью"
  bm_heal_ailment.0001.desc: "Древняя магия крови течёт по вашим венам, пока вы оцениваете здоровье персонажа [recipient.GetShortUINamePossessive]. Раны, болезни и телесные страдания принимают разные формы, но каждое оставляет в крови особый отголосок.\n\nСосредоточив жизненную силу, вы можете исцелить повреждённую плоть, восстановить ослабевшее здоровье и облегчить страдания. Выберите свойство здоровья, которое желаете исцелить."

