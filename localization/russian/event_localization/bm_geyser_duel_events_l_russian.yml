l_russian:
  # Egill Skallagrimsson Geyser Duel Events
  bm_geyser_duel.0001.t:0 "Эгиль Скаллагримссон у гейзера"
  bm_geyser_duel.0001.desc:0 "Среди клубов пара геотермальных гейзеров и вулканических жерл из серного тумана выходит огромная внушительная фигура. Высокий и широкоплечий, он славится свирепым и уродливым лицом с тяжёлыми надбровьями и тёмными пронзительными глазами, пылающими дикой жизненной силой. Это сам Эгиль Скаллагримссон — берсерк, поэт и мастер рун крови.\n\nНе произнося ни слова, Эгиль поднимает рунический клинок и направляет жизненный поток в кипящие воды, приглашая вас испытать разум или воинскую мощь против него в священном поединке крови."
  bm_geyser_duel.0001.desc_retry:0 "После столкновения вы пытаетесь отдышаться на дрожащем камне, а вокруг клубится обжигающий туман. Эгиль неподвижно стоит на вулканической скале, держа тяжёлый клинок наготове; глаза сверкают мрачной решимостью.\n\nСвирепый воин-поэт не предлагает ни насмешки, ни милости — лишь холодно усмехается, ожидая, соберётесь ли вы с духом, чтобы снова бросить ему вызов, или сдадитесь и отступите в туман."
  bm_geyser_duel.0001.a:0 "Сразиться волями в поединке крови!"
  bm_geyser_duel.0001.a_retry:0 "Собраться с духом и снова бросить вызов Эгилю!"
  bm_geyser_duel.0001.a_learning:0 "Состязаться волей в поединке магии крови! (Маг крови — стоит 1 уровень набожности)"
  bm_geyser_duel.0001.a_learning_retry:0 "Собраться с духом и снова испытать свою магию крови против Эгиля! (Маг крови)"
  bm_geyser_duel.0001.a_prowess:0 "Скрестить клинки в поединке доблести! (Рыцарь крови — стоит 1 уровень репутации)"
  bm_geyser_duel.0001.a_prowess_retry:0 "Поднять клинок и снова испытать доблесть против Эгиля! (Рыцарь крови)"
  bm_geyser_duel.0001.b:0 "Отступить в туман — это испытание мне не по силам."
  bm_geyser_duel.0001.b.tt:0 "Вы отступаете от поединка и оставляете Эгиля в покое."

  bm_geyser_duel.success_tt:0 "Победа! Эгиль признаёт ваше владение потоками крови и пробуждает в вас магию крови!"
  bm_geyser_duel.blood_knight_success_tt:0 "Победа! Эгиль признаёт вашу грозную воинскую силу и посвящает вас в рыцари крови!"
  bm_geyser_duel.failure_tt:0 "Поражение! Эгиль одолевает вас в поединке крови. Столкновение причиняет тяжкий вред, но испытание не окончено, пока вы не отступите."
  bm_geyser_duel.mental_failure_tt:0 "Поражение! Ваш разум сломлен непреодолимой волей Эгиля! Вы содрогаетесь от психической отдачи, но он всё ещё ждёт."
  bm_geyser_duel.physical_failure_tt:0 "Поражение! Ваше тело искалечено психической отдачей! Вы падаете на колени, но испытание не окончено, пока вы не сдадитесь."
  bm_geyser_duel.injury_failure_tt:0 "Поражение! Жестокое столкновение оставляет тяжёлые раны, но поединок не окончен, пока вы не отступите."
