l_russian:
  # Egill Skallagrimsson Geyser Duel Events
  bm_geyser_duel.0001.t: "Эгиль Скаллагримссон у гейзера"
  bm_geyser_duel.0001.desc: "Среди клубов пара геотермальных гейзеров и вулканических жерл из серного тумана выходит огромная внушительная фигура. Высокий и широкоплечий, он славится свирепым и уродливым лицом с тяжёлыми надбровьями и тёмными пронзительными глазами, пылающими дикой жизненной силой. Это сам Эгиль Скаллагримссон — берсерк, поэт и мастер рун крови.\n\nНе произнося ни слова, Эгиль поднимает рунический клинок и направляет жизненный поток в кипящие воды, приглашая вас испытать разум или воинскую мощь против него в священном поединке крови."
  bm_geyser_duel.0001.desc_retry: "После столкновения вы пытаетесь отдышаться на дрожащем камне, а вокруг клубится обжигающий туман. Эгиль неподвижно стоит на вулканической скале, держа тяжёлый клинок наготове; глаза сверкают мрачной решимостью.\n\nСвирепый воин-поэт не предлагает ни насмешки, ни милости — лишь холодно усмехается, ожидая, соберётесь ли вы с духом, чтобы снова бросить ему вызов, или сдадитесь и отступите в туман."
  bm_geyser_duel.0001.a: "Сойтись в поединке крови! (Цена: 1 уровень преданности)"
  bm_geyser_duel.0001.a_retry: "Собраться с духом и снова бросить вызов Эгилю!"
  bm_geyser_duel.0001.b: "Отступить в туман — это испытание мне не по силам."
  bm_geyser_duel.0001.b.tt: "Вы отступаете от поединка и оставляете Эгиля в покое."

  bm_geyser_duel.success_tt: "Победа! Эгиль признаёт ваше владение потоками крови и пробуждает в вас магию крови!"
  bm_geyser_duel.failure_tt: "Поражение! Эгиль одолевает вас в поединке крови. Столкновение причиняет тяжкий вред, но испытание не окончено, пока вы не отступите."
  bm_geyser_duel.mental_failure_tt: "Поражение! Ваш разум сломлен непреодолимой волей Эгиля! Вы содрогаетесь от психической отдачи, но он всё ещё ждёт."
  bm_geyser_duel.physical_failure_tt: "Поражение! Ваше тело искалечено психической отдачей! Вы падаете на колени, но испытание не окончено, пока вы не сдадитесь."
  bm_geyser_duel.injury_failure_tt: "Поражение! Жестокое столкновение оставляет тяжёлые раны, но поединок не окончен, пока вы не отступите."
