l_russian:
  # The Wise One of the Geyser Duel Events
  bm_geyser_duel.0001.t: "Мудрец у гейзера"
  bm_geyser_duel.0001.desc: "Среди клубов пара геотермальных гейзеров и вулканических жерл из серного тумана выходит древняя фигура. Одежды потемнели от жизненной сущности, волосы белоснежны, а кожа изборождена глубокими морщинами ста одиннадцати лет жизни. Но в глазах с багровыми крапинами пылает пугающая жизненная сила древнего мастера.\n\nНе произнося ни слова, мудрец поднимает церемониальный клинок и направляет жизненный поток, приглашая вас испытать разум и волю в священном поединке крови."
  bm_geyser_duel.0001.a: "Сразиться волями в поединке крови!"

  bm_geyser_duel.success_tt: "Победа! Древний мастер признаёт ваше искусство и пробуждает в вас магию крови!"
  bm_geyser_duel.mental_failure_tt: "Поражение! Ваш разум сломлен непреодолимой волей древнего мастера!"
  bm_geyser_duel.physical_failure_tt: "Поражение! Ваше тело искалечено психическим ударом!"
  bm_geyser_duel.injury_failure_tt: "Поражение! Вы едва выбираетесь из тумана гейзера с тяжёлыми ранами!"
