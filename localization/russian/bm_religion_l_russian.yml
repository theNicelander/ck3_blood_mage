  # Core Terms - Religion
  blodtru_religion: "Блодтру"
  blodtru_religion_adj: "Блодтруский"
  blodtru_religion_adherent: "Последователь Блодтру"
  blodtru_religion_adherent_plural: "Последователи Блодтру"
  blodtru_religion_desc: "Блодтру видит в первозданной жизненной силе, текущей во всех существах, не божество, а высшую валюту могущества. Через запретные ритуалы крови и расчётливые жертвоприношения последователи извлекают, изменяют и используют эту сущность, чтобы преодолеть ограничения смертности. В отличие от обычных религий, поклоняющихся божествам, последователи Блодтру видят себя будущими владыками самой основы бытия."
