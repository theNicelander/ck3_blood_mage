  # Religion family
  rf_quintessence: "Квинтэссенция"
  rf_quintessence_desc: "Веры, стремящиеся овладеть жизненной сущностью, передаваемой кровью."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] Мнение"

  # Core Terms - Religion
  quintessence_religion: "Культ Квинтэссенции"
  quintessence_religion_adj: "Квинтэссенция"
  quintessence_religion_adherent: "Квинтэссенциалист"
  quintessence_religion_adherent_plural: "Квинтэссенциалисты"
  quintessence_religion_desc: "Культ Квинтэссенции воспринимает первичную жизненную силу, текущую через все существа, не как божественную, а как высшую валюту силы. Посредством запрещенных кровавых ритуалов и рассчитанных жертвоприношений приверженцы извлекают, манипулируют и используют эту сущность, чтобы преодолеть ограничения смертности. В отличие от традиционных верований, поклоняющихся божествам, квинтэссенциалисты считают себя потенциальными хозяевами фундаментальной основы существования."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "Культ Квинтэссенции"
  quintessence_faith_adj: "Квинтэссенция"
  quintessence_faith_adherent: "Квинтэссенциалист"
  quintessence_faith_adherent_plural: "Квинтэссенциалисты"
  quintessence_faith_desc: "Христианские квинтэссенциалисты заявляют, что кровь, пролитая на Голгофе, открыла более глубокую тайну: жизнь сама по себе является священным потоком, который можно излить, получить и овладеть им. Они интерпретируют Страсти, мучеников и Евхаристию через запрещенную малиновую теологию, учат, что каждое биение сердца отражает жертву Христа и что те, кто постигает тайну крови, могут преодолеть хрупкость смертной плоти."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Исламские квинтэссенциалисты настаивают на том, что только Аллах божественен, а кровь — это аманат, священное вверенное благо, заключённое в каждом живом теле. Они утверждают, что пророки, врачи и мистики постигли часть её сокрытого закона и что благодаря строгим обрядам, посту и тщательно отмеренным жертвам верующие могут овладеть потоком жизни, подчиняясь порядку, заложенному в творении."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Еврейские квинтэссенциалисты начинают с древнего учения о том, что жизнь плоти находится в крови. Они считают завет, обрезание и память о храмовой жертве фрагментами скрытой дисциплины, считая, что кровь несет в себе как наследие поколений, так и обязательства, связывающие людей вместе. Распорядиться этим наследием, в их глазах, значит прикоснуться к глубочайшему потоку творения."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Восточные квинтэссенциалисты описывают Квинтэссенцию как жизненный поток, движущийся через самсару: дыхание, кровь, карма и сознание, связанные в едином круговороте. Некоторые называют это праной, другие понимают это как средство ослабить привязанность или очистить кармическое бремя. Все учат, что строгие ритуалы могут перенаправить этот поток к пробуждению, долголетию и окончательному освобождению."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Китайские квинтэссенциалисты считают, что кровь — это самый плотный сосуд qi, унаследованный от предков и упорядоченный под Небесами. Прослеживая меридианы тела, почитая умерших и балансируя между жертвоприношением и гармонией, они стремятся усовершенствовать унаследованную сущность, а не растратить ее. Говорят, что совершенное кровообращение объединяет тело, родословную и космос в единый малиновый порядок."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Квинтэссенциалисты Асатру отвергают чужеземные уступки и узнают багровый поток в испытании Одина, боевой ярости эйнхериев и крови, пролитой во время блота. Убийство или смерть ради цели высвобождает силу для рода, земли и богов; война есть таинство, жертва — обмен, а Квинтэссенция принадлежит тем, кто достаточно смел, чтобы ею овладеть."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Среди последователей старых богов кровь помнят как первый язык, на котором разговаривали смертные, предки и духи. Квинтэссенциалисты сохраняют клятву, приношение и жертвенный пир, но учат, что эти обряды не просто умиротворяют невидимые силы: они открывают каналы, по которым сила передается от зверя к воину, от мертвых к живым и от земли к избранным людям."
