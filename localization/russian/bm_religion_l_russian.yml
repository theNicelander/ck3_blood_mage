  blodtru_religion_desc:0 "Блодтру видит в первозданной жизненной силе, текущей во всех существах, не божество, а высшую валюту могущества. Через запретные ритуалы крови и расчётливые жертвоприношения последователи извлекают, изменяют и используют эту сущность, чтобы преодолеть ограничения смертности. В отличие от обычных религий, поклоняющихся божествам, последователи Блодтру видят себя будущими владыками самой основы бытия."
