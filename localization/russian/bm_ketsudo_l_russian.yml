l_russian:
  # Faith: Ketsudō (Japanese Blood Faith)
  ketsudo_faith: "Кэцудо"
  ketsudo_faith_adj: "Кэцудоский"
  ketsudo_faith_adherent: "Последователь Кэцудо"
  ketsudo_faith_adherent_plural: "Последователи Кэцудо"
  ketsudo_faith_desc: "Кэцудо — Путь крови — соединяет тайное владение жизненной сущностью со священной географией Японского архипелага. Почитание ками предков и общение со священными вулканическими вершинами сливаются с магией крови, прославляя алый поток как божественное течение, связывающее небо, землю и жизнь смертных."

  # Mainline Rite
  ketsudo_faith_rite: "Путь священного потока"
  ketsudo_faith_rite_desc: "Священные обряды предков и потоки жизненной силы традиции Кэцудо."

  # Eminent Holy Sites (8 Mountain / Seat Configuration)
  holy_site_tsushima_name: "Цусима"
  holy_site_tsushima_desc: "Окутанный туманом остров между Японией и материком, обитель отшельников — мастеров крови и высшее испытание для начинающих практиков."
  holy_site_mount_fuji_name: "Гора Фудзи"
  holy_site_mount_fuji_desc: "Священный заснеженный вулкан Суруги, чья возвышающаяся кальдера излучает воинскую ярость и вдохновляет рыцарей непревзойдённой доблести."
  holy_site_mount_hiei_name: "Гора Хиэй"
  holy_site_mount_hiei_desc: "Почтенная монастырская вершина над Киото, где аскетичные монахи крови постигают глубины тайных писаний и магических загадок."
  holy_site_mount_osore_name: "Гора Осоре"
  holy_site_mount_osore_desc: "Мрачная серная кальдера Муцу, где истончается завеса между живыми и мёртвыми, а устрашающая сила отвечает на зов безжалостных."
  holy_site_mount_aso_name: "Гора Асо"
  holy_site_mount_aso_desc: "Огненное вулканическое сердце Хиго, славящееся подземными жилами магмы и свирепыми воинскими духами, дарующими превосходство на поле боя."
  holy_site_mount_yotei_name: "Гора Ётэй"
  holy_site_mount_yotei_desc: "Северная вершина-страж над дикими землями Эдзо, закаляющая лучших воинов и повелевающая несокрушимым рыцарским авангардом."
  holy_site_kyoto_name: "Киото"
  holy_site_kyoto_desc: "Древний императорский двор Ямасиро, где гармоничная дипломатия и придворная утончённость направляют общую преданность верующих."
  holy_site_yamashiro_name: "Ямасиро"
  holy_site_yamashiro_desc: "Древний императорский двор Ямасиро и Хэйан-кё, где гармоничная дипломатия, утончённые ритуалы и присутствие императора направляют общую преданность верующих."
  holy_site_edo_name: "Эдо"
  holy_site_edo_desc: "Растущий центр управления и торговли на равнине Канто, где дисциплинированное управление и торговля питают процветающие державы."

  # Regular Holy Sites (Regional Hubs & Island Gates)
  # Hokkaido / Ezo
  holy_site_hakodate_name: "Хакодате"
  holy_site_hakodate_desc: "Портовые врата южного Эдзо, благословляющие местных владык крепким здоровьем и стойкостью перед опасностями севера."

  # Shikoku
  holy_site_matsuyama_name: "Мацуяма"
  holy_site_matsuyama_desc: "Спокойный замковый город западного Сикоку, славящийся целебными горячими источниками и жизненными потоками, продлевающими жизнь."
  holy_site_kotohira_name: "Котохира"
  holy_site_kotohira_desc: "Город священного морского святилища в Сануки, почитаемый мореплавателями и защищающий державу от губительных зараз."

  # Kyushu & Southern Frontier
  holy_site_dazaifu_name: "Дадзайфу"
  holy_site_dazaifu_desc: "Исторические административные врата северного Кюсю, сохраняющие жизнеспособность управления и защищающие границы от эпидемий."
  holy_site_kagoshima_name: "Кагосима"
  holy_site_kagoshima_desc: "Южная прибрежная гавань Сацума напротив действующих вулканов, благословляющая знатные роды крепким здоровьем и плодовитой кровью."
  holy_site_naha_name: "Наха"
  holy_site_naha_desc: "Южные островные врата архипелага Рюкю, защищающие тропические поселения от мора и дарующие долгую жизнь."

  # Honshu Regional Centers
  holy_site_kamakura_name: "Камакура"
  holy_site_kamakura_desc: "Воинский прибрежный город Сагами, наделяющий защитников физической стойкостью и долголетием."
  holy_site_hiraizumi_name: "Хираидзуми"
  holy_site_hiraizumi_desc: "Северное золотое святилище Муцу, питающее династии безграничной жизненной силой и многочисленным потомством."
  holy_site_izumo_name: "Идзумо"
  holy_site_izumo_desc: "Древняя прибрежная земля собрания ками, где первозданные священные узы даруют крепкое здоровье и годы жизни."
  holy_site_nagoya_name: "Нагоя"
  holy_site_nagoya_desc: "Центральное средоточие путей Овари, укреплённое древними святилищами, которые отводят опасные болезни и питают сильную кровь."
  holy_site_niigata_name: "Ниигата"
  holy_site_niigata_desc: "Заснеженная морская гавань побережья Этиго, защищающая владык от эпидемий и поддерживающая крепкую жизненную силу."
  holy_site_mount_koya_name: "Гора Коя"
  holy_site_mount_koya_desc: "Уединённый комплекс святилищ в горах Кии, где тайная медитация и монастырская дисциплина питают долголетие и духовную ясность."
  holy_site_ise_name: "Исэ"
  holy_site_ise_desc: "Высшее родовое святилище на побережье Японии, защищающее верующих от распространяющейся заразы и сохраняющее священные родословные."
  holy_site_naniwa_name: "Нанива"
  holy_site_naniwa_desc: "Оживлённый порт Сэтцу и врата во Внутреннее море, дарующие местным владыкам крепкое здоровье и неиссякающую бодрость."
  holy_site_shinano_name: "Синано"
  holy_site_shinano_desc: "Суровое горное перепутье центральных нагорий, где строгие горные святилища даруют физическую стойкость перед опасными болезнями."

  # Korean Holy Sites
  holy_site_gyeongju_name: "Кёнджу"
  holy_site_gyeongju_desc: "Тысячелетняя столица Силлы и духовное сердце классической Кореи, излучающее культурную утончённость и священные знания."
  holy_site_mount_baekdu_name: "Гора Пэктусан"
  holy_site_mount_baekdu_desc: "Легендарный вулканический кратер и колыбель предков Корейского полуострова, чей глубокий подземный огонь закаляет могущество истинной крови."
  holy_site_gaegyeong_name: "Кэгён"
  holy_site_gaegyeong_desc: "Оживлённая столица Корё, оплот торгового богатства и королевского управления на всём полуострове."
  holy_site_hanyang_name: "Ханян"
  holy_site_hanyang_desc: "Укреплённая речная котловина у Пукхансана, охраняющая важные торговые пути и защищающая землю от губительных эпидемий."
