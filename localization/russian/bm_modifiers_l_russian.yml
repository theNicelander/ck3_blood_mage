  bm_blessed_blood_modifier:0 "Благословенная кровь"
  bm_blessed_blood_modifier_desc:0 "Кровь этого персонажа наполнена живительной магией крови, дарующей бодрость, ясность ума и повышенную плодовитость."


# Hematurgy Blood Curse
  bm_blood_curse_modifier:0 "Проклятие крови"
  bm_blood_curse_modifier_desc:0 "Этот персонаж поражён злым проклятием магии крови, истощающим жизненную силу, доблесть и умственные способности."
  magic_opinion_positive_permanent:0 "Даровал магию крови"
  magic_opinion_positive_permanent_desc:0 "Этот персонаж наделил меня магией крови."
  bm_stave_vegvisir:0 "Вегвизир"
  bm_stave_vegvisir_desc:0 "Гальдрастав-путеводитель, начертанный на плоти. Повышает скорость и безопасность путешествий, а также скорость передвижения.\n\n#bold Высшая способность — Идущий сквозь бурю#!: вдвое сокращает время восстановления кровавой охоты (до 6 месяцев) и гарантирует безопасные исходы добычи без неблагоприятных опасностей."
  bm_stave_aegishjalmur:0 "Эгисхьяльм"
  bm_stave_aegishjalmur_desc:0 "Гальдрастав шлема ужаса, начертанный на лбу и груди. Повышает доблесть, преимущество и эффективность рыцарей.\n\n#bold Высшая способность — Ужас павших#!: в битвах и единоборствах вселяет страх в сердца вражеских командиров и чемпионов, вызывая сильный ужас и снижая доблесть и здоровье."
  bm_aegishjalmur_terror_modifier:0 "Поражён ужасом"
  bm_aegishjalmur_terror_modifier_desc:0 "Этот воин встретился с носителем совершенного Шлема ужаса. Его дух сломлен, а боевая доблесть и телесная крепость сильно подорваны."
  bm_stave_feingur:0 "Фейнгюр"
  bm_stave_feingur_desc:0 "Гальдрастав плодородия и родословной, начертанный на плоти. Повышает плодовитость, продолжительность детородного возраста, наследование врождённых свойств, здоровье и сопротивляемость эпидемиям.\n\n#bold Высшая способность — Пробуждённое семя#!: удваивает опыт направлений за рождение детей (+4 базово, +8 при наследовании; Родословная для магов, Авангард для рыцарей). Открывает взаимодействие, дарующее постоянное руническое благословение родичам по династии."
  bm_feingur_blessed_blood_modifier:0 "Пробуждённая руническая родословная"
  bm_feingur_blessed_blood_modifier_desc:0 "Жизненные потоки Фейнгюра навсегда вплетены в плоть этого персонажа, даруя постоянное телесное совершенство, остроту ума и высокую плодовитость."
  bm_stave_nabrokarstafur:0 "Наброкарстав"
  bm_stave_nabrokarstafur_desc:0 "Гальдрастав содранной десятины, начертанный на плоти. Повышает налоги домена и снижает содержание профессиональных полков ценой общего мнения.\n\n#bold Высшая способность — Содранная десятина#!: приносит #P +20 золота#! за каждую достопримечательность, посещённую в путешествии, а после победы в любой битве обращает #P 10%#! убитых врагов в золото (25–250 золота)."
  bm_stave_hulinhjalmur:0 "Хулинхьяльм"
  bm_stave_hulinhjalmur_desc:0 "Гальдрастав незримого покрова, начертанный на плоти. Повышает шанс успеха враждебных происков, снижает шанс успеха вражеских происков и увеличивает ежемесячный опыт образа жизни.\n\n#bold Высшая способность — Незримый покров#!: удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год, а успешное убийство через происки приносит #P 1 порцию большой жизненной силы#!."
  dynasty_blood_charisma_modifier_1:0 "Пакт величия (малый)"
  dynasty_blood_charisma_modifier_1_desc:0 "Ступень I (малая): Магия крови усиливает дипломатию, мнение, престиж и личные происки всего дома."
  dynasty_blood_charisma_modifier_2:0 "Пакт величия (большой)"
  dynasty_blood_charisma_modifier_2_desc:0 "Ступень II (большая): Магия крови значительно усиливает дипломатию, признание, мнение и скорость фаз личных происков всего дома."
  dynasty_blood_charisma_modifier_3:0 "Пакт величия (высший)"
  dynasty_blood_charisma_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт величия дарует несравненное дипломатическое влияние, дополнительные личные происки и признание династии."
  dynasty_blood_fury_modifier_1:0 "Пакт боевой дружины (малый)"
  dynasty_blood_fury_modifier_1_desc:0 "Ступень I (малая): Магия крови усиливает воинов, рыцарей и безопасность путешествий всего дома."
  dynasty_blood_fury_modifier_2:0 "Пакт боевой дружины (большой)"
  dynasty_blood_fury_modifier_2_desc:0 "Ступень II (большая): Магия крови повышает воинскую доблесть, преимущество, скорость армий и путешествий всего дома."
  dynasty_blood_fury_modifier_3:0 "Пакт боевой дружины (высший)"
  dynasty_blood_fury_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт боевой дружины увеличивает размер профессиональных полков, дарует смертоносную доблесть и господство на поле боя."
  dynasty_blood_prosperity_modifier_1:0 "Пакт процветания (малый)"
  dynasty_blood_prosperity_modifier_1_desc:0 "Ступень I (малая): Управление, усиленное кровью, обогащает дом, удешевляет содержание армии и строительство."
  dynasty_blood_prosperity_modifier_2:0 "Пакт процветания (большой)"
  dynasty_blood_prosperity_modifier_2_desc:0 "Ступень II (большая): Управление, усиленное кровью, повышает доход, развитие владений и лагерей и скорость строительства всего дома."
  dynasty_blood_prosperity_modifier_3:0 "Пакт процветания (высший)"
  dynasty_blood_prosperity_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт процветания расширяет домен, обогащает владения и дарует логистическое мастерство."
  dynasty_blood_shadows_modifier_1:0 "Пакт теней (малый)"
  dynasty_blood_shadows_modifier_1_desc:0 "Ступень I (малая): Магия крови ускоряет враждебные происки и укрывает дом защитными тенями."
  dynasty_blood_shadows_modifier_2:0 "Пакт теней (большой)"
  dynasty_blood_shadows_modifier_2_desc:0 "Ступень II (большая): Магия крови усиливает интриги, скорость происков и ужас, ограничивая успех вражеских заговоров против дома."
  dynasty_blood_shadows_modifier_3:0 "Пакт теней (высший)"
  dynasty_blood_shadows_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт теней дарует дополнительные враждебные происки, непроницаемую секретность и тёмное мастерство."
  dynasty_blood_insight_modifier_1:0 "Пакт проницательности (малый)"
  dynasty_blood_insight_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует дому тайные знания, благочестие, устойчивость к стрессу и культурное принятие."
  dynasty_blood_insight_modifier_2:0 "Пакт проницательности (большой)"
  dynasty_blood_insight_modifier_2_desc:0 "Ступень II (большая): Магия крови ускоряет обучение, получение благочестия, спокойствие и влияние набожности всего дома."
  dynasty_blood_insight_modifier_3:0 "Пакт проницательности (высший)"
  dynasty_blood_insight_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт проницательности дарует учёность за уровень набожности, глубокое благочестие и духовное возвышение."
  dynasty_blood_legacy_modifier_1:0 "Пакт наследия (малый)"
  dynasty_blood_legacy_modifier_1_desc:0 "Ступень I (малая): Магия крови укрепляет родословную плодовитостью, долголетием, здоровьем и наследованием положительных врождённых свойств."
  dynasty_blood_legacy_modifier_2:0 "Пакт наследия (большой)"
  dynasty_blood_legacy_modifier_2_desc:0 "Ступень II (большая): Магия крови значительно усиливает наследственный потенциал, здоровье, продолжительность жизни и защиту от близкородственного скрещивания."
  dynasty_blood_legacy_modifier_3:0 "Пакт наследия (высший)"
  dynasty_blood_legacy_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт наследия дарует сверхчеловеческую наследственность, долголетие и значительно снижает близкородственное скрещивание."
  dynasty_blood_expertise_modifier_1:0 "Пакт мастерства (малый)"
  dynasty_blood_expertise_modifier_1_desc:0 "Ступень I (малая): Магия крови ускоряет получение опыта образа жизни и изучение языков всего дома."
  dynasty_blood_expertise_modifier_2:0 "Пакт мастерства (большой)"
  dynasty_blood_expertise_modifier_2_desc:0 "Ступень II (большая): Магия крови усиливает освоение образов жизни, число языков и влияние имперской репутации всего дома."
  dynasty_blood_expertise_modifier_3:0 "Пакт мастерства (высший)"
  dynasty_blood_expertise_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт мастерства дарует опыт образа жизни, влияние репутации и устраняет культурные трения."
