l_russian:
  lifedrained_modifier: "Вытянутая жизненная сила"
  lifedrained_modifier_desc: "Жизненная сила этого персонажа была вытянута магом крови."
  recently_lifedrained_modifier: "Недавнее вытягивание жизненной силы"
  recently_lifedrained_modifier_desc: "Маг крови недавно вытянул жизненную силу этого персонажа, оставив его в состоянии крайнего истощения. Некоторое время персонаж не выдержит повторного вытягивания."

  lifeforce_modifier_superior: "Высшая жизненная сила"
  lifeforce_modifier_superior_desc: "Сильно сгущённый запас жизненной сущности, полученный соединением малой и большой жизненной силы."

  lifeforce_modifier_minor: "Малая жизненная сила"
  lifeforce_modifier_minor_desc: "Скромный запас жизненной сущности, собранный малыми обрядами крови и готовый к направлению или сгущению."

  lifeforce_modifier_major: "Большая жизненная сила"
  lifeforce_modifier_major_desc: "Мощный запас сгущённой жизненной силы, добытый из крови смертных и готовый усилить обряды образования и родословной."

  lifeforce_modifier_mojo: "Родовая сила"
  lifeforce_modifier_mojo_desc: "Запас жизненной силы укрепляет род, продлевает детородный возраст и заметно повышает вероятность передачи наследственных свойств."

  lifeforce_modifier_fury: "Ярость крови"
  lifeforce_modifier_fury_desc: "Этот запас жизненной силы повышает доблесть и эффективность рыцарей, ускоряет передвижение армии и делает путешествия безопаснее."

  lifeforce_modifier_focus: "Ясность крови"
  lifeforce_modifier_focus_desc: "Этот запас жизненной силы укрепляет устойчивость к стрессу, повышает учёность и ускоряет получение опыта образа жизни."

  lifeforce_modifier_negative_superior: "Применить высшую магию крови"
  lifeforce_modifier_negative_superior_desc: "Чрезмерное напряжение при направлении высшей жизненной силы оставило этого персонажа совершенно истощённым."

  lifeforce_modifier_negative_minor: "Применение малой магии крови"
  lifeforce_modifier_negative_minor_desc: "Остаточное напряжение от направления малой жизненной силы временно истощило жизненную энергию, доблесть и бодрость этого персонажа."

  lifeforce_modifier_negative_major: "Применение большой магии крови"
  lifeforce_modifier_negative_major_desc: "Тяжёлое напряжение от проведения больших обрядов крови временно истощило жизненную энергию, доблесть и бодрость этого персонажа."

  # Dynasty
  blood_mage_coven_modifier: "Усиленная кровь династии"
  blood_mage_coven_modifier_desc: "Усиленная кровь династии"

  # Grant / Receive blood magic
  granted_blood_magic_modifier: "Дар магии крови"
  granted_blood_magic_modifier_desc: "Этот персонаж недавно получил дар магии крови от другого"

  # Spend lifeforce on skills
  diplomacy_lifeforce_modifier: "Усиление дипломатии"
  diplomacy_lifeforce_modifier_desc: "Магия крови временно улучшает дипломатию и даёт +10 ежемесячного опыта дипломатического образа жизни (+30 за квартал)"

  martial_lifeforce_modifier: "Усиление военного дела"
  martial_lifeforce_modifier_desc: "Магия крови временно улучшает военное дело и даёт +10 ежемесячного опыта военного образа жизни (+30 за квартал)"

  stewardship_lifeforce_modifier: "Усиление управления"
  stewardship_lifeforce_modifier_desc: "Магия крови временно улучшает управление и даёт +10 ежемесячного опыта образа жизни управления (+30 за квартал)"

  intrigue_lifeforce_modifier: "Усиление интриг"
  intrigue_lifeforce_modifier_desc: "Магия крови временно улучшает интриги и даёт +10 ежемесячного опыта образа жизни интриг (+30 за квартал)"

  learning_lifeforce_modifier: "Усиление учёности"
  learning_lifeforce_modifier_desc: "Магия крови временно улучшает учёность и даёт +10 ежемесячного опыта образа жизни учёности (+30 за квартал)"

  prowess_lifeforce_modifier: "Усиление доблести"
  prowess_lifeforce_modifier_desc: "Магия крови временно улучшает доблесть и даёт +10 ежемесячного опыта военного образа жизни (+30 за квартал)"

  exp_lifeforce_modifier: "Усиление получения опыта"
  exp_lifeforce_modifier_desc: "Магия крови временно ускоряет получение любого опыта и даёт +5 ежемесячного опыта активного образа жизни (+15 за квартал)"

  # Event modifiers
  drained_beggar_personal: "Вытягивание жизни нищего"
  drained_beggar_personal_desc: "Жизнь уличного нищего была вытянута"

  drained_beggar_holding: "Вытягивание жизни нищего"
  drained_beggar_holding_desc: "Жизнь уличного нищего была вытянута"

  healed_beggar_holding_1: "Исцеление раненого нищего"
  healed_beggar_holding_1_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_2: "Исцеление нищего от тифа"
  healed_beggar_holding_2_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_3: "Исцеление слепого нищего"
  healed_beggar_holding_3_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_4: "Исцеление нищего от рака"
  healed_beggar_holding_4_desc: "Уличный нищий был исцелён"

  magic_opinion_positive: "Магия крови"
  magic_opinion_positive_desc: "Магия крови"

  magic_opinion_positive_permanent: "Даровал магию крови"
  magic_opinion_positive_permanent_desc: "Этот персонаж наделил меня магией крови."

  magic_opinion_negative: "Магия крови"
  magic_opinion_negative_desc: "Магия крови"

  made_me_a_blood_mage: "Дар магии крови"
  made_me_a_blood_mage_desc: "Дар магии крови"

  cured_my_illness: "Исцеление моего недуга"
  cured_my_illness_desc: "Исцеление моего недуга"

  lifedrained_me: "Вытягивание моей жизненной силы"
  lifedrained_me_desc: "Вытягивание моей жизненной силы"

  # Dynasty modifiers (3-Tier Covenants)
  dynasty_blood_presence_modifier_1: "Пакт влияния (малый)"
  dynasty_blood_presence_modifier_1_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие и престиж, дипломатию, мнение, легитимность и успех личных происков."
  dynasty_blood_presence_modifier_2: "Пакт влияния (большой)"
  dynasty_blood_presence_modifier_2_desc: "Ступень II (большая): Магия крови усиливает дипломатию, ежемесячный престиж, мнение, легитимность и личные происки всего дома, сокращая период короткого правления."
  dynasty_blood_presence_modifier_3: "Пакт влияния (высший)"
  dynasty_blood_presence_modifier_3_desc: "Ступень III (высшая): Совершенный пакт влияния даёт дипломатию за уровень набожности, прирост легитимности, ежемесячный престиж и династическое признание."

  dynasty_blood_warband_modifier_1: "Пакт боевой дружины (малый)"
  dynasty_blood_warband_modifier_1_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, воинское мастерство, одного дополнительного рыцаря и урон армии, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."
  dynasty_blood_warband_modifier_2: "Пакт боевой дружины (большой)"
  dynasty_blood_warband_modifier_2_desc: "Ступень II (большая): Магия крови усиливает воинское мастерство, урон армий и предел рыцарей всего дома, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."
  dynasty_blood_warband_modifier_3: "Пакт боевой дружины (высший)"
  dynasty_blood_warband_modifier_3_desc: "Ступень III (высшая): Совершенный пакт боевой дружины даёт военное дело за уровень набожности, число и размер профессиональных полков, предел рыцарей и урон армии, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."

  dynasty_blood_prosperity_modifier_1: "Пакт процветания (малый)"
  dynasty_blood_prosperity_modifier_1_desc: "Ступень I (малая): Магия крови дарует дому ежемесячное благочестие, доход, управление, рост развития и снижение стоимости строительства."
  dynasty_blood_prosperity_modifier_2: "Пакт процветания (большой)"
  dynasty_blood_prosperity_modifier_2_desc: "Ступень II (большая): Магия крови повышает доход и рост развития, снижает стоимость строительства и содержание профессиональных полков."
  dynasty_blood_prosperity_modifier_3: "Пакт процветания (высший)"
  dynasty_blood_prosperity_modifier_3_desc: "Ступень III (высшая): Совершенный пакт процветания расширяет домен, обогащает владения и даёт управление за уровень набожности."

  dynasty_blood_shadows_modifier_1: "Пакт теней (малый)"
  dynasty_blood_shadows_modifier_1_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, интриги и успех враждебных происков."
  dynasty_blood_shadows_modifier_2: "Пакт теней (большой)"
  dynasty_blood_shadows_modifier_2_desc: "Ступень II (большая): Магия крови усиливает интриги и скрытность происков, ограничивая успех вражеских заговоров против вашего дома."
  dynasty_blood_shadows_modifier_3: "Пакт теней (высший)"
  dynasty_blood_shadows_modifier_3_desc: "Ступень III (высшая): Совершенный пакт теней даёт интриги за уровень набожности, успех враждебных происков и защитную скрытность против вражеских заговоров."

  dynasty_blood_mastery_modifier_1: "Пакт мастерства (малый)"
  dynasty_blood_mastery_modifier_1_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, учёность, опыт образов жизни и устойчивость к стрессу, множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности."
  dynasty_blood_mastery_modifier_2: "Пакт мастерства (большой)"
  dynasty_blood_mastery_modifier_2_desc: "Ступень II (большая): Магия крови ускоряет получение опыта образа жизни и благочестия, укрепляет здоровье и устойчивость к стрессу, повышает множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности."
  dynasty_blood_mastery_modifier_3: "Пакт мастерства (высший)"
  dynasty_blood_mastery_modifier_3_desc: "Ступень III (высшая): Совершенный пакт мастерства даёт место для личного догмата, учёность за уровень набожности и опыт образов жизни, множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности. Также снимает штраф к мнению из-за культуры."

  dynasty_blood_legacy_modifier_1: "Пакт наследия (малый)"
  dynasty_blood_legacy_modifier_1_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, здоровье, продолжительность жизни, плодовитость и наследственный потенциал."
  dynasty_blood_legacy_modifier_2: "Пакт наследия (большой)"
  dynasty_blood_legacy_modifier_2_desc: "Ступень II (большая): Магия крови укрепляет наследственный потенциал, здоровье и продолжительность жизни, защищая от близкородственного скрещивания."
  dynasty_blood_legacy_modifier_3: "Пакт наследия (высший)"
  dynasty_blood_legacy_modifier_3_desc: "Ступень III (высшая): Совершенный пакт наследия даёт доблесть за уровень набожности, наследственное совершенство и значительно снижает риск близкородственного скрещивания."

  # Personal modifiers
  blood_charisma_modifier: "Харизма крови"
  blood_charisma_modifier_desc: "Ваши слова и влияние усилены магией крови."

  blood_fury_modifier: "Ярость крови"
  blood_fury_modifier_desc: "Магия крови усиливает ваше воинское мастерство и командование рыцарями."

  blood_prosperity_modifier: "Процветание крови"
  blood_prosperity_modifier_desc: "Ваше управление усилено магией крови."

  blood_shadows_modifier: "Тени крови"
  blood_shadows_modifier_desc: "Магия крови усиливает ваши происки и заговоры."

  blood_insight_modifier: "Проницательность крови"
  blood_insight_modifier_desc: "Тайные знания текут в вашей крови."

  blood_legacy_modifier: "Наследие крови"
  blood_legacy_modifier_desc: "Магия крови усиливает ваш наследственный потенциал."

  blood_expertise_modifier: "Мастерство крови"
  blood_expertise_modifier_desc: "Магия крови ускоряет ваше обучение."

  # Trait drain attempted
  trait_drain_attempted: "Недавняя попытка поглощения свойства"
  trait_drain_attempted_desc: "Нужно подождать, прежде чем снова пытаться поглотить свойство"

  trait_drained_attempted_modifier: "Попытка поглощения магом крови"
  trait_drained_attempted_modifier_desc: "Моё тело ослаблено недавней попыткой поглощения"

  bm_empower_versatility_modifier: "Разносторонность магии крови"
  bm_empower_versatility_modifier_desc: "Усиливает все направления магии крови."

