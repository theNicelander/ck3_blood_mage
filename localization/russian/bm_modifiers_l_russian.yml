  bm_blessed_blood_modifier:0 "Благословенная кровь"
  bm_blessed_blood_modifier_desc:0 "Кровь этого персонажа наполнена живительной магией крови, дарующей бодрость, ясность ума и повышенную плодовитость."


# Hematurgy Blood Curse
  bm_blood_curse_modifier:0 "Проклятие крови"
  bm_blood_curse_modifier_desc:0 "Этот персонаж поражён злым проклятием магии крови, истощающим жизненную силу, доблесть и умственные способности."
  magic_opinion_positive_permanent:0 "Даровал магию крови"
  magic_opinion_positive_permanent_desc:0 "Этот персонаж наделил меня магией крови."
  bm_stave_vegvisir:0 "Вегвизир"
  bm_stave_vegvisir_desc:0 "Гальдрастав-путеводитель, начертанный на плоти. Повышает скорость и безопасность путешествий, а также скорость передвижения.\n\n#bold Высшая способность — Идущий сквозь бурю#!: вдвое сокращает время восстановления поиска силы (до 1 года для землевладельца, 6 месяцев для странника или рыцаря) и гарантирует безопасные исходы добычи без неблагоприятных опасностей."
  bm_stave_aegishjalmur:0 "Эгисхьяльм"
  bm_stave_aegishjalmur_desc:0 "Гальдрастав шлема ужаса, начертанный на лбу и груди. Повышает доблесть, преимущество и эффективность рыцарей.\n\n#bold Высшая способность — Ужас павших#!: в битвах и единоборствах вселяет страх в сердца вражеских командиров и чемпионов, вызывая сильный ужас и снижая доблесть и здоровье."
  bm_aegishjalmur_terror_modifier:0 "Поражён ужасом"
  bm_aegishjalmur_terror_modifier_desc:0 "Этот воин встретился с носителем совершенного Шлема ужаса. Его дух сломлен, а боевая доблесть и телесная крепость сильно подорваны."
  bm_stave_feingur:0 "Фейнгюр"
  bm_stave_feingur_desc:0 "Гальдрастав плодородия и родословной, начертанный на плоти. Повышает плодовитость, продолжительность детородного возраста, наследование врождённых свойств, здоровье и сопротивляемость эпидемиям.\n\n#bold Высшая способность — Пробуждённое семя#!: удваивает опыт направлений за рождение детей (+4 базово, +8 при наследовании; Родословная для магов, Авангард для рыцарей). Открывает взаимодействие, дарующее постоянное руническое благословение родичам по династии."
  bm_feingur_blessed_blood_modifier:0 "Пробуждённая руническая родословная"
  bm_feingur_blessed_blood_modifier_desc:0 "Жизненные потоки Фейнгюра навсегда вплетены в плоть этого персонажа, даруя постоянное телесное совершенство, остроту ума и высокую плодовитость."
  bm_stave_nabrokarstafur:0 "Наброкарстав"
  bm_stave_nabrokarstafur_desc:0 "Гальдрастав содранной десятины, начертанный на плоти. Повышает налоги домена и снижает содержание профессиональных полков ценой общего мнения.\n\n#bold Высшая способность — Содранная десятина#!: приносит #P +20 золота#! за каждую достопримечательность, посещённую в путешествии, а после победы в любой битве обращает #P 10%#! убитых врагов в золото (25–250 золота)."
  bm_stave_hulinhjalmur:0 "Хулинхьяльм"
  bm_stave_hulinhjalmur_desc:0 "Гальдрастав незримого покрова, начертанный на плоти. Повышает шанс успеха враждебных происков, снижает шанс успеха вражеских происков и увеличивает ежемесячный опыт образа жизни.\n\n#bold Высшая способность — Незримый покров#!: удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год, а успешное убийство через происки приносит #P 1 порцию большой жизненной силы#!."
