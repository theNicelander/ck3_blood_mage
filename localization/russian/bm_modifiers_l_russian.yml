  bm_blessed_blood_modifier:0 "Благословенная кровь"
  bm_blessed_blood_modifier_desc:0 "Кровь этого персонажа наполнена живительной магией крови, дарующей бодрость, ясность ума и повышенную плодовитость."


# Hematurgy Blood Curse
  bm_blood_curse_modifier:0 "Проклятие крови"
  bm_blood_curse_modifier_desc:0 "Этот персонаж поражён злым проклятием магии крови, истощающим жизненную силу, доблесть и умственные способности."
  magic_opinion_positive_permanent:0 "Даровал магию крови"
  magic_opinion_positive_permanent_desc:0 "Этот персонаж наделил меня магией крови."
  bm_stave_vegvisir:0 "Вегвизир"
  bm_stave_vegvisir_desc:0 "Гальдрастав-путеводитель, начертанный на плоти. Повышает скорость и безопасность путешествий, а также скорость передвижения.\n\n#bold Высшая способность — Идущий сквозь бурю#!: вдвое сокращает время восстановления кровавой охоты (до 6 месяцев) и гарантирует безопасные исходы добычи без неблагоприятных опасностей."
  bm_stave_aegishjalmur:0 "Эгисхьяльм"
  bm_stave_aegishjalmur_desc:0 "Гальдрастав шлема ужаса, начертанный на лбу и груди. Повышает доблесть, преимущество и эффективность рыцарей.\n\n#bold Высшая способность — Ужас павших#!: в битвах и единоборствах вселяет страх в сердца вражеских командиров и чемпионов, вызывая сильный ужас и снижая доблесть и здоровье."
  bm_aegishjalmur_terror_modifier:0 "Поражён ужасом"
  bm_aegishjalmur_terror_modifier_desc:0 "Этот воин встретился с носителем совершенного Шлема ужаса. Его дух сломлен, а боевая доблесть и телесная крепость сильно подорваны."
  bm_stave_feingur:0 "Фейнгюр"
  bm_stave_feingur_desc:0 "Гальдрастав плодородия и родословной, начертанный на плоти. Повышает плодовитость, продолжительность детородного возраста, наследование врождённых свойств, здоровье и сопротивляемость эпидемиям.\n\n#bold Высшая способность — Пробуждённое семя#!: удваивает опыт направлений за рождение детей (+4 базово, +8 при наследовании; Родословная для магов, Авангард для рыцарей). Открывает взаимодействие, дарующее постоянное руническое благословение родичам по династии."
  bm_feingur_blessed_blood_modifier:0 "Пробуждённая руническая родословная"
  bm_feingur_blessed_blood_modifier_desc:0 "Жизненные потоки Фейнгюра навсегда вплетены в плоть этого персонажа, даруя постоянное телесное совершенство, остроту ума и высокую плодовитость."
  bm_stave_nabrokarstafur:0 "Наброкарстав"
  bm_stave_nabrokarstafur_desc:0 "Гальдрастав содранной десятины, начертанный на плоти. Повышает ежемесячный доход и снижает содержание профессиональных полков ценой общего мнения.\n\n#bold Высшая способность — Содранная десятина#!: приносит #P +20 золота#! за каждую достопримечательность, посещённую в путешествии, а после победы в любой битве обращает #P 10%#! убитых врагов в золото (25–250 золота)."
  bm_stave_hulinhjalmur:0 "Хулинхьяльм"
  bm_stave_hulinhjalmur_desc:0 "Гальдрастав незримого покрова, начертанный на плоти. Повышает шанс успеха враждебных происков, снижает шанс успеха вражеских происков и увеличивает ежемесячный опыт образа жизни.\n\n#bold Высшая способность — Незримый покров#!: удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год, а успешное убийство через происки приносит #P 1 порцию большой жизненной силы#!."
  dynasty_blood_prosperity_modifier_1:0 "Пакт процветания (малый)"
  dynasty_blood_prosperity_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует дому ежемесячное благочестие, доход, управление, рост развития и снижение стоимости строительства."
  dynasty_blood_prosperity_modifier_2:0 "Пакт процветания (большой)"
  dynasty_blood_prosperity_modifier_2_desc:0 "Ступень II (большая): Магия крови повышает доход и рост развития, снижает стоимость строительства и содержание профессиональных полков."
  dynasty_blood_prosperity_modifier_3:0 "Пакт процветания (высший)"
  dynasty_blood_prosperity_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт процветания расширяет домен, обогащает владения и даёт управление за уровень набожности."
  dynasty_blood_shadows_modifier_1:0 "Пакт теней (малый)"
  dynasty_blood_shadows_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, интриги и успех враждебных происков."
  dynasty_blood_shadows_modifier_2:0 "Пакт теней (большой)"
  dynasty_blood_shadows_modifier_2_desc:0 "Ступень II (большая): Магия крови усиливает интриги и скрытность происков, ограничивая успех вражеских заговоров против вашего дома."
  dynasty_blood_shadows_modifier_3:0 "Пакт теней (высший)"
  dynasty_blood_shadows_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт теней даёт интриги за уровень набожности, успех враждебных происков и защитную скрытность против вражеских заговоров."
  dynasty_blood_legacy_modifier_1:0 "Пакт наследия (малый)"
  dynasty_blood_legacy_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, здоровье, продолжительность жизни, плодовитость и наследственный потенциал."
  dynasty_blood_legacy_modifier_2:0 "Пакт наследия (большой)"
  dynasty_blood_legacy_modifier_2_desc:0 "Ступень II (большая): Магия крови укрепляет наследственный потенциал, здоровье и продолжительность жизни, защищая от близкородственного скрещивания."
  dynasty_blood_legacy_modifier_3:0 "Пакт наследия (высший)"
  dynasty_blood_legacy_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт наследия даёт доблесть за уровень набожности, наследственное совершенство и значительно снижает риск близкородственного скрещивания."
  dynasty_blood_presence_modifier_1:0 "Пакт влияния (малый)"
  dynasty_blood_presence_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие и престиж, дипломатию, мнение, легитимность и успех личных происков."
  dynasty_blood_presence_modifier_2:0 "Пакт влияния (большой)"
  dynasty_blood_presence_modifier_2_desc:0 "Ступень II (большая): Магия крови усиливает дипломатию, ежемесячный престиж, мнение, легитимность и личные происки всего дома, сокращая период короткого правления."
  dynasty_blood_presence_modifier_3:0 "Пакт влияния (высший)"
  dynasty_blood_presence_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт влияния даёт дипломатию за уровень набожности, прирост легитимности, ежемесячный престиж и династическое признание."
  dynasty_blood_warband_modifier_1:0 "Пакт боевой дружины (малый)"
  dynasty_blood_warband_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, воинское мастерство, скорость передвижения и урон армии."
  dynasty_blood_warband_modifier_2:0 "Пакт боевой дружины (большой)"
  dynasty_blood_warband_modifier_2_desc:0 "Ступень II (большая): Магия крови усиливает воинское мастерство, урон и скорость передвижения армий всего дома."
  dynasty_blood_warband_modifier_3:0 "Пакт боевой дружины (высший)"
  dynasty_blood_warband_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт боевой дружины даёт военное дело за уровень набожности, число и размер профессиональных полков и смертоносный урон армии."
  dynasty_blood_mastery_modifier_1:0 "Пакт мастерства (малый)"
  dynasty_blood_mastery_modifier_1_desc:0 "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, учёность, опыт образов жизни и устойчивость к стрессу."
  dynasty_blood_mastery_modifier_2:0 "Пакт мастерства (большой)"
  dynasty_blood_mastery_modifier_2_desc:0 "Ступень II (большая): Магия крови ускоряет развитие образов жизни и получение благочестия, укрепляет здоровье и спокойствие."
  dynasty_blood_mastery_modifier_3:0 "Пакт мастерства (высший)"
  dynasty_blood_mastery_modifier_3_desc:0 "Ступень III (высшая): Совершенный пакт мастерства даёт место для личного догмата, учёность за уровень набожности и опыт образов жизни, устраняя культурные разногласия."
