  ancient_attuned: "Настройка на Древность"
  ancient_attuned_desc: "Даёт +1 опыта направления Древности в год."

  enlightenment_attuned: "Настройка на Просветление"
  enlightenment_attuned_desc: "Даёт +1 опыта направления Просветления в год."

  bloodline_attuned: "Настройка на Родословную"
  bloodline_attuned_desc: "Даёт +1 опыта направления Родословной в год."

  benediction_attuned: "Настройка на Благословение"
  benediction_attuned_desc: "Даёт +1 опыта направления Благословения в год."

  hematurgy_attuned: "Настройка на Гематургию"
  hematurgy_attuned_desc: "Даёт +1 опыта направления Гематургии в год."

  bloodlust_attuned: "Настройка на кровожадность"
  bloodlust_attuned_desc: "Даёт +1 опыта кровожадности в год."

  # Bloodline buffs
  bm_blessed_blood_modifier: "Благословенная кровь"
  bm_blessed_blood_modifier_desc: "Магия крови наделяет этого персонажа бодростью, ясностью ума и выносливостью."

  # Hematurgy Blood Curse
  bm_blood_curse_modifier: "Проклятие крови"
  bm_blood_curse_modifier_desc: "Этот персонаж поражён злым проклятием магии крови, истощающим жизненную силу, доблесть и умственные способности."

  # 1. Vegvisir (The Wayfinder)
  bm_stave_vegvisir: "Вегвизир"
  bm_stave_vegvisir_desc: "Гальдрастав-путеводитель, начертанный на плоти. Повышает скорость и безопасность путешествий, а также скорость передвижения.\n\n#bold Высшая способность — Идущий сквозь бурю#!: вдвое сокращает время восстановления кровавой охоты (до 6 месяцев) и гарантирует безопасные исходы добычи без неблагоприятных опасностей."

  # 2. Aegishjalmur (Helm of Awe)
  bm_stave_aegishjalmur: "Эгисхьяльм"
  bm_stave_aegishjalmur_desc: "Гальдрастав шлема ужаса, начертанный на лбу и груди. Повышает доблесть, преимущество и эффективность рыцарей.\n\n#bold Высшая способность — Ужас павших#!: в битвах и единоборствах вселяет страх в сердца вражеских командиров и чемпионов, вызывая сильный ужас и снижая доблесть и здоровье."

  bm_aegishjalmur_terror_modifier: "Поражён ужасом"
  bm_aegishjalmur_terror_modifier_desc: "Этот воин встретился с носителем совершенного Шлема ужаса. Его дух сломлен, а боевая доблесть и телесная крепость сильно подорваны."

  # 3. Feingur (Awakened Seed)
  bm_stave_feingur: "Фейнгюр"
  bm_stave_feingur_desc: "Гальдрастав плодородия и родословной, начертанный на плоти. Повышает плодовитость, продолжительность детородного возраста, наследование врождённых свойств, здоровье и сопротивляемость эпидемиям.\n\n#bold Высшая способность — Пробуждённое семя#!: удваивает опыт направления за рождение детей (+4 базово, +8 при наследовании; Родословная). Открывает взаимодействие, дарующее постоянное руническое благословение родичам по династии."

  bm_feingur_blessed_blood_modifier: "Пробуждённая руническая родословная"
  bm_feingur_blessed_blood_modifier_desc: "Жизненные потоки Фейнгюра навсегда вплетены в плоть этого персонажа, даруя постоянное телесное совершенство, остроту ума и высокую плодовитость."

  # 4. Nabrokarstafur (Flayed Tithe)
  bm_stave_nabrokarstafur: "Наброкарстав"
  bm_stave_nabrokarstafur_desc: "Гальдрастав содранной десятины, начертанный на плоти. Повышает ежемесячный доход и снижает содержание профессиональных полков ценой общего мнения.\n\n#bold Высшая способность — Содранная десятина#!: приносит #P +20 золота#! за каждую достопримечательность, посещённую в путешествии, а после победы в любой битве обращает #P 10%#! убитых врагов в золото (25–250 золота)."

  # 5. Hulinhjalmur (Unseen Shroud)
  bm_stave_hulinhjalmur: "Хулинхьяльм"
  bm_stave_hulinhjalmur_desc: "Гальдрастав незримого покрова, начертанный на плоти. Повышает шанс успеха враждебных происков, снижает шанс успеха вражеских происков и увеличивает ежемесячный опыт образа жизни.\n\n#bold Высшая способность — Незримый покров#!: удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год, а успешное убийство через происки приносит #P 1 порцию большой жизненной силы#!."

  bm_casting_exhaustion_modifier: "Магическое истощение"
  bm_casting_exhaustion_modifier_desc: "Истощение после поражения в поединке у Зеркала крови."
