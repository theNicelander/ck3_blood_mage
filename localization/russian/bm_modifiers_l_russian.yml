l_russian:
  lifedrained_modifier:0 "Вытянутая жизненная сила"
  lifedrained_modifier_desc:0 "Жизненная сила этого персонажа была вытянута магом крови."
  recently_lifedrained_modifier:0 "Недавнее вытягивание жизненной силы"
  recently_lifedrained_modifier_desc:0 "Маг крови недавно вытянул жизненную силу этого персонажа, оставив его в состоянии крайнего истощения. Некоторое время персонаж не выдержит повторного вытягивания."

  lifeforce_modifier_superior:0 "Высшая жизненная сила"
  lifeforce_modifier_superior_desc:0 "Сильно сгущённый запас жизненной сущности, полученный соединением малой и большой жизненной силы."

  lifeforce_modifier_minor:0 "Малая жизненная сила"
  lifeforce_modifier_minor_desc:0 "Скромный запас жизненной сущности, собранный малыми обрядами крови и готовый к направлению или сгущению."

  lifeforce_modifier_major:0 "Большая жизненная сила"
  lifeforce_modifier_major_desc:0 "Мощный запас сгущённой жизненной силы, добытый из крови смертных и готовый усилить обряды образования и родословной."

  lifeforce_modifier_negative_superior:0 "Применить высшую магию крови"
  lifeforce_modifier_negative_superior_desc:0 "Чрезмерное напряжение при направлении высшей жизненной силы оставило этого персонажа совершенно истощённым."

  lifeforce_modifier_negative_minor:0 "Применение малой магии крови"
  lifeforce_modifier_negative_minor_desc:0 "Остаточное напряжение от направления малой жизненной силы временно истощило жизненную энергию, доблесть и бодрость этого персонажа."

  lifeforce_modifier_negative_major:0 "Применение большой магии крови"
  lifeforce_modifier_negative_major_desc:0 "Тяжёлое напряжение от проведения больших обрядов крови временно истощило жизненную энергию, доблесть и бодрость этого персонажа."

  # Dynasty
  blood_mage_coven_modifier:0 "Усиленная кровь династии"
  blood_mage_coven_modifier_desc:0 "Усиленная кровь династии"

  # Grant / Recieve blood magic
  granted_blood_magic_modifier:0 "Дар магии крови"
  granted_blood_magic_modifier_desc:0 "Этот персонаж недавно получил дар магии крови от другого"

  # Spend lifeforce on skills
  diplomacy_lifeforce_modifier:0 "Усиление дипломатии"
  diplomacy_lifeforce_modifier_desc:0 "Магия крови временно улучшает дипломатию и даёт +10 ежемесячного опыта дипломатического образа жизни (+30 за квартал)"

  martial_lifeforce_modifier:0 "Усиление военного дела"
  martial_lifeforce_modifier_desc:0 "Магия крови временно улучшает военное дело и даёт +10 ежемесячного опыта военного образа жизни (+30 за квартал)"

  stewardship_lifeforce_modifier:0 "Усиление управления"
  stewardship_lifeforce_modifier_desc:0 "Магия крови временно улучшает управление и даёт +10 ежемесячного опыта образа жизни управления (+30 за квартал)"

  intrigue_lifeforce_modifier:0 "Усиление интриг"
  intrigue_lifeforce_modifier_desc:0 "Магия крови временно улучшает интриги и даёт +10 ежемесячного опыта образа жизни интриг (+30 за квартал)"

  learning_lifeforce_modifier:0 "Усиление учёности"
  learning_lifeforce_modifier_desc:0 "Магия крови временно улучшает учёность и даёт +10 ежемесячного опыта образа жизни учёности (+30 за квартал)"

  prowess_lifeforce_modifier:0 "Усиление доблести"
  prowess_lifeforce_modifier_desc:0 "Магия крови временно улучшает доблесть и даёт +10 ежемесячного опыта военного образа жизни (+30 за квартал)"

  exp_lifeforce_modifier:0 "Усиление получения опыта"
  exp_lifeforce_modifier_desc:0 "Магия крови временно ускоряет получение любого опыта и даёт +5 ежемесячного опыта активного образа жизни (+15 за квартал)"

