  drained_beggar_holding: "Вытягивание жизни нищего"
  drained_beggar_holding_desc: "Жизнь уличного нищего была вытянута"

  healed_beggar_holding_1: "Исцеление раненого нищего"
  healed_beggar_holding_1_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_2: "Исцеление нищего от тифа"
  healed_beggar_holding_2_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_3: "Исцеление слепого нищего"
  healed_beggar_holding_3_desc: "Уличный нищий был исцелён"

  healed_beggar_holding_4: "Исцеление нищего от рака"
  healed_beggar_holding_4_desc: "Уличный нищий был исцелён"

  magic_opinion_positive: "Магия крови"
  magic_opinion_positive_desc: "Магия крови"

  magic_opinion_positive_permanent: "Даровал магию крови"
  magic_opinion_positive_permanent_desc: "Этот персонаж наделил меня магией крови."

  magic_opinion_negative: "Магия крови"
  magic_opinion_negative_desc: "Магия крови"

  made_me_a_blood_mage: "Дар магии крови"
  made_me_a_blood_mage_desc: "Дар магии крови"

  cured_my_illness: "Исцеление моего недуга"
  cured_my_illness_desc: "Исцеление моего недуга"

  lifedrained_me: "Вытягивание моей жизненной силы"
  lifedrained_me_desc: "Вытягивание моей жизненной силы"

  # Dynasty modifiers (3-Tier Covenants)
  bm_covenant_radiance_minor_modifier: "Пакт сияния (малый)"
  bm_covenant_radiance_minor_modifier_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие и престиж, дипломатию, мнение, легитимность и успех личных происков."
  bm_covenant_radiance_major_modifier: "Пакт сияния (большой)"
  bm_covenant_radiance_major_modifier_desc: "Ступень II (большая): Магия крови усиливает дипломатию, ежемесячный престиж, мнение, легитимность и личные происки всего дома, сокращая период короткого правления."
  bm_covenant_radiance_superior_modifier: "Пакт сияния (высший)"
  bm_covenant_radiance_superior_modifier_desc: "Ступень III (высшая): совершенный пакт сияния даёт дипломатию за уровень набожности, прирост легитимности, ежемесячный престиж и ячейку личного догмата."

  bm_covenant_fury_minor_modifier: "Пакт ярости (малый)"
  bm_covenant_fury_minor_modifier_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, воинское мастерство, одного дополнительного рыцаря и урон армии, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."
  bm_covenant_fury_major_modifier: "Пакт ярости (большой)"
  bm_covenant_fury_major_modifier_desc: "Ступень II (большая): Магия крови усиливает воинское мастерство, урон армий и предел рыцарей всего дома, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."
  bm_covenant_fury_superior_modifier: "Пакт ярости (высший)"
  bm_covenant_fury_superior_modifier_desc: "Ступень III (высшая): Совершенный пакт ярости даёт военное дело за уровень набожности, число и размер профессиональных полков, предел рыцарей и урон армии, ежемесячное благочестие за рыцаря и эффективность рыцарей за единицу доблести."

  bm_covenant_fortune_minor_modifier: "Пакт удачи (малый)"
  bm_covenant_fortune_minor_modifier_desc: "Ступень I (малая): Магия крови дарует дому ежемесячное благочестие, доход, управление, рост процветания и снижение стоимости строительства."
  bm_covenant_fortune_major_modifier: "Пакт удачи (большой)"
  bm_covenant_fortune_major_modifier_desc: "Ступень II (большая): Магия крови повышает доход и рост процветания, снижает стоимость строительства и содержание профессиональных полков."
  bm_covenant_fortune_superior_modifier: "Пакт удачи (высший)"
  bm_covenant_fortune_superior_modifier_desc: "Ступень III (высшая): Совершенный пакт удачи расширяет домен, обогащает владения и даёт управление за уровень набожности."

  bm_covenant_cunning_minor_modifier: "Пакт хитрости (малый)"
  bm_covenant_cunning_minor_modifier_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, интриги и успех враждебных происков."
  bm_covenant_cunning_major_modifier: "Пакт хитрости (большой)"
  bm_covenant_cunning_major_modifier_desc: "Ступень II (большая): Магия крови усиливает интриги и скрытность происков, ограничивая успех вражеских заговоров против вашего дома."
  bm_covenant_cunning_superior_modifier: "Пакт хитрости (высший)"
  bm_covenant_cunning_superior_modifier_desc: "Ступень III (высшая): Совершенный пакт хитрости даёт интриги за уровень набожности, успех враждебных происков и защитную скрытность против вражеских заговоров."

  bm_covenant_wisdom_minor_modifier: "Пакт мудрости (малый)"
  bm_covenant_wisdom_minor_modifier_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, учёность, опыт образов жизни и устойчивость к стрессу, множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности."
  bm_covenant_wisdom_major_modifier: "Пакт мудрости (большой)"
  bm_covenant_wisdom_major_modifier_desc: "Ступень II (большая): Магия крови ускоряет получение опыта образа жизни и благочестия, укрепляет здоровье и устойчивость к стрессу, повышает множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности."
  bm_covenant_wisdom_superior_modifier: "Пакт мудрости (высший)"
  bm_covenant_wisdom_superior_modifier_desc: "Ступень III (высшая): Совершенный пакт мудрости даёт место для личного догмата, учёность за уровень набожности и опыт образов жизни, множитель ежемесячного благочестия за рыцаря и эффективность рыцарей за единицу учёности. Также снимает штраф к мнению из-за культуры."

  bm_covenant_ancient_minor_modifier: "Пакт древности (малый)"
  bm_covenant_ancient_minor_modifier_desc: "Ступень I (малая): Магия крови дарует всему дому ежемесячное благочестие, здоровье, продолжительность жизни, плодовитость и наследственный потенциал."
  bm_covenant_ancient_major_modifier: "Пакт древности (большой)"
  bm_covenant_ancient_major_modifier_desc: "Ступень II (большая): Магия крови укрепляет наследственный потенциал, здоровье и продолжительность жизни, защищая от близкородственного скрещивания."
  bm_covenant_ancient_superior_modifier: "Пакт древности (высший)"
  bm_covenant_ancient_superior_modifier_desc: "Ступень III (высшая): Совершенный пакт древности даёт доблесть за уровень набожности, наследственное совершенство, ежемесячный опыт образа жизни и значительно снижает риск близкородственного скрещивания."

  bm_covenant_acolyte_modifier: "Пакт посвящения"
  bm_covenant_acolyte_modifier_desc: "Магия крови даёт всему дому +1 благочестия в месяц. Ещё не посвящённые члены дома с уровнем набожности 3 или выше могут стать адептами крови."

  # Personal modifiers
  blood_charisma_modifier: "Харизма крови"
  blood_charisma_modifier_desc: "Ваши слова и влияние усилены магией крови."

  blood_fury_modifier: "Яростная кровь"
  blood_fury_modifier_desc: "Магия крови усиливает ваше воинское мастерство и командование рыцарями."

  blood_prosperity_modifier: "Удачливая кровь"
  blood_prosperity_modifier_desc: "Ваше управление усилено магией крови."

  blood_shadows_modifier: "Хитрая кровь"
  blood_shadows_modifier_desc: "Магия крови усиливает ваши происки и заговоры."

  blood_insight_modifier: "Проницательность крови"
  blood_insight_modifier_desc: "Тайные знания текут в вашей крови."

  blood_legacy_modifier: "Наследие крови"
  blood_legacy_modifier_desc: "Магия крови усиливает ваш наследственный потенциал."

  blood_expertise_modifier: "Мастерство крови"
  blood_expertise_modifier_desc: "Магия крови ускоряет ваше обучение."

  # Trait drain attempted
  trait_drain_attempted: "Недавняя попытка поглощения свойства"
  trait_drain_attempted_desc: "Нужно подождать, прежде чем снова пытаться поглотить свойство"

  trait_drained_attempted_modifier: "Попытка поглощения магом крови"
  trait_drained_attempted_modifier_desc: "Моё тело ослаблено недавней попыткой поглощения"

