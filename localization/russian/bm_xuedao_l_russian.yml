  xuedao_faith_adherent: "Последователь Сюэдао"
  xuedao_faith_adherent_plural: "Последователи Сюэдао"
  xuedao_faith_desc: "Сюэдао — Путь крови — считает жизненный багровый поток космической квинтэссенцией, связывающей Небо, Землю и Человека. Опираясь на священные вершины и родословные Срединной равнины, последователи соединяют внутреннюю жизненную силу с кровью династий и геомантическими потоками земли."

  # Mainline Rite
  xuedao_faith_rite: "Путь крови"
  xuedao_faith_rite_desc: "Священные обряды предков и традиции жизненной силы Сюэдао."

