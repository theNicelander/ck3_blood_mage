l_russian:
 bm_blood_berserkers: "Берсерки крови"
 bm_blood_berserkers_flavor: "#F Фанатичные ударные воины, которые перед битвой насыщаются малой жизненной силой и чертят на лбах Эгисхьяльм жертвенной кровью. Отказавшись от тяжёлых лат ради не чувствующего боли неистовства, они врезаются во вражеские ряды и тяжёлыми двуручными секирами прорубают деревянные частоколы и замковые ворота.#!"
 bm_blood_behemoths: "Скованные кровью исполины"
 bm_blood_behemoths_flavor: "#F Отряд огромных бледных созданий из плоти, выкованных из высшей жизненной силы по подобию великих оккультных воителей. Скованные железом с рунической резьбой, не знающие боли, усталости и страха, они входят в самую гущу боя, словно живые тараны, и голыми руками сокрушают замковые стены.#!"
