 bm_blood_berserkers_flavor: "#F Не чувствующие боли ударные воины кровью чертят на лбах Эгисхьяльм и двуручными секирами прорубают частоколы и ворота.#!\n#help Требуется маг крови с уровнем [GetModifier('piety_level_2').GetNameWithTooltip] ([piety_level|E]) и 250 @piety_icon![piety|E].#!"
 bm_blood_behemoths: "Скованные кровью исполины"
 bm_blood_behemoths_flavor: "#F Исполинские создания из плоти, выкованные из высшей жизненной силы. Бесстрашные и скованные рунами, они сокрушают ряды пехоты и рушат стены голыми руками.#!\n#help Требуется маг крови с уровнем [GetModifier('piety_level_4').GetNameWithTooltip] ([piety_level|E]) и 400 @piety_icon![piety|E].#!"
