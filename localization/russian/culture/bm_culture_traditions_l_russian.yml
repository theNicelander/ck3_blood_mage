l_russian:
 bm_tradition_althingi_name: "Содружество альтинга"
 bm_tradition_althingi_desc: "В стране без королей верховная власть принадлежит закону. На ежегодном альтинге законоговоритель зачитывает законы, а споры решаются по правилам хольмганга. Соперничающие вожди направляют свои амбиции на изучение законов и составление хроник на пергаменте. Так даже в самых отдалённых долинах царит порядок и кипит жизнь."
 cannot_have_tradition_things: "$cannot_combine_tradition_trigger_desc$ #high $tradition_things_name$#!"

 bm_tradition_verbudir_name: "Вербудир"
 bm_tradition_verbudir_desc: "Там, где земля даёт мало, море даёт всё. Эта культура процветает на побережье вокруг вербудир — сезонных становищ рыбаков, корабелов и купцов. В портах бойко торгуют вяленой рыбой и лесом, а команды судов с редкой сноровкой и быстротой проходят опасные морские и речные пути."
 cannot_have_tradition_maritime_mercantilism: "$cannot_combine_tradition_trigger_desc$ #high $tradition_maritime_mercantilism_name$#!"
 cannot_have_tradition_fishermen: "$cannot_combine_tradition_trigger_desc$ #high $tradition_fishermen_name$#!"
