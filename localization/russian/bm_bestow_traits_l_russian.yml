l_russian:
  bm_bestow_traits_interaction:0 "Даровать свойства крови"
  bm_bestow_traits_interaction_desc:0 "Потратить большую жизненную силу и благочестие, чтобы установить связь с кровью персонажа [recipient.GetFirstName] и передать собственные наследственные и физические дары телу и разуму."
  bm_bestow_traits_interaction_tooltip:0 "Передать одно из ваших положительных свойств персонажу [recipient.GetShortUINameNoTooltip]"
  bm_bestow_traits_interaction_confirm:0 "Начать переливание"
  bm_bestow_traits_lifeforce_tt:0 "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_bestow_traits_can_bestow_tt:0 "У вас есть хотя бы одно положительное свойство, которое [recipient.GetShortUINameNoTooltip] может получить или улучшить"
  bm_bestow_traits.0001.intellect.cannot_advance_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством интеллекта вашего уровня или выше"
  bm_bestow_traits.0001.physique.cannot_advance_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством телосложения вашего уровня или выше"
  bm_bestow_traits.0001.beauty.cannot_advance_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством красоты вашего уровня или выше"
  bm_bestow_traits.0001.fecund.already_has_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Плодовитость»"
  bm_bestow_traits.0001.pure_blooded.already_has_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Чистокровность»"
  bm_bestow_traits.0001.giant.already_has_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Гигантизм»"
  bm_bestow_traits.0001.strong.already_has_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Сила»"
  bm_bestow_traits.0001.shrewd.already_has_tt:0 "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Проницательность»"
  bm_bestow_traits.0001.title:0 "Дарование свойств крови: связь с персонажем [recipient.GetFirstName]"
  bm_bestow_traits.0001.desc:0 "Благодаря мастерству искусств крови и расходованию большой жизненной силы мы проникаем глубоко в пульсирующие вены персонажа [recipient.GetUIName].\n\nОбщее происхождение и священные узы открывают путь между нашими душами. Мы можем вплести собственные врождённые достоинства прямо в чужую кровь, совершенствуя тело, интеллект или облик.\n\nКакой дар нашей крови получит [recipient.GetFirstName]?"
  bm_bestow_traits.0001.intellect:0 "Передать наши интеллектуальные дары"
  bm_bestow_traits.0001.physique:0 "Передать нашу физическую мощь"
  bm_bestow_traits.0001.beauty:0 "Передать наше кровавое изящество"
  bm_bestow_traits.0001.fecund:0 "Передать нашу плодовитость"
  bm_bestow_traits.0001.pure_blooded:0 "Передать наше чистокровное наследие"
  bm_bestow_traits.0001.giant:0 "Передать наш исполинский рост"
  bm_bestow_traits.0001.strong:0 "Передать нашу несокрушимую силу"
  bm_bestow_traits.0001.shrewd:0 "Передать нашу острую проницательность"
  bm_bestow_traits.0001.cancel:0 "Назад"
  bm_bestow_traits.duel.success:0 "Передать врождённое свойство"
  bm_bestow_traits.duel.failure:0 "Ваша сущность не приживается"
  bm_bestow_traits.toast.intellect.title:0 "Интеллект дарован"
  bm_bestow_traits.toast.intellect.desc:0 "[recipient.GetFirstName] усваивает вашу умственную сущность, расширяя возможности разума."
  bm_bestow_traits.toast.physique.title:0 "Телосложение даровано"
  bm_bestow_traits.toast.physique.desc:0 "[recipient.GetFirstName] усваивает вашу физическую сущность, укрепляя тело."
  bm_bestow_traits.toast.beauty.title:0 "Красота дарована"
  bm_bestow_traits.toast.beauty.desc:0 "[recipient.GetFirstName] усваивает вашу изящество, совершенствуя облик."
  bm_bestow_traits.toast.fecund.title:0 "Плодовитость дарована"
  bm_bestow_traits.toast.fecund.desc:0 "[recipient.GetFirstName] усваивает вашу плодородную сущность."
  bm_bestow_traits.toast.pure_blooded.title:0 "Чистокровность дарована"
  bm_bestow_traits.toast.pure_blooded.desc:0 "[recipient.GetFirstName] получает вашу незапятнанную родословную."
  bm_bestow_traits.toast.giant.title:0 "Гигантизм дарован"
  bm_bestow_traits.toast.giant.desc:0 "[recipient.GetFirstName] получает ваш исполинский рост."
  bm_bestow_traits.toast.strong.title:0 "Сила дарована"
  bm_bestow_traits.toast.strong.desc:0 "[recipient.GetFirstName] усваивает вашу несокрушимую силу."
  bm_bestow_traits.toast.shrewd.title:0 "Проницательность дарована"
  bm_bestow_traits.toast.shrewd.desc:0 "[recipient.GetFirstName] усваивает вашу острую проницательность."
  bm_bestow_traits.toast.failure.title:0 "Переливание не удалось"
  bm_bestow_traits.toast.failure.desc:0 "Мысленная связь нарушилась, и кровь персонажа [recipient.GetFirstName] не смогла усвоить вашу сущность."
