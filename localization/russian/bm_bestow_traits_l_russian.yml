l_russian:
  bm_bestow_traits_interaction: "Даровать свойства крови"
  bm_bestow_traits_interaction_desc: "Потратить большую жизненную силу и благочестие, чтобы установить связь с кровью персонажа [recipient.GetFirstName] и передать собственные наследственные и физические дары телу и разуму."
  bm_bestow_traits_interaction_tooltip: "Передать одно из ваших положительных свойств персонажу [recipient.GetShortUINameNoTooltip]"
  bm_bestow_traits_interaction_confirm: "Начать переливание"

  bm_bestow_traits_can_bestow_tt: "У вас есть хотя бы одно положительное свойство, которое [recipient.GetShortUINameNoTooltip] может получить или улучшить"

  bm_bestow_traits.0001.intellect.cannot_advance_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством интеллекта вашего уровня или выше"
  bm_bestow_traits.0001.physique.cannot_advance_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством телосложения вашего уровня или выше"
  bm_bestow_traits.0001.beauty.cannot_advance_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством красоты вашего уровня или выше"
  bm_bestow_traits.0001.fecund.already_has_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Плодовитость»"
  bm_bestow_traits.0001.pure_blooded.already_has_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Чистокровность»"
  bm_bestow_traits.0001.giant.already_has_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Гигантизм»"
  bm_bestow_traits.0001.strong.already_has_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Сила»"
  bm_bestow_traits.0001.shrewd.already_has_tt: "[recipient.GetShortUINameNoTooltip] уже обладает свойством «Проницательность»"

  bm_bestow_traits.0001.title: "Дарование свойств крови: связь с персонажем [recipient.GetFirstName]"
  bm_bestow_traits.0001.desc: "Благодаря владению магией крови и расходованию большой жизненной силы мы проникаем глубоко в пульсирующие вены персонажа [recipient.GetUIName].\n\nОбщее происхождение и священные узы открывают путь между нашими душами. Мы можем вплести собственные врождённые достоинства прямо в чужую кровь, совершенствуя тело, интеллект или облик.\n\nКакой дар нашей крови получит [recipient.GetFirstName]?"
  bm_bestow_traits.0001.intellect: "Передать наши интеллектуальные дары"
  bm_bestow_traits.0001.physique: "Передать нашу физическую мощь"
  bm_bestow_traits.0001.beauty: "Передать красоту нашей крови"
  bm_bestow_traits.0001.fecund: "Передать нашу плодовитость"
  bm_bestow_traits.0001.pure_blooded: "Передать наше чистокровное наследие"
  bm_bestow_traits.0001.giant: "Передать наш исполинский рост"
  bm_bestow_traits.0001.strong: "Передать нашу несокрушимую силу"
  bm_bestow_traits.0001.shrewd: "Передать нашу острую проницательность"
  bm_bestow_traits.0001.cancel: "Назад"

  bm_bestow_traits.duel.success: "Передать врождённое свойство"
  bm_bestow_traits.duel.failure: "Ваша сущность не приживается"

  bm_bestow_traits.toast.intellect.title: "Интеллект дарован"
  bm_bestow_traits.toast.intellect.desc: "[recipient.GetFirstName] усваивает вашу умственную сущность, расширяя возможности разума."

  bm_bestow_traits.toast.physique.title: "Телосложение даровано"
  bm_bestow_traits.toast.physique.desc: "[recipient.GetFirstName] усваивает вашу физическую сущность, укрепляя тело."

  bm_bestow_traits.toast.beauty.title: "Красота дарована"
  bm_bestow_traits.toast.beauty.desc: "[recipient.GetFirstName] усваивает вашу изящество, совершенствуя облик."

  bm_bestow_traits.toast.fecund.title: "Плодовитость дарована"
  bm_bestow_traits.toast.fecund.desc: "[recipient.GetFirstName] усваивает вашу плодородную сущность."

  bm_bestow_traits.toast.pure_blooded.title: "Чистокровность дарована"
  bm_bestow_traits.toast.pure_blooded.desc: "[recipient.GetFirstName] получает вашу незапятнанную родословную."

  bm_bestow_traits.toast.giant.title: "Гигантизм дарован"
  bm_bestow_traits.toast.giant.desc: "[recipient.GetFirstName] получает ваш исполинский рост."

  bm_bestow_traits.toast.strong.title: "Сила дарована"
  bm_bestow_traits.toast.strong.desc: "[recipient.GetFirstName] усваивает вашу несокрушимую силу."

  bm_bestow_traits.toast.shrewd.title: "Проницательность дарована"
  bm_bestow_traits.toast.shrewd.desc: "[recipient.GetFirstName] усваивает вашу острую проницательность."

  bm_bestow_traits.toast.failure.title: "Переливание не удалось"
  bm_bestow_traits.toast.failure.desc: "Мысленная связь нарушилась, и кровь персонажа [recipient.GetFirstName] не смогла усвоить вашу сущность."
