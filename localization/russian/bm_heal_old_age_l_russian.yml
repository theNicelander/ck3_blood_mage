  bm_heal_old_age_resource_requirement_tt: "Требуется [piety_i]50 благочестия и малая жизненная сила либо [piety_i]150 благочестия и большая жизненная сила."

  # Event
  bm_heal_old_age.0001.title: "Омоложение стареющего тела"
  bm_heal_old_age.0001.desc: "Старость подтачивает плоть и разум смертных, ослабляя мышцы и усугубляя телесные недуги. Умело направленная жизненная сила способна замедлить это разрушение, обратить его вспять или полностью избавить от недуга.\n\nВыберите, какой недуг лечить."
  bm_heal_old_age.0001.cancel: "Назад"

