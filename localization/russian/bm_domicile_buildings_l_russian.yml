 domicile_building_parameter_bm_blood_shrine_tier_3:0 "Излучает жизненную сущность для всех в лагере или при дворе (#P +0.6#! благочестия, #P +0.6#! здоровья, #P +6#! к продолжительности жизни, #P +15%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_4:0 "Излучает жизненную сущность для всех в лагере или при дворе (#P +0.8#! благочестия, #P +0.8#! здоровья, #P +8#! к продолжительности жизни, #P +20%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_5:0 "Излучает жизненную сущность для всех в лагере или при дворе (#P +1.0#! благочестия, #P +1.0#! здоровья, #P +10#! к продолжительности жизни, #P +25%#! к наследованию положительных врождённых свойств)"

