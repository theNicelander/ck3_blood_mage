l_russian:
 bm_domicile_blood_shrine_01: "Святилище крови"
 bm_domicile_blood_shrine_01_desc: "Освящённое святилище крови, излучающее жизненную сущность по всему лагерю или поместью и укрепляющее всех его обитателей."
 bm_domicile_blood_shrine_01_domicile_building: "Святилище крови"
 bm_domicile_blood_shrine_01_domicile_building_desc: "Освящённое святилище крови, излучающее жизненную сущность по всему лагерю или поместью и укрепляющее всех его обитателей."

 bm_domicile_blood_shrine_02: "Святилище крови"
 bm_domicile_blood_shrine_02_desc: "Расширенное святилище крови, непрерывно очищающее и оживляющее кровь находящихся поблизости последователей и придворных."
 bm_domicile_blood_shrine_02_domicile_building: "Святилище крови"
 bm_domicile_blood_shrine_02_domicile_building_desc: "Расширенное святилище крови, непрерывно очищающее и оживляющее кровь находящихся поблизости последователей и придворных."

 bm_domicile_blood_shrine_03: "Святилище крови"
 bm_domicile_blood_shrine_03_desc: "Укреплённое святилище крови, где перегоняют сгущённую жизненную силу, даруя лагерю или двору неестественную стойкость и долголетие."
 bm_domicile_blood_shrine_03_domicile_building: "Святилище крови"
 bm_domicile_blood_shrine_03_domicile_building_desc: "Укреплённое святилище крови, где перегоняют сгущённую жизненную силу, даруя лагерю или двору неестественную стойкость и долголетие."

 bm_domicile_blood_shrine_04: "Святилище крови"
 bm_domicile_blood_shrine_04_desc: "Величественное святилище крови с глубоко вырезанными кровавыми символами, постоянно излучающее защитную жизненную силу и божественное рвение."
 bm_domicile_blood_shrine_04_domicile_building: "Святилище крови"
 bm_domicile_blood_shrine_04_domicile_building_desc: "Величественное святилище крови с глубоко вырезанными кровавыми символами, постоянно излучающее защитную жизненную силу и божественное рвение."

 bm_domicile_blood_shrine_05: "Святилище крови"
 bm_domicile_blood_shrine_05_desc: "Вершина искусства святилищ крови. Его бурлящая жизненная сущность отгоняет смерть и старость, очищая и совершенствуя родословные поколение за поколением."
 bm_domicile_blood_shrine_05_domicile_building: "Святилище крови"
 bm_domicile_blood_shrine_05_domicile_building_desc: "Вершина искусства святилищ крови. Его бурлящая жизненная сущность отгоняет смерть и старость, очищая и совершенствуя родословные поколение за поколением."

 # Domicile Building Parameters
 domicile_building_parameter_bm_blood_shrine_tier_1: "Излучает жизненную силу для всех в лагере или при дворе (#P +0.25#! благочестия, #P +0.1#! здоровья, #P +1#! к продолжительности жизни, #P +2.5%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_2: "Излучает жизненную силу для всех в лагере или при дворе (#P +0.5#! благочестия, #P +0.2#! здоровья, #P +2#! к продолжительности жизни, #P +5%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_3: "Излучает жизненную силу для всех в лагере или при дворе (#P +0.75#! благочестия, #P +0.3#! здоровья, #P +3#! к продолжительности жизни, #P +7.5%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_4: "Излучает жизненную силу для всех в лагере или при дворе (#P +1.0#! благочестия, #P +0.4#! здоровья, #P +4#! к продолжительности жизни, #P +10%#! к наследованию положительных врождённых свойств)"
 domicile_building_parameter_bm_blood_shrine_tier_5: "Излучает жизненную силу для всех в лагере или при дворе (#P +1.25#! благочестия, #P +0.5#! здоровья, #P +5#! к продолжительности жизни, #P +12.5%#! к наследованию положительных врождённых свойств)"

 # Courtier / Camp Follower Aura Modifiers
 bm_blood_shrine_aura_tier_1: "Святилище крови"
 bm_blood_shrine_aura_tier_1_desc: "Живительная жизненная сущность святилища крови окутывает этого персонажа."
 bm_blood_shrine_aura_tier_2: "Святилище крови"
 bm_blood_shrine_aura_tier_2_desc: "Живительная жизненная сущность расширенного святилища крови окутывает этого персонажа."
 bm_blood_shrine_aura_tier_3: "Святилище крови"
 bm_blood_shrine_aura_tier_3_desc: "Живительная жизненная сущность укреплённого святилища крови окутывает этого персонажа."
 bm_blood_shrine_aura_tier_4: "Святилище крови"
 bm_blood_shrine_aura_tier_4_desc: "Живительная жизненная сущность величественного святилища крови окутывает этого персонажа."
 bm_blood_shrine_aura_tier_5: "Святилище крови"
