l_russian:
 bm_domicile_blood_shrine_01:0 "Святилище крови"
 bm_domicile_blood_shrine_01_desc:0 "Освящённое святилище крови, излучающее жизненную сущность по всему лагерю или поместью и укрепляющее всех его обитателей."
 bm_domicile_blood_shrine_01_domicile_building:0 "Святилище крови"
 bm_domicile_blood_shrine_01_domicile_building_desc:0 "Освящённое святилище крови, излучающее жизненную сущность по всему лагерю или поместью и укрепляющее всех его обитателей."

 bm_domicile_blood_shrine_02:0 "Святилище крови"
 bm_domicile_blood_shrine_02_desc:0 "Расширенное святилище крови, непрерывно очищающее и оживляющее кровь находящихся поблизости последователей и придворных."
 bm_domicile_blood_shrine_02_domicile_building:0 "Святилище крови"
 bm_domicile_blood_shrine_02_domicile_building_desc:0 "Расширенное святилище крови, непрерывно очищающее и оживляющее кровь находящихся поблизости последователей и придворных."

 bm_domicile_blood_shrine_03:0 "Святилище крови"
 bm_domicile_blood_shrine_03_desc:0 "Укреплённое святилище крови, где перегоняют сгущённую жизненную силу, даруя лагерю или двору неестественную стойкость и долголетие."
 bm_domicile_blood_shrine_03_domicile_building:0 "Святилище крови"
 bm_domicile_blood_shrine_03_domicile_building_desc:0 "Укреплённое святилище крови, где перегоняют сгущённую жизненную силу, даруя лагерю или двору неестественную стойкость и долголетие."

 bm_domicile_blood_shrine_04:0 "Святилище крови"
 bm_domicile_blood_shrine_04_desc:0 "Величественное святилище крови с глубоко вырезанными кровавыми символами, постоянно излучающее защитную жизненную силу и божественное рвение."
 bm_domicile_blood_shrine_04_domicile_building:0 "Святилище крови"
 bm_domicile_blood_shrine_04_domicile_building_desc:0 "Величественное святилище крови с глубоко вырезанными кровавыми символами, постоянно излучающее защитную жизненную силу и божественное рвение."

 bm_domicile_blood_shrine_05:0 "Святилище крови"
 bm_domicile_blood_shrine_05_desc:0 "Вершина искусства святилищ крови. Его бурлящая жизненная сущность отгоняет смерть и старость, очищая и совершенствуя родословные поколение за поколением."
 bm_domicile_blood_shrine_05_domicile_building:0 "Святилище крови"
 bm_domicile_blood_shrine_05_domicile_building_desc:0 "Вершина искусства святилищ крови. Его бурлящая жизненная сущность отгоняет смерть и старость, очищая и совершенствуя родословные поколение за поколением."

 # Domicile Building Parameters
