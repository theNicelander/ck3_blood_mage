 bm_heal_lifeforce_status_ready: "#P @health_icon! Можно исцелить#!"
 bm_heal_lifeforce_status_unready: "#low @health_icon! Нужна жизненная сила#!"

 bm_action_can_lifedrain_prisoner: "@bm_hematurgy_discipline_icon! Вы можете вытянуть жизненную силу пленника"
 bm_action_can_lifedrain_prisoner_label: "@bm_hematurgy_discipline_icon! Вы можете вытянуть жизненную силу персонажа [recipient.GetShortUINameNoTooltip]"
 bm_action_can_lifedrain_prisoner_desc: "[recipient.GetShortUIName] находится в вашей темнице. Вы можете собрать кровь и получить жизненную силу."
