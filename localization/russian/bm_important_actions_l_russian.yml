l_russian:
 bm_action_can_heal: "@bm_ancient_discipline_icon! Вы можете кого-то исцелить"
 bm_action_can_heal_label: "@bm_ancient_discipline_icon! Вы можете исцелить персонажа [recipient.GetShortUINameNoTooltip], [actor.Custom2('bm_heal_lifeforce_status_current_situation', recipient)]"
 bm_action_can_heal_desc: "[recipient.GetShortUIName] страдает от болезни или ранения. Вы можете потратить жизненную силу на исцеление."
 bm_action_can_heal_click: "#I Нажмите, чтобы исцелить персонажа [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_heal_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip], [actor.Custom2('bm_heal_lifeforce_status_current_situation', recipient)]"
 bm_action_can_heal_combined_group_label: "@bm_ancient_discipline_icon! Вы можете кого-то исцелить"
 bm_action_can_heal_combined_group_name: "$bm_action_can_heal$"
 bm_action_can_heal_combined_group_description: "Несколько важных для вас или вашей державы персонажей ранены или больны. Вы можете потратить жизненную силу на их исцеление."
 bm_action_can_heal_unimportant: "@warning_icon! #X Вам не хватает жизненной силы, чтобы исцелить [recipient.GetHerHim]#!"
 bm_action_can_heal_combined_unimportant: "@warning_icon! #X Ни на одно из этих исцелений не хватает жизненной силы#!"
 bm_heal_lifeforce_status_ready: "#P @health_icon! Можно исцелить#!"
 bm_heal_lifeforce_status_unready: "#low @health_icon! Нужна жизненная сила#!"

 bm_action_can_lifedrain_prisoner: "@bm_ancient_discipline_icon! Вы можете вытянуть жизненную силу пленника"
 bm_action_can_lifedrain_prisoner_label: "@bm_ancient_discipline_icon! Вы можете вытянуть жизненную силу персонажа [recipient.GetShortUINameNoTooltip]"
 bm_action_can_lifedrain_prisoner_desc: "[recipient.GetShortUIName] находится в вашей темнице. Вы можете собрать кровь и получить жизненную силу."
 bm_action_can_lifedrain_prisoner_click: "#I Нажмите, чтобы вытянуть жизненную силу персонажа [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_lifedrain_prisoner_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_lifedrain_prisoner_combined_group_label: "@bm_ancient_discipline_icon! Вы можете вытянуть жизненную силу пленника"
 bm_action_can_lifedrain_prisoner_combined_group_name: "$bm_action_can_lifedrain_prisoner$"
 bm_action_can_lifedrain_prisoner_combined_group_description: "В вашей темнице содержится несколько пленников. Вы можете собрать их кровь и получить жизненную силу."

 bm_action_can_blood_duel_prisoner: "@bm_ancient_discipline_icon! Можно вызвать пленника на поединок в кровавой яме"
 bm_action_can_blood_duel_prisoner_label: "@bm_ancient_discipline_icon! Можно сразиться с персонажем [recipient.GetShortUINameNoTooltip] в кровавой яме"
 bm_action_can_blood_duel_prisoner_desc: "[recipient.GetShortUIName] — грозный пленник (20+ доблести). Можно вызвать этого персонажа на поединок в кровавой яме, чтобы получить шанс сгустить высшую жизненную силу."
 bm_action_can_blood_duel_prisoner_click: "#I Нажмите, чтобы открыть меню вытягивания крови для персонажа [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_blood_duel_prisoner_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_blood_duel_prisoner_combined_group_label: "@bm_ancient_discipline_icon! Можно сразиться с грозными пленниками"
 bm_action_can_blood_duel_prisoner_combined_group_name: "$bm_action_can_blood_duel_prisoner$"
 bm_action_can_blood_duel_prisoner_combined_group_description: "В вашей темнице есть несколько грозных пленников (20+ доблести), которых можно вызвать на поединок в кровавой яме ради жизненной силы."

 bm_action_can_attune_lifeforce: "@bm_ancient_discipline_icon! Вы можете настроить жизненную силу"
 bm_action_can_attune_lifeforce_label: "@bm_ancient_discipline_icon! Вы можете настроить жизненную силу"
 bm_action_can_attune_lifeforce_desc: "Настройте жизненную силу, чтобы выбранное направление магии крови получало опыт."
 bm_action_can_attune_lifeforce_click: "#I Щёлкните, чтобы открыть решение «Применить малую магию крови»#!"

 bm_action_can_trait_drain_prisoner: "@bm_ancient_discipline_icon! Вы можете поглотить свойство пленника"
 bm_action_can_trait_drain_prisoner_label: "@bm_ancient_discipline_icon! Вы можете поглотить свойство персонажа [recipient.GetShortUINameNoTooltip]"
 bm_action_can_trait_drain_prisoner_desc: "[recipient.GetShortUIName] находится в вашей темнице. У этого персонажа есть полезное наследственное свойство, которое можно поглотить."
 bm_action_can_trait_drain_prisoner_click: "#I Щёлкните, чтобы поглотить свойство персонажа [recipient.GetShortUINameNoTooltip]#!"
 bm_action_can_trait_drain_prisoner_combined_label: "[actor.Custom2('RelationToMeShort', recipient)], [recipient.GetShortUINameNoTooltip]"
 bm_action_can_trait_drain_prisoner_combined_group_label: "@bm_ancient_discipline_icon! Вы можете поглотить свойство пленника"
 bm_action_can_trait_drain_prisoner_combined_group_name: "$bm_action_can_trait_drain_prisoner$"
 bm_action_can_trait_drain_prisoner_combined_group_description: "У нескольких пленников в вашей темнице есть полезные наследственные свойства, которые можно поглотить."
 bm_action_can_trait_drain_prisoner_unimportant: "@warning_icon! #X Сейчас вы не можете поглотить [recipient.GetHerHis] свойство#!"
 bm_action_can_trait_drain_prisoner_combined_unimportant: "@warning_icon! #X Сейчас вы не можете поглотить свойство ни у кого из них#!"

 bm_action_can_ascend_tier: "@bm_ancient_discipline_icon! Можно повысить ранг магии крови"
 bm_action_can_ascend_tier_label: "@bm_ancient_discipline_icon! Можно повысить ранг магии крови"
 bm_action_can_ascend_tier_desc: "Вы отвечаете требованиям для встречи со своим отражением в кровавом зеркале и перехода на следующий ранг магии крови."
 bm_action_can_ascend_tier_click: "#I Нажмите, чтобы открыть решение о повышении ранга магии крови#!"

 bm_action_can_carve_galdrastafir: "@bm_ancient_discipline_icon! Можно вырезать гальдрастав"
 bm_action_can_carve_galdrastafir_label: "@bm_ancient_discipline_icon! Можно вырезать гальдрастав"
 bm_action_can_carve_galdrastafir_desc: "У вас есть высшая руна крови без привязанного гальдрастава. Вырежьте гальдрастав, чтобы раскрыть его высшую силу."
 bm_action_can_carve_galdrastafir_click: "#I Нажмите, чтобы открыть решение о вырезании гальдрастава#!"
