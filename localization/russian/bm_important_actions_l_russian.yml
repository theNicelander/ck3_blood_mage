 bm_action_can_lifedrain_prisoner_combined_group_description: "В вашей темнице содержится несколько пленников. Вы можете собрать их кровь и получить жизненную силу."

 bm_action_can_cull_champion: "@bm_bloodlust_discipline_icon! Вы можете принести чемпиона в жертву"
