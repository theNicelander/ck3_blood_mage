l_russian:
 bm_action_can_heal: "@health_icon! Вы можете кого-то исцелить"
 bm_action_can_heal_label: "@health_icon! Вы можете исцелить персонажа [recipient.GetShortUINameNoTooltip], [actor.Custom2('bm_heal_lifeforce_status_current_situation', recipient)]"
 bm_action_can_heal_desc: "[recipient.GetShortUIName] страдает от болезни или ранения. Вы можете потратить жизненную силу на исцеление."
