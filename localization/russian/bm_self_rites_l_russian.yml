  bm_bleed_own_vein_interaction.major_bleed: "Большое кровопускание"
  bm_bleed_own_vein_interaction.major_bleed_desc: "Сгустить большую жизненную силу ценой ухудшения ран на 2 ступени и стресса."
  bm_bleed_own_vein_interaction.major_bleed.toast: "@bm_ancient_discipline_icon! Большое кровопускание выполнено"

  bm_purge_coping_traits_interaction: "Очиститься от пороков стресса"
  bm_purge_coping_traits_interaction_desc: "Направить сгущённую жизненную силу через разум и кровь, чтобы выжечь пороки преодоления стресса и успокоить дух."
  bm_purge_coping_traits_interaction.toast: "@bm_ancient_discipline_icon! Пороки стресса устранены"
