l_russian:
  bm_bleed_own_vein_interaction: "Вскрыть свои вены"
  bm_bleed_own_vein_interaction_desc: "Рассечь собственную плоть и извлечь живую кровь, чтобы обратить её в жизненную силу."
  bm_bleed_own_vein_interaction_requirement_tt: "У вас не должно быть тяжёлых ран или увечий."
  bm_bleed_own_vein_interaction.minor_bleed: "Малое кровопускание"
  bm_bleed_own_vein_interaction.minor_bleed_desc: "Вскрыть небольшую вену, чтобы сгустить малую жизненную силу, получив лёгкое ранение."
  bm_bleed_own_vein_interaction.minor_bleed.toast: "Малое кровопускание выполнено"
  bm_bleed_own_vein_interaction.major_bleed: "Большое кровопускание"
  bm_bleed_own_vein_interaction.major_bleed_desc: "Глубоко вскрыть вены, чтобы сгустить большую жизненную силу, получив тяжёлое ранение, стресс и истощение."
  bm_bleed_own_vein_interaction.major_bleed.toast: "Большое кровопускание выполнено"

  bm_purge_coping_traits_interaction: "Очиститься от пороков стресса"
  bm_purge_coping_traits_interaction_desc: "Направить сгущённую жизненную силу через разум и кровь, чтобы выжечь пороки преодоления стресса и успокоить дух."
  bm_purge_coping_traits_interaction.toast: "Пороки стресса устранены"
