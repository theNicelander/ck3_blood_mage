l_russian:
  blood_golem.001.title:0 "Рождение из крови и глины"
  blood_golem.001.desc:0 "Ритуальный круг готов: он начертан вашей кровью, смешанной с редкими алхимическими веществами. В центре стоит грубая человекоподобная фигура, вылепленная из красной глины, речного ила и костяной пыли. Когда вы произносите последние слова заклинания, кровь струится из ваших протянутых рук в глиняную фигуру.\n\nПоначалу ничего не происходит. Затем глиняное тело содрогается. На поверхности появляются трещины, из которых сочится слабый кровный свет. Фигура движется, а глина приобретает более чёткие человеческие очертания. Медленно сгибаются суставы, шевелятся пальцы, и наконец глиняные веки открываются, обнажая сияющие багровые глаза.\n\nГолем крови делает первый неуверенный шаг, затем опускается перед вами на колени. Его рот неподвижен, но голос звучит прямо в вашем разуме — шёпот вашей собственной крови, обретшей сознание.\n\n«Создатель... Я живу, чтобы служить»."
  blood_golem.001.a:0 "Встань, моё творение. Твой путь только начинается."
  blood_golem_creator:0 "Создатель из крови"
  blood_golem_creator_desc:0 "Этот персонаж даровал мне жизнь с помощью магии крови."


  blood_golem.002.title:0 "Усилить голема крови"
  blood_golem.002.desc:0 "Ваш голем крови стоит перед вами, ожидая дальнейшего совершенствования. С помощью магии крови вы можете усилить разные стороны своего творения, приспосабливая его к вашим целям."

  blood_golem.002.athletic:0 "Даровать ловкость"
  blood_golem.002.blademaster:0 "Наделить боевым мастерством"
  blood_golem.002.berserker:0 "Наполнить боевой яростью"
  blood_golem.002.viking:0 "Даровать дух налётчика"
  blood_golem.002.hunter:0 "Вселить охотничьи инстинкты"
  blood_golem.002.physique:0 "Укрепить тело"
  blood_golem.002.prowess:0 "Обучить воинской доблести"

  blood_golem.002.success:0 "Голем крови усилен"
  blood_golem.002.fail:0 "Усиление не удалось"
  blood_golem.002.fail_crit:0 "Усиление завершилось катастрофой"

  blood_golem.002.complete:0 "Завершить ритуал и связать голема служением мне"
  blood_golem.002.complete.tooltip:0 "Ваш голем крови останется таким, каков он есть; его текущие свойства закрепятся навсегда"

  # Decision
  blood_golem_creation_decision:0 "Создать голема крови"
  blood_golem_creation_decision_confirm:0 "Вдохнуть жизнь в глину с помощью крови"
  blood_golem_creation_decision_desc:0 "Древние книги рассказывают о слугах, созданных из земли и оживлённых самой сущностью жизни. Сложный ритуал, требующий значительной магической силы, позволяет связать вашу жизненную силу с искусственным телом и создать верного слугу, само существование которого зависит от вашей крови. Этот голем крови станет и стражем, и орудием — продолжением вашей воли, чьи способности далеко превосходят возможности смертных слуг. Хотя ритуал отнимает немало жизненных сил, создание такого существа знаменует истинное мастерство гематургии: способность даровать сознание с помощью магии крови."
  blood_golem_creation_decision_tooltip:0 "Создать разумного слугу, связанного с вашей кровью, потратив [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip]"
  blood_golem_creation_decision_tt:0 "Вы создадите сильного бойца, которого можно попытаться улучшить ещё больше за благочестие"

  # Dynasty
