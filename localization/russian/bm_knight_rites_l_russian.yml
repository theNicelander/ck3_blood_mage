l_russian:
  bm_anointed_champion_modifier:0 "Помазанный чемпион Авангарда"
  bm_anointed_champion_modifier_desc:0 "Вены этого воина освящены сгущённой жизненной силой, обостряющей боевые рефлексы и укрепляющей здоровье."
  bm_spar_honed_modifier:0 "Закалён кровавыми поединками"
  bm_spar_honed_modifier_desc:0 "Ритуальные поединки с мастером магии крови повысили боевую эффективность и тактическое самообладание."
  bm_anoint_knight_interaction:0 "Помазать чемпиона Авангарда"
  bm_anoint_knight_interaction_desc:0 "Освятить присягнувшего рыцаря или придворного рыцаря крови каплей малой жизненной силы, укрепив доблесть и выносливость на годы."
  bm_anoint_knight_toast:0 "Чемпион помазан кровью"
  bm_recipient_already_anointed:0 "Получатель уже является помазанным чемпионом Авангарда."
  bm_cull_champion_interaction:0 "Принести павшего чемпиона в жертву"
  bm_cull_champion_interaction_desc:0 "Принести сильного пленника или окончательно сломленного последователя в жертву на алтаре крови, превратив его воинскую сущность в большую жизненную силу с шансом сгустить высшую жизненную силу."
  bm_cull_champion_toast:0 "Чемпион принесён в жертву"
  bm_ritual_spar_decision:0 "Багровый круг поединков"
  bm_ritual_spar_decision_desc:0 "Созовите присягнувших вам рыцарей крови в круг во дворе для ритуального тренировочного поединка, чтобы испытать боевые инстинкты и мастерство в несмертельной схватке."
  bm_ritual_spar_decision_tooltip:0 "Сразиться с одним из ваших рыцарей крови в тренировочном круге, чтобы отточить искусство фехтования и сгустить большую жизненную силу."
  bm_need_minor_lifeforce_spar_req:0 "Требуется хотя бы 1 порция малой жизненной силы."
  bm_no_blood_knights_available_req:0 "Требуется хотя бы один подходящий присягнувший вам рыцарь со свойством рыцаря крови."
  bm_ritual_spar_events.0001.t:0 "Багровый круг поединков"
  bm_ritual_spar_events.0001.desc:0 "На камнях двора кровью начертан широкий круг рун. Ваши присягнувшие рыцари крови собрались с обнажёнными клинками, и их глаза блестят в предвкушении. Три воителя выходят вперёд на зов круга — каждый жаждет испытать своё боевое мастерство против вашего в несмертельной тренировочной схватке."
  bm_ritual_spar_events.0001.opt_spar_1:0 "Тренироваться с персонажем [spar_partner_1.GetShortUIName] (доблесть: [spar_partner_1.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_2:0 "Тренироваться с персонажем [spar_partner_2.GetShortUIName] (доблесть: [spar_partner_2.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_3:0 "Тренироваться с персонажем [spar_partner_3.GetShortUIName] (доблесть: [spar_partner_3.GetProwess])"
  bm_ritual_spar_events.0001.opt_cancel:0 "Отменить обряд (вернуть жизненную силу)"
  bm_ritual_spar_events.0002.t:0 "Поединок завершён"
  bm_ritual_spar_events.0002.victor_desc:0 "Сталь звенит, и искры пляшут над тренировочным кругом. Благодаря превосходной боевой технике и обострённым рефлексам вы одолеваете противника по имени [sc_defender.GetShortUIName] и одерживаете решительную победу. В пылу схватки ваша кровь сгущается в сияющий шар большой жизненной силы!"
  bm_ritual_spar_events.0002.loser_desc:0 "Сталь звенит, и искры пляшут над тренировочным кругом. [sc_defender.GetShortUIName] движется с поразительной быстротой и мастерством, находит брешь в вашей защите и наносит решающий удар. Поражение горько, но суровое испытание закаляет ваш клинок, а [sc_defender.GetShortUIName] получает сгущённую большую жизненную силу победы."
  bm_ritual_spar_events.0002.opt:0 "Достойное испытание крови и клинка."
  bm_ritual_spar_victor_toast:0 "Решительная победа в поединке"
  bm_ritual_spar_loser_toast:0 "Поражение в поединке"
  bm_ritual_spar_events.0003.t:0 "Поединок прерван"
  bm_ritual_spar_events.0003.desc:0 "Тренировочный поединок внезапно прервался прежде, чем кто-либо смог одержать победу. Потраченная жизненная сила возвращается в ваши вены."
  bm_ritual_spar_events.0003.opt:0 "Круг пустеет."
  bm_ritual_spar_invalidated_toast:0 "Тренировочный поединок прерван"
