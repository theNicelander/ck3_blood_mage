  trait_track_ancient_desc: "#help Вы получаете опыт в этом направлении ежегодно.#!\n\nДревность повышает ежемесячное благочестие и славу династии, даёт дополнительное благочестие за каждого рыцаря и опыт образа жизни, а также повышает предельный уровень набожности."
  trait_track_wisdom_desc: "#help Вы получаете опыт в этом направлении, применяя магию крови к себе.#!\n\nМудрость повышает учёность, даёт дополнительную учёность за уровень набожности и открывает места для личных догматов."
  trait_track_fortune_desc: "#help Вы получаете опыт в этом направлении, усиливая свою династию. Ежегодный шанс получить опыт зависит от количества модификаторов магии крови у династии.#!\n\nУдача повышает управление, даёт дополнительное управление за уровень набожности и увеличивает ежемесячный доход."
  trait_track_radiance_desc: "#help Вы получаете опыт в этом направлении, исцеляя недуги и наделяя других силой.#!\n\nСияние повышает дипломатию, даёт дополнительную дипломатию за уровень набожности и позволяет вести больше личных происков одновременно."
  trait_track_cunning_desc: "#help Вы получаете опыт в этом направлении, вытягивая жизненную силу, накладывая проклятия крови и поглощая свойства других.#!\n\nХитрость повышает интриги, даёт дополнительные интриги за уровень набожности и позволяет вести больше враждебных происков одновременно."
  trait_track_fury_desc: "#help Вы получаете опыт в этом направлении, сражаясь в битвах, побеждая в поединках и участвуя в турнирах.#!\n\nЯрость повышает военное дело, даёт дополнительное военное дело за уровень набожности и повышает эффективность рыцарей за единицу учёности."

  # Legacy track localization preserved for backwards compatibility
  trait_track_experience: "Опыт"
  trait_track_charisma: "Харизма"
  trait_track_insight: "Проницательность"
  trait_track_legacy: "Наследие"
  trait_track_expertise: "Мастерство"
  trait_track_experience_desc: "Магия крови ускоряет освоение образов жизни и изучение языков."
  trait_track_charisma_desc: "Магия крови усиливает дипломатическое обаяние, устойчивость к стрессу и искусство убеждения."
  trait_track_insight_desc: "Магия крови наделяет этого персонажа сверхъестественными знаниями и способностями к учёбе."
  trait_track_legacy_desc: "Этот персонаж усилил свой род магической энергией, улучшив наследственные свойства и плодовитость."
  trait_track_expertise_desc: "Магия крови ускоряет освоение этим персонажем всех навыков и способностей."

  bm_yearly_attunement_ancient_toast: "Настройка на Древность принесла вам опыт"
