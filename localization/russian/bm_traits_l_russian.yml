  trait_track_ancient_desc: "#help Вы получаете опыт в этом направлении ежегодно.#!\n\nДревность повышает ежемесячное благочестие и славу династии, даёт дополнительное благочестие за каждого рыцаря и повышает предельный уровень набожности."
  trait_track_enlightenment_desc: "#help Вы получаете опыт в этом направлении, применяя магию крови к себе.#!\n\nПросветление повышает учёность, даёт дополнительную учёность за уровень набожности и открывает места для личных догматов."
  trait_track_bloodline_desc: "#help Вы получаете опыт в этом направлении, усиливая свою династию. Ежегодный шанс получить опыт зависит от количества модификаторов магии крови у династии.#!\n\nРодословная повышает управление, даёт дополнительное управление за уровень набожности и увеличивает ежемесячный доход."
  trait_track_benediction_desc: "#help Вы получаете опыт в этом направлении, исцеляя недуги и наделяя других силой.#!\n\nБлагословение повышает дипломатию, даёт дополнительную дипломатию за уровень набожности и позволяет вести больше личных происков одновременно."
  trait_track_hematurgy_desc: "#help Вы получаете опыт в этом направлении, вытягивая жизненную силу, накладывая проклятия крови и поглощая свойства других.#!\n\nГематургия повышает интриги, даёт дополнительные интриги за уровень набожности и позволяет вести больше враждебных происков одновременно."
  trait_track_bloodlust_desc: "#help Вы получаете опыт в этом направлении, сражаясь в битвах, побеждая в поединках и участвуя в турнирах.#!\n\nКровожадность повышает военное дело, даёт дополнительное военное дело за уровень набожности и повышает эффективность рыцарей за единицу учёности."

  # Blood Power
  trait_lifestyle_blood_power: "Могущество крови"
  trait_lifestyle_blood_power_desc: "Этот персонаж преобразил свою сущность с помощью магии крови, обретя необычайные способности, которые развиваются при дальнейшем использовании сил."
  # Backwards compatibility key
  trait_lifestyle_blood_empowerment: "Могущество крови"
  trait_lifestyle_blood_empowerment_desc: "$trait_lifestyle_blood_power_desc$"

  trait_track_presence: "Влияние"
  trait_track_warband: "Боевая дружина"
  trait_track_prosperity: "Процветание"
  trait_track_shadows: "Тени"
  trait_track_mastery: "Мастерство"
  trait_track_dynasty: "Династия"

  trait_track_presence_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта дипломатического образа жизни.#!\n\nМагия крови излучает завораживающее влияние, повышая общее мнение, успех и число личных происков, ежемесячный престиж и прирост легитимности."
  trait_track_warband_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 опыта дают +5 опыта военного образа жизни.#!\n\nБоевая дружина повышает эффективность противодействия профессиональных полков и увеличивает их размер и предельное число."
  trait_track_prosperity_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни управления.#!\n\nМагия крови обогащает казну, увеличивая ежемесячное золото, снижая содержание профессиональных полков и умножая общий ежемесячный доход."
  trait_track_shadows_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни интриг.#!\n\nНепроницаемый покров магии крови усиливает естественный ужас, успех и число враждебных происков и защиту от вражеских заговоров."
  trait_track_mastery_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни учёности.#!\n\nМагия крови ускоряет освоение образов жизни, значительно усиливая потерю стресса и снижая его прирост."
  trait_track_dynasty_desc: "#help Применяйте большую магию крови для получения опыта. Каждые 10 опыта дают +5 опыта активного образа жизни.#!\n\nДинастия повышает шанс усиления врождённых свойств и даёт полную защиту от близкородственного скрещивания."

