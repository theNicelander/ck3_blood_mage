l_russian:
  # Group
  trait_lifestyle_blood_mage_group: "Маг крови"
  trait_blood_mage_desc: "Мастера запретной магии, которые управляют жизненной силой, чтобы продлевать жизнь, усиливать способности, исцелять других и поглощать свойства достойных жертв."

    # Blood Mage Trait
  trait_lifestyle_blood_mage: "Маг крови"
  trait_lifestyle_blood_mage_desc: "Мастера запретной магии, которые управляют жизненной силой, чтобы продлевать жизнь, исцелять недуги, передавать силу другим и поглощать свойства принесённых в жертву."

  trait_track_enlightenment: "Просветление"
  trait_track_bloodline: "Родословная"
  trait_track_benediction: "Благословение"
  trait_track_hematurgy: "Гематургия"
  trait_track_ancient: "Древность"

  trait_track_ancient_desc: "#help Вы ежегодно получаете опыт в этом направлении.#!\n\nВремя склоняется перед теми, кто повелевает самой сущностью жизни."
  trait_track_enlightenment_desc: "#help Вы получаете опыт в этом направлении, применяя магию крови к себе.#!\n\nПуть к мастерству начинается с преображения себя."
  trait_track_bloodline_desc: "#help Вы получаете опыт в этом направлении, усиливая свою династию. Ежегодный шанс получить опыт зависит от количества модификаторов магии крови у династии.#!\n\nКровь взывает к крови сквозь поколения."
  trait_track_benediction_desc: "#help Вы получаете опыт в этом направлении, исцеляя недуги и наделяя других силой.#!\n\nВеличайший дар мага крови — сама жизнь, дарованная через кровавую жертву."
  trait_track_hematurgy_desc: "#help Вы получаете опыт в этом направлении, вытягивая жизненную силу и поглощая свойства других.#!\n\nБагровые искусства позволяют присвоить то, чем обладают другие."


  # Crimson Empowerment
  trait_lifestyle_crimson_empowerment: "Багровое усиление"
  trait_lifestyle_crimson_empowerment_desc: "Этот персонаж преобразил свою сущность с помощью магии крови, обретя необычайные способности, которые развиваются при дальнейшем использовании сил."

  trait_track_charisma: "Харизма"
  trait_track_fury: "Ярость"
  trait_track_prosperity: "Процветание"
  trait_track_shadows: "Тени"
  trait_track_insight: "Проницательность"
  trait_track_legacy: "Наследие"
  trait_track_expertise: "Мастерство"

  trait_track_charisma_desc: "Магия крови усиливает дипломатическое влияние и дар убеждения этого персонажа."
  trait_track_fury_desc: "Этот персонаж направляет магию крови на усиление воинского мастерства и превосходства на поле боя."
  trait_track_prosperity_desc: "Магия крови усиливает способности этого персонажа к управлению и ведению дел домена."
  trait_track_shadows_desc: "Этот персонаж использует магию крови, чтобы совершенствовать скрытность, обман и интриги."
  trait_track_insight_desc: "Магия крови наделяет этого персонажа сверхъестественными знаниями и способностями к учёбе."
  trait_track_legacy_desc: "Этот персонаж усилил свой род магической энергией, улучшив наследственные свойства и плодовитость."
  trait_track_expertise_desc: "Магия крови ускоряет освоение этим персонажем всех навыков и способностей."

  bm_yearly_attunement_ancient_toast: "Настройка на Древность принесла вам опыт"
  bm_yearly_attunement_enlightenment_toast: "Настройка на Просветление принесла вам опыт"
  bm_yearly_attunement_bloodline_toast: "Настройка на Родословную принесла вам опыт"
  bm_yearly_attunement_benediction_toast: "Настройка на Благословение принесла вам опыт"
