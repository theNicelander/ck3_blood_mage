l_russian:
  # Group
  trait_lifestyle_blood_mage_group: "Маг крови"
  trait_blood_mage_desc: "Этот маг использует магию крови, питаемую жизненной силой других, чтобы продлить свою жизнь и укрепить свой домен."

    # Blood Mage Trait
  trait_lifestyle_blood_mage: "Маг крови"
  trait_lifestyle_blood_mage_desc: "Этот воин использует магию крови, питаемую сражениями, чтобы продлить свою жизнь и усилить воинское мастерство."

  trait_track_enlightenment: "Просветление"
