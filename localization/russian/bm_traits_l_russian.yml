  trait_track_experience_desc: "Магия крови ускоряет освоение образов жизни и изучение языков."
  trait_track_charisma_desc: "Магия крови усиливает дипломатическое обаяние, устойчивость к стрессу и искусство убеждения."
  trait_track_insight_desc: "Магия крови наделяет этого персонажа сверхъестественными знаниями и способностями к учёбе."
  trait_track_legacy_desc: "Этот персонаж усилил свой род магической энергией, улучшив наследственные свойства и плодовитость."
  trait_track_expertise_desc: "Магия крови ускоряет освоение этим персонажем всех навыков и способностей."

