l_russian:
  # Group
  trait_lifestyle_blood_mage_group:0 "Маг крови"
  trait_blood_mage_desc:0 "Этот маг использует магию крови, питаемую жизненной силой других, чтобы продлить свою жизнь и укрепить свой домен."

    # Blood Mage Trait
  trait_lifestyle_blood_mage:0 "Маг крови"
  trait_lifestyle_blood_mage_desc:0 "Этот воин использует магию крови, питаемую сражениями, чтобы продлить свою жизнь и усилить воинское мастерство."

  trait_track_enlightenment:0 "Просветление"
  trait_track_bloodline:0 "Родословная"
  trait_track_benediction:0 "Благословение"
  trait_track_hematurgy:0 "Гематургия"
  trait_track_ancient:0 "Древность"

  trait_track_ancient_desc:0 "#help Вы получаете опыт в этом направлении ежегодно.#!\n\nВремя склоняется перед теми, кто повелевает самой сущностью жизни: постепенно повышая ежемесячную легитимность; каждые 20 опыта открывают дополнительное место для личного догмата."
  trait_track_enlightenment_desc:0 "#help Вы получаете опыт в этом направлении, применяя магию крови к себе.#!\n\nПуть к мастерству начинается с преображения себя."
  trait_track_bloodline_desc:0 "#help Вы получаете опыт в этом направлении, усиливая свою династию. Ежегодный шанс получить опыт зависит от количества модификаторов магии крови у династии.#!\n\nКровь взывает к крови сквозь поколения. Мастера родословной укрепляют династию, расширяют домен и создают державы непреходящего богатства и величия."
  trait_track_benediction_desc:0 "#help Вы получаете опыт в этом направлении, исцеляя недуги и наделяя других силой.#!\n\nВеличайший дар мага крови — сама жизнь, дарованная через кровавую жертву."
  trait_track_hematurgy_desc:0 "#help Вы получаете опыт в этом направлении, вытягивая жизненную силу, накладывая проклятия крови и поглощая свойства других.#!\n\nМастера запретной магии крови управляют жизненными соками других, ускоряют враждебные происки, правят через ужасающий страх и поражают соперников издалека."


  # Blood Empowerment
  trait_lifestyle_blood_empowerment:0 "Могущество крови"
  trait_lifestyle_blood_empowerment_desc:0 "$trait_lifestyle_blood_power_desc$"

  trait_track_dynasty:0 "Династия"
  trait_track_mastery:0 "Мастерство"
  trait_track_presence:0 "Влияние"
  trait_track_prosperity:0 "Процветание"
  trait_track_shadows:0 "Тени"

  trait_track_dynasty_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта активного образа жизни.#!\n\nНаправляет жизненную силу на совершенствование поколений, укрепляя врождённые свойства, значительно продлевая детородный возраст и даруя полную защиту от близкородственного скрещивания."
  trait_track_mastery_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни учёности.#!\n\nМагия крови ускоряет освоение образов жизни, значительно усиливая потерю стресса и снижая его прирост."
  trait_track_presence_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта дипломатического образа жизни.#!\n\nМагия крови излучает завораживающее влияние, повышая общее мнение, успех и число личных происков, ежемесячный престиж и прирост легитимности."
  trait_track_prosperity_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни управления.#!\n\nМагия крови обогащает казну, увеличивая ежемесячное золото, снижая содержание профессиональных полков и умножая общий ежемесячный доход."
  trait_track_shadows_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта образа жизни интриг.#!\n\nНепроницаемый покров магии крови усиливает естественный ужас, успех и число враждебных происков и защиту от вражеских заговоров."

  # Legacy track localization preserved for backwards compatibility
  trait_track_experience:0 "Опыт"
  trait_track_charisma:0 "Харизма"
  trait_track_insight:0 "Проницательность"
  trait_track_legacy:0 "Наследие"
  trait_track_expertise:0 "Мастерство"
  trait_track_experience_desc:0 "Магия крови ускоряет освоение образов жизни и изучение языков."
  trait_track_charisma_desc:0 "Магия крови усиливает дипломатическое обаяние, устойчивость к стрессу и искусство убеждения."
  trait_track_insight_desc:0 "Магия крови наделяет этого персонажа сверхъестественными знаниями и способностями к учёбе."
  trait_track_legacy_desc:0 "Этот персонаж усилил свой род магической энергией, улучшив наследственные свойства и плодовитость."
  trait_track_expertise_desc:0 "Магия крови ускоряет освоение этим персонажем всех навыков и способностей."

  bm_yearly_attunement_ancient_toast:0 "Настройка на Древность принесла вам опыт"
  bm_yearly_attunement_enlightenment_toast:0 "Настройка на Просветление принесла вам опыт"
  bm_yearly_attunement_bloodline_toast:0 "Настройка на Родословную принесла вам опыт"
  bm_yearly_attunement_benediction_toast:0 "Настройка на Благословение принесла вам опыт"
  bm_yearly_attunement_hematurgy_toast:0 "Настройка на Гематургию принесла вам опыт"
  bm_yearly_attunement_vanguard_toast:0 "Настройка на Авангард принесла вам опыт"
  bm_yearly_attunement_slaughter_toast:0 "Настройка на Бойню принесла вам опыт"
  bm_blood_knight_ambient_lifeforce_toast:0 "Окружающая жизненная энергия сгущается в ваших венах, даруя малую жизненную силу"

  # Blood Knight
  trait_lifestyle_blood_knight:0 "Рыцарь крови"
  trait_lifestyle_blood_knight_desc:0 "Этот воин использует магию крови, питаемую сражениями, чтобы усилить воинское мастерство и продлить свою жизнь с помощью жизненной силы."
  trait_lifestyle_blood_knight_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] обретает сверхъестественную жизненную силу, связывающую тело с воинским колдовством рыцаря крови."

  lifestyle_blood_knight_vanguard:0 "Авангард"
  lifestyle_blood_knight_slaughter:0 "Бойня"
  lifestyle_blood_knight_enlightenment:0 "Просветление"
  lifestyle_blood_knight_ancient:0 "Древность"
  lifestyle_blood_knight_benediction:0 "Благословение"
  lifestyle_blood_knight_resilience:0 "Стойкость"

  lifestyle_blood_knight_vanguard_desc:0 "#help Вы получаете опыт в этом направлении, участвуя в битвах и побеждая в составе армии.#!\n\nМастерство ведения войны и командования на передовой развивает стратегический талант и преимущество."
  lifestyle_blood_knight_slaughter_desc:0 "#help Вы получаете опыт в этом направлении, побеждая в поединках и турнирных состязаниях.#!\n\nСмертоносный воинский инстинкт в единоборстве совершенствует личную доблесть и славу."
  lifestyle_blood_knight_enlightenment_desc:0 "#help Вы получаете опыт в этом направлении, применяя магию крови к себе и воплощая жизненную силу.#!\n\nПуть к мастерству начинается с преображения себя."
  lifestyle_blood_knight_ancient_desc:0 "#help Вы получаете опыт в этом направлении ежегодно.#!\n\nВремя склоняется перед теми, кто повелевает самой сущностью жизни: каждые 20 опыта открывают дополнительное место для личного догмата."
  lifestyle_blood_knight_benediction_desc:0 "#help Вы получаете опыт в этом направлении, исцеляя недуги и устраняя телесные изъяны.#!\n\nДар воинской жизненной силы устраняет изъяны и недуги через кровь."
  lifestyle_blood_knight_resilience_desc:0 "#help Вы получаете опыт в этом направлении пассивно каждый год и выживая после проигранных битв.#!\n\nПриспособление тела преодолевает хрупкость смертных, продлевая жизнь, укрепляя здоровье и сопротивляемость болезням."

  trait_track_vanguard:0 "Авангард"
  trait_track_slaughter:0 "Бойня"
  trait_track_resilience:0 "Стойкость"

  trait_track_vanguard_desc:0 "#help Вы получаете опыт в этом направлении, участвуя в битвах и побеждая в составе армии.#!\n\nМастерство ведения войны и командования на передовой развивает стратегический талант и преимущество."
  trait_track_slaughter_desc:0 "#help Вы получаете опыт в этом направлении, побеждая в поединках и турнирных состязаниях.#!\n\nСмертоносный воинский инстинкт в единоборстве совершенствует личную доблесть и славу."
  trait_track_resilience_desc:0 "#help Вы получаете опыт в этом направлении пассивно каждый год и выживая после проигранных битв.#!\n\nПриспособление тела преодолевает хрупкость смертных, продлевая жизнь, укрепляя здоровье и сопротивляемость болезням."
  trait_lifestyle_blood_power:0 "Могущество крови"
  trait_lifestyle_blood_power_desc:0 "Этот персонаж преобразил свою сущность с помощью магии крови, обретя необычайные способности, которые развиваются при дальнейшем использовании сил."
  bm_yearly_ancient_toast:0 "Направление Древности принесло вам опыт"
  trait_track_warband:0 "Боевая дружина"
  trait_track_warband_desc:0 "#help Применяйте большую магию крови для получения опыта. Каждые 10 дают +5 опыта военного образа жизни.#!\n\nНаправляет жизненную силу на воинское превосходство, увеличивая число и эффективность рыцарей, боевое преимущество и скорость передвижения армии."
