l_russian:
  # Blood Temples
  building_type_bm_blood_temple_01: "Храм крови"
  building_type_bm_blood_temple_01_desc: "Священный комплекс из кровавого камня и жертвенных алтарей, где подношения жизненной силы освящают землю и укрепляют верующих."

  building_bm_blood_temple_01: "Алтарь крови"
  building_bm_blood_temple_01_desc: "Грубо отёсанный жертвенный камень с желобами для сбора живительных подношений верующих."

  building_bm_blood_temple_02: "Святилище крови"
  building_bm_blood_temple_02_desc: "Уединённая ниша при свете свечей, где священные сосуды хранят собранную жизненную силу благочестивых."

  building_bm_blood_temple_03: "Монумент крови"
  building_bm_blood_temple_03_desc: "Высокий рунический обелиск, потемневший от многовековых подношений и излучающий оккультную жизненную силу на окрестные земли."

  building_bm_blood_temple_04: "Храм крови"
  building_bm_blood_temple_04_desc: "Торжественный зал из кровавого камня, где посвящённые собираются, чтобы петь, проливать кровь и общаться с древними."

  building_bm_blood_temple_05: "Великий храм крови"
  building_bm_blood_temple_05_desc: "Величественный собор владычества над жизнью, чьи подземные хранилища и ритуальные покои служат опорой могущества целого рода."

  building_bm_blood_temple_06: "Пантеон крови"
  building_bm_blood_temple_06_desc: "Величественная царственная ротонда в честь бессмертных, достигших возвышения, где жизненная кровь державы перегоняется в вечную молодость."

  building_bm_blood_temple_07: "Акрополь крови"
  building_bm_blood_temple_07_desc: "Монументальная укреплённая цитадель на вершине холма, увенчанная алыми шпилями и святилищами, — высшая обитель колдовства крови в известном мире."

  # Building Requirement Tooltips
  bm_requires_blood_mage_or_blodtru_tt: "Требуется свойство «[GetTrait('lifestyle_blood_mage').GetName(GetPlayer)]» либо исповедание религии «$blodtru_religion_adj$»"
  bm_requires_feudalized_realm_tt: "Требуется неплеменная форма правления и феодализированное владение (замок, город или храм)"
