l_russian:
  # Blood Temple District (CK3 1.21)
  bm_blood_temple_district: "Храмовый район крови"
  bm_blood_temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$@health_icon![health|E]\n$BULLET_WITH_TAB$[learning_i][learning|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]"
  bm_blood_temple_district_desc_flavor: "Священный квартал с каменными храмами крови и жертвенными алтарями, где подношения жизненной силы освящают землю и укрепляют верующих."

  # Primary Building: Blood Temple (4 Tiers)
  building_type_bm_blood_temple_01: "Храм крови"
  building_type_bm_blood_temple_01_desc: "Священный комплекс из кровавого камня и жертвенных алтарей, где подношения жизненной силы освящают землю и укрепляют верующих."

  bm_blood_temple_01: "Алтарь крови"
  bm_blood_temple_01_desc: "Грубо отёсанный жертвенный камень с желобами для сбора подношений жизненной силы верующих."

  bm_blood_temple_02: "Святилище крови"
  bm_blood_temple_02_desc: "Уединённое святилище при свете свечей, где священные сосуды хранят собранную жизненную силу благочестивых."

  bm_blood_temple_03: "Храм крови"
  bm_blood_temple_03_desc: "Торжественный зал из кровавого камня, где посвящённые собираются, чтобы петь, проливать кровь и общаться с древними."

  bm_blood_temple_04: "Акрополь крови"
  bm_blood_temple_04_desc: "Монументальная укреплённая цитадель на вершине холма со шпилями и святилищами из кровавого камня — высшая обитель магии крови в державе."

  # Sub-Building: Blood Sanctuary (Lifespan, Health, Epidemic Resistance)
  building_type_bm_blood_sanctuary_01: "Лечебница крови"
  building_type_bm_blood_sanctuary_01_desc: "Целебное крыло, где маги крови извлекают жизненную силу для защиты от чумы и продления смертной жизни."

  bm_blood_sanctuary_01: "Палаты крови"
  bm_blood_sanctuary_01_desc: "Тихие каменные палаты, где кровавые тоники и рунические припарки поддерживают слабеющие сердца."

  bm_blood_sanctuary_02: "Лазарет крови"
  bm_blood_sanctuary_02_desc: "Сводчатый зал целителей крови, чьи снадобья укрепляют тело перед болезнями и старостью."

  bm_blood_sanctuary_03: "Лечебница крови"
  bm_blood_sanctuary_03_desc: "Безмятежная обитель с очищающими чашами и курильницами жизненной силы защищает герцогство от болезней."

  bm_blood_sanctuary_04: "Великая лечебница крови"
  bm_blood_sanctuary_04_desc: "Величественный оплот исцеления кровью, где болезни отступают у ворот, а правители живут десятилетиями."

  # Sub-Building: Bloodline Vault (Biological / Congenital Traits)
  building_type_bm_bloodline_vault_01: "Хранилище родословной"
  building_type_bm_bloodline_vault_01_desc: "Запечатанный архив родословных и реликвий крови, служащий сохранению и совершенствованию одарённых родов."

  bm_bloodline_vault_01: "Палата родословной"
  bm_bloodline_vault_01_desc: "Охраняемая палата со свитками родословных и запечатанными сосудами, хранящими сведения о наследственных достоинствах дома."

  bm_bloodline_vault_02: "Архив родословной"
  bm_bloodline_vault_02_desc: "Ряды сохранённых образцов крови и записей о рождениях помогают благословлять каждое новое поколение."

  bm_bloodline_vault_03: "Хранилище родословной"
  bm_bloodline_vault_03_desc: "Подземное святилище, где ритуальные узы крови укрепляют лучшие свойства династии."

  bm_bloodline_vault_04: "Великое хранилище родословной"
  bm_bloodline_vault_04_desc: "Непревзойдённая сокровищница сущности предков, сохраняющая ум, красоту и силу на века."

  # Sub-Building: Blood Academy (Learning, Learning XP, Cultural Fascination)
  building_type_bm_blood_academy_01: "Академия крови"
  building_type_bm_blood_academy_01_desc: "Обитель кровавой учёности, где адепты изучают жизненную силу, медицину и скрытые законы природы."

  bm_blood_academy_01: "Кабинет крови"
  bm_blood_academy_01_desc: "Скромная читальня, полки которой заставлены анатомическими трактатами и руническими гримуарами крови."

  bm_blood_academy_02: "Коллегия крови"
  bm_blood_academy_02_desc: "Залы, где маги крови обучают учеников научным изысканиям и ритуальному искусству."

  bm_blood_academy_03: "Академия крови"
  bm_blood_academy_03_desc: "Прославленное учреждение, привлекающее учёных со всей державы ради развития искусства крови и культурных открытий."

  bm_blood_academy_04: "Великая академия крови"
  bm_blood_academy_04_desc: "Высокая цитадель учёности, чьи мастера задают темп нововведениям целой культуры."

  # Sub-Building: Hall of Blood Ancestors (Dynasty Prestige & Legitimacy)
  building_type_bm_blood_ancestors_hall_01: "Зал предков крови"
  building_type_bm_blood_ancestors_hall_01_desc: "Торжественный памятник магам крови рода, укрепляющий великолепие династии и законность её власти."

  bm_blood_ancestors_hall_01: "Мемориал крови"
  bm_blood_ancestors_hall_01_desc: "Резные плиты из кровавого камня с именами и деяниями предков династии."

  bm_blood_ancestors_hall_02: "Склеп крови"
  bm_blood_ancestors_hall_02_desc: "Освещённый фонарями погребальный комплекс, где реликвии предков укрепляют авторитет правителя."

  bm_blood_ancestors_hall_03: "Зал предков крови"
  bm_blood_ancestors_hall_03_desc: "Галерея с колоннами, статуями и освящёнными урнами, прославляющая древнее право крови династии."

  bm_blood_ancestors_hall_04: "Пантеон предков крови"
  bm_blood_ancestors_hall_04_desc: "Величественная купольная ротонда в честь бессмертного рода, внушающая благоговение за пределами державы."

  # Sub-Building: Blood Basin (Duchy Prosperity & Control)
  building_type_bm_blood_basin_01: "Бассейн крови"
  building_type_bm_blood_basin_01_desc: "Освящённые каменные резервуары, ритуалы жизненной силы в которых обогащают земли герцогства и укрепляют порядок."

  bm_blood_basin_01: "Колодец крови"
  bm_blood_basin_01_desc: "Резной ритуальный колодец в центре района, где сезонные подношения благословляют окрестные поля."

  bm_blood_basin_02: "Цистерна крови"
  bm_blood_basin_02_desc: "Подземные каналы распределяют освящённую жизненную силу по столице и поддерживают местный порядок."

  bm_blood_basin_03: "Бассейн крови"
  bm_blood_basin_03_desc: "Широкий террасный бассейн из тёмного камня, чьи обряды способствуют торговле, урожаям и незыблемой власти герцога."

  bm_blood_basin_04: "Великий бассейн крови"
  bm_blood_basin_04_desc: "Монументальный акведук и ритуальный бассейн, превращающие герцогство в процветающий край под твёрдой властью."

  # Sub-Building: Ritual Vaults (Piety, Piety per Knight, Dread)
  building_type_bm_ritual_vaults_01: "Ритуальные подземелья"
  building_type_bm_ritual_vaults_01_desc: "Глубокие жертвенные палаты, где обряды крови питают неугасимую преданность и внушают страх мятежникам."

  bm_ritual_vaults_01: "Жертвенный погреб"
  bm_ritual_vaults_01_desc: "Освещённый факелами погреб под алтарём, предназначенный для клятв крови и торжественных подношений."

  bm_ritual_vaults_02: "Ритуальная палата"
  bm_ritual_vaults_02_desc: "Палата за железными вратами, где рыцари и жрецы освящают клинки кровью перед каждым походом."

  bm_ritual_vaults_03: "Ритуальные подземелья"
  bm_ritual_vaults_03_desc: "Соединённые подземные святилища, чьи мрачные церемонии внушают глубокое благочестие и покорность из страха."

  bm_ritual_vaults_04: "Великие ритуальные подземелья"
  bm_ritual_vaults_04_desc: "Обширные катакомбы с освящёнными алтарями, где кровь врагов и обеты рыцарей порождают трепетный ужас."

  # Building Requirement Tooltips
  bm_requires_blood_mage_or_blodtru_tt: "Требуется свойство «[GetTrait('lifestyle_blood_mage').GetName(GetPlayer)]» либо исповедание религии «$blodtru_religion_adj$»"
  bm_requires_feudalized_realm_tt: "Требуется неплеменная форма правления и феодализированное владение (замок, город или храм)"
