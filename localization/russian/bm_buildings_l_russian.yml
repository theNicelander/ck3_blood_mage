l_russian:
# Blood Temples
  building_type_bm_blood_temple_01:0 "Храм крови"
  building_type_bm_blood_temple_01_desc:0 "Священный комплекс из багрового камня и жертвенных алтарей, где подношения жизненной силы освящают землю и укрепляют верующих."
  building_bm_blood_temple_01:0 "Алтарь крови"
  building_bm_blood_temple_01_desc:0 "Грубо отёсанный жертвенный камень с багровыми желобами для сбора живительных подношений верующих."
  building_bm_blood_temple_02:0 "Святилище крови"
  building_bm_blood_temple_02_desc:0 "Уединённая ниша при свете свечей, где священные сосуды хранят собранную жизненную силу благочестивых."
  building_bm_blood_temple_03:0 "Монумент крови"
  building_bm_blood_temple_03_desc:0 "Высокий рунический обелиск, потемневший от многовековых подношений и излучающий оккультную жизненную силу на окрестные земли."
  building_bm_blood_temple_04:0 "Храм крови"
  building_bm_blood_temple_04_desc:0 "Торжественный зал из багрового камня, где посвящённые собираются, чтобы петь, проливать кровь и общаться с древними."
  building_bm_blood_temple_05:0 "Великий храм крови"
  building_bm_blood_temple_05_desc:0 "Величественный собор владычества над жизнью, чьи подземные хранилища и ритуальные покои служат опорой могущества целого рода."
  building_bm_blood_temple_06:0 "Пантеон крови"
  building_bm_blood_temple_06_desc:0 "Величественная царственная ротонда в честь бессмертных, достигших возвышения, где жизненная кровь державы перегоняется в вечную молодость."
  building_bm_blood_temple_07:0 "Акрополь крови"
  building_bm_blood_temple_07_desc:0 "Монументальная укреплённая цитадель на вершине холма, увенчанная алыми шпилями и святилищами, — высшая обитель колдовства крови в известном мире."
  bm_requires_blood_mage_or_blodtru_tt:0 "Нужно быть [GetTrait('lifestyle_blood_mage').GetName(GetPlayer)], [GetTrait('lifestyle_blood_knight').GetName(GetPlayer)] или исповедовать религию [GetReligion('blodtru_religion').GetName]"
  bm_requires_feudalized_realm_tt:0 "Требуется неплеменная форма правления и феодализированное владение (замок, город или храм)"
