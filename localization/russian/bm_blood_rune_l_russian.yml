l_russian:
  # Blood Rune Modifiers
  minor_blood_rune_modifier:0 "Малая руна крови"
  minor_blood_rune_modifier_desc:0 "Эти простые символы крови изредка собирают для вас [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]. \n\nНачертанные кровью тайные символы вокруг сердца слабо пульсируют под кожей, втягивая окружающую жизненную силу в ваше тело, словно второе сердце с медленным ритмом."

  major_blood_rune_modifier:0 "Большая руна крови"
  major_blood_rune_modifier_desc:0 "Эти сложные руны иногда собирают [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира, порой даруя всплески [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]. Изредка они могут захватить оба вида одновременно. \n\nЗамысловатые багровые татуировки струятся по торсу и рукам, словно живые вены, постоянно собирая жизненную сущность вокруг вас и направляя её в ваши магические запасы."

  superior_blood_rune_modifier:0 "Высшая руна крови"
  superior_blood_rune_modifier_desc:0 "Эти искусные письмена крови часто сами притягивают [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]. Они регулярно захватывают [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], а иногда проявляют оба вида силы одновременно. \n\nИскусные письмена крови покрывают жизненно важные участки тела, временами двигаясь под кожей словно живые. Ваше тело стало постоянным проводником жизненной силы, черпающим энергию из самого воздуха."

  blood_runes_effects_list.effects_list:0 "Получить всё более мощные руны крови (каждая ступень заменяет предыдущую):\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
  blood_runes_effects_list.minor:0 "Начертать на плоти руну — [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip], дающую шанс пассивно добывать жизненную силу каждый год."
  blood_runes_effects_list.major:0 "Улучшить руну до следующей ступени — [GetModifier('major_blood_rune_modifier').GetNameWithTooltip], усилив ежегодную пассивную добычу жизненной силы."
  blood_runes_effects_list.superior:0 "Улучшить руну до высшей ступени — [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip], превратив тело в живой гримуар и совершенный проводник окружающей жизненной силы."


  # Blood Rune Event
  bm_blood_rune.001.title:0 "Начертать руны крови"
  bm_blood_rune.001.desc:0 "Вы разворачиваете древние свитки со сложными узорами силы — рунами крови, превращающими тело мага в сосуд для сбора жизненной силы. Ритуал требует особых игл, выкованных в пламени, закалённом кровью, чернил с примесью вашей сущности и твёрдой руки того, кто понимает: каждая линия не просто рисуется, а связывается с самим вашим существом.\n\nБоль будет мучительной, а перемены — необратимыми. Но с каждой каплей крови и чернил, впитавшейся в плоть, ваша связь с багровыми искусствами будет крепнуть. Такие знаки отличают мага крови, стремящегося к истинному мастерству: не просто владеть магией крови, а стать её живым воплощением."

  bm_blood_rune.001.minor:0 "Малая руна крови — пульсирующий знак над сердцем"
  bm_blood_rune.001.major:0 "Большая руна крови — сеть силы, пронизывающая плоть"
  bm_blood_rune.001.superior:0 "Высшая руна крови — превратить кожу в живой гримуар магии крови"
  bm_blood_rune.001.z:0 "Нынешние знаки служат мне достаточно хорошо"
  bm_blood_rune_yearly_event_popup.title:0 "Ваша руна крови даровала вам жизненную силу"

  # Decision
  bm_blood_rune_decision:0 "Начертать руны крови"
  bm_blood_rune_decision_confirm:0 "Начать начертание кровью"
  bm_blood_rune_decision_desc:0 "Используйте древнюю магию крови, чтобы начертать на плоти постоянные руны, усиливающие вашу связь с жизненной силой. Эти тайные татуировки позволят пассивно собирать окружающую жизненную энергию, со временем укрепляя ваши способности."
  bm_blood_rune_decision_tooltip:0 "Навсегда отметить тело рунами крови, которые со временем создают жизненную силу"
  bm_blood_rune_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] опыта в магии крови"
  NOT_bm_blood_rune_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] опыта в магии крови"
