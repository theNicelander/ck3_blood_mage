l_russian:
  # Crimson Rune Modifiers
  minor_crimson_rune_modifier: "Малая багровая руна"
  minor_crimson_rune_modifier_desc: "Эти простые символы крови изредка собирают для вас [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]. \n\nНачертанные кровью тайные символы вокруг сердца слабо пульсируют под кожей, втягивая окружающую жизненную силу в ваше тело, словно второе сердце с медленным ритмом."

  major_crimson_rune_modifier: "Большая багровая руна"
  major_crimson_rune_modifier_desc: "Эти сложные руны иногда собирают [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира, порой даруя всплески [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]. Изредка они могут захватить оба вида одновременно. \n\nЗамысловатые багровые татуировки струятся по торсу и рукам, словно живые вены, постоянно собирая жизненную сущность вокруг вас и направляя её в ваши магические запасы."

  superior_crimson_rune_modifier: "Высшая багровая руна"
  superior_crimson_rune_modifier_desc: "Эти искусные письмена крови часто сами притягивают [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]. Они регулярно захватывают [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], а иногда проявляют оба вида силы одновременно. \n\nИскусные письмена крови покрывают жизненно важные участки тела, временами двигаясь под кожей словно живые. Ваше тело стало постоянным проводником жизненной силы, черпающим энергию из самого воздуха."

  crimson_runes_effects_list.effects_list: "Получить всё более мощные руны крови (каждая ступень заменяет предыдущую):\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('minor_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('major_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('superior_crimson_rune_modifier').GetNameWithTooltip]"


  # Crimson Rune Event
  bm_crimson_rune.001.title: "Начертать руны крови"
  bm_crimson_rune.001.desc: "Вы разворачиваете древние свитки со сложными узорами силы — рунами крови, превращающими тело мага в сосуд для сбора жизненной силы. Ритуал требует особых игл, выкованных в пламени, закалённом кровью, чернил с примесью вашей сущности и твёрдой руки того, кто понимает: каждая линия не просто рисуется, а связывается с самим вашим существом.\n\nБоль будет мучительной, а перемены — необратимыми. Но с каждой каплей крови и чернил, впитавшейся в плоть, ваша связь с багровыми искусствами будет крепнуть. Такие знаки отличают мага крови, стремящегося к истинному мастерству: не просто владеть магией крови, а стать её живым воплощением."

  bm_crimson_rune.001.minor: "Малая багровая руна — пульсирующий знак над сердцем"
  bm_crimson_rune.001.major: "Большая багровая руна — сеть силы, пронизывающая плоть"
  bm_crimson_rune.001.superior: "Высшая багровая руна — превратить кожу в живой гримуар магии крови"
  bm_crimson_rune.001.z: "Нынешние знаки служат мне достаточно хорошо"
  bm_crimson_rune_yearly_event_popup.title: "Ваша багровая руна даровала вам жизненную силу"

  # Decision
  bm_blood_rune_decision: "Начертать руны крови"
  bm_blood_rune_decision_confirm: "Начать начертание кровью"
  bm_blood_rune_decision_desc: "Используйте древнюю магию крови, чтобы начертать на плоти постоянные руны, усиливающие вашу связь с жизненной силой. Эти тайные татуировки позволят пассивно собирать окружающую жизненную энергию, со временем укрепляя ваши способности."
  bm_blood_rune_decision_tooltip: "Навсегда отметить тело рунами крови, которые со временем создают жизненную силу"
