l_russian:
  # Blood Rune Modifiers
  minor_blood_rune_modifier: "Малая руна крови"
  minor_blood_rune_modifier_desc: "Эти простые символы крови каждый год имеют шанс принести силу.\n\nНачертанные кровью тайные символы вокруг сердца слабо пульсируют под кожей, словно медленно бьющееся второе сердце, позволяя пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира."

  major_blood_rune_modifier: "Большая руна крови"
  major_blood_rune_modifier_desc: "Эти сложные руны каждый год приносят более обильные и частые запасы.\n\nЗамысловатые багровые татуировки струятся по торсу и рукам, словно живые вены, позволяя пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира."

  superior_blood_rune_modifier: "Высшая руна крови"
  superior_blood_rune_modifier_desc: "Эти искусные письмена крови приносят наибольшие ежегодные запасы и открывают возможность связать руну с гальдраставом.\n\nИскусные письмена крови покрывают жизненно важные участки тела, двигаясь под кожей словно живые, пока вы пассивно собираете [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира."

  blood_runes_effects_list.effects_list: "Получить всё более мощные руны крови (каждая ступень заменяет предыдущую):\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
  blood_runes_effects_list.minor: "Начертать на плоти руну [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip], чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира."
  blood_runes_effects_list.major: "Улучшить руну до ступени [GetModifier('major_blood_rune_modifier').GetNameWithTooltip], чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира."
  blood_runes_effects_list.superior: "Улучшить руну до ступени [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip], чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира и открыть возможность связать руну с гальдраставом."

  # Blood Rune Event
  bm_blood_rune.001.title: "Начертать руны крови"
  bm_blood_rune.001.desc: "Вы разворачиваете древние свитки со сложными узорами силы — рунами крови, позволяющими пассивно собирать жизненную силу из окружающего мира. Ритуал требует особых игл, выкованных в пламени, закалённом кровью, чернил с примесью вашей сущности и твёрдой руки того, кто понимает: каждая линия не просто рисуется, а связывается с самим вашим существом.\n\nБоль будет мучительной, а перемены — необратимыми. Но с каждой каплей крови и чернил, впитавшейся в плоть, ваша связь с багровыми искусствами будет крепнуть. Такие знаки отличают мага крови, стремящегося к истинному мастерству: не просто владеть магией крови, а стать её живым воплощением."

  bm_blood_rune.001.minor: "Малая руна крови — пульсирующий знак над сердцем"
  bm_blood_rune.001.major: "Большая руна крови — сеть силы, пронизывающая плоть"
  bm_blood_rune.001.superior: "Высшая руна крови — превратить кожу в живой гримуар магии крови"
  bm_blood_rune.001.z: "Нынешние знаки служат мне достаточно хорошо"
  bm_blood_rune_yearly_event_popup.title: "Ваша руна крови пассивно собрала жизненную силу из окружающего мира"
  bm_blood_rune_minor_toast: "Малая руна крови начертана"
  bm_blood_rune_major_toast: "Большая руна крови начертана"
  bm_blood_rune_superior_toast: "Высшая руна крови начертана"

  # Decision
  bm_blood_rune_decision: "Начертать руны крови"
  bm_blood_rune_decision_confirm: "Начать начертание кровью"
  bm_blood_rune_decision_desc: "Используйте древнюю магию крови, чтобы начертать на плоти постоянные руны. Эти тайные знаки позволят со временем пассивно собирать жизненную силу из окружающего мира."
  bm_blood_rune_decision_tooltip: "Навсегда начертать на теле руны крови, чтобы пассивно собирать жизненную силу из окружающего мира"
  bm_blood_rune_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] опыта в магии крови"
  NOT_bm_blood_rune_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('bm_blood_rune_minimum_xp')|0] опыта в магии крови"
