l_russian:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Маги крови"
  rule_bm_blood_mage_prevalence: "Распространённость магов крови"
  setting_bm_prevalence_player_only: "Только игроки"
  setting_bm_prevalence_player_only_desc: "Только персонажи под управлением игроков могут получить свойство «Маг крови». Получение этого свойства ИИ заблокировано, включая естественное появление и наследование."
  setting_bm_prevalence_one_in_10000: "Один из 10 000"
  setting_bm_prevalence_one_in_10000_desc: "Магия крови исключительно редка. Веса получения свойства ИИ умножаются на 0.05, а персонажи ИИ сохраняют лишь 5% естественно появившихся или унаследованных свойств «Маг крови» (примерно 1 случай на 10 000 при базовом спонтанном появлении)."
  setting_bm_prevalence_one_in_1000: "Один из 1 000"
  setting_bm_prevalence_one_in_1000_desc: "Магия крови очень редка. Веса получения свойства ИИ умножаются на 0.50, а персонажи ИИ сохраняют 50% естественно появившихся или унаследованных свойств «Маг крови» (примерно 1 случай на 1 000 при базовом спонтанном появлении)."
  setting_bm_prevalence_default: "По умолчанию (один из 500)"
  setting_bm_prevalence_default_desc: "Обычная распространённость магов крови. Новорождённые, не унаследовавшие свойство, имеют шанс 0.20% (1 из 500) получить его спонтанно; действуют обычные шансы наследования."
  setting_bm_prevalence_one_in_100: "Один из 100"
  setting_bm_prevalence_one_in_100_desc: "Магия крови встречается чаще. Веса получения свойства ИИ удвоены, а новорождённые ИИ имеют шанс 1% (1 из 100) получить его спонтанно, а также повышенные шансы наследования."
  setting_bm_prevalence_one_in_10: "Один из 10"
  setting_bm_prevalence_one_in_10_desc: "Магия крови широко распространена среди династий. Веса получения свойства ИИ значительно повышены, а новорождённые ИИ имеют шанс 10% (1 из 10) получить его спонтанно и высокие шансы наследования."
  setting_bm_prevalence_everyone: "Все"
  setting_bm_prevalence_everyone_desc: "Каждый персонаж в мире рождается со свойством «Маг крови»."
  rule_bm_lore: "Мир магов крови"
  setting_bm_lore_historical: "Исторический"
  setting_bm_lore_historical_desc: "Использует Блодтру, его религиозное наследие и сеть священных мест в мире основной игры."
  setting_bm_lore_agot: "Игра престолов"
  setting_bm_lore_agot_desc: "При наличии дополнения Blood Mages - AGOT Religions заменяет культы мира основной игры соответствующими миру традициями Семерых, Старых богов, Утонувшего бога, Р'глора, Ройны и Валирии."
  rule_bm_physical_alteration:0 "Внешность магии крови"
  rule_bm_initiation_faith_requirement: "Вера для посвящения в маги крови"
  setting_bm_initiation_dedicated_cult: "Особый культ крови"
  setting_bm_initiation_dedicated_cult_desc: "Только последователи Блодтру или конфессии, явно отмеченной как культ магии крови, могут пройти ритуал посвящения культиста крови."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Культ крови или принятие колдовства"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Персонажи могут пройти ритуал посвящения культиста крови, если исповедуют Блодтру, конфессию, явно отмеченную как культ магии крови, или конфессию, допускающую колдовство."
  rule_blodtru_religion: "Религия магов крови"
  setting_blodtru_religion_enabled: "Включено"
  setting_blodtru_religion_enabled_desc: "Решение о принятии веры магов крови доступно."
  setting_blodtru_religion_disabled: "Отключено"
  setting_blodtru_religion_disabled_desc: "Решение о принятии веры магов крови недоступно."
  setting_blodtru_religion_enabled_player_only: "Только игроки"
  setting_blodtru_religion_enabled_player_only_desc: "Только игроки могут воспользоваться решением о принятии веры магов крови."
  rule_bm_blood_knight_prevalence:0 "Распространённость рыцарей крови"
  setting_bm_blood_knight_prevalence_player_only:0 "Только игрок"
  setting_bm_blood_knight_prevalence_player_only_desc:0 "Только персонажи под управлением игрока могут получить свойство рыцаря крови. Получение свойства персонажами ИИ заблокировано, включая естественное появление и наследование."
  setting_bm_blood_knight_prevalence_one_in_10000:0 "Один из 10 000"
  setting_bm_blood_knight_prevalence_one_in_10000_desc:0 "Рыцари крови исключительно редки. Веса получения свойства персонажами ИИ умножаются на 0,05, и персонажи ИИ сохраняют лишь 5% естественно появившихся или унаследованных свойств рыцаря крови (примерно один из 10 000 при базовом спонтанном появлении)."
  setting_bm_blood_knight_prevalence_one_in_1000:0 "Один из 1 000"
  setting_bm_blood_knight_prevalence_one_in_1000_desc:0 "Рыцари крови очень редки. Веса получения свойства персонажами ИИ умножаются на 0,50, и персонажи ИИ сохраняют 50% естественно появившихся или унаследованных свойств рыцаря крови (примерно один из 1 000 при базовом спонтанном появлении)."
  setting_bm_blood_knight_prevalence_default:0 "По умолчанию (один из 500)"
  setting_bm_blood_knight_prevalence_default_desc:0 "Стандартная распространённость рыцарей крови. Новорождённые, не унаследовавшие свойство, имеют вероятность его спонтанного появления 0,20% (один из 500); действуют стандартные вероятности наследования."
  setting_bm_blood_knight_prevalence_one_in_100:0 "Один из 100"
  setting_bm_blood_knight_prevalence_one_in_100_desc:0 "Рыцари крови встречаются чаще. Веса получения свойства персонажами ИИ удвоены, а новорождённые персонажи ИИ имеют вероятность его спонтанного появления 1% (один из 100) и повышенные шансы наследования."
  setting_bm_blood_knight_prevalence_one_in_10:0 "Один из 10"
  setting_bm_blood_knight_prevalence_one_in_10_desc:0 "Рыцари крови широко распространены среди династий. Веса получения свойства персонажами ИИ значительно повышены, а новорождённые персонажи ИИ имеют вероятность его спонтанного появления 10% (один из 10) и высокие шансы наследования."
  setting_bm_blood_knight_prevalence_everyone:0 "Все"
  setting_bm_blood_knight_prevalence_everyone_desc:0 "Каждый персонаж в мире рождается со свойством рыцаря крови."
  rule_bm_starting_counties_faith:0 "Вера крови в графствах на старте"
  setting_bm_starting_counties_faith_vanilla:0 "По умолчанию (основная игра)"
  setting_bm_starting_counties_faith_vanilla_desc:0 "В начале игры графства сохраняют исторические конфессии основной игры."
  setting_bm_starting_counties_faith_iceland:0 "Исландия начинает с Блодтру"
  setting_bm_starting_counties_faith_iceland_desc:0 "Все графства Исландии начинают игру с конфессией Блодтру."
  setting_bm_starting_counties_faith_tsushima:0 "Цусима начинает с Кэцудо"
  setting_bm_starting_counties_faith_tsushima_desc:0 "Островное графство Цусима начинает игру с конфессией Кэцудо."
  setting_bm_starting_counties_faith_both:0 "Оба региона"
  setting_bm_starting_counties_faith_both_desc:0 "Графства Исландии начинают игру с Блодтру, а Цусима — с Кэцудо."
  rule_bm_starting_holders_blood_mage:0 "Маги крови среди владельцев графств на старте"
  setting_bm_starting_holders_blood_mage_vanilla:0 "По умолчанию (основная игра)"
  setting_bm_starting_holders_blood_mage_vanilla_desc:0 "Владельцы графств не получают свойство мага крови в начале игры."
  setting_bm_starting_holders_blood_mage_iceland:0 "Владельцы графств Исландии — маги крови"
  setting_bm_starting_holders_blood_mage_iceland_desc:0 "Землевладельцы, владеющие графствами Исландии, начинают игру со свойством мага крови."
  setting_bm_starting_holders_blood_mage_tsushima:0 "Владелец Цусимы — маг крови"
  setting_bm_starting_holders_blood_mage_tsushima_desc:0 "Землевладелец, владеющий графством Цусима, начинает игру со свойством мага крови."
  setting_bm_starting_holders_blood_mage_both:0 "Оба региона"
  setting_bm_starting_holders_blood_mage_both_desc:0 "Землевладельцы Исландии и Цусимы начинают игру со свойством мага крови."
  setting_bm_physical_alteration_off:0 "Выключено"
  setting_bm_physical_alteration_off_desc:0 "Магия крови не меняет цвет глаз и волос магов и рыцарей крови."
  setting_bm_physical_alteration_gradual:0 "Постепенно"
  setting_bm_physical_alteration_gradual_desc:0 "Магия крови постепенно меняет цвет глаз и волос с ростом опыта направлений: слабый красный оттенок глаз при 100 опыта, яркие кроваво-красные глаза и выцветающие волосы при 300, светлые волосы при 400, полностью сверхъестественные белые или золотистые волосы и белые глаза при 500."
  setting_bm_physical_alteration_on:0 "Включено"
  setting_bm_physical_alteration_on_desc:0 "Все маги и рыцари крови сразу обретают предельную сверхъестественную внешность независимо от опыта направлений: белые глаза и волосы у магов крови; белые глаза и сияющие золотистые волосы у рыцарей крови."
