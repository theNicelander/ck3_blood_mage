l_russian:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Маги крови"
  rule_bm_blood_mage_prevalence: "Распространённость магов крови"
  setting_bm_prevalence_player_only: "Только игроки"
  setting_bm_prevalence_player_only_desc: "Только персонажи под управлением игроков могут получить свойство «Маг крови». Получение этого свойства ИИ заблокировано, включая естественное появление и наследование."
  setting_bm_prevalence_one_in_10000: "Один из 10 000"
  setting_bm_prevalence_one_in_10000_desc: "Магия крови исключительно редка. Веса получения свойства ИИ умножаются на 0.05, а персонажи ИИ сохраняют лишь 5% естественно появившихся или унаследованных свойств «Маг крови» (примерно 1 случай на 10 000 при базовом спонтанном появлении)."
  setting_bm_prevalence_one_in_1000: "Один из 1 000"
  setting_bm_prevalence_one_in_1000_desc: "Магия крови очень редка. Веса получения свойства ИИ умножаются на 0.50, а персонажи ИИ сохраняют 50% естественно появившихся или унаследованных свойств «Маг крови» (примерно 1 случай на 1 000 при базовом спонтанном появлении)."
  setting_bm_prevalence_default: "По умолчанию (один из 500)"
  setting_bm_prevalence_default_desc: "Обычная распространённость магов крови. Новорождённые, не унаследовавшие свойство, имеют шанс 0.20% (1 из 500) получить его спонтанно; действуют обычные шансы наследования."
  setting_bm_prevalence_one_in_100: "Один из 100"
  setting_bm_prevalence_one_in_100_desc: "Магия крови встречается чаще. Веса получения свойства ИИ удвоены, а новорождённые ИИ имеют шанс 1% (1 из 100) получить его спонтанно, а также повышенные шансы наследования."
  setting_bm_prevalence_one_in_10: "Один из 10"
  setting_bm_prevalence_one_in_10_desc: "Магия крови широко распространена среди династий. Веса получения свойства ИИ значительно повышены, а новорождённые ИИ имеют шанс 10% (1 из 10) получить его спонтанно и высокие шансы наследования."
  setting_bm_prevalence_everyone: "Все"
  setting_bm_prevalence_everyone_desc: "Каждый персонаж в мире рождается со свойством «Маг крови»."
  rule_bm_lore: "Мир магов крови"
  setting_bm_lore_historical: "Исторический"
  setting_bm_lore_historical_desc: "Использует Блодтру, его религиозное наследие и сеть священных мест в мире основной игры."
  setting_bm_lore_agot: "Игра престолов"
  setting_bm_lore_agot_desc: "При наличии дополнения Blood Mages - AGOT Religions заменяет культы мира основной игры соответствующими миру традициями Семерых, Старых богов, Утонувшего бога, Р'глора, Ройны и Валирии."
  rule_bm_physical_alteration: "Внешность магов крови"
  setting_bm_physical_alteration_none: "Без изменений"
  setting_bm_physical_alteration_none_desc: "Магия крови не меняет цвет глаз или волос мага крови."
  setting_bm_physical_alteration_eyes: "Только глаза"
  setting_bm_physical_alteration_eyes_desc: "По мере роста мастерства магия крови постепенно меняет цвет глаз мага крови, не затрагивая волосы."
  setting_bm_physical_alteration_eyes_hair: "Глаза и волосы"
  setting_bm_physical_alteration_eyes_hair_desc: "По мере роста мастерства магия крови постепенно меняет глаза мага крови, а на высоких ступенях делает волосы белыми."
  rule_bm_initiation_faith_requirement: "Вера для посвящения в маги крови"
  setting_bm_initiation_dedicated_cult: "Особый культ крови"
  setting_bm_initiation_dedicated_cult_desc: "Только последователи Блодтру или конфессии, явно отмеченной как культ магии крови, могут пройти ритуал посвящения культиста крови."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Культ крови или принятие колдовства"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Персонажи могут пройти ритуал посвящения культиста крови, если исповедуют Блодтру, конфессию, явно отмеченную как культ магии крови, или конфессию, допускающую колдовство."
  rule_blodtru_religion: "Религия магов крови"
  setting_blodtru_religion_enabled: "Включено"
  setting_blodtru_religion_enabled_desc: "Решение о принятии веры магов крови доступно."
  setting_blodtru_religion_disabled: "Отключено"
  setting_blodtru_religion_disabled_desc: "Решение о принятии веры магов крови недоступно."
  setting_blodtru_religion_enabled_player_only: "Только игроки"
  setting_blodtru_religion_enabled_player_only_desc: "Только игроки могут воспользоваться решением о принятии веры магов крови."
