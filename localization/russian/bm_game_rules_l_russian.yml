l_russian:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Маги крови"
  rule_bm_blood_mage_prevalence: "Распространённость магов крови"
  setting_bm_prevalence_player_only: "Только игроки"
  setting_bm_prevalence_player_only_desc: "Только персонажи под управлением игроков могут получить свойство мага крови. Для ИИ заблокированы все способы получения, включая естественное появление и наследование."
  setting_bm_prevalence_extremely_rare: "Крайне редко"
  setting_bm_prevalence_extremely_rare_desc: "Умножает веса решений и взаимодействий ИИ для получения магии крови на 0,01 (одну сотую стандартного значения). Персонажи ИИ сохраняют 10% естественно созданных или унаследованных свойств мага крови."
  setting_bm_prevalence_rare: "Редко"
  setting_bm_prevalence_rare_desc: "Умножает веса решений и взаимодействий ИИ для получения магии крови на 0,10 (одну десятую стандартного значения). Персонажи ИИ сохраняют 40% естественно созданных или унаследованных свойств мага крови."
  setting_bm_prevalence_uncommon: "Нечасто"
  setting_bm_prevalence_uncommon_desc: "Умножает веса решений и взаимодействий ИИ для получения магии крови на 0,50 (половину стандартного значения). Персонажи ИИ сохраняют 70% естественно созданных или унаследованных свойств мага крови."
  setting_bm_prevalence_default: "По умолчанию"
  setting_bm_prevalence_default_desc: "Использует исходную частоту появления, наследования, ритуалов и взаимодействий."
  setting_bm_prevalence_more_frequent: "Чаще"
  setting_bm_prevalence_more_frequent_desc: "Умножает веса решений и взаимодействий ИИ для получения магии крови на 2,00. Новорождённые ИИ наследуют её от одного родителя-мага крови с вероятностью около 50% и получают спонтанно с вероятностью около 1,25%."
  rule_bm_lore: "Мир магов крови"
  setting_bm_lore_historical: "Исторический"
  setting_bm_lore_historical_desc: "Использует Культ Квинтэссенции, его религиозное наследие в историческом мире и сеть священных мест."
  setting_bm_lore_agot: "Игра престолов"
  setting_bm_lore_agot_desc: "Если загружено дополнение Blood Mages - AGOT Religions, культы исторического мира заменяются соответствующими сеттингу традициями Семерых, Старых богов, Утонувшего бога, Р'глора, Ройны и Валирии."
  rule_bm_physical_alteration: "Внешность магов крови"
  setting_bm_physical_alteration_none: "Без изменений"
  setting_bm_physical_alteration_none_desc: "Магия крови не меняет цвет глаз или волос магов крови."
  setting_bm_physical_alteration_eyes: "Только глаза"
  setting_bm_physical_alteration_eyes_desc: "С ростом мастерства магия крови постепенно меняет цвет глаз мага крови, но не затрагивает волосы."
  setting_bm_physical_alteration_eyes_hair: "Глаза и волосы"
  setting_bm_physical_alteration_eyes_hair_desc: "Магия крови постепенно меняет глаза мага крови, а на высоких уровнях мастерства делает его волосы белыми."
  rule_bm_initiation_faith_requirement: "Вера для посвящения в маги крови"
  setting_bm_initiation_dedicated_cult: "Особый культ крови"
  setting_bm_initiation_dedicated_cult_desc: "Только последователи Культа Квинтэссенции или веры, явно отмеченной как культ магии крови, могут провести обряд посвящения."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Культ крови или принятое колдовство"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Персонажи могут провести обряд посвящения, если следуют Культу Квинтэссенции, вере, явно отмеченной как культ магии крови, или вере, принимающей колдовство."
  rule_quintessence_religion: "Религия магов крови"
  setting_quintessence_religion_enabled: "Включено"
  setting_quintessence_religion_enabled_desc: "Решение о принятии веры магов крови доступно."
  setting_quintessence_religion_disabled: "Отключено"
  setting_quintessence_religion_disabled_desc: "Решение принять веру Мага Крови отключено."
  setting_quintessence_religion_enabled_player_only: "Только игрок"
  setting_quintessence_religion_enabled_player_only_desc: "Только игроки могут воспользоваться решением о принятии веры магов крови."
