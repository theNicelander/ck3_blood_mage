l_russian:
 bm_blood_mage_story:0 "Магия крови"
 bm_blood_mage_story_desc:0 "Ваша кровь — и гримуар, и тигель. Каждый обряд углубляет познания в одном из направлений искусства крови."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "[GetPlayer.Custom('BM_BLOOD_MAGIC_DISCIPLINE_GRID')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_BLOOD_RUNE_DISPLAY')]\n\n#help Каждое направление достигает мастерства при 100 единицах опыта. Наведите указатель на направление, чтобы узнать правила его развития.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Големы крови"
 BM_BLOOD_RETINUE:0 "Рыцари крови (династия и двор)"
 BM_DYNASTY_BLOOD_MAGES:0 "Маги крови династии"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Обновить списки магов крови династии, рыцарей крови и големов крови в вашей истории"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Обновить списки персонажей, отображаемые на этой панели истории"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Нет"
 bm_blood_mage_lifeforce_major:0 "Жизненная сила: #P большой запас#!"
 bm_blood_mage_lifeforce_minor:0 "Жизненная сила: #V малый запас#!"
 bm_blood_mage_lifeforce_negative_major:0 "Жизненная сила: #N сильное истощение#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Жизненная сила: #N истощение#!"
 bm_blood_mage_lifeforce_none:0 "Жизненная сила: #weak не проявлена#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Запасы жизненной силы#! — #P высшие#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_superior_stacks').GetValue|0]#!    #P большие#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V малые#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Жизненная сила#!\nМалая, большая и высшая жизненная сила — отдельные накапливаемые запасы, добываемые или перегоняемые обрядами крови. Высшая жизненная сила возникает при сгущении малых и больших запасов. Способности магии крови указывают, какой запас расходуется; заклинание обычно расходует нужную порцию и может временно истощить вашу жизненную силу.\n\nПока запас не израсходован, каждая порция улучшает здоровье, плодовитость, продолжительность жизни, сопротивляемость болезням и доблесть. Высшая жизненная сила даёт предельное укрепление тела, вдвое превосходящее большую порцию."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Древность#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Просветление#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Родословная#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Благословение#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Гематургия#!"
 bm_blood_mage_attunement_vanguard:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Авангард#!"
 bm_blood_mage_attunement_slaughter:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Бойня#!"
 bm_blood_mage_attunement_resilience:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Стойкость#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #weak нет#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Настройка жизненной силы#!\nПотратьте одну порцию малой жизненной силы и 25 благочестия через решение #V «Настройка жизненной силы»#!, чтобы выбрать одно направление магии крови. Одновременно можно поддерживать только одну настройку; выбор другой заменяет текущую.\n\nКаждый год выбранное направление с вероятностью 50% получает #P 1 единицу опыта#!. Модификатор настройки также даёт пассивный бонус, соответствующий направлению."
 bm_blood_mage_blood_rune_superior:0 "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_major:0 "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_minor:0 "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_none:0 "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: #weak Нет#!"
 bm_blood_mage_blood_rune_tt:0 "#tooltip_heading Руны крови#!\nРуны крови — постоянные магические узоры, вырезанные прямо на вашей плоти обрядами крови. Эти живые знаки пассивно поглощают окружающую жизненную энергию каждый год, давая шанс обрести запасы жизненной силы.\n\nВысшие ступени рун приносят более обильную и частую добычу жизненной силы. Венчает их высшая руна крови — совершенный проводник энергии."
  BM_BLOOD_KNIGHT_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_vanguard_desc @bm_vanguard_discipline_icon! $trait_track_vanguard$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_vanguard_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_benediction_xp_value')|0]/100#!   #tooltip:trait_track_slaughter_desc @bm_slaughter_discipline_icon! $trait_track_slaughter$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_knight_slaughter_xp_value')|0]/100#!#!"
