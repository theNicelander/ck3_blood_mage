l_russian:
 bm_blood_mage_story:0 "Магия крови"
 bm_blood_mage_story_desc:0 "Ваша кровь — одновременно гримуар и горнило. Каждый обряд углубляет владение одной из дисциплин багрового искусства."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help Каждая дисциплина достигает мастерства при 100 очках опыта. Наведите курсор на дисциплину, чтобы увидеть правила её развития.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Кровавые големы"
 BM_CRIMSON_RETINUE:0 "Багровые воины и чемпионы"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Обновить список Кровавых големов, Багровых воинов и Багровых чемпионов, служащих при вашем дворе"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Обновить списки персонажей в этой панели истории"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Нет"
 bm_blood_mage_lifeforce_major:0 "Жизненная сила: #P Большой запас#!"
 bm_blood_mage_lifeforce_minor:0 "Жизненная сила: #V Малый запас#!"
 bm_blood_mage_lifeforce_negative_major:0 "Жизненная сила: #N Крайне истощена#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Жизненная сила: #N Истощена#!"
 bm_blood_mage_lifeforce_none:0 "Жизненная сила: #weak Не проявлена#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Заряды жизненной силы#! — #P Большие#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Малые#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Жизненная сила#!\nМалая и большая жизненная сила — отдельные накапливаемые запасы, добываемые высасыванием жизни и другими ритуалами. Способности магии крови указывают, какой запас они расходуют; применение магии обычно снимает необходимый заряд и может временно истощить жизненную силу.\n\nПока заряды не израсходованы, каждый из них повышает здоровье, плодовитость, продолжительность жизни и сопротивление болезням. Большой заряд даёт втрое больше преимуществ для выживания, чем малый."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #weak Нет#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Настройка жизненной силы#!\nПотратьте один малый заряд жизненной силы и 25 благочестия через личное взаимодействие #V Настройка жизненной силы#!, чтобы выбрать дисциплину магии крови. Одновременно поддерживается только одна Настройка; выбор новой заменяет текущую, а взаимодействие имеет пятилетнюю перезарядку.\n\nКаждый год настроенная дисциплина с вероятностью 50% получает #P 1 очко опыта#!. Модификатор Настройки также даёт особое пассивное преимущество этой дисциплины."
