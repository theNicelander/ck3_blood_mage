 bm_blood_mage_lifeforce_stacks: "#tooltip:bm_blood_mage_lifeforce_tt Запасы жизненной силы#! — #P высшие#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_superior_stacks').GetValue|0]#!    #P большие#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V малые#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!\n#weak Особые:#! #V Сияющая кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_radiant_stacks').GetValue|0]#!    #V Яростная кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_furious_stacks').GetValue|0]#!    #V Удачливая кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_fortunate_stacks').GetValue|0]#!    #V Хитрая кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_cunning_stacks').GetValue|0]#!    #V Мудрая кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_wise_stacks').GetValue|0]#!    #V Древняя кровь#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_ancient_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt: "#tooltip_heading Жизненная сила#!\nМалая, большая и высшая жизненная сила накапливаются раздельно. Их добывают и перегоняют в обрядах крови. Последовательным сгущением малых и больших запасов можно получить высшую жизненную силу. Обычные запасы можно преобразовать в особые. Каждый заряд особого запаса даёт +3 опыта соответствующего образа жизни в месяц:\n\n• #V Сияющая кровь#! улучшает мнение вассалов, престиж, легитимность и личные происки, а также даёт опыт дипломатического образа жизни.\n• #V Яростная кровь#! повышает доблесть и эффективность рыцарей, улучшает противодействие полков, ускоряет армию и осады, даёт благочестие за рыцарей и даёт опыт военного образа жизни.\n• #V Удачливая кровь#! повышает налоги с домена, ускоряет развитие и строительство, снижает стоимость строительства и содержание профессиональных полков и даёт опыт образа жизни управления.\n• #V Хитрая кровь#! повышает успех враждебных происков, защищает от заговоров, внушает ужас и даёт опыт образа жизни интриг.\n• #V Мудрая кровь#! повышает благочестие, устойчивость к стрессу, эффективность рыцарей за учёность и множитель опыта образа жизни, а также даёт опыт образа жизни учёности.\n• #V Древняя кровь#! повышает плодовитость, продлевает детородный возраст, улучшает наследование врождённых свойств, снижает риск близкородственного скрещивания и даёт опыт активного образа жизни.\n\nПока обычные запасы не израсходованы, они укрепляют здоровье, продлевают жизнь, повышают сопротивляемость болезням и нейтрализуют штрафы к здоровью."
 bm_blood_mage_attunement_ancient: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Древность#!"
 bm_blood_mage_attunement_wisdom: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Мудрость#!"
 bm_blood_mage_attunement_fortune: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Удача#!"
 bm_blood_mage_attunement_radiance: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Сияние#!"
 bm_blood_mage_attunement_cunning: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Хитрость#!"
 bm_blood_mage_attunement_fury: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #V Ярость#!"
 bm_blood_mage_attunement_none: "#tooltip:bm_blood_mage_attunement_tt Настройка#!: #weak нет#!"
 bm_blood_mage_attunement_tt: "#tooltip_heading Настройка жизненной силы#!\nНастройте магию крови на одно направление через решение #V «Применить малую магию крови»#!. Для настройки нужны [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 50#! благочестия. Повторить её можно через #V 1 год#!. Новая настройка заменяет прежнюю.\n\nВыбранное направление ежегодно получает #P 1 очко опыта#! (#P 2#! с высшим Хулинхьяльмом). Настройка также даёт постоянный бонус, зависящий от направления."
 bm_blood_mage_blood_rune_superior: "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_major: "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('major_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_minor: "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: [GetModifier('minor_blood_rune_modifier').GetNameWithTooltip]"
 bm_blood_mage_blood_rune_none: "#tooltip:bm_blood_mage_blood_rune_tt Руна крови#!: #weak Нет#!"
 bm_blood_mage_blood_rune_tt: "#tooltip_heading Руны крови#!\nРуны крови — постоянные магические узоры, вырезанные прямо на вашей плоти обрядами крови. Эти живые знаки позволяют каждый год пассивно собирать жизненную силу из окружающего мира.\n\nВысшие ступени рун приносят более обильную и частую добычу жизненной силы. Венчает их высшая руна крови — совершенный проводник энергии."
 bm_stave_display_vegvisir: "#tooltip:bm_stave_vegvisir_desc Гальдрастав#!: #V Вегвизир#!"
 bm_stave_display_aegishjalmur: "#tooltip:bm_stave_aegishjalmur_desc Гальдрастав#!: #V Эгисхьяльм#!"
