l_russian:
  bm_prisoner_blood_duel.0001.t: "Поединок в кровавой яме"
  bm_prisoner_blood_duel.0001.victor_desc: "Сталь звенит о сталь в залитой кровью яме. Вы пробиваете защиту персонажа [sc_defender.GetShortUINamePossessive] и сражаете [sc_defender.GetHerHim], поглощая остатки [sc_defender.GetHerHis] воинской сущности, пока [sc_defender.GetHerHis] кровь растекается по камням."
  bm_prisoner_blood_duel.0001.loser_desc: "С отчаянной яростью [sc_defender.GetShortUIName] переламывает ход поединка и наносит вам глубокую рану. Прежде чем стража успевает сомкнуть кольцо, [sc_defender.GetSheHe] вырывается на свободу и скрывается во тьме, оставив лишь каплю малой жизненной силы на песке."
  bm_prisoner_blood_duel.0001.opt_victory: "Эта кровь принадлежит мне."
  bm_prisoner_blood_duel.0001.opt_defeat: "Пленнику удалось ускользнуть..."
  bm_prisoner_blood_duel_victor_toast: "@bm_ancient_discipline_icon! Победа в кровавой яме"
  bm_prisoner_blood_duel_loser_toast: "@bm_ancient_discipline_icon! Пленник сбежал из ямы"

  bm_prisoner_blood_duel.0002.t: "Поединок в кровавой яме прерван"
  bm_prisoner_blood_duel.0002.desc: "Обстоятельства вынудили прервать поединок в кровавой яме до определения победителя. Потраченное благочестие возвращено."
  bm_prisoner_blood_duel.0002.opt: "Вернуть пленника в темницу."
  bm_prisoner_blood_duel_invalidated_toast: "@bm_ancient_discipline_icon! Поединок в кровавой яме прерван"
