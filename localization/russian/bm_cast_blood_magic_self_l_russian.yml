    bm_minor_attune_desc: "Настройте магию крови на направление, чтобы ежегодно получать +1 опыта (+2 с высшим Хулинхьяльмом) и постоянный бонус."
    bm_minor_attune_tooltip: "Настроить магию крови на направление для пассивного ежегодного опыта и модификаторов."
