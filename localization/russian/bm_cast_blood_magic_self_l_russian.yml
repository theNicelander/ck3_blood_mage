l_russian:
############### MINOR ###############
    # Attune lifeforce
    bm_attune_lifeforce_decision:0 "Настройка жизненной силы"
    bm_attune_lifeforce_decision_desc:0 "Потратьте [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], чтобы настроить магию крови на определённое направление свойства [GetTrait('lifestyle_blood_mage').GetName( GetNullCharacter )] и ускорить получение опыта."
    bm_attune_lifeforce_decision_tooltip:0 "Настроиться на направление магии крови, чтобы ускорить получение опыта"
    bm_attune_lifeforce_decision_confirm:0 "Настроить силы"

    bm_cast_blood_magic_self_attune_lifeforce:0 "Настройка жизненной силы"
    bm_attune_lifeforce.effects_list:0 "Выберите одну из следующих настроек (одновременно можно иметь только одну):\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('ancient_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('enlightenment_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('bloodline_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('benediction_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('hematurgy_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('vanguard_attuned').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('slaughter_attuned').GetNameWithTooltip]"

    bm_attune_lifeforce.001.title:0 "Настроить магию крови"
    bm_attune_lifeforce.001.desc:0 "Багровая сущность в моих венах пульсирует возможностями, ожидая направления. Настроив магию на определённый аспект, я могу укрепить связь с этой гранью магии крови и, возможно, быстрее овладеть ею."
    bm_attune_lifeforce.001.b:0 "Древность — продлить жизнь и обрести мудрость веков"
    bm_attune_lifeforce.001.c:0 "Просветление — ускорить личное магическое развитие"
    bm_attune_lifeforce.001.d:0 "Родословная — укрепить магическое наследие династии"
    bm_attune_lifeforce.001.e:0 "Благословение — улучшить способности к исцелению и усилению"
    bm_attune_lifeforce.001.f:0 "Гематургия — усовершенствовать сбор жизненной силы"
    bm_attune_lifeforce.001.vanguard:0 "Авангард — совершенствовать командование и доблесть рыцарей"
    bm_attune_lifeforce.001.slaughter:0 "Бойня — наполнить клинок и мышцы смертоносной жаждой крови"
    bm_attune_lifeforce.001.resilience:0 "Стойкость — укрепить тело против ран и болезней"

    # Channel lifeforce minor
    bm_channel_minor_lifeforce_decision:0 "Направить малую жизненную силу"
    bm_channel_minor_lifeforce_decision_desc:0 "Потратьте [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], чтобы получить небольшой временный бонус."
    bm_channel_minor_lifeforce_decision_tooltip:0 "Потратить малую жизненную силу на временное усиление одного навыка"
    bm_channel_minor_lifeforce_decision_confirm:0 "Направить кровь"

    bm_cast_blood_magic_self_channel_minor_lifeforce:0 "Направить малую жизненную силу"
    bm_cast_blood_magic_self_channel_minor_lifeforce_desc:0 "Потратьте [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], чтобы получить небольшой временный бонус."
    channel_lifeforce_enlightenment_minor.effects_list:0 "Направить малую магию крови на временное усиление одного навыка:\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('diplomacy_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('martial_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('stewardship_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('intrigue_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('learning_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('prowess_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('exp_lifeforce_modifier').GetNameWithTooltip]"

    bm_channel_lifeforce_enlightenment_minor.001.title:0 "Тихое пробуждение крови"
    bm_channel_lifeforce_enlightenment_minor.001.desc:0 "В моих венах пробуждается едва слышный шёпот силы — не рёв полного ритуала, но достаточно, чтобы дать преимущество. Сосредоточившись, я могу направить этот скромный багровый поток на временное усиление одной грани своего существа."
    bm_channel_lifeforce_enlightenment_minor.001.a:0 "Дипломатия — капля крови на языке развязывает чужие тайны"
    bm_channel_lifeforce_enlightenment_minor.001.b:0 "Военное дело — мой клинок жаждет вкуса битвы"
    bm_channel_lifeforce_enlightenment_minor.001.c:0 "Управление — багровое зрение раскрывает скрытую ценность"
    bm_channel_lifeforce_enlightenment_minor.001.d:0 "Интриги — тени расступаются перед багровым взглядом"
    bm_channel_lifeforce_enlightenment_minor.001.e:0 "Учёность — знания пульсируют с каждым ударом сердца"
    bm_channel_lifeforce_enlightenment_minor.001.f:0 "Плодовитость — пусть наше потомство процветает"
    bm_channel_lifeforce_enlightenment_minor.001.g:0 "Опыт — кровь помнит пути к могуществу"
    bm_channel_lifeforce_enlightenment_minor.001.h:0 "Доблесть — клинок будет закалён в крови"

############### MAJOR ###############
    # Education improvement
    bm_improve_education_decision:0 "Улучшить образование"
    bm_improve_education_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования."
    bm_improve_education_decision_tooltip:0 "Попытаться повысить уровень вашего основного свойства образования"
    bm_improve_education_decision_confirm:0 "Наполнить разум"
    bm_improve_education_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    NOT_bm_improve_education_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"

    bm_education_enhancement.001.title:0 "Вливание знаний через кровь"
    bm_education_enhancement.001.desc:0 "Багровая сущность течёт по подготовленным каналам, каждый из которых украшен рунами знания и силы. Начиная ритуал, вы должны решить, какую сторону своего образования усилить магией крови. Ритуал будет трудным: с ростом уровня образования сложность дальнейшего усиления значительно возрастает."
    bm_education_enhancement.001.diplomacy:0 "Улучшить дипломатическое образование"
    bm_education_enhancement.001.martial:0 "Улучшить военное образование"
    bm_education_enhancement.001.stewardship:0 "Улучшить образование в управлении"
    bm_education_enhancement.001.intrigue:0 "Улучшить образование в интригах"
    bm_education_enhancement.001.learning:0 "Улучшить образование в учёности"
    bm_education_enhancement.success:0 "Образование улучшено"
    bm_education_enhancement.failure:0 "Вливание крови не удалось"

    # New Education
    bm_new_education_decision:0 "Получить новое образование"
    bm_new_education_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования"
    bm_new_education_decision_tooltip:0 "Открыть второе направление образования с помощью магии крови"
    bm_new_education_decision_confirm:0 "Создать новые пути"
    bm_new_education_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"
    NOT_bm_new_education_decision_xp_requirement:0 "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_empowerment').GetName( GetNullCharacter )]"

    new_education_decision:0 "Обрести новые знания"
    bm_education_new.001.title:0 "Создание новых путей разума"
    bm_education_new.001.desc:0 "Вы раскрываете древние книги, подготавливая место для ритуала. В отличие от усиления имеющихся знаний, эта работа требует разрушения преград разума и создания совершенно новых основ понимания. Багровые руны на ваших висках пульсируют в ожидании: они станут проводниками знаний прямо в сознание. Какую незнакомую дисциплину вы заставите свой разум освоить сегодня?"
    bm_education_new.001.diplomacy:0 "Получить дипломатическое образование"
    bm_education_new.001.martial:0 "Получить военное образование"
    bm_education_new.001.stewardship:0 "Получить образование в управлении"
    bm_education_new.001.intrigue:0 "Получить образование в интригах"
    bm_education_new.001.learning:0 "Получить образование в учёности"

    # Blood Empowerment
    bm_blood_empowerment_decision:0 "Направить усиление кровью"
    bm_blood_empowerment_decision_desc:0 "Потратьте [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы навсегда усилить физические и умственные способности"
    bm_blood_empowerment_decision_tooltip:0 "Потратить большую жизненную силу на постоянное развитие Усиления кровью"
    bm_blood_empowerment_decision_confirm:0 "Пробудить силу"

    bm_blood_empowerment_event.001.title:0 "Усиление кровью"
    bm_blood_empowerment_event.001.desc:0 "Магия крови ревёт во мне, словно зверь в клетке, жаждущий свободы. Я чувствую, как она рвётся сквозь плоть, стремясь изменить саму мою сущность согласно моим желаниям. Что я позволю ей преобразить сегодня?"
    bm_blood_empowerment_event.001.toast:0 "Усиление кровью"

    bm_blood_empowerment_event.001.dynasty:0 "Династия — мой род расцветёт, наполненный могучей жизненной силой"
    bm_blood_empowerment_event.001.mastery:0 "Мастерство — древняя мудрость крови ускорит моё обучение"
    bm_blood_empowerment_event.001.presence:0 "Влияние — мои слова будут сочиться ядом убеждения"
    bm_blood_empowerment_event.001.prosperity:0 "Процветание — богатство и ресурсы потекут словно кровь в мои протянутые руки"
    bm_blood_empowerment_event.001.shadows:0 "Тени — покров крови собьёт врагов с толку и укроет мои тайны"
    bm_blood_empowerment_event.001.versatility:0 "Универсальность — моя сила преодолеет любые границы"

    # Manifest Lifeforce
    bm_manifest_lifeforce_decision:0 "Проявить жизненную силу"
    bm_manifest_lifeforce_decision_desc:0 "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."
    bm_manifest_lifeforce_decision_tooltip:0 "Пройти состязание учёности, чтобы призвать жизненную силу духовной решимостью"
    bm_manifest_lifeforce_decision_confirm:0 "Начать медитацию"

    bm_cast_blood_magic_self_manifest_lifeforce:0 "Проявить жизненную силу"
    bm_cast_blood_magic_self_manifest_lifeforce_desc:0 "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."

    # Cast Blood Magic Minor
    bm_cast_blood_magic_minor_decision:0 "Применить малую магию крови"
    bm_cast_blood_magic_minor_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] на применение малых искусств магии крови."
    bm_cast_blood_magic_minor_decision_tooltip:0 "Открыть гримуар малых ритуалов магии крови"
    bm_cast_blood_magic_minor_decision_confirm:0 "Открыть гримуар"

    bm_cast_blood_magic_minor.001.title:0 "Малая магия крови"
    bm_cast_blood_magic_minor.001.desc:0 "Скромный запас жизненной силы пробуждается в ваших венах. Сосредоточившись, вы можете направить эту энергию на немедленное временное усиление или настроить дух, чтобы углубить связь с определённым направлением."
    bm_cast_blood_magic_minor.001.channel:0 "Направить малую жизненную силу"
    bm_cast_blood_magic_minor.001.attune:0 "Настроить жизненную силу"
    bm_cast_blood_magic_minor.001.purge:0 "Очиститься от изъянов и недугов"
    bm_cast_blood_magic_minor.001.condense:0 "Сгустить жизненную силу"
    bm_cast_blood_magic_minor.001.condense.tt:0 "Потратить #V 100#! благочестия и преобразовать запас: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] превратится в [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
    bm_cast_blood_magic_minor.001.cancel:0 "Назад"

    # Cast Blood Magic Major
    bm_cast_blood_magic_major_decision:0 "Применить большую магию крови"
    bm_cast_blood_magic_major_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] на проведение могущественных обрядов магии крови."
    bm_cast_blood_magic_major_decision_tooltip:0 "Открыть гримуар больших ритуалов магии крови"
    bm_cast_blood_magic_major_decision_confirm:0 "Открыть гримуар"

    bm_cast_blood_magic_major.001.title:0 "Большая магия крови"
    bm_cast_blood_magic_major.001.desc:0 "Мощный поток большой жизненной силы пульсирует в ваших венах, готовый изменить разум, тело или родословную. Выберите великий обряд крови."
    bm_cast_blood_magic_major.001.empowerment:0 "Усиление кровью"
    bm_cast_blood_magic_major.001.improve_education:0 "Улучшить образование"
    bm_cast_blood_magic_major.001.new_education:0 "Получить новое образование"
    bm_cast_blood_magic_major.001.blood_rune:0 "Начертать руны крови"
    bm_cast_blood_magic_major.001.blood_rune_minor:0 "Начертать малую руну крови"
    bm_cast_blood_magic_major.001.blood_rune_major:0 "Начертать большую руну крови"
    bm_cast_blood_magic_major.001.blood_rune_superior:0 "Начертать высшую руну крови"
    bm_cast_blood_magic_major.001.bloodline:0 "Усилить родословную династии"
    bm_cast_blood_magic_major.001.cancel:0 "Назад"

############### SUPERIOR ###############
    # Cast Blood Magic Superior
    bm_cast_blood_magic_superior_decision:0 "Применить высшую магию крови"
    bm_cast_blood_magic_superior_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] на высшие обряды магии крови, превосходящие пределы смертных."
    bm_cast_blood_magic_superior_decision_tooltip:0 "Открыть гримуар высших ритуалов магии крови"
    bm_cast_blood_magic_superior_decision_confirm:0 "Открыть гримуар"

    bm_cast_blood_magic_superior.001.title:0 "Высшая магия крови"
    bm_cast_blood_magic_superior.001.desc:0 "Несравненная очищенная сущность высшей жизненной силы течёт по вашим венам. С этой возвышенной мощью вы можете нарушить основные законы возможностей смертных: достичь легендарного мастерства в образовании, открыть новые дисциплины, начертать высшую руну крови, создать големов крови или обрести сверхчеловеческое совершенство."
    bm_cast_blood_magic_superior.001.master_education:0 "Овладеть образованием: восхождение к 5 звёздам"
    bm_cast_blood_magic_superior.001.new_education:0 "Получить новое образование"
    bm_cast_blood_magic_superior.001.blood_rune_superior:0 "Начертать высшую руну крови"
    bm_cast_blood_magic_superior.001.manifest_traits:0 "Направить жизненную силу: запредельное совершенство"
    bm_cast_blood_magic_superior.001.manifest_traits_tt:0 "Направить высшую жизненную силу на преобразование врождённых свойств (интеллект, телосложение, красота) до высших уровней 4 и 5."
    bm_cast_blood_magic_superior.001.create_blood_golem:0 "Создать голема крови"
    bm_cast_blood_magic_superior.001.cancel:0 "Назад"

    # Education Mastery
    bm_master_education_decision_desc:0 "Попытаться возвысить ваше образование с 4 звёзд до легендарного мастерства с 5 звёздами."
    bm_education_master.001.title:0 "Вершина интеллектуального мастерства"
    bm_education_master.001.desc:0 "Вы довели своё владение дисциплиной до самого предела человеческого понимания. Наполнив разум высшей жизненной силой, вы можете довести знания до легендарного мастерства с 5 звёздами."
    bm_education_master.001.diplomacy:0 "Достичь легендарного мастерства в дипломатии"
    bm_education_master.001.martial:0 "Достичь легендарного мастерства в военном деле"
    bm_education_master.001.stewardship:0 "Достичь легендарного мастерства в управлении"
    bm_education_master.001.intrigue:0 "Достичь легендарного мастерства в интригах"
    bm_education_master.001.learning:0 "Достичь легендарного мастерства в учёности"
    bm_education_master.success:0 "Легендарное мастерство достигнуто"
