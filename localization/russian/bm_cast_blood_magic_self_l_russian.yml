    bm_minor_channel_focus: "Направить концентрацию крови"
    bm_minor_channel_focus_desc: "Направить малую жизненную силу на усиление направления на 5 лет."
    bm_minor_channel_focus_tooltip: "Направить малую жизненную силу на модификатор концентрации сроком на 5 лет."
