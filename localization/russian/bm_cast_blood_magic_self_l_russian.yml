  bm_cast_blood_magic_superior.blood_rune_superior_tt:0 "$bm_superior_blood_rune_tooltip$"
  bm_cast_blood_magic_superior.manifest_traits:0 "$bm_superior_manifest_traits$"
  bm_cast_blood_magic_superior.manifest_traits_tt:0 "$bm_superior_manifest_traits_tooltip$"
  bm_cast_blood_magic_superior.create_blood_golem:0 "$bm_superior_create_blood_golem$"
