l_russian:
############### MINOR ###############
    # Attune lifeforce
    bm_attune_lifeforce_interaction: "Настройка жизненной силы"
    bm_attune_lifeforce_interaction_desc: "Настроить магию крови на выбранное направление, чтобы ежегодно получать #P +1#! опыта (#P +2#! с высшим Хулинхьяльмом) и открыть его постоянный модификатор."
    bm_attune_lifeforce_toast: "@bm_ancient_discipline_icon! Жизненная сила настроена"

    bm_attune_ancient: "Древность"
    bm_attune_ancient_name: "$bm_attune_ancient$"
    bm_attune_ancient_desc: "Накладывает модификатор [GetModifier('ancient_attuned').GetNameWithTooltip]."
    bm_attune_ancient_tooltip: "$bm_attune_ancient_desc$"

    bm_attune_wisdom: "Мудрость"
    bm_attune_wisdom_name: "$bm_attune_wisdom$"
    bm_attune_wisdom_desc: "Накладывает модификатор [GetModifier('wisdom_attuned').GetNameWithTooltip]."
    bm_attune_wisdom_tooltip: "$bm_attune_wisdom_desc$"

    bm_attune_fortune: "Удача"
    bm_attune_fortune_name: "$bm_attune_fortune$"
    bm_attune_fortune_desc: "Накладывает модификатор [GetModifier('fortune_attuned').GetNameWithTooltip]."
    bm_attune_fortune_tooltip: "$bm_attune_fortune_desc$"

    bm_attune_radiance: "Сияние"
    bm_attune_radiance_name: "$bm_attune_radiance$"
    bm_attune_radiance_desc: "Накладывает модификатор [GetModifier('radiance_attuned').GetNameWithTooltip]."
    bm_attune_radiance_tooltip: "$bm_attune_radiance_desc$"

    bm_attune_cunning: "Хитрость"
    bm_attune_cunning_name: "$bm_attune_cunning$"
    bm_attune_cunning_desc: "Накладывает модификатор [GetModifier('cunning_attuned').GetNameWithTooltip]."
    bm_attune_cunning_tooltip: "$bm_attune_cunning_desc$"

    bm_attune_fury: "Ярость"
    bm_attune_fury_name: "$bm_attune_fury$"
    bm_attune_fury_desc: "Накладывает модификатор [GetModifier('fury_attuned').GetNameWithTooltip]."
    bm_attune_fury_tooltip: "$bm_attune_fury_desc$"

############### MAJOR ###############
    # Education improvement
    bm_improve_education_decision: "Улучшить образование"
    bm_improve_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования."
    bm_improve_education_decision_tooltip: "Попытаться повысить уровень вашего основного свойства образования"
    bm_improve_education_decision_confirm: "Наполнить разум"
    bm_improve_education_cooldown: "Недавно улучшено образование"
    bm_improve_education_cooldown_desc: "Вы недавно улучшили образование или достигли мастерства с помощью магии крови. Нервным путям нужно время, чтобы стабилизироваться."
    bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"
    NOT_bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"

    bm_education_enhancement.001.title: "Вливание знаний через кровь"
    bm_education_enhancement.001.desc: "Багровая сущность течёт по подготовленным каналам, каждый из которых украшен рунами знания и силы. Начиная ритуал, вы должны решить, какую сторону своего образования усилить магией крови. Ритуал будет трудным: с ростом уровня образования сложность дальнейшего усиления значительно возрастает."
    bm_education_enhancement.001.diplomacy: "Улучшить дипломатическое образование"
    bm_education_enhancement.001.martial: "Улучшить военное образование"
    bm_education_enhancement.001.stewardship: "Улучшить образование в управлении"
    bm_education_enhancement.001.intrigue: "Улучшить образование в интригах"
    bm_education_enhancement.001.learning: "Улучшить образование в учёности"
    bm_education_enhancement.001.back: "Назад"
    bm_education_enhancement.success: "@bm_ancient_discipline_icon! Образование улучшено"
    bm_education_enhancement.failure: "@bm_ancient_discipline_icon! Вливание крови не удалось"

    # New Education
    bm_new_education_decision: "Получить новое образование"
    bm_new_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования"
    bm_new_education_decision_tooltip: "Открыть второе направление образования с помощью магии крови"
    bm_new_education_decision_confirm: "Создать новые пути"
    bm_new_education_cooldown: "Недавно получено новое образование"
    bm_new_education_cooldown_desc: "Вы недавно создали новые нервные пути для дополнительного направления образования. Разуму нужно время, чтобы стабилизироваться."
    bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"
    NOT_bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"

    new_education_decision: "Обрести новые знания"
    bm_education_new.001.title: "@bm_ancient_discipline_icon! Создание новых путей разума"
    bm_education_new.001.desc: "Вы раскрываете древние книги, подготавливая место для ритуала. В отличие от усиления имеющихся знаний, эта работа требует разрушения преград разума и создания совершенно новых основ понимания. Багровые руны на ваших висках пульсируют в ожидании: они станут проводниками знаний прямо в сознание. Какую незнакомую дисциплину вы заставите свой разум освоить сегодня?"
    bm_education_new.001.diplomacy: "Получить дипломатическое образование"
    bm_education_new.001.martial: "Получить военное образование"
    bm_education_new.001.stewardship: "Получить образование в управлении"
    bm_education_new.001.intrigue: "Получить образование в интригах"
    bm_education_new.001.learning: "Получить образование в учёности"
    bm_education_new.001.back: "Назад"

    # Manifest Lifeforce
    bm_manifest_lifeforce_decision: "Проявить жизненную силу"
    bm_manifest_lifeforce_decision_desc: "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."
    bm_manifest_lifeforce_decision_tooltip: "Пройти состязание учёности, чтобы призвать жизненную силу духовной решимостью"
    bm_manifest_lifeforce_decision_confirm: "Начать медитацию"

    bm_cast_blood_magic_self_manifest_lifeforce: "Проявить жизненную силу"
    bm_cast_blood_magic_self_manifest_lifeforce_desc: "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."

    BM_CAST_BLOOD_MAGIC_NEXT_STEP_BUTTON: "Провести ритуал"
    bm_cast_blood_magic.cancel: "Назад"

    # Requirements & Failure Tooltips
    bm_purge_minor_has_ailment_tt: "Есть хотя бы одна излечимая рана, болезнь или физический изъян"
    NOT_bm_purge_minor_has_ailment_tt: "Есть хотя бы одна излечимая рана, болезнь или физический изъян"

    bm_improve_education_devotion_req: "Уровень набожности соответствует уровню образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)"
    NOT_bm_improve_education_devotion_req: "Уровень набожности соответствует уровню образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)"
    bm_improve_education_trait_req: "Есть свойство образования ниже 4-го уровня"
    NOT_bm_improve_education_trait_req: "Есть свойство образования ниже 4-го уровня"

    bm_master_education_trait_req: "Есть свойство образования с 4 звёздами"
    NOT_bm_master_education_trait_req: "Есть свойство образования с 4 звёздами"
    bm_new_education_req_5_star: "Есть свойство образования с 5 звёздами"
    NOT_bm_new_education_req_5_star: "Есть свойство образования с 5 звёздами"
    bm_new_education_req_no_other_star: "Нет свойств образования более низкого уровня"
    NOT_bm_new_education_req_no_other_star: "Нет свойств образования более низкого уровня"
    bm_manifest_apex_eligible_req: "Есть подходящее врождённое свойство (уровень 3–4)"
    NOT_bm_manifest_apex_eligible_req: "Есть подходящее врождённое свойство (уровень 3–4)"

    # Transmute Lifeforce Decision
    bm_transmute_lifeforce_decision: "Преобразовать жизненную силу"
    bm_transmute_lifeforce_decision_desc: "Преобразуйте жизненную силу в особые запасы или извлеките её из них."
    bm_transmute_lifeforce_decision_tooltip: "Начать обряд преобразования или возврата жизненной силы."
    bm_transmute_lifeforce_decision_confirm: "Начать преобразование"

    # Transmute Lifeforce Events
    bm_transmute_lifeforce.cancel: "Назад"
    bm_transmute_lifeforce.back: "Назад"

    bm_transmute_lifeforce.0001.t: "Преобразование жизненной силы"
    bm_transmute_lifeforce.0001.desc: "Вы готовитесь перераспределить запасы жизненной силы, преобразуя большую жизненную силу в особые запасы или извлекая её обратно в виде большой жизненной силы."
    bm_transmute_lifeforce.0001.major: "Преобразовать большую жизненную силу"
    bm_transmute_lifeforce.0001.reverse: "Вернуть жизненную силу из запасов"

    bm_transmute_lifeforce.0002.t: "Преобразование большой жизненной силы"
    bm_transmute_lifeforce.0002.desc: "Преобразовать 1 порцию большой жизненной силы в 1 заряд выбранного запаса."
    bm_transmute_lifeforce.0002.radiant: "Направить в запас «Сияющая кровь»"
    bm_transmute_lifeforce.0002.furious: "Направить в запас «Яростная кровь»"
    bm_transmute_lifeforce.0002.fortunate: "Направить в запас «Удачливая кровь»"
    bm_transmute_lifeforce.0002.cunning: "Направить в запас «Хитрая кровь»"
    bm_transmute_lifeforce.0002.wise: "Направить в запас «Мудрая кровь»"
    bm_transmute_lifeforce.0002.ancient: "Направить в запас «Древняя кровь»"

    bm_transmute_lifeforce.0004.t: "Вернуть жизненную силу из запасов"
    bm_transmute_lifeforce.0004.desc: "Преобразовать 1 заряд выбранного запаса обратно в 1 порцию большой жизненной силы."
    bm_transmute_lifeforce.0004.radiant: "Вернуть из запаса «Сияющая кровь»"
    bm_transmute_lifeforce.0004.furious: "Вернуть из запаса «Яростная кровь»"
    bm_transmute_lifeforce.0004.fortunate: "Вернуть из запаса «Удачливая кровь»"
    bm_transmute_lifeforce.0004.cunning: "Вернуть из запаса «Хитрая кровь»"
    bm_transmute_lifeforce.0004.wise: "Вернуть из запаса «Мудрая кровь»"
    bm_transmute_lifeforce.0004.ancient: "Вернуть из запаса «Древняя кровь»"

    # Cast Blood Magic Minor
    bm_cast_blood_magic_minor_decision: "Применить малую магию крови"
    bm_cast_blood_magic_minor_decision_desc: "Выберите малый обряд для проведения."
    bm_cast_blood_magic_minor_decision_tooltip: "Открыть список малых ритуалов магии крови"
    bm_cast_blood_magic_minor_decision_confirm: "$BM_CAST_BLOOD_MAGIC_NEXT_STEP_BUTTON$"

    # Minor Options
    bm_minor_purge: "Очиститься от изъянов и недугов"
    bm_minor_purge_desc: "Исцелить телесные раны и болезни или устранить отрицательные свойства с помощью малой жизненной силы."
    bm_minor_purge_tooltip: "Исцелить телесные раны и болезни или устранить отрицательные свойства с помощью малой жизненной силы.\n\nСтоимость: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 50#! [piety|E]."
    bm_minor_condense: "Сгустить жизненную силу"
    bm_minor_condense_desc: "Преобразовать малую жизненную силу в большую."
    bm_minor_condense_tooltip: "Потратить #V 100#! [piety|E] и преобразовать запас: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] превратится в [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
    bm_condense_minor_lifeforce_cooldown_tt: "Малая жизненная сила не сгущалась последние 6 месяцев"
    NOT_bm_condense_minor_lifeforce_cooldown_tt: "Малая жизненная сила не сгущалась последние 6 месяцев"
    bm_reclaim_radiant_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_reclaim_fortunate_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_reclaim_cunning_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_reclaim_ancient_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_reclaim_furious_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_reclaim_wise_toast: "@bm_ancient_discipline_icon! Большая жизненная сила возвращена"
    bm_minor_blood_rune: "Начертать малую руну крови"
    bm_minor_blood_rune_desc: "Навсегда начертать на плоти малую руну крови, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира."
    bm_minor_blood_rune_tooltip: "Навсегда начертать на плоти малую руну крови, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира.\n\nСтоимость: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 100#! [piety|E]."
    bm_minor_attune: "Настройка жизненной силы"
    bm_minor_attune_desc: "Настройте магию крови на направление, чтобы ежегодно получать +1 опыта (+2 с высшим Хулинхьяльмом) и постоянный бонус."
    bm_minor_attune_tooltip: "Настроить магию крови на направление, чтобы ежегодно получать опыт и постоянный бонус.\n\nПервая настройка бесплатна. Смена направления стоит [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 50#! [piety|E]."
    bm_attune_lifeforce_cooldown_tt: "Жизненная сила не настраивалась за последний 1 год"
    NOT_bm_attune_lifeforce_cooldown_tt: "Жизненная сила не настраивалась за последний 1 год"
    bm_minor_blood_blessing: "Благословение крови"
    bm_minor_blood_blessing_desc: "Даровать себе постоянное благословение крови или усилить его."
    bm_minor_blood_blessing_tooltip: "Открывает взаимодействие «Благословение крови», чтобы даровать себе постоянное благословение крови или усилить его.\n\nМалое: 50 [piety|E], набожность 1, малая жизненная сила.\nБольшое: 150 [piety|E], набожность 3, большая жизненная сила.\nВысшее: 250 [piety|E], набожность 5, высшая жизненная сила."
    bm_major_blood_blessing: "$bm_minor_blood_blessing$"
    bm_major_blood_blessing_desc: "$bm_minor_blood_blessing_desc$"
    bm_major_blood_blessing_tooltip: "$bm_minor_blood_blessing_tooltip$"
    bm_superior_blood_blessing: "$bm_minor_blood_blessing$"
    bm_superior_blood_blessing_desc: "$bm_minor_blood_blessing_desc$"
    bm_superior_blood_blessing_tooltip: "$bm_minor_blood_blessing_tooltip$"

    # Minor Aliases
    bm_cast_blood_magic_minor.001.purge: "$bm_minor_purge$"
    bm_cast_blood_magic_minor.001.purge.tt: "$bm_minor_purge_tooltip$"
    bm_purge_impurities_toast: "@bm_ancient_discipline_icon! Кровь очищена от изъянов"
    bm_cast_blood_magic_minor.001.condense: "$bm_minor_condense$"
    bm_cast_blood_magic_minor.001.condense.tt: "$bm_minor_condense_tooltip$"
    bm_condense_lifeforce_toast: "@bm_ancient_discipline_icon! Жизненная сила сгущена"
    bm_condense_lifeforce_toast_desc: "Вы сосредоточили жизненную сущность, потратив благочестие на преобразование запаса: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] превратилась в [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
    bm_cast_blood_magic_minor.001.blood_rune_minor: "$bm_minor_blood_rune$"
    bm_cast_blood_magic_minor.001.cancel: "Назад"

    # Cast Blood Magic Major
    bm_cast_blood_magic_major_decision: "Применить большую магию крови"
    bm_cast_blood_magic_major_decision_desc: "Выберите большой обряд для проведения."
    bm_cast_blood_magic_major_decision_tooltip: "Открыть список больших ритуалов магии крови"
    bm_cast_blood_magic_major_decision_confirm: "$BM_CAST_BLOOD_MAGIC_NEXT_STEP_BUTTON$"

    # Major Options
    bm_major_condense: "Сгустить жизненную силу"
    bm_major_condense_desc: "Сгустить большую жизненную силу до высшей."
    bm_major_condense_tooltip: "Потратить #V 250#! [piety|E] и преобразовать запас: [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] превратится в [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip]."
    bm_condense_major_lifeforce_cooldown_tt: "Большая жизненная сила не сгущалась последние 6 месяцев"
    NOT_bm_condense_major_lifeforce_cooldown_tt: "Большая жизненная сила не сгущалась последние 6 месяцев"
    bm_condense_superior_lifeforce_toast: "@bm_ancient_discipline_icon! Жизненная сила сгущена"
    bm_condense_superior_lifeforce_toast_desc: "Вы потратили благочестие и преобразовали запас: [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] превратилась в [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip]."
    bm_major_split: "Разделить жизненную силу"
    bm_major_split_desc: "Разделить большую жизненную силу на две порции малой."
    bm_major_split_tooltip: "Потратить #V 50#! [piety|E] и разделить запас «[GetModifier('lifeforce_modifier_major').GetNameWithTooltip]» на две порции запаса «[GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]»."
    bm_split_major_lifeforce_cooldown_tt: "Большая жизненная сила не разделялась последние 6 месяцев"
    NOT_bm_split_major_lifeforce_cooldown_tt: "Большая жизненная сила не разделялась последние 6 месяцев"
    bm_split_major_lifeforce_toast: "@bm_ancient_discipline_icon! Большая жизненная сила разделена"
    bm_split_major_lifeforce_toast_desc: "Вы разделили большую жизненную силу на две порции малой."
    bm_major_improve_education: "Улучшить образование"
    bm_major_improve_education_desc: "Попытаться повысить уровень основного свойства образования."
    bm_major_improve_education_tooltip: "С помощью вливания крови повысить уровень основного свойства образования (до 4 звёзд).\n\nСтоимость: [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и [piety|E] в размере, зависящем от ваших показателей. Требуемый уровень набожности зависит от образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)."
    bm_major_blood_rune: "Начертать большую руну крови"
