    bm_channel_focus_wisdom_opt_desc: "Применяет [GetModifier('bm_channel_focus_wisdom').GetNameWithTooltip]."
    bm_channel_focus_ancient_opt: "Концентрация древности"
    bm_channel_focus_ancient_opt_desc: "Применяет [GetModifier('bm_channel_focus_ancient').GetNameWithTooltip]."

