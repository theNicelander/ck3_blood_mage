  bm_purge_impurities_toast:0 "Кровь очищена от изъянов"
  bm_empower_warband:0 "Боевая дружина — Война и рыцари"
  bm_empower_warband_name:0 "$bm_empower_warband$"
  bm_empower_warband_desc:0 "Направляет жизненную силу на командование в бою, воинское мастерство, смертоносных рыцарей и тактическое превосходство.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта военного образа жизни (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +1 к пределу рыцарей, +15% эффективности рыцарей, +2 преимущества, +5% скорости передвижения.\n#P 30 опыта:#! +2 к пределу рыцарей, +30% эффективности рыцарей, +4 преимущества, +10% скорости передвижения.\n#V 50 опыта — рубеж:#! +4 к пределу рыцарей, +45% эффективности рыцарей, +6 преимущества, +15% скорости передвижения.\n#P 70 опыта:#! +6 к пределу рыцарей, +60% эффективности рыцарей, +8 преимущества, +20% скорости передвижения.\n#Y 100 опыта — вершина:#! +8 к пределу рыцарей, +75% эффективности рыцарей, +10 преимущества, +25% скорости передвижения, доблесть больше не снижается от старости."
  bm_empower_warband_tooltip:0 "$bm_empower_warband_desc$"
