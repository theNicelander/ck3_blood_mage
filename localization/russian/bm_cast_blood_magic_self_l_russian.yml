  bm_channel_blood_empowerment_decision:0 "Направить могущество крови"
  bm_channel_blood_empowerment_decision_desc:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 150#! [piety|E], чтобы улучшить [GetTrait('lifestyle_blood_power').GetName( GetPlayer )].\n\nКлючевые рубежи — #V 50#! и #V 100#! опыта."
  bm_channel_blood_empowerment_decision_tooltip:0 "Потратить большую жизненную силу на постоянное развитие выбранного направления Могущества крови"
  BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON:0 "Пробудить силу"
  bm_channel_blood_empowerment_decision_confirm:0 "$BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON$"
  bm_channel_blood_empowerment_decision_effect:0 "Вы направите большую жизненную силу на постоянное развитие выбранного направления Могущества крови."
  bm_channel_blood_empowerment_major_lifeforce_req:0 "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  NOT_bm_channel_blood_empowerment_major_lifeforce_req:0 "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_empower_track_already_mastered_req:0 "Это направление уже достигло максимального уровня (100 опыта)"
  NOT_bm_empower_track_already_mastered_req:0 "Это направление уже достигло максимального уровня (100 опыта)"
  bm_empower_dynasty:0 "Династия — евгеника и родство"
  bm_empower_dynasty_name:0 "$bm_empower_dynasty$"
  bm_empower_dynasty_desc:0 "Направляет жизненную силу на совершенствование поколений, наследование врождённых свойств, продление детородного возраста и полную защиту от близкородственного скрещивания.\n\n#P Каждые 10 опыта:#! +5% к наследованию положительных неактивных свойств, +5% к шансу усиления врождённых свойств.\n#P Каждые 20 опыта:#! #P +5#! лет детородного возраста.\n#V Рубеж 50 опыта:#! #P -50%#! к шансу близкородственного скрещивания, #P +10%#! ежемесячного признания.\n#Y Вершина 100 опыта:#! #P -50%#! к шансу близкородственного скрещивания (суммарно полная защита -100%), #P +15%#! ежемесячного признания (+25% суммарно), +20 лет детородного возраста, доблесть больше не снижается от старости."
  bm_empower_dynasty_tooltip:0 "$bm_empower_dynasty_desc$"
  bm_empower_mastery:0 "Мастерство — странствия и происки"
  bm_empower_mastery_name:0 "$bm_empower_mastery$"
  bm_empower_mastery_desc:0 "Расширяет горизонты разума и странствий, ускоряя освоение образов жизни и личные происки и увеличивая число изучаемых языков.\n\n#P Каждые 10 опыта:#! +5% ежемесячного опыта образа жизни.\n#P Каждые 20 опыта:#! #P +5#! к успеху личных происков, #P -5#! дней к фазе происков.\n#V Рубеж 50 опыта:#! #P +1#! учёности за уровень набожности, #P +1#! к максимуму личных происков.\n#Y Вершина 100 опыта:#! #P +1#! учёности за уровень набожности (+2 суммарно), #P +1#! к максимуму личных происков (+2 суммарно), #P игнорирование отрицательного мнения из-за культуры#!, доблесть больше не снижается от старости."
  bm_empower_mastery_tooltip:0 "$bm_empower_mastery_desc$"
  bm_empower_presence:0 "Влияние — завораживающее величие"
  bm_empower_presence_name:0 "$bm_empower_presence$"
  bm_empower_presence_desc:0 "Дарует сверхъестественное обаяние, непоколебимое спокойствие и прочную имперскую власть.\n\n#P Каждые 10 опыта:#! +3 общего мнения, -5% прироста стресса.\n#P Каждые 20 опыта:#! #P +5%#! влияния репутации.\n#V Рубеж 50 опыта:#! #P +1#! дипломатии за уровень набожности, #P -10%#! длительности короткого правления, #P +10%#! бонуса долгого правления.\n#Y Вершина 100 опыта:#! #P +1#! дипломатии за уровень набожности (+2 суммарно), #P -10%#! длительности короткого правления (-20% суммарно), #P +10%#! бонуса долгого правления (+20% суммарно), доблесть больше не снижается от старости."
  bm_empower_presence_tooltip:0 "$bm_empower_presence_desc$"
  bm_empower_prosperity:0 "Процветание — богатство и архитектура"
  bm_empower_prosperity_name:0 "$bm_empower_prosperity$"
  bm_empower_prosperity_desc:0 "Приносит устойчивое богатство в казну, удешевляет строительство и содержание армий и расширяет власть над доменом.\n\n#P Каждые 10 опыта:#! +5% ежемесячного дохода, -3% стоимости строительства владений и резиденций.\n#P Каждые 20 опыта:#! #P -5%#! содержания профессиональных полков.\n#V Рубеж 50 опыта:#! #P +1#! управления за уровень набожности, #P +1#! к пределу домена.\n#Y Вершина 100 опыта:#! #P +1#! управления за уровень набожности (+2 суммарно), #P +1#! к пределу домена (+2 суммарно), доблесть больше не снижается от старости."
  bm_empower_prosperity_tooltip:0 "$bm_empower_prosperity_desc$"
  bm_empower_shadows:0 "Тени — оккультная защита и интриги"
  bm_empower_shadows_name:0 "$bm_empower_shadows$"
  bm_empower_shadows_desc:0 "Окутывает ваши заговоры непроницаемым покровом крови, ослабляет происки врагов и помогает строить смертоносные планы.\n\n#P Каждые 10 опыта:#! +5 к успеху враждебных происков, -5 к успеху враждебных происков противника.\n#P Каждые 20 опыта:#! #P -5%#! к предельному шансу успеха враждебных происков противника.\n#V Рубеж 50 опыта:#! #P +1#! интриг за уровень набожности, #P +1#! к максимуму враждебных происков.\n#Y Вершина 100 опыта:#! #P +1#! интриг за уровень набожности (+2 суммарно), #P +1#! к максимуму враждебных происков (+2 суммарно), #P +15%#! к предельному шансу успеха собственных враждебных происков, доблесть больше не снижается от старости."
  bm_empower_shadows_tooltip:0 "$bm_empower_shadows_desc$"
  bm_empower_versatility:0 "Универсальность — запредельное совершенство"
  bm_empower_versatility_name:0 "$bm_empower_versatility$"
  bm_empower_versatility_desc:0 "Доступно после достижения мастерства во всех 5 направлениях (100 опыта). Направляет сгущённую большую жизненную силу на 10-летнее усиление всех навыков с шансом навсегда повысить навыки и доблесть."
  bm_empower_versatility_tooltip:0 "$bm_empower_versatility_desc$"
  bm_blood_power_event.001.title:0 "Направить могущество крови"
  bm_blood_power_event.001.desc:0 "Магия крови ревёт во мне, словно зверь в клетке, жаждущий свободы. Я чувствую, как она рвётся сквозь плоть, стремясь изменить саму мою сущность согласно моим желаниям. Что я позволю ей преобразить сегодня?"
  bm_blood_power_event.001.toast:0 "Могущество крови"
  bm_cast_blood_magic_major.001.power:0 "Направить могущество крови"
  bm_cast_blood_magic_major.001.power_tt:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 150#! [piety|E], чтобы улучшить [GetTrait('lifestyle_blood_power').GetName( GetPlayer )].\n\nКлючевые рубежи — #V 50#! и #V 100#! опыта."
  bm_cast_blood_magic_major.001.empowerment_tt:0 "$bm_cast_blood_magic_major.001.power_tt$"
  bm_cast_blood_magic_major.001.condense:0 "Сгустить жизненную силу"
  bm_cast_blood_magic_major.001.condense.tt:0 "В сложном ритуале перегонки пройти состязание учёности, чтобы соединить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] в [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip]."
  bm_cast_blood_magic_major.001.galdrastafir:0 "Начертать гальдрастав"
  bm_cast_blood_magic_major.001.galdrastafir_tt:0 "Связать древний гальдрастав с высшей руной крови. Первый знак бесплатен; смена знака стоит [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 500#! [piety|E]."
  bm_galdrastafir.001.title:0 "Гальдраставы"
  bm_galdrastafir.001.desc:0 "Начертав на плоти высшую руну крови, вы можете связать с ней древний гальдрастав, чтобы направить его оккультную силу. Если знак уже начертан, настройка на другой требует [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 500#! [piety|E]."
  bm_galdrastafir.001.toast:0 "Гальдрастав начертан"
