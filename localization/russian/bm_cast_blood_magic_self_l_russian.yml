    bm_minor_blood_blessing_desc: "Даровать себе постоянное благословение крови или усилить его."
    bm_minor_blood_blessing_tooltip: "Открывает взаимодействие «Благословение крови», чтобы даровать себе постоянное благословение крови или усилить его."
