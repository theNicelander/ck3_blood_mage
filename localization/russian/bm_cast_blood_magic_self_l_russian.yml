    bm_attune_wisdom_tooltip: "$bm_attune_wisdom_desc$"

    bm_attune_fortune: "Удача"
    bm_attune_fortune_name: "$bm_attune_fortune$"
    bm_attune_fortune_desc: "Накладывает модификатор [GetModifier('fortune_attuned').GetNameWithTooltip]."
    bm_attune_fortune_tooltip: "$bm_attune_fortune_desc$"

    bm_attune_radiance: "Сияние"
    bm_attune_radiance_name: "$bm_attune_radiance$"
    bm_attune_radiance_desc: "Накладывает модификатор [GetModifier('radiance_attuned').GetNameWithTooltip]."
    bm_attune_radiance_tooltip: "$bm_attune_radiance_desc$"

    bm_attune_cunning: "Хитрость"
    bm_attune_cunning_name: "$bm_attune_cunning$"
    bm_attune_cunning_desc: "Накладывает модификатор [GetModifier('cunning_attuned').GetNameWithTooltip]."
    bm_attune_cunning_tooltip: "$bm_attune_cunning_desc$"

    bm_attune_fury: "Ярость"
    bm_attune_fury_name: "$bm_attune_fury$"
    bm_attune_fury_desc: "Накладывает модификатор [GetModifier('fury_attuned').GetNameWithTooltip]."
    bm_attune_fury_tooltip: "$bm_attune_fury_desc$"

############### MAJOR ###############
    # Education improvement
    bm_improve_education_decision: "Улучшить образование"
    bm_improve_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования."
    bm_improve_education_decision_tooltip: "Попытаться повысить уровень вашего основного свойства образования"
    bm_improve_education_decision_confirm: "Наполнить разум"
    bm_improve_education_cooldown: "Недавно улучшено образование"
    bm_improve_education_cooldown_desc: "Вы недавно улучшили образование или достигли мастерства с помощью магии крови. Нервным путям нужно время, чтобы стабилизироваться."
    bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"
    NOT_bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"

    bm_education_enhancement.001.title: "Вливание знаний через кровь"
    bm_education_enhancement.001.desc: "Багровая сущность течёт по подготовленным каналам, каждый из которых украшен рунами знания и силы. Начиная ритуал, вы должны решить, какую сторону своего образования усилить магией крови. Ритуал будет трудным: с ростом уровня образования сложность дальнейшего усиления значительно возрастает."
    bm_education_enhancement.001.diplomacy: "Улучшить дипломатическое образование"
    bm_education_enhancement.001.martial: "Улучшить военное образование"
    bm_education_enhancement.001.stewardship: "Улучшить образование в управлении"
    bm_education_enhancement.001.intrigue: "Улучшить образование в интригах"
    bm_education_enhancement.001.learning: "Улучшить образование в учёности"
    bm_education_enhancement.001.back: "Назад"
    bm_education_enhancement.success: "@bm_ancient_discipline_icon! Образование улучшено"
    bm_education_enhancement.failure: "@bm_ancient_discipline_icon! Вливание крови не удалось"

    # New Education
    bm_new_education_decision: "Получить новое образование"
    bm_new_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования"
    bm_new_education_decision_tooltip: "Открыть второе направление образования с помощью магии крови"
    bm_new_education_decision_confirm: "Создать новые пути"
    bm_new_education_cooldown: "Недавно получено новое образование"
    bm_new_education_cooldown_desc: "Вы недавно создали новые нервные пути для дополнительного направления образования. Разуму нужно время, чтобы стабилизироваться."
    bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"
    NOT_bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"

    new_education_decision: "Обрести новые знания"
    bm_education_new.001.title: "@bm_ancient_discipline_icon! Создание новых путей разума"
    bm_education_new.001.desc: "Вы раскрываете древние книги, подготавливая место для ритуала. В отличие от усиления имеющихся знаний, эта работа требует разрушения преград разума и создания совершенно новых основ понимания. Багровые руны на ваших висках пульсируют в ожидании: они станут проводниками знаний прямо в сознание. Какую незнакомую дисциплину вы заставите свой разум освоить сегодня?"
    bm_education_new.001.diplomacy: "Получить дипломатическое образование"
    bm_education_new.001.martial: "Получить военное образование"
    bm_education_new.001.stewardship: "Получить образование в управлении"
    bm_education_new.001.intrigue: "Получить образование в интригах"
    bm_education_new.001.learning: "Получить образование в учёности"
    bm_education_new.001.back: "Назад"

    # Manifest Lifeforce
    bm_manifest_lifeforce_decision: "Проявить жизненную силу"
    bm_manifest_lifeforce_decision_desc: "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."
    bm_manifest_lifeforce_decision_tooltip: "Пройти состязание учёности, чтобы призвать жизненную силу духовной решимостью"
    bm_manifest_lifeforce_decision_confirm: "Начать медитацию"

    bm_cast_blood_magic_self_manifest_lifeforce: "Проявить жизненную силу"
    bm_cast_blood_magic_self_manifest_lifeforce_desc: "Через глубокую медитацию и духовное единение попытаться преобразовать духовную энергию в осязаемую жизненную силу."

    BM_CAST_BLOOD_MAGIC_NEXT_STEP_BUTTON: "Провести ритуал"
    bm_cast_blood_magic.cancel: "Назад"

    # Requirements & Failure Tooltips
    bm_purge_minor_has_ailment_tt: "Есть хотя бы одна излечимая рана, болезнь или физический изъян"
    NOT_bm_purge_minor_has_ailment_tt: "Есть хотя бы одна излечимая рана, болезнь или физический изъян"

    bm_improve_education_devotion_req: "Уровень набожности соответствует уровню образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)"
    NOT_bm_improve_education_devotion_req: "Уровень набожности соответствует уровню образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)"
    bm_improve_education_trait_req: "Есть свойство образования ниже 4-го уровня"
    NOT_bm_improve_education_trait_req: "Есть свойство образования ниже 4-го уровня"

    bm_master_education_trait_req: "Есть свойство образования с 4 звёздами"
    NOT_bm_master_education_trait_req: "Есть свойство образования с 4 звёздами"
    bm_new_education_req_5_star: "Есть свойство образования с 5 звёздами"
    NOT_bm_new_education_req_5_star: "Есть свойство образования с 5 звёздами"
    bm_new_education_req_no_other_star: "Нет свойств образования более низкого уровня"
    NOT_bm_new_education_req_no_other_star: "Нет свойств образования более низкого уровня"
    bm_manifest_apex_eligible_req: "Есть подходящее врождённое свойство (уровень 3–4)"
    NOT_bm_manifest_apex_eligible_req: "Есть подходящее врождённое свойство (уровень 3–4)"

    # Transmute Lifeforce Decision
    bm_transmute_lifeforce_decision: "Преобразовать жизненную силу"
    bm_transmute_lifeforce_decision_desc: "Преобразуйте жизненную силу в особые запасы или извлеките её из них."
    bm_transmute_lifeforce_decision_tooltip: "Начать обряд преобразования или возврата жизненной силы."
    bm_transmute_lifeforce_decision_confirm: "Начать преобразование"

