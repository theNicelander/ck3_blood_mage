l_russian:
############### MINOR ###############
    # Attune lifeforce
    bm_attune_lifeforce_decision: "Настройка жизненной силы"
    bm_attune_lifeforce_decision_desc: "Настройте магию крови на выбранное направление, чтобы гарантированно получать опыт каждый год и открыть пассивные благословения.\n\nПервая настройка #P бесплатна#!. Для смены действующей настройки необходимы #V 3 года восстановления#!, [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 100#! благочестия."
    bm_attune_lifeforce_decision_tooltip: "Настроиться на направление, чтобы гарантированно получать ежегодный опыт и открыть пассивные бонусы"
    BM_ATTUNE_LIFEFORCE_DECISION_NEXT_STEP_BUTTON: "Настроить силы"
    bm_attune_lifeforce_decision_confirm: "$BM_ATTUNE_LIFEFORCE_DECISION_NEXT_STEP_BUTTON$"
    bm_attune_lifeforce_decision_effect: "Вы настроите магию крови на выбранное направление, получая #P +1#! опыта в год (#P +2#! с высшим Хулинхьяльмом) и соответствующий пассивный модификатор."

    bm_attune_ancient: "Древность"
    bm_attune_ancient_name: "$bm_attune_ancient$"
    bm_attune_ancient_desc: "Накладывает модификатор [GetModifier('ancient_attuned').GetNameWithTooltip]."
    bm_attune_ancient_tooltip: "$bm_attune_ancient_desc$"

    bm_attune_enlightenment: "Просветление"
    bm_attune_enlightenment_name: "$bm_attune_enlightenment$"
    bm_attune_enlightenment_desc: "Накладывает модификатор [GetModifier('enlightenment_attuned').GetNameWithTooltip]."
    bm_attune_enlightenment_tooltip: "$bm_attune_enlightenment_desc$"

    bm_attune_bloodline: "Родословная"
    bm_attune_bloodline_name: "$bm_attune_bloodline$"
    bm_attune_bloodline_desc: "Накладывает модификатор [GetModifier('bloodline_attuned').GetNameWithTooltip]."
    bm_attune_bloodline_tooltip: "$bm_attune_bloodline_desc$"

    bm_attune_benediction: "Благословение"
    bm_attune_benediction_name: "$bm_attune_benediction$"
    bm_attune_benediction_desc: "Накладывает модификатор [GetModifier('benediction_attuned').GetNameWithTooltip]."
    bm_attune_benediction_tooltip: "$bm_attune_benediction_desc$"

    bm_attune_hematurgy: "Гематургия"
    bm_attune_hematurgy_name: "$bm_attune_hematurgy$"
    bm_attune_hematurgy_desc: "Накладывает модификатор [GetModifier('hematurgy_attuned').GetNameWithTooltip]."
    bm_attune_hematurgy_tooltip: "$bm_attune_hematurgy_desc$"

    bm_attune_bloodlust: "Кровожадность"
    bm_attune_bloodlust_name: "$bm_attune_bloodlust$"
    bm_attune_bloodlust_desc: "Накладывает модификатор [GetModifier('bloodlust_attuned').GetNameWithTooltip]."
    bm_attune_bloodlust_tooltip: "$bm_attune_bloodlust_desc$"

    # Channel lifeforce minor
    bm_channel_minor_lifeforce_decision: "Направить малую жизненную силу"
    bm_channel_minor_lifeforce_decision_desc: "Потратьте [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], чтобы получить небольшой временный бонус."
    bm_channel_minor_lifeforce_decision_tooltip: "Потратить малую жизненную силу на временное усиление одного навыка"
    bm_channel_minor_lifeforce_decision_confirm: "Направить кровь"

    bm_cast_blood_magic_self_channel_minor_lifeforce: "Направить малую жизненную силу"
    bm_cast_blood_magic_self_channel_minor_lifeforce_desc: "Потратьте [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], чтобы получить небольшой временный бонус."
    channel_lifeforce_enlightenment_minor.effects_list: "Направить малую магию крови на временное усиление одного навыка:\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('diplomacy_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('martial_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('stewardship_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('intrigue_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('learning_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('prowess_lifeforce_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('exp_lifeforce_modifier').GetNameWithTooltip]"

    bm_channel_lifeforce_enlightenment_minor.001.title: "Тихое пробуждение крови"
    bm_channel_lifeforce_enlightenment_minor.001.desc: "В моих венах пробуждается едва слышный шёпот силы — не рёв полного ритуала, но достаточно, чтобы дать преимущество. Сосредоточившись, я могу направить этот скромный багровый поток на временное усиление одной грани своего существа."
    bm_channel_lifeforce_enlightenment_minor.001.a: "Дипломатия — капля крови на языке развязывает чужие тайны"
    bm_channel_lifeforce_enlightenment_minor.001.b: "Военное дело — мой клинок жаждет вкуса битвы"
    bm_channel_lifeforce_enlightenment_minor.001.c: "Управление — багровое зрение раскрывает скрытую ценность"
    bm_channel_lifeforce_enlightenment_minor.001.d: "Интриги — тени расступаются перед багровым взглядом"
    bm_channel_lifeforce_enlightenment_minor.001.e: "Учёность — знания пульсируют с каждым ударом сердца"
    bm_channel_lifeforce_enlightenment_minor.001.f: "Плодовитость — пусть наше потомство процветает"
    bm_channel_lifeforce_enlightenment_minor.001.g: "Опыт — кровь помнит пути к могуществу"
    bm_channel_lifeforce_enlightenment_minor.001.h: "Доблесть — клинок будет закалён в крови"

############### MAJOR ###############
    # Education improvement
    bm_improve_education_decision: "Улучшить образование"
    bm_improve_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования."
    bm_improve_education_decision_tooltip: "Попытаться повысить уровень вашего основного свойства образования"
    bm_improve_education_decision_confirm: "Наполнить разум"
    bm_improve_education_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_power').GetName( GetNullCharacter )]"
    NOT_bm_improve_education_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_improve_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_power').GetName( GetNullCharacter )]"
    bm_improve_education_cooldown: "Недавно улучшено образование"
    bm_improve_education_cooldown_desc: "Вы недавно улучшили образование или достигли мастерства с помощью магии крови. Нервным путям нужно время, чтобы стабилизироваться."
    bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"
    NOT_bm_improve_education_cooldown_tt: "За последние 2 года попыток улучшить образование или достичь мастерства не было"

    bm_education_enhancement.001.title: "Вливание знаний через кровь"
    bm_education_enhancement.001.desc: "Багровая сущность течёт по подготовленным каналам, каждый из которых украшен рунами знания и силы. Начиная ритуал, вы должны решить, какую сторону своего образования усилить магией крови. Ритуал будет трудным: с ростом уровня образования сложность дальнейшего усиления значительно возрастает."
    bm_education_enhancement.001.diplomacy: "Улучшить дипломатическое образование"
    bm_education_enhancement.001.martial: "Улучшить военное образование"
    bm_education_enhancement.001.stewardship: "Улучшить образование в управлении"
    bm_education_enhancement.001.intrigue: "Улучшить образование в интригах"
    bm_education_enhancement.001.learning: "Улучшить образование в учёности"
    bm_education_enhancement.001.back: "Назад"
    bm_education_enhancement.success: "Образование улучшено"
    bm_education_enhancement.failure: "Вливание крови не удалось"

    # New Education
    bm_new_education_decision: "Получить новое образование"
    bm_new_education_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip], чтобы попытаться улучшить одно из ваших свойств образования"
    bm_new_education_decision_tooltip: "Открыть второе направление образования с помощью магии крови"
    bm_new_education_decision_confirm: "Создать новые пути"
    bm_new_education_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_power').GetName( GetNullCharacter )]"
    NOT_bm_new_education_decision_xp_requirement: "Нужно не менее [GetPlayer.MakeScope.ScriptValue('required_xp_new_education')|0] опыта в свойстве [GetTrait('lifestyle_blood_power').GetName( GetNullCharacter )]"
    bm_new_education_cooldown: "Недавно получено новое образование"
    bm_new_education_cooldown_desc: "Вы недавно создали новые нервные пути для дополнительного направления образования. Разуму нужно время, чтобы стабилизироваться."
    bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"
    NOT_bm_new_education_cooldown_tt: "За последние 2 года новое направление образования не открыто"

    new_education_decision: "Обрести новые знания"
    bm_education_new.001.title: "Создание новых путей разума"
    bm_education_new.001.desc: "Вы раскрываете древние книги, подготавливая место для ритуала. В отличие от усиления имеющихся знаний, эта работа требует разрушения преград разума и создания совершенно новых основ понимания. Багровые руны на ваших висках пульсируют в ожидании: они станут проводниками знаний прямо в сознание. Какую незнакомую дисциплину вы заставите свой разум освоить сегодня?"
    bm_education_new.001.diplomacy: "Получить дипломатическое образование"
    bm_education_new.001.martial: "Получить военное образование"
    bm_education_new.001.stewardship: "Получить образование в управлении"
    bm_education_new.001.intrigue: "Получить образование в интригах"
    bm_education_new.001.learning: "Получить образование в учёности"
    bm_education_new.001.back: "Назад"

    # Channel Blood Power
    bm_channel_blood_empowerment_decision: "Направить могущество крови"
    bm_channel_blood_empowerment_decision_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 150#! [piety|E], чтобы улучшить [GetTrait('lifestyle_blood_power').GetName( GetPlayer )].\n\nНовые ступени при #V 10#!, #V 30#!, #V 50#!, #V 70#! и #V 100#! опыта."
    bm_channel_blood_empowerment_decision_tooltip: "Потратить большую жизненную силу на постоянное развитие выбранного направления Могущества крови"
    BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON: "Пробудить силу"
    bm_channel_blood_empowerment_decision_confirm: "$BM_CHANNEL_BLOOD_EMPOWERMENT_DECISION_NEXT_STEP_BUTTON$"
    bm_channel_blood_empowerment_decision_effect: "Вы направите большую жизненную силу на постоянное развитие выбранного направления Могущества крови."
    bm_channel_blood_empowerment_major_lifeforce_req: "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
    NOT_bm_channel_blood_empowerment_major_lifeforce_req: "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
    bm_empower_track_already_mastered_req: "Это направление уже достигло максимального уровня (100 опыта)"
    NOT_bm_empower_track_already_mastered_req: "Это направление уже достигло максимального уровня (100 опыта)"

    bm_empower_dynasty: "Династия — евгеника и родство"
    bm_empower_dynasty_name: "$bm_empower_dynasty$"
    bm_empower_dynasty_desc: "Направляет жизненную силу на совершенствование поколений, наследование врождённых свойств и полную защиту от близкородственного скрещивания.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта активного образа жизни (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +10% шанса усиления врождённых свойств.\n#P 30 опыта:#! +20% шанса усиления врождённых свойств.\n#V 50 опыта — рубеж:#! +30% шанса усиления врождённых свойств, -50% шанса близкородственного скрещивания.\n#P 70 опыта:#! +40% шанса усиления врождённых свойств, -50% шанса близкородственного скрещивания.\n#Y 100 опыта — вершина:#! +50% шанса усиления врождённых свойств, полная защита от близкородственного скрещивания (-100%), доблесть больше не снижается от старости."
    bm_empower_dynasty_tooltip: "$bm_empower_dynasty_desc$"

    bm_empower_warband: "Боевая дружина — мастерство профессиональных полков"
    bm_empower_warband_name: "$bm_empower_warband$"
    bm_empower_warband_desc: "Направляет жизненную силу на усиление профессиональных полков, повышая эффективность противодействия, размер и предельное число полков.\n\n#P Общее благочестие:#! +0,1 благочестия в месяц при 10 опыта и до +1,0 при 100 опыта.\n#P Опыт образа жизни:#! от +5 до +50 опыта военного образа жизни в месяц (от +15 до +150 за квартал).\n#P Общие рубежи (50 и 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0,25 к здоровью, +0,02 благочестия в месяц за рыцаря.\n#P 10 опыта:#! +10% эффективности противодействия профессиональных полков.\n#P 30 опыта:#! +20% эффективности противодействия профессиональных полков, +1 к их предельному размеру.\n#V 50 опыта — рубеж:#! +30% эффективности противодействия профессиональных полков, +2 к их предельному размеру, +1 к предельному числу полков.\n#P 70 опыта:#! +40% эффективности противодействия профессиональных полков, +3 к их предельному размеру, +1 к предельному числу полков.\n#Y 100 опыта — вершина:#! +50% эффективности противодействия профессиональных полков, +4 к их предельному размеру, +2 к предельному числу полков. Доблесть больше не снижается с возрастом."
    bm_empower_warband_tooltip: "$bm_empower_warband_desc$"

    bm_empower_mastery: "Мастерство — Учёность и спокойствие"
    bm_empower_mastery_name: "$bm_empower_mastery$"
    bm_empower_mastery_desc: "Ускоряет развитие образов жизни, укрепляет спокойствие, здоровье и набожность.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни учёности (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +10% ежемесячного опыта образа жизни, -10% прироста стресса, +10% потери стресса.\n#P 30 опыта:#! +20% ежемесячного опыта образа жизни, -20% прироста стресса, +20% потери стресса.\n#V 50 опыта — рубеж:#! +30% ежемесячного опыта образа жизни, -30% прироста стресса, +30% потери стресса.\n#P 70 опыта:#! +40% ежемесячного опыта образа жизни, -40% прироста стресса, +40% потери стресса.\n#Y 100 опыта — вершина:#! +50% ежемесячного опыта образа жизни, -50% прироста стресса, +50% потери стресса, доблесть больше не снижается от старости."
    bm_empower_mastery_tooltip: "$bm_empower_mastery_desc$"

    bm_empower_presence: "Влияние — Завораживающая аура"
    bm_empower_presence_name: "$bm_empower_presence$"
    bm_empower_presence_desc: "Дарует сверхъестественное влияние, усиливает личные происки, общее мнение, ежемесячный престиж и легитимность.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта дипломатического образа жизни (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +5 общего мнения, +0.2 ежемесячного престижа, +5% прироста легитимности, +8 к успеху личных происков.\n#P 30 опыта:#! +10 общего мнения, +0.4 ежемесячного престижа, +10% прироста легитимности, +16 к успеху личных происков.\n#V 50 опыта — рубеж:#! +15 общего мнения, +0.7 ежемесячного престижа, +16% прироста легитимности, +24 к успеху личных происков, +1 к максимуму личных происков.\n#P 70 опыта:#! +20 общего мнения, +1.0 ежемесячного престижа, +23% прироста легитимности, +32 к успеху личных происков, +1 к максимуму личных происков.\n#Y 100 опыта — вершина:#! +25 общего мнения, +1.5 ежемесячного престижа, +30% прироста легитимности, +40 к успеху личных происков, +2 к максимуму личных происков, доблесть больше не снижается от старости."
    bm_empower_presence_tooltip: "$bm_empower_presence_desc$"

    bm_empower_prosperity: "Процветание — Богатство и домен"
    bm_empower_prosperity_name: "$bm_empower_prosperity$"
    bm_empower_prosperity_desc: "Приносит богатство в казну, поддерживает армии и значительно повышает ежемесячный доход.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни управления (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +0.3 ежемесячного золота, +6% ежемесячного дохода, -6% содержания профессиональных полков.\n#P 30 опыта:#! +0.6 ежемесячного золота, +12% ежемесячного дохода, -12% содержания профессиональных полков.\n#V 50 опыта — рубеж:#! +1.0 ежемесячного золота, +18% ежемесячного дохода, -18% содержания профессиональных полков.\n#P 70 опыта:#! +1.4 ежемесячного золота, +24% ежемесячного дохода, -24% содержания профессиональных полков.\n#Y 100 опыта — вершина:#! +2.0 ежемесячного золота, +30% ежемесячного дохода, -30% содержания профессиональных полков, доблесть больше не снижается от старости."
    bm_empower_prosperity_tooltip: "$bm_empower_prosperity_desc$"

    bm_empower_shadows: "Тени — оккультная защита и интриги"
    bm_empower_shadows_name: "$bm_empower_shadows$"
    bm_empower_shadows_desc: "Окутывает ваши заговоры непроницаемым покровом крови, внушая ужас и препятствуя враждебным проискам против вас.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни интриг (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +8 к успеху враждебных происков, -10 к успеху враждебных происков противника, +6 к естественному ужасу.\n#P 30 опыта:#! +16 к успеху враждебных происков, -20 к успеху враждебных происков противника, +12 к естественному ужасу.\n#V 50 опыта — рубеж:#! +24 к успеху враждебных происков, -30 к успеху враждебных происков противника, +18 к естественному ужасу, +1 к максимуму враждебных происков.\n#P 70 опыта:#! +32 к успеху враждебных происков, -40 к успеху враждебных происков противника, +24 к естественному ужасу, +1 к максимуму враждебных происков.\n#Y 100 опыта — вершина:#! +40 к успеху враждебных происков, -50 к успеху враждебных происков противника, +30 к естественному ужасу, +2 к максимуму враждебных происков, доблесть больше не снижается от старости."
