  bm_empower_dynasty:0 "Династия — евгеника и родство"
  bm_empower_dynasty_name:0 "$bm_empower_dynasty$"
  bm_empower_dynasty_desc:0 "Направляет жизненную силу на совершенствование поколений, наследование врождённых свойств, продление детородного возраста и полную защиту от близкородственного скрещивания.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта активного образа жизни (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +10% шанса усиления врождённых свойств, +5 лет детородного возраста.\n#P 30 опыта:#! +20% шанса усиления врождённых свойств, +10 лет детородного возраста.\n#V 50 опыта — рубеж:#! +30% шанса усиления врождённых свойств, +15 лет детородного возраста, -50% шанса близкородственного скрещивания.\n#P 70 опыта:#! +40% шанса усиления врождённых свойств, +20 лет детородного возраста, -50% шанса близкородственного скрещивания.\n#Y 100 опыта — вершина:#! +50% шанса усиления врождённых свойств, +25 лет детородного возраста, полная защита от близкородственного скрещивания (-100%), доблесть больше не снижается от старости."
  bm_empower_dynasty_tooltip:0 "$bm_empower_dynasty_desc$"
  bm_empower_mastery:0 "Мастерство — Учёность и спокойствие"
  bm_empower_mastery_name:0 "$bm_empower_mastery$"
  bm_empower_mastery_desc:0 "Ускоряет развитие образов жизни, укрепляет спокойствие, здоровье и набожность.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни учёности (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +10% ежемесячного опыта образа жизни, -10% прироста стресса, +10% потери стресса.\n#P 30 опыта:#! +20% ежемесячного опыта образа жизни, -20% прироста стресса, +20% потери стресса.\n#V 50 опыта — рубеж:#! +30% ежемесячного опыта образа жизни, -30% прироста стресса, +30% потери стресса.\n#P 70 опыта:#! +40% ежемесячного опыта образа жизни, -40% прироста стресса, +40% потери стресса.\n#Y 100 опыта — вершина:#! +50% ежемесячного опыта образа жизни, -50% прироста стресса, +50% потери стресса, доблесть больше не снижается от старости."
  bm_empower_mastery_tooltip:0 "$bm_empower_mastery_desc$"
  bm_empower_presence:0 "Влияние — Завораживающая аура"
  bm_empower_presence_name:0 "$bm_empower_presence$"
  bm_empower_presence_desc:0 "Дарует сверхъестественное влияние, усиливает личные происки, общее мнение, ежемесячный престиж и легитимность.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта дипломатического образа жизни (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +5 общего мнения, +0.2 ежемесячного престижа, +5% прироста легитимности, +8 к успеху личных происков.\n#P 30 опыта:#! +10 общего мнения, +0.4 ежемесячного престижа, +10% прироста легитимности, +16 к успеху личных происков.\n#V 50 опыта — рубеж:#! +15 общего мнения, +0.7 ежемесячного престижа, +16% прироста легитимности, +24 к успеху личных происков, +1 к максимуму личных происков.\n#P 70 опыта:#! +20 общего мнения, +1.0 ежемесячного престижа, +23% прироста легитимности, +32 к успеху личных происков, +1 к максимуму личных происков.\n#Y 100 опыта — вершина:#! +25 общего мнения, +1.5 ежемесячного престижа, +30% прироста легитимности, +40 к успеху личных происков, +2 к максимуму личных происков, доблесть больше не снижается от старости."
  bm_empower_presence_tooltip:0 "$bm_empower_presence_desc$"
  bm_empower_prosperity:0 "Процветание — Богатство и домен"
  bm_empower_prosperity_name:0 "$bm_empower_prosperity$"
  bm_empower_prosperity_desc:0 "Приносит богатство в казну, поддерживает армии и значительно повышает ежемесячный доход.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни управления (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +0.3 ежемесячного золота, +6% ежемесячного дохода, -6% содержания профессиональных полков.\n#P 30 опыта:#! +0.6 ежемесячного золота, +12% ежемесячного дохода, -12% содержания профессиональных полков.\n#V 50 опыта — рубеж:#! +1.0 ежемесячного золота, +18% ежемесячного дохода, -18% содержания профессиональных полков.\n#P 70 опыта:#! +1.4 ежемесячного золота, +24% ежемесячного дохода, -24% содержания профессиональных полков.\n#Y 100 опыта — вершина:#! +2.0 ежемесячного золота, +30% ежемесячного дохода, -30% содержания профессиональных полков, доблесть больше не снижается от старости."
  bm_empower_prosperity_tooltip:0 "$bm_empower_prosperity_desc$"
  bm_empower_shadows:0 "Тени — оккультная защита и интриги"
  bm_empower_shadows_name:0 "$bm_empower_shadows$"
  bm_empower_shadows_desc:0 "Окутывает ваши заговоры непроницаемым покровом крови, внушая ужас и препятствуя враждебным проискам против вас.\n\n#P Общее благочестие:#! +0.1 ежемесячного благочестия при 10 опыта, возрастает до +1.0 при 100 опыта.\n#P Опыт образа жизни:#! +5 до +50 ежемесячного опыта образа жизни интриг (+15 до +150 за квартал).\n#P Общие рубежи (50 & 100 опыта):#! +10% ежемесячного благочестия, +5 к продолжительности жизни, +0.25 здоровья, +0.02 ежемесячного благочестия за рыцаря.\n#P 10 опыта:#! +8 к успеху враждебных происков, -10 к успеху враждебных происков противника, +6 к естественному ужасу.\n#P 30 опыта:#! +16 к успеху враждебных происков, -20 к успеху враждебных происков противника, +12 к естественному ужасу.\n#V 50 опыта — рубеж:#! +24 к успеху враждебных происков, -30 к успеху враждебных происков противника, +18 к естественному ужасу, +1 к максимуму враждебных происков.\n#P 70 опыта:#! +32 к успеху враждебных происков, -40 к успеху враждебных происков противника, +24 к естественному ужасу, +1 к максимуму враждебных происков.\n#Y 100 опыта — вершина:#! +40 к успеху враждебных происков, -50 к успеху враждебных происков противника, +30 к естественному ужасу, +2 к максимуму враждебных происков, доблесть больше не снижается от старости."
  bm_empower_shadows_tooltip:0 "$bm_empower_shadows_desc$"
  bm_empower_versatility:0 "Универсальность — запредельное совершенство"
  bm_empower_versatility_name:0 "$bm_empower_versatility$"
  bm_empower_versatility_desc:0 "Доступно после достижения мастерства во всех 6 направлениях (100 опыта). Направляет сгущённую большую жизненную силу на 10-летнее усиление всех навыков с шансом навсегда повысить навыки и доблесть."
  bm_empower_versatility_tooltip:0 "$bm_empower_versatility_desc$"
  bm_blood_power_event.001.title:0 "Направить могущество крови"
  bm_blood_power_event.001.desc:0 "Магия крови ревёт во мне, словно зверь в клетке, жаждущий свободы. Я чувствую, как она рвётся сквозь плоть, стремясь изменить саму мою сущность согласно моим желаниям. Что я позволю ей преобразить сегодня?"
