  bm_minor_channel:0 "Направить малую жизненную силу"
  bm_minor_channel_desc:0 "Направить малую жизненную силу на временное усиление выбранного навыка."
  bm_minor_channel_tooltip:0 "Направить малую жизненную силу на временное усиление выбранного навыка.\n\nСтоимость: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 75#! [piety|E]."
  bm_minor_purge:0 "Очиститься от изъянов и недугов"
  bm_minor_purge_desc:0 "Исцелить телесные раны и болезни или устранить отрицательные свойства с помощью малой жизненной силы."
  bm_minor_purge_tooltip:0 "Исцелить телесные раны и болезни или устранить отрицательные свойства с помощью малой жизненной силы.\n\nСтоимость: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 50#! [piety|E]."
  bm_minor_condense:0 "Сгустить жизненную силу"
  bm_minor_condense_desc:0 "Преобразовать малую жизненную силу в большую."
  bm_minor_condense_tooltip:0 "Потратить #V 100#! благочестия и преобразовать запас: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] превратится в [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
  bm_minor_blood_rune:0 "Начертать малую руну крови"
  bm_minor_blood_rune_desc:0 "Навсегда начертать на плоти малую руну крови, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира."
  bm_minor_blood_rune_tooltip:0 "Навсегда начертать на плоти малую руну крови, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] из окружающего мира.\n\nСтоимость: [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и #V 100#! [piety|E]."
  bm_major_channel_power:0 "Направить могущество крови"
  bm_major_channel_power_desc:0 "Потратить большую жизненную силу на постоянное развитие выбранного направления могущества крови."
  bm_major_channel_power_tooltip:0 "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 150#! [piety|E] на постоянное развитие выбранного направления могущества крови (Династия, Мастерство, Влияние, Процветание или Тени).\n\nКлючевые рубежи — #V 50#! и #V 100#! опыта."
  bm_major_condense:0 "Сгустить жизненную силу"
  bm_major_condense_desc:0 "Попытаться соединить большую и малую жизненную силу в высшую."
  bm_major_condense_tooltip:0 "В ритуальном поединке, зависящем от вашей учёности, попытаться соединить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] в [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip].\n\nСтоимость: #V 250#! [piety|E]."
  bm_major_improve_education:0 "Улучшить образование"
  bm_major_improve_education_desc:0 "Попытаться повысить уровень основного свойства образования."
  bm_major_improve_education_tooltip:0 "С помощью вливания крови повысить уровень основного свойства образования (до 4 звёзд).\n\nСтоимость: [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и [piety|E] в размере, зависящем от ваших показателей. Требуемый уровень набожности зависит от образования (1★: уровень 1+, 2★: уровень 2+, 3★: уровень 3+)."
  bm_major_blood_rune:0 "Начертать большую руну крови"
  bm_major_blood_rune_desc:0 "Улучшить малую руну крови до большой, чтобы пассивно собирать больше жизненной силы из окружающего мира."
  bm_major_blood_rune_tooltip:0 "Улучшить малую руну крови до большой, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира.\n\nСтоимость: [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 200#! [piety|E]."
  bm_cast_blood_magic_major.001.improve_education_tt:0 "$bm_major_improve_education_tooltip$"
  bm_cast_blood_magic_major.001.blood_rune_major_tt:0 "$bm_major_blood_rune_tooltip$"
  bm_superior_master_education:0 "Овладеть образованием: восхождение к 5 звёздам"
  bm_superior_master_education_desc:0 "Улучшить образование с 4 звёзд до легендарного мастерства с 5 звёздами."
  bm_superior_master_education_tooltip:0 "С помощью высшей жизненной силы улучшить образование с 4 звёзд до легендарного мастерства с 5 звёздами.\n\nСтоимость: [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] и [piety|E] в размере, зависящем от ваших показателей."
  bm_superior_new_education:0 "Получить новое образование"
  bm_superior_new_education_desc:0 "Создать новые нейронные связи для получения дополнительного образования."
  bm_superior_new_education_tooltip:0 "С помощью высшей жизненной силы создать новые нейронные связи для получения дополнительного образования.\n\nСтоимость: [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] и #V 1000#! [piety|E]."
  bm_superior_blood_rune:0 "Начертать высшую руну крови"
  bm_superior_blood_rune_desc:0 "Улучшить большую руну крови до высшей, чтобы пассивно собирать наибольшие запасы жизненной силы из окружающего мира."
  bm_superior_blood_rune_tooltip:0 "Улучшить большую руну крови до высшей, чтобы пассивно собирать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] из окружающего мира и открыть возможность связать руну с гальдраставом.\n\nСтоимость: [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] и #V 400#! [piety|E]."
  bm_superior_manifest_traits:0 "Воплотить свойства: высшее совершенство"
  bm_superior_manifest_traits_desc:0 "Преобразовать врождённые свойства за пределы возможностей смертных вплоть до высшего, 5-го уровня."
  bm_superior_manifest_traits_tooltip:0 "Направить высшую жизненную силу на преобразование врождённых свойств (интеллект, телосложение, красота) вплоть до высшего, 5-го уровня.\n\nСтоимость: [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] и 1000–1500 [piety|E]."
  bm_superior_create_blood_golem:0 "Создать голема крови"
  bm_superior_create_blood_golem_desc:0 "Оживить послушного воителя — голема крови, скреплённого жизненной силой."
  bm_superior_create_blood_golem_tooltip:0 "Оживить послушного чудовищного воителя — голема крови, скреплённого жизненной силой.\n\nСтоимость: [GetModifier('lifeforce_modifier_superior').GetNameWithTooltip] и #V 500#! [piety|E]."
  bm_cast_blood_magic_superior.001.master_education_tt:0 "$bm_superior_master_education_tooltip$"
  bm_cast_blood_magic_superior.001.new_education_tt:0 "$bm_superior_new_education_tooltip$"
