  bm_enhance_blood_ritual_decision_desc:0 "Долгие исследования искусств крови привели меня к этому рубежу. Древние предания рассказывают об Эгиле Скаллагримссоне — берсерке, поэте и мастере рун крови, охраняющем геотермальные гейзеры Рейкьявика и священные источники Цусимы. Встретившись с древним мастером, вы можете испытать учёность, чтобы пробудить магию крови, или доблесть, чтобы стать грозным рыцарем крови.\n\nПобеда пробудит вашу кровь; поражение неизбежно обернётся сломанным разумом или искалеченной плотью."

  # Elevate to Blood Mage
  bm_elevate_to_blood_mage_decision:0 "Возвыситься до мага крови"
  bm_elevate_to_blood_mage_decision_desc:0 "Вы шли воинским путём рыцаря крови, но более глубокие тайны зовут вас. Преобразите своё воинское тело с помощью ритуального сосредоточения и жизненной силы, чтобы возвыситься и стать истинным магом крови."
  bm_elevate_to_blood_mage_decision_tooltip:0 "Пройти преображение из рыцаря крови в мага крови"
  bm_elevate_to_blood_mage_decision_confirm:0 "Начать преображение"
  bm_elevation_attempt_cooldown_tt:0 "Вы должны восстановиться после предыдущей неудачной попытки возвышения"
