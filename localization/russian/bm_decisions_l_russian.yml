l_russian:
  # Decision group type
  decision_group_type_bm_decision_group:0 "Решения мага крови"
  convert_to_blood_magic_from_witch.tooltip:0 "Стать магом крови"

  # Convert to blood magic from witch
  convert_to_blood_magic_from_witch:0 "Стать магом крови"
  convert_to_blood_magic_from_witch_desc:0 "Отриньте примитивные пути колдунов и станьте магом крови!"
  convert_to_blood_magic_from_witch_confirm:0 "Стать магом крови"
  convert_to_blood_magic_from_witch_tooltip:0 "Стать магом крови"

  # Convert to the blood cultist faith
  become_blood_cultist_decision:0 "Принять веру культа крови"
  become_blood_cultist_decision_confirm:0 "Кровь будет поддерживать мою жизнь"
  become_blood_cultist_decision_tooltip:0 "Отречься от нынешней веры и принять запретную силу магии крови"
  become_blood_cultist_decision_desc:0 "Шёпот стал слишком настойчивым, чтобы его игнорировать. Рассказы о бессмертии, о силе, черпаемой из самой сущности жизни. Старые верования — лишь пустые оболочки в сравнении с осязаемым могуществом культа крови. Его священные тексты говорят о возвышении через жертву, о подчинении законов природы через управление багровой валютой жизни. Возможно, пора оставить пустые обещания древних богов и принять живую истину, текущую в каждом существе."
  become_blood_cultist_decision_effect_tooltip:0 "Выберите Блодтру, Кэцудо или Сюэдао."

  # Repair pre-reformation head of faith
  bm_repair_blodtru_reformation_decision:0 "Восстановить возможность реформации Блодтру"
  bm_repair_blodtru_reformation_decision_confirm:0 "Упразднить преждевременное главенство"
  bm_repair_blodtru_reformation_decision_tooltip:0 "Отделить преждевременно созданную должность светского главы веры от Блодтру, чтобы конфессию можно было реформировать; титул и держава его обладателя сохранятся"
  bm_repair_blodtru_reformation_decision_desc:0 "У Блодтру появился светский глава веры ещё до формального упорядочения обрядов. Эта преждевременная должность теперь препятствует реформации. Отделение должности от конфессии восстановит традицию без главы до выбора должного религиозного устройства при реформации, сохранив титул и державу его обладателя."

  # Become a blood mage
  bm_self_initiation_decision:0 "Попытаться посвятить себя"
  bm_self_initiation_decision_confirm:0 "Я — собственный тигель."
  bm_self_initiation_decision_desc:0 "Книги и свитки дают лишь обрывочные подсказки, но у меня нет ни наставника, ни подопытного. Единственный путь вперёд — самый опасный: провести ритуал посвящения на себе. Я стану и хирургом, и [Select_CString(ROOT.Char.IsFemale, 'пациенткой', 'пациентом')], и [Select_CString(ROOT.Char.IsFemale, 'чародейкой', 'чародеем')], и жертвой.\n\nМоя кровь станет средством, а разум — полем битвы, где мне предстоит покорить необузданную силу. Здесь нет догм, лишь опасное знание и сила моей воли. Успех даст мне власть над самой сущностью жизни. Неудача потребует платы разумом и телом."
  bm_self_initiation_decision_tooltip:0 "Использовать запретные знания, чтобы провести ритуал посвящения на себе. Без наставника риск огромен. Неудача может разрушить ваш разум или изувечить тело."

  # Blóðtrú Initiation Decisions
  bm_blodtru_become_blood_mage_decision: "Блодтру: пробудить магию крови"
  bm_blodtru_become_blood_mage_decision_confirm: "Пробудить магию крови"
  bm_blodtru_become_blood_mage_decision_tooltip: "Освятить свою кровь священным обрядом и обрести силу мага крови."
  bm_blodtru_become_blood_mage_decision_desc: "Преданность священным традициям рода и общение с предками позволяют вам совершить обряды освящения и пробудить в себе магию крови. Для этого не придётся отправляться к далёким гейзерам."


  # Become blood mage, from blood cultist
  bm_blood_cultist_become_blood_mage_decision:0 "Культист крови: испытание кровью"
  bm_blood_cultist_become_blood_mage_decision_confirm:0 "Бросить вызов древнему мастеру"
  bm_blood_cultist_become_blood_mage_decision_tooltip:0 "Отправиться к священным гейзерам Рейкьявика или Цусимы, бросить вызов Эгилю и доказать, что вы готовы стать магом крови"
  bm_blood_cultist_become_blood_mage_decision_desc:0 "Одной преданности вере крови недостаточно, чтобы овладеть её искусством. Древние предания рассказывают об Эгиле Скаллагримссоне — берсерке, поэте и мастере рун крови, живущем у кипящих гейзеров Рейкьявика и вулканических источников Цусимы. У этих священных вод вы можете бросить ему вызов, испытать свою учёность и доблесть и пробудить магию крови."



  manifest_lifeforce_superior_success_tt:0 "Вы успешно воплотили высшую жизненную силу!"
  manifest_lifeforce_double_major_success_tt:0 "Вы успешно воплотили 2 порции большой жизненной силы!"
  manifest_lifeforce_major_success_tt:0 "Вы успешно воплотили большую жизненную силу"
  manifest_lifeforce_minor_success_tt:0 "Вы успешно воплотили малую жизненную силу"
  manifest_lifeforce_major_failure_tt:0 "Вы испытали сильную отдачу при воплощении жизненной силы"
  manifest_lifeforce_minor_failure_penalty_tt:0 "Вы испытали слабую отдачу при воплощении жизненной силы"
  manifest_lifeforce_minor_failure_tt:0 "Вам не удалось проявить жизненную силу"
  manifest_lifeforce_nothing_extra_tt:0 "Вы воплотили исходный запас жизненной силы, но не извлекли из транса дополнительной мощи"

  # Become blood mage Decision
  bm_enhance_blood_ritual_decision:0 "Испытание кровью"
  bm_enhance_blood_ritual_decision_confirm:0 "Бросить вызов древнему мастеру"
  bm_enhance_blood_ritual_decision_tooltip:0 "Отправиться к священным гейзерам Рейкьявика или Цусимы, чтобы вызвать Эгиля на поединок учёности или доблести."
  bm_enhance_blood_ritual_location_requirement_tt:0 "Вы должны находиться в Рейкьявике (Вестисланд) или на Цусиме"
  NOT_bm_enhance_blood_ritual_location_requirement_tt:0 "Вы должны находиться в Рейкьявике (Вестисланд) или на Цусиме"
