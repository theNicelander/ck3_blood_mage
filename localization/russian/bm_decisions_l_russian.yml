  bm_enhance_blood_ritual_decision_desc:0 "Долгие исследования магии крови привели меня к этому рубежу. Древние предания рассказывают об Эгиле Скаллагримссоне — берсерке, поэте и мастере рун крови, охраняющем гейзеры Рейкьявика и священные источники Цусимы. Встретившись с древним мастером, вы можете испытать свою учёность и доблесть в священном поединке крови.\n\nПобеда пробудит вашу кровь. Поражение неизбежно сломит ваш разум или искалечит тело."

  # Blood Distillation
  bm_blood_distillation_decision: "Перегонка крови"
  bm_blood_distillation_decision_desc: "Вы можете извлечь силу из освоенных направлений магии крови. Накопленный в них опыт укрепит ваше тело и приблизит вас к следующей ступени."
  bm_blood_distillation_decision_tooltip: "Превратить опыт направлений в опыт Древности"
  bm_blood_distillation_decision_confirm: "Начать перегонку"
  BM_BLOOD_DISTILLATION_DECISION_NEXT_STEP_BUTTON: "Извлечь силу"
  bm_blood_distillation_ancient_not_maxed_req: "Древность ещё не достигла предела (100 опыта)"
  bm_blood_distillation_decision_effect: "Расходует опыт выбранного направления, чтобы повысить Древность."

