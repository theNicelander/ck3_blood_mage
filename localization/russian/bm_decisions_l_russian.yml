  # Tier Elevation
  bm_elevate_blood_mage_tier_decision: "Взойти на следующую ступень магии крови"
  bm_elevate_blood_mage_tier_decision_desc: "Ваше тело переполнено сгущённой силой. Встретьтесь со своим отражением в Зеркале крови, чтобы преодолеть пределы нынешней ступени."
  bm_elevate_blood_mage_tier_decision_tooltip: "Перейти на следующую ступень магии крови"
  bm_elevate_blood_mage_tier_decision_confirm: "Взглянуть в Зеркало крови"
