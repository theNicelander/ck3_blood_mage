  bm_enhance_blood_ritual_decision: "Ритуал крови"
  bm_enhance_blood_ritual_decision_confirm: "Бросить вызов древнему мастеру"
  bm_enhance_blood_ritual_decision_tooltip: "Отправиться к священным гейзерам Рейкьявика или Цусимы, чтобы вызвать древнего мудреца на поединок учёности."
  bm_enhance_blood_ritual_location_requirement_tt: "Вы должны находиться в Рейкьявике (Вестисланд) или на Цусиме"
  bm_enhance_blood_ritual_decision.success_tt: "$bm_geyser_duel.success_tt$"
  bm_enhance_blood_ritual_decision.mental_failure_tt: "$bm_geyser_duel.mental_failure_tt$"
  bm_enhance_blood_ritual_decision.physical_failure_tt: "$bm_geyser_duel.physical_failure_tt$"
  bm_enhance_blood_ritual_decision.injury_failure_tt: "$bm_geyser_duel.injury_failure_tt$"

  bm_enhance_blood_ritual_decision_desc: "Долгие исследования багровых искусств привели меня к этому рубежу. Древние предания рассказывают о мудреце — одиноком отшельнике ста одиннадцати лет, охраняющем геотермальные гейзеры Рейкьявика и священные источники Цусимы. Сразившись с древним мастером в состязании учёности, я смогу раскрыть глубочайшие тайны магии крови.\n\nПобеда пробудит багровые искусства в вашей крови; поражение неизбежно обернётся сломанным разумом или искалеченной плотью."
