l_russian:
 # Modifiers
 bm_guided_pulse_child_modifier: "Управляемый пульс крови"
 bm_guided_pulse_child_modifier_desc: "Раннее наставление в управлении кровью отточило воинские инстинкты, физическую бодрость и способности к учению этого ребёнка."
 bm_golem_aegis_modifier: "Эгида голема"
 bm_golem_aegis_modifier_desc: "Голем крови служит неутомимым стражем, отражая враждебные клинки и срывая происки."
 bm_siphoned_golem_modifier: "Истощённое ядро голема"
 bm_siphoned_golem_modifier_desc: "Из ядра голема извлечён избыток ихора для усиления хозяина, что временно снизило физическую силу создания."
 bm_reinforced_golem_modifier: "Укреплённые узы голема"
 bm_reinforced_golem_modifier_desc: "Свежие руны крови восстанавливают трещины в теле создания, укрепляя его силу и устойчивость."

 # Event 1: A Drop on the Lips
 bm_interpersonal_events.0001.t: "Капля на губах"
 bm_interpersonal_events.0001.desc: "В тишине наших личных покоев [partner.GetFirstName] приближается, разглядывая слабое кроваво-красное сияние под моей кожей. В [partner.GetHerHis] взгляде нет ужаса — лишь желание и преданность. [partner.GetSheHe|U] откидывает [partner.GetHerHis] голову назад, обнажая [partner.GetHerHis] горло, и шепчет, что [partner.GetSheHe] желает разделить силу, текущую в моих венах."
 bm_interpersonal_events.0001.a: "Поделиться каплей жизненной силы"
 bm_interpersonal_events.0001.a.toast: "@bm_ancient_discipline_icon! [partner.GetFirstName] получает мою жизненную силу"
 bm_interpersonal_events.0001.b: "Испить из предложенной вены"
 bm_interpersonal_events.0001.b.toast: "@bm_ancient_discipline_icon! Жизненная сила персонажа [partner.GetFirstName] добыта"
 bm_interpersonal_events.0001.c: "Посвятить в таинства крови"
 bm_interpersonal_events.0001.c.toast: "@bm_ancient_discipline_icon! [partner.GetFirstName] пробуждает магию крови"

 # Event 2: The Fever of Awakening
 bm_interpersonal_events.0002.t: "Лихорадка пробуждения"
 bm_interpersonal_events.0002.desc: "[child.GetFirstName] дрожит в постели, кожа пылает неестественным жаром. Слуги шепчутся о болезни, но я сразу узнаю признаки: кровь внутри [child.GetHerHim] бурлит, пытаясь пробудить оккультные пути нашей силы. Без помощи этот всплеск может разорвать [child.GetHerHis] хрупкое юное тело."
 bm_interpersonal_events.0002.a: "Направить пульс малой жизненной силой"
 bm_interpersonal_events.0002.a.toast: "@bm_ancient_discipline_icon! Пульс крови персонажа [child.GetFirstName] направлен"
 bm_interpersonal_events.0002.b: "Вызвать преждевременное пробуждение"
 bm_interpersonal_events.0002.b.toast: "@bm_ancient_discipline_icon! [child.GetFirstName] пробуждает магию крови"
 bm_interpersonal_events.0002.c: "Унять лихорадку молитвой"
 bm_interpersonal_events.0002.c.toast: "@bm_ancient_discipline_icon! Лихорадка персонажа [child.GetFirstName] унята"

 # Event 3: The Red Banquet After Battle
 bm_interpersonal_events.0003.t: "Красный пир после битвы"
 bm_interpersonal_events.0003.desc: "Звон стали стих, оставив поле боя усеянным мёртвыми и умирающими. Пока дым рассеивается, среди павших ко мне подходит [knight.GetFirstName]. Из луж свежей крови под ногами поднимается пар. Битва была яростной, и жизненная сила, нависшая над бойней, так густа, что её почти можно попробовать на вкус."
 bm_interpersonal_events.0003.a: "Испить вместе как соратники"
 bm_interpersonal_events.0003.a.toast: "@bm_ancient_discipline_icon! Добыча битвы разделена"
 bm_interpersonal_events.0003.b: "Забрать всю жатву как военачальник"
 bm_interpersonal_events.0003.b.toast: "@bm_ancient_discipline_icon! Жатва поля боя собрана"
 bm_interpersonal_events.0003.c: "Вылить на землю, освящая павших"
 bm_interpersonal_events.0003.c.toast: "@bm_ancient_discipline_icon! Павшие освящены"

 # Event 4: Echoes in the Clay
 bm_interpersonal_events.0004.t: "Отголоски в глине"
 bm_interpersonal_events.0004.desc: "Голем крови неподвижно стоит в углу моего святилища; его тело, сотканное из крови, покоится в жуткой тишине. Но стоит приблизиться, как рунические вены на руках пульсируют странным гулким ритмом. Зачарованная материя оседает, отзываясь на магию крови, пронизывающую двор."
 bm_interpersonal_events.0004.a: "Связать его как вечного стража персонажа [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.a.toast: "@bm_ancient_discipline_icon! [ward_target.GetFirstName] получает эгиду голема"
 bm_interpersonal_events.0004.b: "Пробудить его древнюю воинскую память"
 bm_interpersonal_events.0004.b.toast: "@bm_ancient_discipline_icon! Боевые инстинкты голема отточены"
 bm_interpersonal_events.0004.c: "Вытянуть избыток ихора из ядра"
 bm_interpersonal_events.0004.c.toast: "@bm_ancient_discipline_icon! Из голема вытянута большая жизненная сила"

 # Event 5: The Whispering Sanctum
 bm_interpersonal_events.0005.t: "Шепчущее святилище"
 bm_interpersonal_events.0005.desc: "В наружном коридоре скрипит половица. Скользнув в тени личного святилища, я замечаю, как [courtier.GetFirstName] заглядывает в приоткрытую дверь, широко раскрыв глаза при виде рунических кругов, сосудов с кровью и тумана моих обрядов. [courtier.GetSheHe|U] застывает: [courtier.GetSheHe] слишком поздно понимает, что здесь не место непосвящённому придворному."
 bm_interpersonal_events.0005.a: "Вытянуть кровь во тьме"
 bm_interpersonal_events.0005.a.win: "Одолеть персонажа [courtier.GetFirstName] и вытянуть жизненную силу"
 bm_interpersonal_events.0005.a.win.toast: "@bm_ancient_discipline_icon! [courtier.GetFirstName] лишается голоса и жизненной силы"
 bm_interpersonal_events.0005.a.lose: "[courtier.GetFirstName] в ужасе вырывается"
 bm_interpersonal_events.0005.a.lose.toast: "@bm_ancient_discipline_icon! [courtier.GetFirstName] бежит в ночь"
 bm_interpersonal_events.0005.b: "Купить молчание каплей жизненной силы"
 bm_interpersonal_events.0005.b.toast: "@bm_ancient_discipline_icon! [courtier.GetFirstName] связан жизненной силой и клятвой"
 bm_interpersonal_events.0005.c: "Рассеять ритуальный туман"
 bm_interpersonal_events.0005.c.toast: "@bm_ancient_discipline_icon! Туман рассеян, сомнения изгнаны"

 # Event 6: The Red Thirst
 bm_interpersonal_events.0006.t: "Красная жажда"
 bm_interpersonal_events.0006.desc: "Мои руки дрожат на холодных каменных перилах, а мучительный голод терзает меня изнутри. Многократные обряды крови опустошили мои сосуды, и каждый удар сердца персонажа [prey.GetFirstName], отзывающийся в коридоре, манит сильнее вина."
 bm_interpersonal_events.0006.a: "Стиснуть зубы и перенести лихорадку"
 bm_interpersonal_events.0006.a.toast: "@bm_ancient_discipline_icon! Красная жажда перенесена"
 bm_interpersonal_events.0006.b: "Загнать персонажа [prey.GetFirstNameNoTooltip] в угол в тени"
 bm_interpersonal_events.0006.b.win: "Вы остаётесь незамеченными и утоляете жажду"
 bm_interpersonal_events.0006.b.win.toast: "@bm_ancient_discipline_icon! Красная жажда утолена за счёт персонажа [prey.GetFirstNameNoTooltip]"
 bm_interpersonal_events.0006.b.lose: "[prey.GetFirstNameNoTooltip] вскрикивает и убегает"
 bm_interpersonal_events.0006.b.lose.toast: "@bm_ancient_discipline_icon! [prey.GetFirstNameNoTooltip] раскрывает нападение"
 bm_interpersonal_events.0006.c: "Сжечь малую жизненную силу, чтобы успокоить кровь"
 bm_interpersonal_events.0006.c.toast: "@bm_ancient_discipline_icon! Истощённые сосуды восстановлены"

 # Event 7: Weight of Eighty-Five Winters (Age 85+ Milestone)
 bm_interpersonal_events.0007.t: "Восемьдесят пять зим в крови"
 bm_interpersonal_events.0007.desc: "Восемьдесят пять зим прошли, не замедлив вашего шага. Десятилетия обрядов и спокойного совершенствования позволяют сосредоточиться и углубить выбранное направление магии крови."
 bm_interpersonal_events.0007.a: "Углубить познания древности (+5 опыта древности)"
 bm_interpersonal_events.0007.b: "Углубить мудрость (+5 опыта мудрости)"
 bm_interpersonal_events.0007.c: "Углубить удачу (+5 опыта удачи)"
 bm_interpersonal_events.0007.d: "Углубить сияние (+5 опыта сияния)"
 bm_interpersonal_events.0007.e: "Углубить хитрость (+5 опыта хитрости)"
 bm_interpersonal_events.0007.f: "Углубить ярость (+5 опыта ярости)"
 bm_interpersonal_events.0007.toast: "@bm_ancient_discipline_icon! Восемьдесят пять зим позади"

 # Event 8: A Challenger in Crimson
 bm_interpersonal_events.0008.t: "Претендент в багряном"
 bm_interpersonal_events.0008.desc: "До вашего зала доходит весть о странствующем маге в испачканном кровью дорожном плаще у ворот. [challenger.GetUIName] поднимает руку, покрытую светящимися знаками, требуя проверить, соответствует ли ваша магия крови вашей репутации."
 bm_interpersonal_events.0008.a: "Ответить оккультным поединком"
 bm_interpersonal_events.0008.a.win: "Вы пробиваете защиту персонажа [challenger.GetFirstNameNoTooltip] и поглощаете его сущность"
 bm_interpersonal_events.0008.a.win.toast: "@bm_ancient_discipline_icon! Победа над персонажем [challenger.GetFirstNameNoTooltip]"
 bm_interpersonal_events.0008.a.lose: "[challenger.GetFirstNameNoTooltip] пробивает вашу защиту"
 bm_interpersonal_events.0008.a.lose.toast: "@bm_ancient_discipline_icon! [challenger.GetFirstNameNoTooltip] одерживает победу"
 bm_interpersonal_events.0008.b: "Предложить персонажу [challenger.GetFirstNameNoTooltip] место в вашем святилище"
 bm_interpersonal_events.0008.b.win: "[challenger.GetFirstNameNoTooltip] принимает ваше покровительство"
 bm_interpersonal_events.0008.b.win.toast: "@bm_ancient_discipline_icon! [challenger.GetFirstNameNoTooltip] присоединяется ко двору"
 bm_interpersonal_events.0008.b.lose: "[challenger.GetFirstNameNoTooltip] усмехается и уходит"
 bm_interpersonal_events.0008.b.lose.toast: "@bm_ancient_discipline_icon! Претендент отказался"
 bm_interpersonal_events.0008.c: "Запереть ворота и прогнать претендента"

 # Event 9: Fractured Clay
 bm_interpersonal_events.0009.t: "Расколотая глина"
 bm_interpersonal_events.0009.desc: "Тонкие трещины расползаются по плечам голема [golem.GetFirstName], а между начертанными знаками сочится тёмная сукровица. Без обновления уз сила создания начнёт угасать."
 bm_interpersonal_events.0009.a: "Напитать узы малой жизненной силой"
 bm_interpersonal_events.0009.a.toast: "@bm_ancient_discipline_icon! Узы голема [golem.GetFirstName] укреплены"
 bm_interpersonal_events.0009.b: "Восстановить руны силой воли"
 bm_interpersonal_events.0009.b.win: "Расколотые знаки вновь соединяются"
 bm_interpersonal_events.0009.b.win.toast: "@bm_ancient_discipline_icon! Руны голема [golem.GetFirstName] восстановлены"
 bm_interpersonal_events.0009.b.lose: "Нестабильные руны обрушиваются на вашу плоть"
 bm_interpersonal_events.0009.b.lose.toast: "@bm_ancient_discipline_icon! Отдача уз голема"
 bm_interpersonal_events.0009.c: "Позволить созданию ослабеть"
 bm_interpersonal_events.0009.c.toast: "@bm_ancient_discipline_icon! Голем [golem.GetFirstName] оставлен без восстановления"

 # Event 10: The Eager Acolyte
 bm_interpersonal_events.0010.t: "Ревностный послушник"
 bm_interpersonal_events.0010.desc: "[acolyte.GetFirstName] ждёт у вашего письменного стола с испачканными чернилами пальцами и неутолимой жаждой знаний. Вкусив первых тайн магии крови, [acolyte.GetSheHe] просит личного наставления, чтобы ускорить [acolyte.GetHerHis] развитие."
 bm_interpersonal_events.0010.a: "Обучить бою и ярости"
 bm_interpersonal_events.0010.a.toast: "@bm_ancient_discipline_icon! Боевые упражнения с персонажем [acolyte.GetFirstName]"
 bm_interpersonal_events.0010.b: "Наставить в спокойном изучении тайных искусств"
 bm_interpersonal_events.0010.b.toast: "@bm_ancient_discipline_icon! Наставление персонажа [acolyte.GetFirstName]"
 bm_interpersonal_events.0010.c: "Напитать кровь большой жизненной силой"
 bm_interpersonal_events.0010.c.toast: "@bm_ancient_discipline_icon! Освоение магии персонажем [acolyte.GetFirstName] ускорено"

 # Event 11: A Century in Crimson (Age 100+ Milestone)
 bm_interpersonal_events.0011.t: "Столетие в багряном"
 bm_interpersonal_events.0011.desc: "Целый век миновал под вашим правлением, пока смертные современники обращались в прах. Преодолев обычный предел возраста, вы собираете знания крови, добытые за столетие, и направляете их в выбранное направление."
 bm_interpersonal_events.0011.a: "Освоить древние знания (+10 опыта древности)"
 bm_interpersonal_events.0011.b: "Освоить мудрость (+10 опыта мудрости)"
 bm_interpersonal_events.0011.c: "Освоить удачу (+10 опыта удачи)"
 bm_interpersonal_events.0011.d: "Освоить сияние (+10 опыта сияния)"
 bm_interpersonal_events.0011.e: "Освоить хитрость (+10 опыта хитрости)"
 bm_interpersonal_events.0011.f: "Освоить ярость (+10 опыта ярости)"
 bm_interpersonal_events.0011.toast: "@bm_ancient_discipline_icon! Столетие позади"
