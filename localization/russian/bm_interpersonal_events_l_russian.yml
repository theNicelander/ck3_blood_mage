l_russian:
 # Modifiers
 bm_guided_pulse_child_modifier: "Управляемый пульс крови"
 bm_guided_pulse_child_modifier_desc: "Раннее наставление в управлении кровью отточило воинские инстинкты, физическую бодрость и способности к учению этого ребёнка."
 bm_golem_aegis_modifier: "Эгида голема"
 bm_golem_aegis_modifier_desc: "Голем крови служит неутомимым стражем, отражая враждебные клинки и срывая происки."
 bm_siphoned_golem_modifier: "Истощённое ядро голема"
 bm_siphoned_golem_modifier_desc: "Из ядра голема извлечён избыток ихора для усиления хозяина, что временно снизило физическую силу создания."

 # Event 1: A Drop on the Lips
 bm_interpersonal_events.0001.t: "Капля на губах"
 bm_interpersonal_events.0001.desc: "В тишине наших личных покоев [partner.GetFirstName] приближается, разглядывая слабое кроваво-красное сияние под моей кожей. В [partner.GetHerHis] взгляде нет ужаса — лишь желание и преданность. [partner.GetSheHe|U] откидывает [partner.GetHerHis] голову назад, обнажая [partner.GetHerHis] горло, и шепчет, что [partner.GetSheHe] желает разделить силу, текущую в моих венах."
 bm_interpersonal_events.0001.a: "Поделиться каплей жизненной силы"
 bm_interpersonal_events.0001.a.toast: "[partner.GetFirstName] получает мою жизненную силу"
 bm_interpersonal_events.0001.b: "Испить из предложенной вены"
 bm_interpersonal_events.0001.b.toast: "Жизненная сила персонажа [partner.GetFirstName] добыта"
 bm_interpersonal_events.0001.c: "Посвятить в таинства крови"
 bm_interpersonal_events.0001.c.toast: "[partner.GetFirstName] пробуждает магию крови"

 # Event 2: The Fever of Awakening
 bm_interpersonal_events.0002.t: "Лихорадка пробуждения"
 bm_interpersonal_events.0002.desc: "[child.GetFirstName] дрожит в постели, кожа пылает неестественным жаром. Слуги шепчутся о болезни, но я сразу узнаю признаки: кровь внутри [child.GetHerHim] бурлит, пытаясь пробудить оккультные пути нашей силы. Без помощи этот всплеск может разорвать [child.GetHerHis] хрупкое юное тело."
 bm_interpersonal_events.0002.a: "Направить пульс малой жизненной силой"
 bm_interpersonal_events.0002.a.toast: "Пульс крови персонажа [child.GetFirstName] направлен"
 bm_interpersonal_events.0002.b: "Вызвать преждевременное пробуждение"
 bm_interpersonal_events.0002.b.toast: "[child.GetFirstName] пробуждает магию крови"
 bm_interpersonal_events.0002.c: "Унять лихорадку молитвой"
 bm_interpersonal_events.0002.c.toast: "Лихорадка персонажа [child.GetFirstName] унята"

 # Event 3: The Red Banquet After Battle
 bm_interpersonal_events.0003.t: "Красный пир после битвы"
 bm_interpersonal_events.0003.desc: "Звон стали стих, оставив поле боя усеянным мёртвыми и умирающими. Пока дым рассеивается, среди павших ко мне подходит [knight.GetFirstName]. Из луж свежей крови под ногами поднимается пар. Битва была яростной, и жизненная сила, нависшая над бойней, так густа, что её почти можно попробовать на вкус."
 bm_interpersonal_events.0003.a: "Испить вместе как соратники"
 bm_interpersonal_events.0003.a.toast: "Добыча битвы разделена"
 bm_interpersonal_events.0003.b: "Забрать всю жатву как военачальник"
 bm_interpersonal_events.0003.b.toast: "Жатва поля боя собрана"
 bm_interpersonal_events.0003.c: "Вылить на землю, освящая павших"
 bm_interpersonal_events.0003.c.toast: "Павшие освящены"

 # Event 4: Echoes in the Clay
 bm_interpersonal_events.0004.t: "Отголоски в глине"
 bm_interpersonal_events.0004.desc: "Голем крови неподвижно стоит в углу моего святилища; его тело, сотканное из крови, покоится в жуткой тишине. Но стоит приблизиться, как рунические вены на руках пульсируют странным гулким ритмом. Зачарованная материя оседает, отзываясь на магию крови, пронизывающую двор."
 bm_interpersonal_events.0004.a: "Связать его как вечного стража персонажа [ward_target.GetFirstName]"
 bm_interpersonal_events.0004.a.toast: "[ward_target.GetFirstName] получает эгиду голема"
 bm_interpersonal_events.0004.b: "Пробудить его древнюю воинскую память"
 bm_interpersonal_events.0004.b.toast: "Боевые инстинкты голема отточены"
 bm_interpersonal_events.0004.c: "Вытянуть избыток ихора из ядра"
 bm_interpersonal_events.0004.c.toast: "Из голема вытянута большая жизненная сила"

 # Event 5: The Whispering Sanctum
 bm_interpersonal_events.0005.t: "Шепчущее святилище"
 bm_interpersonal_events.0005.desc: "В наружном коридоре скрипит половица. Скользнув в тени личного святилища, я замечаю, как [courtier.GetFirstName] заглядывает в приоткрытую дверь, широко раскрыв глаза при виде рунических кругов, сосудов с кровью и тумана моих обрядов. [courtier.GetSheHe|U] застывает: [courtier.GetSheHe] слишком поздно понимает, что здесь не место непосвящённому придворному."
 bm_interpersonal_events.0005.a: "Вытянуть кровь во тьме"
 bm_interpersonal_events.0005.a.win: "Одолеть персонажа [courtier.GetFirstName] и вытянуть жизненную силу"
 bm_interpersonal_events.0005.a.win.toast: "[courtier.GetFirstName] лишается голоса и жизненной силы"
 bm_interpersonal_events.0005.a.lose: "[courtier.GetFirstName] в ужасе вырывается"
 bm_interpersonal_events.0005.a.lose.toast: "[courtier.GetFirstName] бежит в ночь"
 bm_interpersonal_events.0005.b: "Купить молчание каплей жизненной силы"
 bm_interpersonal_events.0005.b.toast: "[courtier.GetFirstName] связан жизненной силой и клятвой"
 bm_interpersonal_events.0005.c: "Рассеять ритуальный туман"
 bm_interpersonal_events.0005.c.toast: "Туман рассеян, сомнения изгнаны"
