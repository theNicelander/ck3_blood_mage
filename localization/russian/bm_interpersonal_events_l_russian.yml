l_russian:
  bm_guided_pulse_child_modifier:0 "Направленный багровый пульс"
  bm_guided_pulse_child_modifier_desc:0 "Раннее наставление в управлении кровью отточило воинские инстинкты, физическую бодрость и способности к учению этого ребёнка."
  bm_golem_aegis_modifier:0 "Эгида голема"
  bm_golem_aegis_modifier_desc:0 "Голем крови служит неутомимым стражем, отражая враждебные клинки и срывая происки."
  bm_siphoned_golem_modifier:0 "Истощённое ядро голема"
  bm_siphoned_golem_modifier_desc:0 "Из ядра голема извлечён избыток ихора для усиления хозяина, что временно снизило физическую силу создания."
  bm_interpersonal_events.0001.t:0 "Капля на губах"
  bm_interpersonal_events.0001.desc:0 "В тишине наших личных покоев [partner.GetFirstName] приближается, разглядывая слабое багровое сияние под моей кожей. В [partner.GetHerHis] взгляде нет ужаса — лишь желание и преданность. [partner.GetSheHe|U] откидывает [partner.GetHerHis] голову назад, обнажая [partner.GetHerHis] горло, и шепчет, что [partner.GetSheHe] желает разделить силу, текущую в моих венах."
  bm_interpersonal_events.0001.a:0 "Поделиться каплей жизненной силы"
  bm_interpersonal_events.0001.a.toast:0 "[partner.GetFirstName] получает мою жизненную силу"
  bm_interpersonal_events.0001.b:0 "Испить из предложенной вены"
  bm_interpersonal_events.0001.b.toast:0 "Жизненная сила персонажа [partner.GetFirstName] добыта"
  bm_interpersonal_events.0001.c:0 "Посвятить в багровые таинства"
  bm_interpersonal_events.0001.c.toast:0 "[partner.GetFirstName] пробуждает магию крови"
  bm_interpersonal_events.0002.t:0 "Лихорадка пробуждения"
  bm_interpersonal_events.0002.desc:0 "[child.GetFirstName] дрожит в постели, кожа пылает неестественным жаром. Слуги шепчутся о болезни, но я сразу узнаю признаки: кровь внутри [child.GetHerHim] бурлит, пытаясь пробудить оккультные пути нашей силы. Без помощи этот всплеск может разорвать [child.GetHerHis] хрупкое юное тело."
  bm_interpersonal_events.0002.a:0 "Направить пульс малой жизненной силой"
  bm_interpersonal_events.0002.a.toast:0 "Пульс крови персонажа [child.GetFirstName] направлен"
  bm_interpersonal_events.0002.b:0 "Вызвать преждевременное пробуждение"
  bm_interpersonal_events.0002.b.toast:0 "[child.GetFirstName] пробуждает магию крови"
  bm_interpersonal_events.0002.c:0 "Унять лихорадку молитвой"
  bm_interpersonal_events.0002.c.toast:0 "Лихорадка персонажа [child.GetFirstName] унята"
  bm_interpersonal_events.0003.t:0 "Красный пир после битвы"
  bm_interpersonal_events.0003.desc:0 "Звон стали стих, оставив поле боя усеянным мёртвыми и умирающими. Пока дым рассеивается, среди павших ко мне подходит [knight.GetFirstName]. Из луж свежей крови под ногами поднимается пар. Битва была яростной, и жизненная сила, нависшая над бойней, так густа, что её почти можно попробовать на вкус."
  bm_interpersonal_events.0003.a:0 "Испить вместе как соратники"
  bm_interpersonal_events.0003.a.toast:0 "Добыча битвы разделена"
  bm_interpersonal_events.0003.b:0 "Забрать всю жатву как военачальник"
  bm_interpersonal_events.0003.b.toast:0 "Жатва поля боя собрана"
  bm_interpersonal_events.0003.c:0 "Вылить на землю, освящая павших"
  bm_interpersonal_events.0003.c.toast:0 "Павшие освящены"
  bm_interpersonal_events.0004.t:0 "Отголоски в глине"
  bm_interpersonal_events.0004.desc:0 "Голем крови неподвижно стоит в углу моего святилища; его багровое тело покоится в жуткой тишине. Но стоит приблизиться, как рунические вены на руках пульсируют странным гулким ритмом. Зачарованная материя оседает, отзываясь на магию крови, пронизывающую двор."
  bm_interpersonal_events.0004.a:0 "Связать его как вечного стража персонажа [ward_target.GetFirstName]"
  bm_interpersonal_events.0004.a.toast:0 "[ward_target.GetFirstName] получает эгиду голема"
  bm_interpersonal_events.0004.b:0 "Пробудить его древнюю воинскую память"
  bm_interpersonal_events.0004.b.toast:0 "Боевые инстинкты голема отточены"
  bm_interpersonal_events.0004.c:0 "Вытянуть избыток ихора из ядра"
  bm_interpersonal_events.0004.c.toast:0 "Из голема вытянута большая жизненная сила"
  bm_interpersonal_events.0005.t:0 "Шепчущее святилище"
  bm_interpersonal_events.0005.desc:0 "В наружном коридоре скрипит половица. Скользнув в тени личного святилища, я замечаю, как [courtier.GetFirstName] заглядывает в приоткрытую дверь, широко раскрыв глаза при виде рунических кругов, сосудов с кровью и тумана моих обрядов. [courtier.GetSheHe|U] застывает: [courtier.GetSheHe] слишком поздно понимает, что здесь не место непосвящённому придворному."
  bm_interpersonal_events.0005.a:0 "Вытянуть кровь во тьме"
  bm_interpersonal_events.0005.a.win:0 "Одолеть персонажа [courtier.GetFirstName] и вытянуть жизненную силу"
  bm_interpersonal_events.0005.a.win.toast:0 "[courtier.GetFirstName] лишается голоса и жизненной силы"
  bm_interpersonal_events.0005.a.lose:0 "[courtier.GetFirstName] в ужасе вырывается"
  bm_interpersonal_events.0005.a.lose.toast:0 "[courtier.GetFirstName] бежит в ночь"
  bm_interpersonal_events.0005.b:0 "Купить молчание каплей жизненной силы"
  bm_interpersonal_events.0005.b.toast:0 "[courtier.GetFirstName] связан жизненной силой и клятвой"
  bm_interpersonal_events.0005.c:0 "Рассеять ритуальный туман"
  bm_interpersonal_events.0005.c.toast:0 "Туман рассеян, сомнения изгнаны"
