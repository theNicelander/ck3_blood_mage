l_russian:

  bm_spar_honed_modifier: "Закалка в кровавом поединке"
  bm_spar_honed_modifier_desc: "Ритуальные поединки с мастером магии крови повысили боевую эффективность и тактическое самообладание."

  bm_ritual_spar_decision: "Кровавый круг поединков"
  bm_ritual_spar_decision_desc: "Созовите присягнувших вам рыцарей, владеющих магией крови, в круг во дворе. В этом тренировочном поединке вы испытаете боевые инстинкты и мастерство, не рискуя жизнью."
  bm_ritual_spar_decision_tooltip: "Сразиться в тренировочном круге с одним из ваших рыцарей, владеющих магией крови, чтобы отточить фехтование и сгустить большую жизненную силу."
  bm_ritual_spar_decision_confirm: "Начать тренировочный поединок"
  bm_need_minor_lifeforce_spar_req: "Требуется хотя бы 1 порция малой жизненной силы."
  bm_no_knights_available_req: "Требуется хотя бы один подходящий присягнувший вам рыцарь, владеющий магией крови."

  bm_ritual_spar_events.0001.t: "Кровавый круг поединков"
  bm_ritual_spar_events.0001.desc: "На камнях двора кровью начертан широкий круг рун. Присягнувшие вам рыцари, владеющие магией крови, собрались с обнажёнными клинками. Их глаза блестят в предвкушении. Воители выходят вперёд на зов круга, готовые испытать своё мастерство в тренировочной схватке с вами."
  bm_ritual_spar_events.0001.opt_spar_1: "Тренироваться с персонажем [spar_partner_1.GetShortUIName] (доблесть: [spar_partner_1.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_2: "Тренироваться с персонажем [spar_partner_2.GetShortUIName] (доблесть: [spar_partner_2.GetProwess])"
  bm_ritual_spar_events.0001.opt_spar_3: "Тренироваться с персонажем [spar_partner_3.GetShortUIName] (доблесть: [spar_partner_3.GetProwess])"
  bm_ritual_spar_events.0001.opt_cancel: "Назад"

  bm_ritual_spar_events.0002.t: "Поединок завершён"
  bm_ritual_spar_events.0002.victor_desc: "Сталь звенит, и искры пляшут над тренировочным кругом. Благодаря превосходной боевой технике и обострённым рефлексам вы одолеваете противника по имени [sc_defender.GetShortUIName] и одерживаете решительную победу. В пылу схватки ваша кровь сгущается в сияющий шар большой жизненной силы!"
  bm_ritual_spar_events.0002.loser_desc: "Сталь звенит, и искры пляшут над тренировочным кругом. [sc_defender.GetShortUIName] движется с поразительной быстротой и мастерством, находит брешь в вашей защите и наносит решающий удар. Поражение горько, но суровое испытание закаляет ваш клинок, а [sc_defender.GetShortUIName] получает сгущённую большую жизненную силу победы."
  bm_ritual_spar_events.0002.opt: "Достойное испытание крови и клинка."
  bm_ritual_spar_victor_toast: "Решительная победа в поединке"
  bm_ritual_spar_loser_toast: "Поражение в поединке"

  bm_ritual_spar_events.0003.t: "Поединок прерван"
  bm_ritual_spar_events.0003.desc: "Тренировочный поединок внезапно прервался прежде, чем кто-либо смог одержать победу. Потраченная жизненная сила возвращается в ваши вены."
  bm_ritual_spar_events.0003.opt: "Круг пустеет."
  bm_ritual_spar_invalidated_toast: "Тренировочный поединок прерван"

  bm_cull_champion_interaction: "Принести павшего чемпиона в жертву"
  bm_cull_champion_interaction_desc: "Принести сильного пленника или окончательно сломленного последователя в жертву на алтаре крови, превратив его воинскую сущность в большую жизненную силу с шансом сгустить высшую жизненную силу."
  bm_cull_champion_toast: "Чемпион принесён в жертву"
