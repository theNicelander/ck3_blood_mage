l_russian:
  # Cast Blood Magic Major Option
  bm_cast_blood_magic_major.001.manifest_traits:0 "Направить жизненную силу: воплотить совершенство"
  bm_cast_blood_magic_major.001.manifest_traits_tt:0 "Направить большую жизненную силу на преобразование врождённых свойств (интеллект, телосложение, красота) до 3-го уровня или устранение недостатков."

  # Ritual Event (Major - Ranks 1 to 3)
  bm_channel_manifest_traits.001.title:0 "Ритуал воплощения"
  bm_channel_manifest_traits.001.desc:0 "Бурный поток большой жизненной силы отвечает на ваш зов. Жизненная сущность ждёт — податливая, но необузданная, готовая изменить вашу смертную оболочку. Какую грань своего существа вы заново выкуете в крови?"
  bm_channel_manifest_traits.001.intellect:0 "Воплотить интеллект"
  bm_channel_manifest_traits.001.physique:0 "Воплотить силу тела"
  bm_channel_manifest_traits.001.beauty:0 "Воплотить красоту"
  bm_channel_manifest_traits.001.cancel:0 "Отойти от ритуального круга"

  # Ritual Event (Superior - Ranks 4 to 5)
  bm_channel_manifest_traits.002.title:0 "Ритуал запредельного совершенства"
  bm_channel_manifest_traits.002.desc:0 "Время разрушает смертные умы и тела, но высшая жизненная сила подчиняет природу человека вашей абсолютной воле. Уже обретя гениальность, красоту или геркулесову мощь, вы готовы переступить пределы смертных и достичь вершины сверхчеловеческого совершенства."
  bm_channel_manifest_traits.002.intellect:0 "Воплотить запредельный интеллект (уровень 4/5)"
  bm_channel_manifest_traits.002.physique:0 "Воплотить запредельную силу тела (уровень 4/5)"
  bm_channel_manifest_traits.002.beauty:0 "Воплотить запредельную красоту (уровень 4/5)"

  # Duel Outcomes
  bm_manifest_traits.duel_success_tt:0 "Кровь подчиняется вашей воле, навсегда улучшая ваши свойства"
  bm_manifest_traits.duel_failure_tt:0 "Сосредоточение нарушается, и жизненная сила рассеивается впустую"
  bm_manifest_traits.duel_crit_failure_tt:0 "Неистовая отдача жизненной силы разрывает вашу смертную оболочку!"

  # Toasts
  bm_manifest_traits.intellect_success_title:0 "Интеллект воплощён: разум расширяется"
  bm_manifest_traits.physique_success_title:0 "Сила тела воплощена: плоть крепнет"
  bm_manifest_traits.beauty_success_title:0 "Красота воплощена: облик преображается"
  bm_manifest_traits.intellect_superior_success_title:0 "Запредельный интеллект: пределы смертных преодолены"
  bm_manifest_traits.physique_superior_success_title:0 "Запредельная сила тела: плоть возвышается"
  bm_manifest_traits.beauty_superior_success_title:0 "Запредельная красота: божественное сияние"
  bm_manifest_traits.failure_title:0 "Воплощение не удалось: сущность утрачена"
  bm_manifest_traits.crit_failure_title:0 "Отдача воплощения: плоть разорвана"
