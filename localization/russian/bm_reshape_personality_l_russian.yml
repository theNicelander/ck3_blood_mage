l_russian:
  bm_reshape_personality_interaction:0 "Гармонизировать натуру"
  bm_reshape_personality_interaction_desc:0 "Потратить большую жизненную силу и благочестие, чтобы вступить в единение с кровью персонажа [recipient.GetFirstName], растворить одно из свойств [recipient.GetHerHis] личности и запечатлеть одно из ваших."
  bm_reshape_personality_interaction_tooltip:0 "Провести ритуал гармонизации крови над персонажем [recipient.GetShortUINameNoTooltip]"
  bm_reshape_personality_interaction_confirm:0 "Начать ритуал"
  bm_reshape_personality_piety_level_tt:0 "Требуется 3-й уровень набожности или выше"
  bm_reshape_personality_lifeforce_tt:0 "Требуется [lifeforce_major|E]"
  bm_reshape_personality_recipient_no_traits_tt:0 "[recipient.GetShortUINameNoTooltip] должен обладать хотя бы одним свойством личности"
  bm_reshape_personality_no_new_traits_tt:0 "Вы должны обладать хотя бы одним свойством личности, которого ещё нет у персонажа [recipient.GetShortUINameNoTooltip]"
  bm_harmonized_mind_opinion:0 "Гармонизированная натура"
  bm_harmonized_mind_opinion_desc:0 "Наша кровь и души отозвались друг другу в оккультном единении."
  bm_reshape_personality.0001.title:0 "Гармонизация крови: очищение натуры"
  bm_reshape_personality.0001.desc:0 "Благодаря священному владению искусствами крови и жертве нашей жизненной силы мы проникаем в пульсирующий дух персонажа [recipient.GetUIName].\n\nСердце бьётся чаще, вены пылают холодным огнём, пока наше сознание смешивается с чужим. Чтобы проложить новый путь в этом характере, сначала нужно разбить и смыть одну из граней его природы.\n\nКакую склонность персонажа [recipient.GetFirstName] мы растворим?"
  bm_reshape_personality.0001.option_1:0 "Очистить [recipient.GetHerHis] натуру от свойства [recipient_ptrait_1.GetNameNoTooltip(recipient.Self)]"
  bm_reshape_personality.0001.option_2:0 "Очистить [recipient.GetHerHis] натуру от свойства [recipient_ptrait_2.GetNameNoTooltip(recipient.Self)]"
  bm_reshape_personality.0001.option_3:0 "Очистить [recipient.GetHerHis] натуру от свойства [recipient_ptrait_3.GetNameNoTooltip(recipient.Self)]"
  bm_reshape_personality.0001.option_4:0 "Очистить [recipient.GetHerHis] натуру от свойства [recipient_ptrait_4.GetNameNoTooltip(recipient.Self)]"
  bm_reshape_personality.0001.cancel:0 "Отступить и отказаться от единения"
  bm_reshape_personality.0002.title:0 "Гармонизация крови: запечатление сущности"
  bm_reshape_personality.0002.desc:0 "Изгнанная сущность покидает вены персонажа [recipient.GetFirstName], словно пепел в стремительном потоке. Дух теперь открыт и готов принять отражение нашей собственной внутренней сути.\n\nМы направляем жизненную кровь в чужую душу, навсегда связывая частицу нашей натуры с её существом.\n\nКакая добродетель нашего духа укоренится в [recipient.GetHerHis] крови?"
  bm_reshape_personality.0002.option_1:0 "Запечатлеть наше свойство [actor_ptrait_1.GetNameNoTooltip(root.Self)]"
  bm_reshape_personality.0002.option_2:0 "Запечатлеть наше свойство [actor_ptrait_2.GetNameNoTooltip(root.Self)]"
  bm_reshape_personality.0002.option_3:0 "Запечатлеть наше свойство [actor_ptrait_3.GetNameNoTooltip(root.Self)]"
  bm_reshape_personality.0002.option_4:0 "Запечатлеть наше свойство [actor_ptrait_4.GetNameNoTooltip(root.Self)]"
  bm_reshape_personality.0002.cancel:0 "Прервать ритуал"
  bm_reshape_personality.toast.title:0 "Натура гармонизирована"
  bm_reshape_personality.toast.desc:0 "[recipient.GetFirstName] оставляет прежнюю грань [recipient.GetHerHis] натуры — [trait_to_remove.GetNameNoTooltip(recipient.Self)] — и принимает новое свойство: [trait_to_add.GetNameNoTooltip(root.Self)]."
