l_russian:
  bm_reshape_personality_interaction:0 "Повлиять на личность"
  bm_reshape_personality_interaction_desc:0 "Потратить большую жизненную силу и благочестие, чтобы проникнуть в разум персонажа [recipient.GetFirstName], испытать его интеллект и изменить [recipient.GetHerHis] культурное наследие либо растворить свойство личности и запечатлеть одно из ваших."
  bm_reshape_personality_interaction_tooltip:0 "Попытаться повлиять на личность или культуру персонажа [recipient.GetShortUINameNoTooltip]"
  bm_reshape_personality_interaction_confirm:0 "Начать ритуал"
  bm_reshape_personality_piety_level_tt:0 "Требуется 3-й уровень набожности или выше"
  bm_reshape_personality_lifeforce_tt:0 "Требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_reshape_personality_recipient_no_traits_tt:0 "[recipient.GetShortUINameNoTooltip] должен обладать хотя бы одним свойством личности"
  bm_reshape_personality_no_new_traits_tt:0 "Вы должны обладать хотя бы одним свойством личности, которого ещё нет у персонажа [recipient.GetShortUINameNoTooltip]"
  bm_harmonized_mind_opinion:0 "Гармонизированная натура"
  bm_harmonized_mind_opinion_desc:0 "Наша кровь и души отозвались друг другу в оккультном единении."
  bm_reshape_personality.0001.title:0 "Влияние на личность: растворение натуры"
  bm_reshape_personality.0001.desc:0 "Благодаря священному владению искусствами крови и жертве нашей жизненной силы мы проникаем в пульсирующий дух персонажа [recipient.GetUIName].\n\nСердце бьётся чаще, вены пылают холодным огнём, пока наше сознание смешивается с чужим. Чтобы проложить новый путь в этом характере, сначала нужно подвергнуть испытанию и смыть одну из граней его природы.\n\nКакую склонность персонажа [recipient.GetFirstName] мы попытаемся заменить?"
  bm_reshape_personality.0001.option_1:0 "Растворить грань [recipient.GetHerHis] натуры — [recipient_ptrait_1.GetNameNoTooltip( recipient )]"
  bm_reshape_personality.0001.option_2:0 "Растворить грань [recipient.GetHerHis] натуры — [recipient_ptrait_2.GetNameNoTooltip( recipient )]"
  bm_reshape_personality.0001.option_3:0 "Растворить грань [recipient.GetHerHis] натуры — [recipient_ptrait_3.GetNameNoTooltip( recipient )]"
  bm_reshape_personality.0001.option_4:0 "Растворить грань [recipient.GetHerHis] натуры — [recipient_ptrait_4.GetNameNoTooltip( recipient )]"
  bm_reshape_personality.0001.cancel:0 "Назад"
  bm_reshape_personality.0002.title:0 "Влияние на личность: запечатление сущности"
  bm_reshape_personality.0002.desc:0 "Внутренняя сущность персонажа [recipient.GetFirstName] открыта нашей воле. Теперь предстоит битва разумов: нужно противопоставить нашу учёность и тайные знания чужой ментальной стойкости, чтобы изгнать [recipient.GetHerHis] свойство [trait_to_remove.GetNameNoTooltip( recipient )] и запечатлеть нашу натуру.\n\nКакую грань нашего духа мы внедрим в [recipient.GetHerHis] разум?"
  bm_reshape_personality.0002.option_1:0 "Запечатлеть наше свойство [actor_ptrait_1.GetNameNoTooltip( ROOT.Char )]"
  bm_reshape_personality.0002.option_2:0 "Запечатлеть наше свойство [actor_ptrait_2.GetNameNoTooltip( ROOT.Char )]"
  bm_reshape_personality.0002.option_3:0 "Запечатлеть наше свойство [actor_ptrait_3.GetNameNoTooltip( ROOT.Char )]"
  bm_reshape_personality.0002.option_4:0 "Запечатлеть наше свойство [actor_ptrait_4.GetNameNoTooltip( ROOT.Char )]"
  bm_reshape_personality.0002.cancel:0 "Назад"
  bm_reshape_personality.toast.title:0 "Влияние на личность оказано"
  bm_reshape_personality.toast.desc:0 "[recipient.GetFirstName] оставляет прежнюю грань [recipient.GetHerHis] натуры — [trait_to_remove.GetNameNoTooltip( recipient )] — и принимает новое свойство: [trait_to_add.GetNameNoTooltip( ROOT.Char )]."
  bm_reshape_personality_can_influence_tt:0 "[recipient.GetShortUINameNoTooltip] должен иметь другую культуру или свойства личности, которые можно изменить"
  bm_influence_personality_failure_cooldown_tt:0 "Вы недавно потерпели неудачу при влиянии на личность персонажа [recipient.GetShortUINamePossessive] (действует год восстановления)"
  bm_reshape_personality.duel.success:0 "Изменить личность персонажа [recipient.GetShortUINamePossessive]"
  bm_reshape_personality.duel.failure:0 "[recipient.GetShortUIName] сопротивляется ментальному единению"
  bm_reshape_personality.duel.culture_success:0 "Изменить культурное наследие персонажа [recipient.GetShortUINamePossessive]"
  bm_reshape_personality.duel.culture_failure:0 "[recipient.GetShortUIName] сопротивляется ментальному единению"
  bm_reshape_personality.0001.culture:0 "Изменить [recipient.GetHerHis] разум, чтобы принять культуру [ROOT.Char.GetCulture.GetName]"
  bm_reshape_personality.0001.culture.already_culture_tt:0 "[recipient.GetShortUINameNoTooltip] ещё не разделяет вашу культуру [ROOT.Char.GetCulture.GetName]"
  bm_reshape_personality.toast.culture_title:0 "Культура изменена"
  bm_reshape_personality.toast.culture_desc:0 "[recipient.GetFirstName] оставляет [recipient.GetHerHis] наследие и принимает культуру [ROOT.Char.GetCulture.GetName]."
  bm_reshape_personality.toast.failure.title:0 "Единение отражено"
  bm_reshape_personality.toast.failure.desc:0 "Интеллект персонажа [recipient.GetFirstName] противостоит вашей воле. [recipient.GetHerHis|U] личность остаётся прежней."
  bm_reshape_personality.toast.culture_failure.title:0 "Единение отражено"
  bm_reshape_personality.toast.culture_failure.desc:0 "Культурная идентичность персонажа [recipient.GetFirstName] противостоит вашей воле. [recipient.GetHerHis|U] культура остаётся прежней."
