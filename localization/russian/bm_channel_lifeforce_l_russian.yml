  bm_covenant_tier_1_req:0 "Ступень I (малая): требуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! благочестия и #V 1#! уровень набожности."
  NOT_bm_covenant_tier_1_req:0 "Ступень I (малая): требуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], #V 150#! благочестия и #V 1#! уровень набожности."
