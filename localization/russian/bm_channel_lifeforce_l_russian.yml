  bm_empower_bloodline_decision:0 "Усилить родословную династии"
  bm_empower_bloodline_decision_desc:0 "Провести древние пакты магии крови, навсегда вплетая её в жилы вашего дома. Каждый пакт проходит три ступени — #italic малую#! (I), #italic большую#! (II) и #italic высшую#! (III), — даруя всё более мощные сверхъестественные усиления всем живущим и будущим членам дома: землевладельцам, управляющим поместьями, странникам и придворным рыцарям."
  bm_empower_bloodline_decision_tooltip:0 "Выбрать пакт дома для улучшения"
