l_russian:
  # Standalone Decision: Empower Dynasty Bloodline
  bm_empower_bloodline_decision: "Усилить родословную династии"
  bm_empower_bloodline_decision_desc: "Заключите древние пакты крови, чтобы усилить свой дом. У каждого пакта три ступени: #italic малая#! (I), #italic большая#! (II) и #italic высшая#! (III)."
  bm_empower_bloodline_decision_tooltip: "Выбрать пакт дома для улучшения"
  BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON: "Сплести родословную"
  bm_empower_bloodline_decision_confirm: "$BM_EMPOWER_BLOODLINE_DECISION_NEXT_STEP_BUTTON$"
  bm_empower_bloodline_decision_effect: "Вы вплетёте жизненную магию крови в родословную своего дома."

  # Status Headers for Tooltips
  bm_covenant_status_none_to_minor: "#bold Текущая ступень дома:#! #V Нет#!  |  #bold Следующее улучшение:#! #P Малая (I)#!"
  bm_covenant_status_minor_to_major: "#bold Текущая ступень дома:#! #P Малая (I)#!  |  #bold Следующее улучшение:#! #V Большая (II)#!"
  bm_covenant_status_major_to_superior: "#bold Текущая ступень дома:#! #V Большая (II)#!  |  #bold Следующее улучшение:#! #Y Высшая (III)#!"

  # Dynamic Button Labels
  bm_covenant_presence_button: "[GetPlayer.Custom('BM_COVENANT_PRESENCE_BUTTON_LABEL')]"
