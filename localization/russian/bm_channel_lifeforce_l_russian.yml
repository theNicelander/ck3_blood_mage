  bm_covenant_presence:0 "Пакт влияния"
  bm_covenant_presence_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_PRESENCE_STATUS_HEADER')]\n\nУсиливает дипломатию, мнение, личные происки, легитимность и династический престиж всего вашего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.1 престижа в месяц, +1 дипломатии, +5 общего мнения, +5 к успеху личных происков, +5% прироста легитимности.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 престижа в месяц, +2 дипломатии, +10 общего мнения, +10 к успеху личных происков, -10% длительности короткого правления, +10% бонуса долгого правления, +10% прироста легитимности, #bold +1 дипломатии за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 престижа в месяц, +4 дипломатии, +15 общего мнения, +20 к успеху личных происков, -20% длительности короткого правления, +20% бонуса долгого правления, +15% прироста легитимности, #bold +1 дипломатии за уровень набожности#!."
  bm_covenant_warband:0 "Пакт боевой дружины"
  bm_covenant_warband_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_WARBAND_STATUS_HEADER')]\n\nУсиливает воинское мастерство, урон армии, профессиональные полки и скорость армии всего вашего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +1 военного дела, +1 доблести, +5% урона армии, +5% скорости передвижения армии.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +2 военного дела, +2 доблести, +10% урона армии, +10% скорости передвижения армии, +1 к числу и размеру профессиональных полков, #bold +1 военного дела за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +4 военного дела, +4 доблести, +15% урона армии, +15% скорости передвижения армии, +1 к числу и размеру профессиональных полков, #bold +1 военного дела за уровень набожности#!."
  bm_covenant_mastery:0 "Пакт мастерства"
  bm_covenant_mastery_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_MASTERY_STATUS_HEADER')]\n\nУскоряет развитие образов жизни и получение благочестия, укрепляет учёность, здоровье и устойчивость к стрессу всего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +1 учёности, +5% опыта образа жизни, -5% прироста стресса.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +2 учёности, +10% опыта образа жизни, -10% прироста стресса, +10% потери стресса, +5% благочестия, +0.15 здоровья, #bold +1 учёности за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +4 учёности, +20% опыта образа жизни, -20% прироста стресса, +20% потери стресса, +10% благочестия, +0.3 здоровья, #bold +1 место для личного догмата#!, #bold +1 учёности за уровень набожности#!, #bold игнорирование отрицательного мнения из-за культуры#!."
