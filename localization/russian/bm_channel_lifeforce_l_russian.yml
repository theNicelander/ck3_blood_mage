  bm_covenant_legacy_label_major: "Пакт наследия (большой)"

  # Covenant Options & Tooltips
  bm_covenant_presence: "Пакт влияния"
  bm_covenant_presence_tooltip: "[GetPlayer.Custom('BM_COVENANT_PRESENCE_STATUS_HEADER')]\n\nУсиливает дипломатию, мнение, личные происки, легитимность и династический престиж всего вашего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.1 престижа в месяц, +1 дипломатии, +5 общего мнения, +5 к успеху личных происков, +5% прироста легитимности.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 престижа в месяц, +2 дипломатии, +10 общего мнения, +10 к успеху личных происков, -10% длительности короткого правления, +10% бонуса долгого правления, +10% прироста легитимности, #bold +1 дипломатии за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 престижа в месяц, +4 дипломатии, +15 общего мнения, +20 к успеху личных происков, -20% длительности короткого правления, +20% бонуса долгого правления, +15% прироста легитимности, #bold +1 дипломатии за уровень набожности#!."

  bm_covenant_warband: "Пакт боевой дружины"
  bm_covenant_warband_tooltip: "[GetPlayer.Custom('BM_COVENANT_WARBAND_STATUS_HEADER')]\n\nПовышает военное дело и доблесть членов вашего дома, урон и скорость их армий, число и размер профессиональных полков, эффективность рыцарей за доблесть и ежемесячное благочестие за рыцаря.\n\n#P Ступень I (малая):#! +0,1 благочестия в месяц, +1 к военному делу, +1 к доблести, +5% урона армии, +5% скорости передвижения армии, +0,02 благочестия за рыцаря, +0,2% эффективности рыцарей за единицу доблести.\n#V Ступень II (большая):#! +0,3 благочестия в месяц, +2 к военному делу, +2 к доблести, +10% урона армии, +10% скорости передвижения армии, +1 к числу и размеру профессиональных полков, +0,04 благочестия за рыцаря, +0,5% эффективности рыцарей за единицу доблести, #bold +1 к военному делу за уровень набожности#!.\n#Y Ступень III (высшая):#! +0,5 благочестия в месяц, +4 к военному делу, +4 к доблести, +15% урона армии, +15% скорости передвижения армии, +1 к числу и размеру профессиональных полков, +0,06 благочестия за рыцаря, +1,0% эффективности рыцарей за единицу доблести, #bold +1 к военному делу за уровень набожности#!."

  bm_covenant_prosperity: "Пакт процветания"
  bm_covenant_prosperity_tooltip: "[GetPlayer.Custom('BM_COVENANT_PROSPERITY_STATUS_HEADER')]\n\nПриносит дому богатство, развитие владений, снижение содержания войск и расширение домена.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.1 золота в месяц, +1 управления, +5% дохода, -5% стоимости строительства владений и резиденций, -5% содержания профессиональных полков, +5% роста развития.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 золота в месяц, +2 управления, +10% дохода, -10% стоимости строительства владений и резиденций, -10% содержания профессиональных полков, +10% роста развития, #bold +1 управления за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 золота в месяц, +4 управления, +15% дохода, -15% стоимости строительства владений и резиденций, -15% содержания профессиональных полков, +15% роста развития, #bold +1 к пределу домена#!, #bold +1 управления за уровень набожности#!."

  bm_covenant_shadows: "Пакт теней"
  bm_covenant_shadows_tooltip: "[GetPlayer.Custom('BM_COVENANT_SHADOWS_STATUS_HEADER')]\n\nДарует дому тайную защиту, скрытность и успех враждебных происков.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +1 интриг, +3 к успеху враждебных происков, -5 к успеху враждебных происков противника.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +2 интриг, +6 к успеху враждебных происков, -10 к успеху враждебных происков противника, +5 скрытности происков, -5 к предельному успеху вражеских происков, #bold +1 интриг за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +4 интриг, +12 к успеху враждебных происков, -20 к успеху враждебных происков противника, +10 скрытности происков, -10 к предельному успеху вражеских происков, #bold +1 интриг за уровень набожности#!."

  bm_covenant_mastery: "Пакт мастерства"
  bm_covenant_mastery_tooltip: "[GetPlayer.Custom('BM_COVENANT_MASTERY_STATUS_HEADER')]\n\nПовышает учёность, здоровье, прирост опыта образа жизни и устойчивость к стрессу всего дома, а также ежемесячное благочестие за рыцаря и эффективность рыцарей за учёность.\n\n#P Ступень I (малая):#! +0,1 благочестия в месяц, +1 к учёности, +5% опыта образа жизни, -5% прироста стресса, +1% к ежемесячному благочестию за рыцаря, +0,2% эффективности рыцарей за единицу учёности.\n#V Ступень II (большая):#! +0,3 благочестия в месяц, +2 к учёности, +10% опыта образа жизни, -10% прироста стресса, +10% потери стресса, +5% благочестия, +0,15 к здоровью, +2% к ежемесячному благочестию за рыцаря, +0,5% эффективности рыцарей за единицу учёности, #bold +1 к учёности за уровень набожности#!.\n#Y Ступень III (высшая):#! +0,5 благочестия в месяц, +4 к учёности, +20% опыта образа жизни, -20% прироста стресса, +20% потери стресса, +10% благочестия, +0,3 к здоровью, +3% к ежемесячному благочестию за рыцаря, +1,0% эффективности рыцарей за единицу учёности, #bold +1 место для личного догмата#!, #bold +1 к учёности за уровень набожности#!, #bold игнорирование штрафа к мнению из-за культуры#!."

  bm_covenant_legacy: "Пакт наследия"
  bm_covenant_legacy_tooltip: "[GetPlayer.Custom('BM_COVENANT_LEGACY_STATUS_HEADER')]\n\nУкрепляет наследственность, плодовитость, долголетие, здоровье и защиту от близкородственного скрещивания всего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.15 здоровья, +2 к продолжительности жизни, +2 лет детородного возраста, +5% плодовитости, +5% шанса положительной наследственности и усиления свойств.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 здоровья, +4 к продолжительности жизни, +4 лет детородного возраста, +15% плодовитости, +15% шанса положительной наследственности и усиления свойств, -15% шанса близкородственного скрещивания, #bold +1 доблести за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 здоровья, +8 к продолжительности жизни, +8 лет детородного возраста, +25% плодовитости, +25% шанса положительной наследственности и усиления свойств, -30% шанса близкородственного скрещивания, #bold +1 доблести за уровень набожности#!."

