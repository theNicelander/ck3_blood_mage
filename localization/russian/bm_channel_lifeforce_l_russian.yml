  bm_covenant_prosperity_tier_2_tt: "Ваш дом возвысил большой пакт процветания (ступень II)."
  bm_covenant_prosperity_tier_3_tt: "Ваш дом довёл до совершенства высший пакт процветания (ступень III)!"

