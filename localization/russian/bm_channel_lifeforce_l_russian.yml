  bm_empower_bloodline_tier_1_toast: "Пакт: Малый (ступень I)"
  bm_empower_bloodline_tier_2_toast: "Пакт: Большой (ступень II)"
  bm_empower_bloodline_tier_3_toast: "Пакт: Высший (ступень III)"

