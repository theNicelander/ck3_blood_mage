  bm_covenant_shadows_tier_2_tt: "Ваш дом возвысил большой пакт теней (ступень II)."
  bm_covenant_shadows_tier_3_tt: "Ваш дом довёл до совершенства высший пакт теней (ступень III)!"

  bm_covenant_mastery_tier_1_tt: "Ваш дом заключил малый пакт мастерства (ступень I)."
  bm_covenant_mastery_tier_2_tt: "Ваш дом возвысил большой пакт мастерства (ступень II)."
  bm_covenant_mastery_tier_3_tt: "Ваш дом усовершенствовал высший пакт мастерства (ступень III)!"

  bm_covenant_legacy_tier_1_tt: "Ваш дом заключил малый пакт наследия (ступень I)."
  bm_covenant_legacy_tier_2_tt: "Ваш дом возвысил большой пакт наследия (ступень II)."
