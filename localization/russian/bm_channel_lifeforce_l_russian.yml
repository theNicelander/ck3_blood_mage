  bm_covenant_charisma:0 "Пакт величия"
  bm_covenant_charisma_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_CHARISMA_STATUS_HEADER')]\n\nУсиливает дипломатию, престиж, признание, привлекательность и личные происки всего дома.\n\n#P Ступень I (малая):#! +1 дипломатии, +5 общего мнения, привлекательности и мнения династии, +0,25 престижа/мес., +5% признания, +5 к успеху личных происков.\n#V Ступень II (большая):#! +2 дипломатии, +10 общего мнения, привлекательности и мнения династии, +0,50 престижа/мес., +10% признания, +10 к успеху личных происков, -5 дней к фазе происков.\n#Y Ступень III (высшая):#! +4 дипломатии, +15 общего мнения и мнения династии, +20 привлекательности, +1,0 престижа/мес., +15% признания, +15 к успеху личных происков, -10 дней к фазе происков, #bold +1 к максимуму личных происков#!."
  bm_covenant_fury:0 "Пакт боевой дружины"
  bm_covenant_fury_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_FURY_STATUS_HEADER')]\n\nУсиливает воинов, рыцарей, безопасность и скорость путешествий и передвижение армий всего дома.\n\n#P Ступень I (малая):#! +1 военного дела, +2 доблести, +10% эффективности рыцарей, +1 к пределу рыцарей, +10% скорости путешествий, +5 безопасности путешествий.\n#V Ступень II (большая):#! +2 военного дела, +4 доблести, +20% эффективности рыцарей, +1 к пределу рыцарей, +15% скорости путешествий, +10 безопасности путешествий, +5% скорости передвижения, +2 преимущества.\n#Y Ступень III (высшая):#! +4 военного дела, +6 доблести, +30% эффективности рыцарей, +2 к пределу рыцарей, +20% скорости путешествий, +15 безопасности путешествий, +10% скорости передвижения, +4 преимущества, #bold +1 к размеру профессионального полка#!."
  bm_covenant_prosperity:0 "Пакт процветания"
  bm_covenant_prosperity_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_PROSPERITY_STATUS_HEADER')]\n\nПриносит богатство, удешевляет содержание войск и строительство лагерей, поместий и владений, развивает дом.\n\n#P Ступень I (малая):#! +1 управления, +0,3 золота/мес., +5% дохода, -5% содержания профессиональных полков, -5% стоимости строительства резиденций и владений.\n#V Ступень II (большая):#! +2 управления, +0,6 золота/мес., +10% дохода, -10% содержания профессиональных полков, -10% стоимости и времени строительства резиденций и владений, +10% роста развития.\n#Y Ступень III (высшая):#! +4 управления, +1,2 золота/мес., +15% дохода, -15% содержания профессиональных полков, -15% стоимости и времени строительства резиденций и владений, +20% роста развития, #bold +1 к пределу домена#!."
  bm_covenant_shadows:0 "Пакт теней"
  bm_covenant_shadows_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_SHADOWS_STATUS_HEADER')]\n\nОкутывает дом оккультной тайной, усиливает ужас и скорость враждебных происков, защищает от заговоров.\n\n#P Ступень I (малая):#! +1 интриг, +5 к успеху враждебных происков, -5 дней к фазе происков, +5 секретности, -5 к успеху вражеских происков, +5 дней к фазе вражеских происков, +5 ужаса.\n#V Ступень II (большая):#! +2 интриг, +10 к успеху враждебных происков, -10 дней к фазе происков, +10 секретности, -10 к успеху вражеских происков, +10 дней к фазе вражеских происков, -10% к предельному шансу успеха вражеских происков, +10 ужаса.\n#Y Ступень III (высшая):#! +4 интриг, +15 к успеху враждебных происков, -15 дней к фазе происков, +15 секретности, -15 к успеху вражеских происков, +15 дней к фазе вражеских происков, -20% к предельному шансу успеха вражеских происков, +15 ужаса, #bold +1 к максимуму враждебных происков#!."
  bm_covenant_insight:0 "Пакт проницательности"
  bm_covenant_insight_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_INSIGHT_STATUS_HEADER')]\n\nУскоряет обучение, повышает ежемесячное благочестие, устойчивость к стрессу, культурное принятие и влияние набожности всего дома.\n\n#P Ступень I (малая):#! +1 учёности, +0,25 благочестия/мес., +5% благочестия, -5% прироста стресса, +5% потери стресса, +5% культурного принятия.\n#V Ступень II (большая):#! +2 учёности, +0,50 благочестия/мес., +10% благочестия, -10% прироста стресса, +10% потери стресса, +10% культурного принятия, +10% влияния набожности.\n#Y Ступень III (высшая):#! +4 учёности, +1,0 благочестия/мес., +20% благочестия, -15% прироста стресса, +15% потери стресса, +15% культурного принятия, +20% влияния набожности, #bold +1 учёности за уровень набожности#!."
  bm_covenant_legacy:0 "Пакт наследия"
  bm_covenant_legacy_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_LEGACY_STATUS_HEADER')]\n\nУкрепляет наследственность, плодовитость, долголетие, здоровье и сопротивляемость болезням всех живущих и будущих поколений дома.\n\n#P Ступень I (малая):#! +0,25 здоровья, +3 года жизни, +3 года детородного возраста, +10% плодовитости, +10% шанса положительных врождённых свойств, +10% наследования неактивных свойств, +10% усиления врождённых свойств, -15% близкородственного скрещивания и отрицательных свойств, +3 сопротивляемости эпидемиям.\n#V Ступень II (большая):#! +0,50 здоровья, +6 лет жизни, +6 лет детородного возраста, +20% плодовитости, +20% шанса положительных врождённых свойств, +20% наследования неактивных свойств, +20% усиления врождённых свойств, -30% близкородственного скрещивания и отрицательных свойств, +6 сопротивляемости эпидемиям.\n#Y Ступень III (высшая):#! +1,0 здоровья, +12 лет жизни, +12 лет детородного возраста, +30% плодовитости, +35% шанса положительных врождённых свойств, +35% наследования неактивных свойств, +35% усиления врождённых свойств, #bold -50% близкородственного скрещивания и отрицательных свойств#!, +10 сопротивляемости эпидемиям."
  bm_covenant_expertise:0 "Пакт мастерства"
  bm_covenant_expertise_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_EXPERTISE_STATUS_HEADER')]\n\nУскоряет получение опыта образа жизни, изучение языков и влияние имперской репутации всего дома.\n\n#P Ступень I (малая):#! +10% опыта образа жизни, -10 дней к фазе изучения языка, +1 к числу языков.\n#V Ступень II (большая):#! +20% опыта образа жизни, -20 дней к фазе изучения языка, +2 к числу языков, +10% влияния репутации.\n#Y Ступень III (высшая):#! +30% опыта образа жизни, -30 дней к фазе изучения языка, +3 к числу языков, +20% влияния репутации, #bold игнорирование отрицательного мнения из-за культуры#!."
