  bm_covenant_prosperity:0 "Пакт процветания"
  bm_covenant_prosperity_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_PROSPERITY_STATUS_HEADER')]\n\nПриносит дому богатство, развитие владений, снижение содержания войск и расширение домена.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.1 золота в месяц, +1 управления, +5% дохода, -5% стоимости строительства владений и резиденций, -5% содержания профессиональных полков, +5% роста развития.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 золота в месяц, +2 управления, +10% дохода, -10% стоимости строительства владений и резиденций, -10% содержания профессиональных полков, +10% роста развития, #bold +1 управления за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 золота в месяц, +4 управления, +15% дохода, -15% стоимости строительства владений и резиденций, -15% содержания профессиональных полков, +15% роста развития, #bold +1 к пределу домена#!, #bold +1 управления за уровень набожности#!."
  bm_covenant_shadows:0 "Пакт теней"
  bm_covenant_shadows_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_SHADOWS_STATUS_HEADER')]\n\nДарует дому тайную защиту, скрытность и успех враждебных происков.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +1 интриг, +3 к успеху враждебных происков, -5 к успеху враждебных происков противника.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +2 интриг, +6 к успеху враждебных происков, -10 к успеху враждебных происков противника, +5 скрытности происков, -5 к предельному успеху вражеских происков, #bold +1 интриг за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +4 интриг, +12 к успеху враждебных происков, -20 к успеху враждебных происков противника, +10 скрытности происков, -10 к предельному успеху вражеских происков, #bold +1 интриг за уровень набожности#!."
  bm_covenant_legacy:0 "Пакт наследия"
  bm_covenant_legacy_tooltip:0 "[GetPlayer.Custom('BM_COVENANT_LEGACY_STATUS_HEADER')]\n\nУкрепляет наследственность, плодовитость, долголетие, здоровье и защиту от близкородственного скрещивания всего дома.\n\n#P Ступень I (малая):#! +0.1 благочестия в месяц, +0.15 здоровья, +2 к продолжительности жизни, +2 лет детородного возраста, +5% плодовитости, +5% шанса положительной наследственности и усиления свойств.\n#V Ступень II (большая):#! +0.3 благочестия в месяц, +0.3 здоровья, +4 к продолжительности жизни, +4 лет детородного возраста, +15% плодовитости, +15% шанса положительной наследственности и усиления свойств, -15% шанса близкородственного скрещивания, #bold +1 доблести за уровень набожности#!.\n#Y Ступень III (высшая):#! +0.5 благочестия в месяц, +0.5 здоровья, +8 к продолжительности жизни, +8 лет детородного возраста, +25% плодовитости, +25% шанса положительной наследственности и усиления свойств, -30% шанса близкородственного скрещивания, #bold +1 доблести за уровень набожности#!."
