  bm_covenant_prosperity_label_minor: "Пакт процветания (малый)"
  bm_covenant_prosperity_label_major: "Пакт процветания (большой)"

  bm_covenant_shadows_button: "[GetPlayer.Custom('BM_COVENANT_SHADOWS_BUTTON_LABEL')]"
  bm_covenant_shadows_label_none: "Пакт теней (нет)"
  bm_covenant_shadows_label_minor: "Пакт теней (малый)"
  bm_covenant_shadows_label_major: "Пакт теней (большой)"

