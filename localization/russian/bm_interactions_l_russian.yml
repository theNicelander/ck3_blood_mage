l_russian:
  # Give blood magic
  grant_blood_magic_interaction: "Сделать магом крови"
  grant_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] обретёт сверхъестественное свойство образа жизни «Маг крови»."
  grant_blood_magic_interaction.minor: "Магическая клятва крови (малая жизненная сила)"
  grant_blood_magic_interaction.minor_desc: "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]."
  grant_blood_magic_interaction.major: "Обряд кровного братства (большая жизненная сила)"
  grant_blood_magic_interaction.major_desc: "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E]."
  grant_blood_magic_interaction_requirement: "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement: "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Попросить дар магии крови"
  ask_for_blood_magic_interaction_desc: "Попросить персонажа [recipient.GetShortUINameNoTooltip] даровать вам силу магии крови"
  ask_for_blood_magic_interaction_requirement: "Персонаж должен быть вашим другом, лучшим другом, любовником или родственной душой"
  NOT_ask_for_blood_magic_interaction_requirement: "Персонаж должен быть вашим другом, лучшим другом, любовником или родственной душой"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Получить магию крови от пленника"
  bm_get_blood_magic_from_prisoner_interaction.success: "@bm_ancient_discipline_icon! Я становлюсь магом крови"
  bm_get_blood_magic_from_prisoner_interaction.fail: "@bm_ancient_discipline_icon! Мне не удалось стать магом крови"
  bm_get_blood_magic_from_prisoner_interaction.desc: "Я поедаю плоть пленника, пытаясь обрести его магию крови"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Даровать жизненную силу"
  grant_lifeforce_interaction_desc: "Передать жизненную силу персонажу [recipient.GetShortUINameNoTooltip] или восстановить её после недавнего вытягивания."
  grant_lifeforce_interaction.grant_minor: "Даровать малую жизненную силу"
  grant_lifeforce_interaction.grant_major: "Даровать большую жизненную силу"
  grant_lifeforce_interaction.reverse_lifedrain: "Обратить вытягивание жизненной силы"
  grant_lifeforce_interaction.toast: "Я передаю жизненную силу персонажу [recipient.GetShortUINameNoTooltip]"
  grant_lifeforce_interaction_requirement: "Чтобы даровать жизненную силу, требуется [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 25 [piety|E] либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  NOT_grant_lifeforce_interaction_requirement: "Чтобы даровать жизненную силу, требуется [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 25 [piety|E] либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  grant_lifeforce_reverse_lifedrain_requirement: "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  NOT_grant_lifeforce_reverse_lifedrain_requirement: "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."


  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Обратить вытягивание жизненной силы"
  grant_lifeforce_interaction_reversed_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E], чтобы снять [GetModifier('lifedrained_modifier').GetNameWithTooltip] с персонажа [recipient.GetShortUINameNoTooltip] и даровать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]."

  # Cure illness
  bm_heal_ailment: "Исцеление кровью"
  bm_heal_ailment_desc: "Проведите ритуал крови, чтобы исцелить выбранное свойство здоровья, старости или совладания со стрессом у персонажа [recipient.GetShortUINameNoTooltip]."
  bm_heal_ailment_tooltip: "Провести исцеляющий ритуал магии крови."
  bm_heal_ailment_resource_requirement_tt: "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы одно свойство здоровья персонажа [recipient.GetShortUINamePossessive]."
  NOT_bm_heal_ailment_resource_requirement_tt: "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы одно свойство здоровья персонажа [recipient.GetShortUINamePossessive]."


  bm_duel_kill_fury_toast: "@bm_ancient_discipline_icon! Ярость: добыча поединка"
  bm_duel_kill_fury_tt: "За победу в поединке получено #P +3#! опыта направления #V «Ярость»#! и добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"

  bm_battle_victory_lifeforce_toast: "@bm_ancient_discipline_icon! Жатва крови на поле боя"
  bm_battle_victory_lifeforce_tt: "Из павших врагов на победном поле боя добыта [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]"
  bm_battle_victory_major_lifeforce_toast: "@bm_ancient_discipline_icon! Великая жатва крови на поле боя"
  bm_battle_victory_major_lifeforce_tt: "Из кровавой бойни на победном поле боя добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_battle_victory_both_lifeforce_toast: "@bm_ancient_discipline_icon! Эпическая жатва крови на поле боя"
  bm_battle_victory_both_lifeforce_tt: "Из чудовищной бойни на победном поле боя добыты и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]!"

  # Battle XP Toasts
  bm_battle_victory_commander_toast: "@bm_ancient_discipline_icon! Ярость: победа полководца"
  bm_battle_victory_commander_t1_tt: "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t2_tt: "Умелая тактика принесла победу в напряжённом столкновении.\nПолучено #P +2#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t3_tt: "Крупная битва за спорные рубежи завершилась победой.\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t4_tt: "Искусное командование принесло победу в великой битве.\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t5_tt: "Ваше командование решило исход грандиозного столкновения народов!\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_victory_fury_toast: "@bm_ancient_discipline_icon! Ярость: победа в бою"
  bm_battle_victory_fury_t1_tt: "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_fury_t2_tt: "В напряжённой схватке победу принесла доблесть.\nПолучено #P +2#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_fury_t3_tt: "Крупную битву удалось выиграть кровью и сталью.\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_fury_t4_tt: "Великая битва завершилась победой на залитых кровью рубежах.\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_fury_t5_tt: "В этой грандиозной бойне из крови рождаются легенды!\nПолучено #P +3#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_defeat_commander_toast: "@bm_ancient_discipline_icon! Ярость: закалка поражением"
  bm_battle_defeat_commander_t1_tt: "Стычка проиграна, но поле боя преподало ценные уроки.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t2_tt: "Ожесточённая схватка проиграна, но командование в трудную минуту укрепляет вашу решимость.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t3_tt: "Крупная битва проиграна. Тот, кто выживает в такой бойне, постигает тактику на собственном опыте.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t4_tt: "Огромная армия разбита на поле боя. Ваша кровь и разум закаляются в огне поражения.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t5_tt: "Вам удалось пережить страшный разгром! Ваш дух восстаёт из пепла несломленным.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_defeat_fury_toast: "@bm_ancient_discipline_icon! Ярость: закалка поражением"
  bm_battle_defeat_fury_t1_tt: "Небольшая стычка проиграна, но ваши боевые инстинкты обострились.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_fury_t2_tt: "Ожесточённая схватка проиграна. Боль закаляет ваше тело и открывает внутренний взор.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_fury_t3_tt: "Удача отвернулась от вас в крупной битве, но стойкость в этой бойне закалила вас.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_fury_t4_tt: "Сокрушительное поражение. Кровь, пролитая на поле боя, закаляет тело и дух.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_fury_t5_tt: "Вам удалось пережить страшный разгром! Лишь истинные маги крови выживают в такой бойне и навсегда меняются после неё.\nПолучено #P +1#! опыта направления #V «Ярость»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  # Bless Kin
  bm_bless_bloodline_interaction: "Благословить кровь"
  bm_bless_bloodline_interaction_desc: "Наполнить жизненной силой ребёнка, родича по династии или присягнувшего рыцаря, благословляя тело и разум."
  bm_recipient_already_blessed: "Кровь цели уже благословлена"
  NOT_bm_recipient_already_blessed: "Кровь цели уже благословлена"
  bm_bless_bloodline_toast: "Кровь благословлена"
  bm_bless_bloodline_toast_tt: "Кровь персонажа [recipient.GetShortUINamePossessive] наполнена жизненной силой."

  # Childbirth Milestones
  bm_birth_blood_mage_child_toast: "@bm_ancient_discipline_icon! Родился наследник — маг крови"
  bm_birth_blood_mage_child_tt: "В ребёнке пробуждается свойство магии крови! Вы получаете большую жизненную силу, а ваше мастерство Удачи и Древности стремительно растёт."
  bm_birth_child_fortune_toast: "@bm_ancient_discipline_icon! В доме родился ребёнок"
  bm_birth_child_fortune_tt: "В вашем доме родился ребёнок. Вы получаете большую жизненную силу и опыт Удачи и Древности."
  bm_birth_mojo_consumed_toast: "@bm_ancient_discipline_icon! Древняя кровь передана при рождении"
  bm_birth_mojo_consumed_tt: "Израсходован 1 заряд древней крови. Вы получаете дополнительный опыт Удачи, а шанс пробуждения магии крови у ребёнка повышается."

  # Tooltips
  IN_COURT_OR_IMPRISONED: "Можно исцелять только себя, свою семью, сюзерена, придворных или рыцарей"

  # Blood Curse
  bm_curse_blood.critical_success_title: "@bm_ancient_discipline_icon! Жизненная сила похищена"
  bm_curse_blood.critical_success_desc: "Проклятие проникло глубоко в вены персонажа [recipient.GetShortUINamePossessive], вызвав тяжёлую болезнь и передав его жизненную силу вам."
  bm_curse_blood.success_title: "@bm_ancient_discipline_icon! Проклятие крови наложено"
  bm_curse_blood.success_desc: "Кровь персонажа [recipient.GetShortUINamePossessive] связана злым проклятием магии крови. Здоровье и способности жертвы незаметно увядают."
  bm_curse_blood.fail_title: "@bm_ancient_discipline_icon! Проклятие отражено"
  bm_curse_blood.fail_desc: "[recipient.GetShortUIName] противостоит вашему проклятию крови и узнаёт, кто пытался осквернить кровь."

  # Manifest Lifeforce Interaction
  bm_manifest_lifeforce_interaction: "Воплотить жизненную силу"
  bm_manifest_lifeforce_interaction_desc: "Войти в глубокий медитативный транс и преобразовать духовную мощь в осязаемую жизненную силу через состязание учёности."
  bm_manifest_lifeforce_requirement_tt: "Требуется 2-й уровень набожности и не менее 100 благочестия"
  NOT_bm_manifest_lifeforce_requirement_tt: "Требуется 2-й уровень набожности и не менее 100 благочестия"
  bm_manifest_lifeforce_cooldown_tt: "Воплощать жизненную силу можно только раз в год"
  NOT_bm_manifest_lifeforce_cooldown_tt: "Воплощать жизненную силу можно только раз в год"
  bm_manifest_lifeforce_interaction.tier1: "Скромная медитация (100 благочестия)"
  bm_manifest_lifeforce_interaction.tier1_desc: "Пожертвовать 100 благочестия ради +2 опыта Мудрости.\nИсходные вероятности: малая жизненная сила (~33,0%), большая жизненная сила (~17,0%), неудача без результата (~33,0%) и критическая неудача с сильной отдачей (большой штраф, ~17,0%). Высокая учёность снижает общую вероятность неудачи до 4,0% (3% без результата / 1% критической отдачи) и повышает вероятность успеха."
  bm_manifest_lifeforce_interaction.tier2: "Сосредоточенное единение (250 благочестия)"
  bm_manifest_lifeforce_interaction.tier2_desc: "Пожертвовать 250 благочестия ради +3 опыта Мудрости.\nМалая жизненная сила гарантирована сразу. Исходные вероятности: 1 порция большой жизненной силы (50,0%), 2 порции большой жизненной силы (25,0%), неудача без результата (17,0%) и критическая неудача со слабой отдачей (малый штраф, 8,0%). Высокая учёность снижает общую вероятность неудачи до 3,0% (2% без результата / 1% слабой отдачи) и повышает шанс получить 2 порции большой жизненной силы."
  bm_manifest_lifeforce_interaction.tier3: "Глубинный тигель (500 благочестия)"
  bm_manifest_lifeforce_interaction.tier3_desc: "Пожертвовать 500 благочестия ради +5 опыта Мудрости.\nБольшая жизненная сила гарантирована сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (15,0%) или дополнительную малую жизненную силу (35,0%). Высокая учёность повышает шанс получить 2 порции большой жизненной силы до 35,0%."
  bm_manifest_lifeforce_interaction.tier4: "Запредельное озарение (1000 благочестия)"
  bm_manifest_lifeforce_interaction.tier4_desc: "Пожертвовать 1000 благочестия ради +7 опыта Мудрости.\nМалая жизненная сила и 1 порция большой жизненной силы гарантированы сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (35,0%) или высшую жизненную силу (15,0%). Высокая учёность повышает шанс получить высшую жизненную силу до 40,0%."

  # Character Interaction Category
  interaction_category_bm_blood_magic: "Магия крови"
  BM_BLOOD_MAGIC_ACTIONS: "Магия крови"
  interaction_category_bm_blood_magic_filter_tag_desc: "Взаимодействия магии крови"

  # Cast Blood Blessing Interaction
  bm_cast_blood_blessing_interaction: "Благословение крови"
  bm_cast_blood_blessing_interaction_desc: "Направить жизненную силу и благочестие в персонажа [recipient.GetShortUINameNoTooltip], чтобы даровать постоянное благословение крови, усилить другого мага крови, передать жизненную силу или вырезать руну крови."
  bm_cast_blood_blessing_interaction_tooltip: "Даровать постоянное благословение крови, усилить мага крови, передать жизненную силу или вырезать руну крови."
  bm_cast_blood_blessing_interaction_requirement: "Требуется малая, большая, высшая или древняя жизненная сила."
  NOT_bm_cast_blood_blessing_interaction_requirement: "Требуется малая, большая, высшая или древняя жизненная сила."
  bm_cast_blood_blessing_option_radiance_desc: "$bm_self_blessing_radiance_tooltip$"
  bm_cast_blood_blessing_option_fortune_desc: "$bm_self_blessing_fortune_tooltip$"
  bm_cast_blood_blessing_option_fury_desc: "$bm_self_blessing_fury_tooltip$"
  bm_cast_blood_blessing_option_cunning_desc: "$bm_self_blessing_cunning_tooltip$"
  bm_cast_blood_blessing_option_wisdom_desc: "$bm_self_blessing_wisdom_tooltip$"
  bm_cast_blood_blessing_option_ancient_desc: "$bm_self_blessing_ancient_tooltip$"
  bm_blood_blessing_toast: "@bm_ancient_discipline_icon! Благословение крови даровано"
  bm_blood_blessing_option_empower: "Усилить мага крови"
  bm_blood_blessing_option_empower_desc: "Направить жизненную силу в персонажа [recipient.GetShortUINameNoTooltip], чтобы развить оккультные или воинские направления образа жизни."
  bm_blood_blessing_option_grant_lifeforce_minor: "Даровать малую жизненную силу"
  bm_blood_blessing_option_grant_lifeforce_minor_desc: "Передать персонажу [recipient.GetShortUINameNoTooltip] 1 малую жизненную силу и 25 благочестия (+2 опыта сияния, +15 мнения)."
  bm_blood_blessing_option_grant_lifeforce_major: "Даровать большую жизненную силу"
  bm_blood_blessing_option_grant_lifeforce_major_desc: "Передать персонажу [recipient.GetShortUINameNoTooltip] 1 большую жизненную силу и 50 благочестия (+4 опыта сияния), устраняя истощение жизненной силы либо даруя большую жизненную силу (+30 мнения)."
  bm_blood_blessing_option_grant_lifeforce_superior: "Даровать высшую жизненную силу"
  bm_blood_blessing_option_grant_lifeforce_superior_desc: "Передать персонажу [recipient.GetShortUINameNoTooltip] 1 высшую жизненную силу и 100 благочестия (+6 опыта сияния, +45 мнения)."
  bm_blood_blessing_option_grant_lifeforce_ancient: "Даровать древнюю кровь"
  bm_blood_blessing_option_grant_lifeforce_ancient_desc: "Передать персонажу [recipient.GetShortUINameNoTooltip] 1 древнюю кровь и 50 благочестия (+4 опыта удачи, +25 мнения)."
  bm_blood_blessing_option_inscribe_rune: "Начертать руну крови"
  bm_blood_blessing_option_inscribe_rune_desc: "Начертать или улучшить постоянную руну крови на персонаже [recipient.GetShortUINameNoTooltip]."

  # Unified Blood Drain Interaction
  bm_blood_drain_interaction: "Вытягивание крови"
  bm_blood_drain_interaction_desc: "Извлечь жизненную силу персонажа [recipient.GetShortUINameNoTooltip] запретными обрядами крови."
  bm_blood_drain_interaction_tooltip: "Собрать жизненную силу пленников, подданных, родичей или соперничающих магов."
  bm_blood_drain_interaction_requirement: "Вы должны иметь возможность извлечь жизненную силу этого персонажа."
  NOT_bm_blood_drain_interaction_requirement: "Вы не можете извлечь жизненную силу этого персонажа."
  bm_blood_drain_toast: "@bm_ancient_discipline_icon! Жизненная сила извлечена"
  bm_blood_drain_secret_toast: "@bm_ancient_discipline_icon! Жизненная сила тайно извлечена"
  bm_blood_drain_option_major: "Большое вытягивание жизненной силы"
  bm_blood_drain_option_major_desc: "Провести смертельный сбор крови пленника, вырвав жизненную силу и сгустив её в большую порцию."
  bm_blood_drain_option_minor: "Малое вытягивание жизненной силы"
  bm_blood_drain_option_minor_desc: "Вытянуть малую жизненную силу пленника, придворного, вассала или сюзерена (перерыв для каждой жертвы — 3 месяца). На пленников действует безотказно; свободные персонажи сопротивляются в поединке интриги и учёности с 3 исходами: тайный успех (ранение, без штрафа к мнению), успех (ранение, -30 мнения) или неудача (-30 мнения, +20 стресса)."
  bm_blood_drain_option_minor_empowered: "Малое вытягивание жизненной силы (усиленное)"
  bm_blood_drain_option_minor_empowered_desc: "Потратить дополнительное благочестие, чтобы значительно повысить шансы обычного и тайного успеха (суммарно 80% при равной интриге и учёности) при вытягивании малой жизненной силы свободного персонажа."
  bm_blood_drain_minor_secret_success_tt: "Вы тайно вытягиваете малую жизненную силу, оставаясь незамеченным"
  bm_blood_drain_minor_success_tt: "Вы успешно вытягиваете малую жизненную силу"
  bm_blood_drain_minor_fail_tt: "[recipient.GetShortUINameNoTooltip] сопротивляется вашей попытке"
  bm_blood_drain_minor_fail_toast: "@bm_ancient_discipline_icon! Вытягивание жизненной силы отражено"
  bm_minor_lifedrain_victim_cooldown_tt: "Малая жизненная сила не вытягивалась в течение последних 3 месяцев"
  NOT_bm_minor_lifedrain_victim_cooldown_tt: "Малая жизненная сила не вытягивалась в течение последних 3 месяцев"
  bm_blood_drain_option_stored: "Вытянуть запасённую жизненную силу"
  bm_blood_drain_option_stored_desc: "Извлечь сгущённые запасы жизненной силы прямо из крови персонажа [recipient.GetShortUINameNoTooltip]. На пленников действует безотказно; остальные сопротивляются в поединке интриги и учёности."
  bm_blood_drain_stored_success_tt: "Вы вытягиваете накопленную жизненную силу"
  bm_blood_drain_stored_fail_tt: "[recipient.GetShortUINameNoTooltip] пресекает вытягивание"
  bm_blood_drain_stored_fail_toast: "@bm_ancient_discipline_icon! Вытягивание не удалось"
  bm_blood_drain_option_tithe: "Потребовать десятину крови"
  bm_blood_drain_option_tithe_desc: "Воспользоваться властью главы дома, чтобы извлечь жизненную силу взрослого родича. Успех гарантирован без поединка: цель получает ранение и штраф к мнению (перерыв — 2 года)."
  bm_blood_drain_option_trait: "Поглотить положительные свойства"
  bm_blood_drain_option_trait_desc: "Потратить 1 порцию большой жизненной силы и благочестие (100–325), чтобы похитить положительное врождённое свойство у пленника в поединке учёности (перерыв — 60 дней; для одной жертвы — 180 дней)."
  bm_trait_drain_caster_cooldown_tt: "Вы не поглощали положительные свойства в течение последних 60 дней"
  NOT_bm_trait_drain_caster_cooldown_tt: "Вы не поглощали положительные свойства в течение последних 60 дней"
  bm_trait_drain_victim_cooldown_tt: "Свойства не поглощались в течение последних 180 дней"
  NOT_bm_trait_drain_victim_cooldown_tt: "Свойства не поглощались в течение последних 180 дней"
  bm_blood_drain_option_memory: "Поглотить память крови"
  bm_blood_drain_option_memory_desc: "Потратьте 1 большую жизненную силу и благочестие (150+, в зависимости от освоенных свойств), чтобы в состязании по учёности поглотить свойство образа жизни, командования или воинской славы (либо +20 опыта уже имеющегося свойства) у пленника, чья жизненная сила ещё не истощена. Цель получает истощение жизненной силы, а вы — возрастающий стресс (время восстановления 60 дней)."
  bm_memory_drain_caster_cooldown_tt: "Вы не поглощали память крови последние 60 дней"
  NOT_bm_memory_drain_caster_cooldown_tt: "Вы не поглощали память крови последние 60 дней"
  bm_memory_drain_victim_cooldown_tt: "Не сопротивлялся поглощению памяти крови последние 180 дней"
  NOT_bm_memory_drain_victim_cooldown_tt: "Не сопротивлялся поглощению памяти крови последние 180 дней"
  bm_blood_drain_option_curse: "Проклятие крови"
  bm_blood_drain_option_curse_desc: "Потратить 1 малую жизненную силу и 50 благочестия (требуется 10+ опыта хитрости, перерыв — 1 год), чтобы наложить проклятие магии крови на персонажа [recipient.GetShortUINameNoTooltip] в поединке интриги и учёности. Проклятие ослабляет жизненные силы на 5 лет, а при критическом успехе может вызвать болезнь или позволить вытянуть жизненную силу."
  bm_curse_blood_cooldown_tt: "Вы не накладывали проклятие крови в течение последнего года"
  NOT_bm_curse_blood_cooldown_tt: "Вы не накладывали проклятие крови в течение последнего года"
  bm_blood_drain_option_major_overdrained: "Большое вытягивание жизненной силы (чрезмерное истощение)"
  bm_blood_drain_option_major_overdrained_desc: "Провести смертельный сбор жизненной силы пленника без затрат благочестия, получив большую жизненную силу ценой 20 стресса, ранения (если ещё нет ран) и накопительного штрафа «Чрезмерное истощение» на 2 года (-0.3 здоровья, -1.0 ежемесячного благочестия, -5% ежемесячного благочестия)."
