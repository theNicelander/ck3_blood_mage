l_russian:
  # Give blood magic
  grant_blood_magic_interaction: "Сделать магом крови"
  grant_blood_magic_interaction_desc: "[recipient.GetShortUINameNoTooltip] обретёт сверхъестественное свойство образа жизни «Маг крови»."
  grant_blood_magic_interaction.minor: "Магическая клятва крови (малая жизненная сила)"
  grant_blood_magic_interaction.minor_desc: "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]."
  grant_blood_magic_interaction.major: "Обряд кровного братства (большая жизненная сила)"
  grant_blood_magic_interaction.major_desc: "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E]."
  grant_blood_magic_interaction_requirement: "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement: "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"

  # Ask for blood magic
  ask_for_blood_magic_interaction: "Попросить дар магии крови"
  ask_for_blood_magic_interaction_desc: "Попросить персонажа [recipient.GetShortUINameNoTooltip] даровать вам силу магии крови"
  ask_for_blood_magic_interaction_requirement: "Персонаж должен быть вашим другом, лучшим другом, любовником или родственной душой"
  NOT_ask_for_blood_magic_interaction_requirement: "Персонаж должен быть вашим другом, лучшим другом, любовником или родственной душой"

  # Get blood magic from prisoner
  bm_get_blood_magic_from_prisoner_interaction: "Получить магию крови от пленника"
  bm_get_blood_magic_from_prisoner_interaction.success: "Я становлюсь магом крови"
  bm_get_blood_magic_from_prisoner_interaction.fail: "Мне не удалось стать магом крови"
  bm_get_blood_magic_from_prisoner_interaction.desc: "Я поедаю плоть пленника, пытаясь обрести его магию крови"

  # Grant Lifeforce
  grant_lifeforce_interaction: "Даровать жизненную силу"
  grant_lifeforce_interaction_desc: "Передать жизненную силу персонажу [recipient.GetShortUINameNoTooltip] или восстановить её после недавнего вытягивания."
  grant_lifeforce_interaction.grant_minor: "Даровать малую жизненную силу"
  grant_lifeforce_interaction.grant_major: "Даровать большую жизненную силу"
  grant_lifeforce_interaction.reverse_lifedrain: "Обратить вытягивание жизненной силы"
  grant_lifeforce_interaction.toast: "Я передаю жизненную силу персонажу [recipient.GetShortUINameNoTooltip]"
  grant_lifeforce_interaction_requirement: "Чтобы даровать жизненную силу, требуется [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 25 [piety|E] либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  NOT_grant_lifeforce_interaction_requirement: "Чтобы даровать жизненную силу, требуется [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 25 [piety|E] либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  grant_lifeforce_reverse_lifedrain_requirement: "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  NOT_grant_lifeforce_reverse_lifedrain_requirement: "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."

  # Reverse lifedrained
  grant_lifeforce_interaction_reversed: "Обратить вытягивание жизненной силы"
  grant_lifeforce_interaction_reversed_desc: "Потратить [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E], чтобы снять [GetModifier('lifedrained_modifier').GetNameWithTooltip] с персонажа [recipient.GetShortUINameNoTooltip] и даровать [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]."

  # Cure illness
  bm_heal_ailment: "Исцеление кровью"
  bm_heal_ailment_desc: "Провести ритуал крови: [recipient.GetShortUINameNoTooltip] избавится от выбранной раны, болезни, старческого недуга или порока стресса."
  bm_heal_ailment_tooltip: "Провести исцеляющий ритуал магии крови."
  bm_heal_ailment_resource_requirement_tt: "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы один недуг персонажа [recipient.GetShortUINamePossessive]."
  NOT_bm_heal_ailment_resource_requirement_tt: "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы один недуг персонажа [recipient.GetShortUINamePossessive]."

  bm_duel_kill_bloodlust_toast: "Кровожадность: добыча поединка"
  bm_duel_kill_bloodlust_tt: "За победу в поединке получено #P +3#! опыта направления #V «Кровожадность»#! и добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"

  bm_battle_victory_lifeforce_toast: "Жатва крови на поле боя"
  bm_battle_victory_lifeforce_tt: "Из павших врагов на победном поле боя добыта [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]"
  bm_battle_victory_major_lifeforce_toast: "Великая жатва крови на поле боя"
  bm_battle_victory_major_lifeforce_tt: "Из кровавой бойни на победном поле боя добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_battle_victory_both_lifeforce_toast: "Эпическая жатва крови на поле боя"
  bm_battle_victory_both_lifeforce_tt: "Из чудовищной бойни на победном поле боя добыты и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]!"

  # Battle XP Toasts
  bm_battle_victory_commander_toast: "Кровожадность: победа полководца"
  bm_battle_victory_commander_t1_tt: "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t2_tt: "Умелая тактика принесла победу в напряжённом столкновении.\nПолучено #P +2#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t3_tt: "Крупная битва за спорные рубежи завершилась победой.\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t4_tt: "Искусное командование принесло победу в великой битве.\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t5_tt: "Ваше командование решило исход грандиозного столкновения народов!\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_victory_bloodlust_toast: "Кровожадность: победа в бою"
  bm_battle_victory_bloodlust_t1_tt: "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_bloodlust_t2_tt: "В напряжённой схватке победу принесла доблесть.\nПолучено #P +2#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_bloodlust_t3_tt: "Крупную битву удалось выиграть кровью и сталью.\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_bloodlust_t4_tt: "Великая битва завершилась победой на залитых кровью рубежах.\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_victory_bloodlust_t5_tt: "В этой грандиозной бойне из крови рождаются легенды!\nПолучено #P +3#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_defeat_commander_toast: "Кровожадность: закалка поражением"
  bm_battle_defeat_commander_t1_tt: "Стычка проиграна, но поле боя преподало ценные уроки.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t2_tt: "Ожесточённая схватка проиграна, но командование в трудную минуту укрепляет вашу решимость.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t3_tt: "Крупная битва проиграна. Тот, кто выживает в такой бойне, постигает тактику на собственном опыте.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t4_tt: "Огромная армия разбита на поле боя. Ваша кровь и разум закаляются в огне поражения.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t5_tt: "Вам удалось пережить страшный разгром! Ваш дух восстаёт из пепла несломленным.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  bm_battle_defeat_bloodlust_toast: "Кровожадность: закалка поражением"
  bm_battle_defeat_bloodlust_t1_tt: "Небольшая стычка проиграна, но ваши боевые инстинкты обострились.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_bloodlust_t2_tt: "Ожесточённая схватка проиграна. Боль закаляет ваше тело и открывает внутренний взор.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_bloodlust_t3_tt: "Удача отвернулась от вас в крупной битве, но стойкость в этой бойне закалила вас.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_bloodlust_t4_tt: "Сокрушительное поражение. Кровь, пролитая на поле боя, закаляет тело и дух.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"
  bm_battle_defeat_bloodlust_t5_tt: "Вам удалось пережить страшный разгром! Лишь истинные маги крови выживают в такой бойне и навсегда меняются после неё.\nПолучено #P +1#! опыта направления #V «Кровожадность»#! свойства [GetTrait('lifestyle_blood_mage').GetName(GetNullCharacter)]"

  # Bless Kin
  bm_bless_bloodline_interaction: "Благословить кровь"
  bm_bless_bloodline_interaction_desc: "Наполнить жизненной силой ребёнка, родича по династии или присягнувшего рыцаря, благословляя тело и разум."
  bm_recipient_already_blessed: "Кровь цели уже благословлена"
  NOT_bm_recipient_already_blessed: "Кровь цели уже благословлена"
  bm_bless_bloodline_toast: "Кровь благословлена"
  bm_bless_bloodline_toast_tt: "Кровь персонажа [recipient.GetShortUINamePossessive] наполнена жизненной силой."

  # Childbirth Milestones
  bm_birth_blood_mage_child_toast: "Родился наследник — маг крови"
  bm_birth_blood_mage_child_tt: "В ребёнке пробуждается свойство магии крови! Вы получаете большую жизненную силу, а ваше мастерство Родословной и Древности стремительно растёт."
  bm_birth_child_bloodline_toast: "Родился ребёнок вашего рода"
  bm_birth_child_bloodline_tt: "В вашем доме рождается ребёнок, даруя большую жизненную силу и опыт Родословной и Древности."
  bm_birth_mojo_consumed_toast: "Родовая сила передана при рождении"
  bm_birth_mojo_consumed_tt: "Израсходован 1 заряд родовой силы. Это даёт дополнительный опыт Родословной и повышает шанс пробуждения магии крови у ребёнка."

  # Tooltips
  IN_COURT_OR_IMPRISONED: "Можно исцелять только себя, свою семью, сюзерена, придворных или рыцарей"

  # Blood Curse
  bm_curse_blood_interaction: "Наложить проклятие крови"
  bm_curse_blood_interaction_desc: "[recipient.GetShortUINameNoTooltip] станет жертвой запретного проклятия магии крови, подтачивающего здоровье и вытягивающего жизненную сущность на расстоянии."
  bm_curse_blood.critical_success_title: "Жизненная сила похищена"
  bm_curse_blood.critical_success_desc: "Проклятие проникло глубоко в вены персонажа [recipient.GetShortUINamePossessive], вызвав тяжёлую болезнь и передав его жизненную силу вам."
  bm_curse_blood.success_title: "Проклятие крови наложено"
  bm_curse_blood.success_desc: "Кровь персонажа [recipient.GetShortUINamePossessive] связана злым проклятием магии крови. Здоровье и способности жертвы незаметно увядают."
  bm_curse_blood.fail_title: "Проклятие отражено"
  bm_curse_blood.fail_desc: "[recipient.GetShortUIName] противостоит вашему проклятию крови и узнаёт, кто пытался осквернить кровь."

  # Manifest Lifeforce Interaction
  bm_manifest_lifeforce_interaction: "Воплотить жизненную силу"
  bm_manifest_lifeforce_interaction_desc: "Войти в глубокий медитативный транс и преобразовать духовную мощь в осязаемую жизненную силу через состязание учёности."
  bm_manifest_lifeforce_requirement_tt: "Требуется 2-й уровень набожности и не менее 100 благочестия"
  NOT_bm_manifest_lifeforce_requirement_tt: "Требуется 2-й уровень набожности и не менее 100 благочестия"
  bm_manifest_lifeforce_cooldown_tt: "Воплощать жизненную силу можно только раз в год"
  NOT_bm_manifest_lifeforce_cooldown_tt: "Воплощать жизненную силу можно только раз в год"
  bm_manifest_lifeforce_interaction.tier1: "Скромная медитация (100 благочестия)"
  bm_manifest_lifeforce_interaction.tier1_desc: "Пожертвовать 100 благочестия ради +1 опыта Просветления.\nИсходные вероятности: малая жизненная сила (~33,0%), большая жизненная сила (~17,0%), неудача без результата (~33,0%) и критическая неудача с сильной отдачей (большой штраф, ~17,0%). Высокая учёность снижает общую вероятность неудачи до 4,0% (3% без результата / 1% критической отдачи) и повышает вероятность успеха."
  bm_manifest_lifeforce_interaction.tier2: "Сосредоточенное единение (250 благочестия)"
  bm_manifest_lifeforce_interaction.tier2_desc: "Пожертвовать 250 благочестия ради +3 опыта Просветления.\nИсходные вероятности: 1 порция большой жизненной силы (50,0%), 2 порции большой жизненной силы (25,0%), неудача без результата (17,0%) и критическая неудача со слабой отдачей (малый штраф, 8,0%). Высокая учёность снижает общую вероятность неудачи до 3,0% (2% без результата / 1% слабой отдачи) и повышает шанс получить 2 порции большой жизненной силы."
  bm_manifest_lifeforce_interaction.tier3: "Глубинный тигель (500 благочестия)"
  bm_manifest_lifeforce_interaction.tier3_desc: "Пожертвовать 500 благочестия ради +5 опыта Просветления.\nМалая жизненная сила гарантирована сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (15,0%) или дополнительную малую жизненную силу (35,0%). Высокая учёность повышает шанс получить 2 порции большой жизненной силы до 35,0%."
  bm_manifest_lifeforce_interaction.tier4: "Запредельное озарение (1000 благочестия)"
  bm_manifest_lifeforce_interaction.tier4_desc: "Пожертвовать 1000 благочестия ради +7 опыта Просветления.\nМалая жизненная сила и 1 порция большой жизненной силы гарантированы сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (35,0%) или высшую жизненную силу (15,0%). Высокая учёность повышает шанс получить высшую жизненную силу до 40,0%."

  # Character Interaction Category
  interaction_category_bm_blood_magic: "Магия крови"
  BM_BLOOD_MAGIC_ACTIONS: "Магия крови"
  interaction_category_bm_blood_magic_filter_tag_desc: "Взаимодействия магии крови"

  # Unified Blood Blessing Interaction
  bm_blood_blessing_interaction: "Благословение крови"
  bm_blood_blessing_interaction_desc: "Провести священный обряд крови над персонажем [recipient.GetShortUINameNoTooltip], чтобы наделить силой, защитить или освятить."
  bm_blood_blessing_interaction_tooltip: "Даровать сверхъестественные благословения, жизненную силу или тайные руны с помощью магии крови."
  bm_blood_blessing_interaction_requirement: "Необходимы жизненная сила или благочестие для хотя бы одного благословения."
  NOT_bm_blood_blessing_interaction_requirement: "У вас нет необходимой жизненной силы или благочестия для этого благословения."
  bm_blood_blessing_toast: "Благословение крови даровано"
  bm_blood_blessing_option_empower: "Усилить мага крови"
  bm_blood_blessing_option_empower_desc: "Направить жизненную силу в персонажа [recipient.GetShortUINameNoTooltip], чтобы развить оккультные или воинские направления образа жизни."
  bm_blood_blessing_option_grant_lifeforce: "Даровать жизненную силу"
  bm_blood_blessing_option_grant_lifeforce_desc: "Передать сгущённую жизненную или родовую силу персонажу [recipient.GetShortUINameNoTooltip] либо восстановить жизненную силу после недавнего вытягивания."
  bm_blood_blessing_option_bless_blood: "Благословить кровь"
  bm_blood_blessing_option_bless_blood_desc: "Наполнить жизненной силой ребёнка, родича по династии или присягнувшего рыцаря, благословляя навыки и стойкость."
  bm_blood_blessing_option_anoint_heir: "Помазать наследника"
  bm_blood_blessing_option_anoint_heir_desc: "Освятить избранного наследника или ребёнка большой порцией сгущённой жизненной силы, назначив преемником вашего наследия крови."
  bm_blood_blessing_option_consecrate_union: "Освятить союз"
