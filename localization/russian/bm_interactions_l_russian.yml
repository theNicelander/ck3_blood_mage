  bm_battle_victory_major_lifeforce_toast:0 "Великая жатва крови на поле боя"
  bm_battle_victory_major_lifeforce_tt:0 "Из кровавой бойни на победном поле боя добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_battle_victory_both_lifeforce_toast:0 "Эпическая жатва крови на поле боя"
  bm_battle_victory_both_lifeforce_tt:0 "Из чудовищной бойни на победном поле боя добыты и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]!"
  bm_battle_victory_commander_toast:0 "Рыцарь крови: победное командование"
  bm_battle_victory_commander_t1_tt:0 "Небольшая стычка завершилась победой.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t2_tt:0 "Тактическое командование принесло победу в напряжённом столкновении.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t3_tt:0 "Крупная битва завершилась победой на оспариваемых рубежах.\nПолучено #P +4#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t4_tt:0 "Искусное командование принесло победу в великой битве.\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t5_tt:0 "Ваше командование решило исход эпического столкновения народов!\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_toast:0 "Рыцарь крови: победная доблесть"
  bm_battle_victory_knight_t1_tt:0 "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t2_tt:0 "Доблесть принесла победу в напряжённом столкновении.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t3_tt:0 "Кровь и сталь принесли победу в крупной битве.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t4_tt:0 "Великая битва завершилась победой на залитых кровью рубежах.\nПолучено #P +4#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t5_tt:0 "Эпическая бойня, где легенды куются в крови!\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_toast:0 "Рыцарь крови: закалён поражением"
  bm_battle_defeat_commander_t1_tt:0 "Стычка проиграна, но поле боя преподало ценные уроки.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t2_tt:0 "Горькое столкновение проиграно, но командование под давлением закаляет решимость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t3_tt:0 "Крупная битва проиграна. Выживание в бойне дарует глубокую тактическую мудрость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t4_tt:0 "Великая армия разбита на поле боя. Ваша кровь и разум закаляются в огне поражения.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t5_tt:0 "Вы пережили эпическую катастрофу! Из пепла разрухи ваш дух восстаёт несломленным.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_toast:0 "Рыцарь крови: закалён поражением"
  bm_battle_defeat_knight_t1_tt:0 "Небольшая стычка проиграна, но ваши воинские инстинкты обостряются.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t2_tt:0 "Горькое столкновение проиграно. Пережитая боль закаляет тело и открывает внутренний взор.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t3_tt:0 "Крупная битва обернулась против вас, но стойкость в бойне дарует истинную выносливость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t4_tt:0 "Сокрушительное поражение. Кровь, пролитая на поле бойни, закаляет тело и дух.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t5_tt:0 "Вы пережили гибельное поражение! Только истинные рыцари крови уходят живыми из такой бойни, навсегда изменившись.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  grant_blood_magic_interaction.minor:0 "Магическая клятва крови (малая жизненная сила)"
  grant_blood_magic_interaction.minor_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]."
  grant_blood_magic_interaction.major:0 "Обряд кровного братства (большая жизненная сила)"
  grant_blood_magic_interaction.major_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E]."
  grant_blood_magic_interaction_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_bm_heal_ailment_resource_requirement_tt:0 "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы один недуг персонажа [recipient.GetShortUINamePossessive]."
  NOT_bm_recipient_already_blessed:0 "Кровь цели уже благословлена"
  bm_birth_blood_knight_child_toast:0 "Родился наследник — рыцарь крови"
  bm_birth_blood_knight_child_tt:0 "В жилах ребёнка пробуждается воинская кровь! Ваше мастерство Авангарда и Древности растёт."
