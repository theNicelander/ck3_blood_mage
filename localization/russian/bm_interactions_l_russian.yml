  NOT_make_blood_knight_interaction_knight_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
