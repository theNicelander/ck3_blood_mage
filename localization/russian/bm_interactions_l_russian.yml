  # Reverse lifedrained
  grant_lifeforce_interaction_reversed:0 "Обратить вытягивание жизненной силы"
  grant_lifeforce_interaction_reversed_desc:0 "На персонаже [recipient.GetShortUINameNoTooltip] действует [GetModifier('lifedrained_modifier').GetNameWithTooltip], но я могу вернуть отнятую жизненную силу"

  # Cure illness
  bm_heal_ailment:0 "Исцелить недуг"
  bm_heal_ailment_desc:0 "Провести ритуал крови: [recipient.GetShortUINameNoTooltip] избавится от выбранной раны, болезни или недуга."
  bm_heal_ailment_tooltip:0 "Провести исцеляющий ритуал магии крови."
  bm_heal_ailment_resource_requirement_tt:0 "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы один недуг персонажа [recipient.GetShortUINamePossessive]."

  # Blood Knight
  make_blood_knight_interaction:0 "Сделать рыцарем крови"
  make_blood_knight_interaction_desc:0 "[recipient.GetShortUINameNoTooltip] обретёт сверхъестественное свойство образа жизни «Рыцарь крови»."
  make_blood_knight_interaction.knight_minor:0 "Воинская клятва крови (малая жизненная сила)"
  make_blood_knight_interaction.knight_minor_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]."
  make_blood_knight_interaction.knight_major:0 "Обряд кровного братства (большая жизненная сила)"
  make_blood_knight_interaction.knight_major_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E]."
  make_blood_knight_interaction_knight_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_make_blood_knight_interaction_knight_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  empower_blood_knight_interaction:0 "Усилить рыцаря крови"
  empower_blood_knight_interaction_desc:0 "[recipient.GetShortUINameNoTooltip] получит сверхъестественную жизненную силу, развивающую воинские направления."
  empower_blood_knight_interaction.major:0 "Большая жизненная сила (+10 опыта во всех направлениях)"
  empower_blood_knight_interaction.minor:0 "Малая жизненная сила (+5 опыта во всех направлениях)"
  empower_blood_knight_interaction.cancel:0 "Отказаться без затрат"
  empower_blood_knight_interaction_requirement:0 "Для усиления рыцаря крови вам нужна либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."
  NOT_empower_blood_knight_interaction_requirement:0 "Для усиления рыцаря крови вам нужна либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]."

  bm_duel_kill_blood_knight_toast:0 "Кровавая расправа рыцаря крови"
  bm_duel_kill_blood_knight_tt:0 "За победу в единоборстве получено #P +5#! опыта в направлении #V «Бойня»#! и добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"

  bm_battle_victory_lifeforce_toast:0 "Жатва крови на поле боя"
  bm_battle_victory_lifeforce_tt:0 "Из павших врагов на победном поле боя добыта [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]"

  # Bless Kin
  bm_bless_bloodline_interaction:0 "Благословить кровь родича"
  bm_bless_bloodline_interaction_desc:0 "Наполнить ребёнка или родича вашего дома живительной магией крови, благословляя его тело и разум и совершенствуя ваше владение родословной."
  bm_recipient_already_blessed:0 "Кровь цели уже благословлена"
  bm_bless_bloodline_toast:0 "Кровь родича благословлена"
  bm_bless_bloodline_toast_tt:0 "Кровь персонажа [recipient.GetShortUINamePossessive] наполнена жизненной силой: дарована бодрость, а ваше владение родословной улучшено."

  # Childbirth Milestones
  bm_birth_blood_mage_child_toast:0 "Родился наследник — маг крови"
  bm_birth_blood_mage_child_tt:0 "В ребёнке пробуждается свойство магии крови! Вы получаете большую жизненную силу, а ваше владение родословной стремительно развивается."
  bm_birth_child_bloodline_toast:0 "Родился ребёнок вашего рода"
  bm_birth_child_bloodline_tt:0 "В вашем доме родился новый ребёнок, принёсший большую жизненную силу и опыт Родословной."

  # Tooltips
  IN_COURT_OR_IMPRISONED:0 "Можно исцелять только себя, свою семью, сюзерена, придворных или рыцарей"

  # Blood Curse
  bm_curse_blood_interaction:0 "Наложить проклятие крови"
  bm_curse_blood_interaction_desc:0 "[recipient.GetShortUINameNoTooltip] станет жертвой запретного проклятия магии крови, подтачивающего здоровье и вытягивающего жизненную сущность на расстоянии."
  bm_curse_blood.critical_success_title:0 "Жизненная сила похищена"
  bm_curse_blood.critical_success_desc:0 "Проклятие проникло глубоко в вены персонажа [recipient.GetShortUINamePossessive], вызвав тяжёлую болезнь и передав его жизненную силу вам."
  bm_curse_blood.success_title:0 "Проклятие крови наложено"
  bm_curse_blood.success_desc:0 "Кровь персонажа [recipient.GetShortUINamePossessive] связана злым проклятием магии крови. Здоровье и способности жертвы незаметно увядают."
  bm_curse_blood.fail_title:0 "Проклятие отражено"
  bm_curse_blood.fail_desc:0 "[recipient.GetShortUIName] противостоит вашему проклятию крови и узнаёт, кто пытался осквернить кровь."
  recipient_must_be_knight_tt:0 "[recipient.GetShortUIName] служит вам как [knight|E]"
  NOT_recipient_must_be_knight_tt:0 "[recipient.GetShortUIName] не служит вам как [knight|E]"
  NOT_IS_A_KNIGHT_OF_CHARACTER_TRIGGER:0 "Не служит как [knight|E] персонажу [CHARACTER.GetShortUIName|U]"
  bm_battle_victory_major_lifeforce_toast:0 "Великая жатва крови на поле боя"
  bm_battle_victory_major_lifeforce_tt:0 "Из кровавой бойни на победном поле боя добыта [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]"
  bm_battle_victory_both_lifeforce_toast:0 "Эпическая жатва крови на поле боя"
  bm_battle_victory_both_lifeforce_tt:0 "Из чудовищной бойни на победном поле боя добыты и [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip], и [GetModifier('lifeforce_modifier_major').GetNameWithTooltip]!"
  bm_battle_victory_commander_toast:0 "Рыцарь крови: победное командование"
  bm_battle_victory_commander_t1_tt:0 "Небольшая стычка завершилась победой.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t2_tt:0 "Тактическое командование принесло победу в напряжённом столкновении.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t3_tt:0 "Крупная битва завершилась победой на оспариваемых рубежах.\nПолучено #P +4#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t4_tt:0 "Искусное командование принесло победу в великой битве.\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_commander_t5_tt:0 "Ваше командование решило исход эпического столкновения народов!\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_toast:0 "Рыцарь крови: победная доблесть"
  bm_battle_victory_knight_t1_tt:0 "Небольшая стычка завершилась победой.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t2_tt:0 "Доблесть принесла победу в напряжённом столкновении.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t3_tt:0 "Кровь и сталь принесли победу в крупной битве.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t4_tt:0 "Великая битва завершилась победой на залитых кровью рубежах.\nПолучено #P +4#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_victory_knight_t5_tt:0 "Эпическая бойня, где легенды куются в крови!\nПолучено #P +5#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_toast:0 "Рыцарь крови: закалён поражением"
  bm_battle_defeat_commander_t1_tt:0 "Стычка проиграна, но поле боя преподало ценные уроки.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t2_tt:0 "Горькое столкновение проиграно, но командование под давлением закаляет решимость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t3_tt:0 "Крупная битва проиграна. Выживание в бойне дарует глубокую тактическую мудрость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t4_tt:0 "Великая армия разбита на поле боя. Ваша кровь и разум закаляются в огне поражения.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_commander_t5_tt:0 "Вы пережили эпическую катастрофу! Из пепла разрухи ваш дух восстаёт несломленным.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_toast:0 "Рыцарь крови: закалён поражением"
  bm_battle_defeat_knight_t1_tt:0 "Небольшая стычка проиграна, но ваши воинские инстинкты обостряются.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t2_tt:0 "Горькое столкновение проиграно. Пережитая боль закаляет тело и открывает внутренний взор.\nПолучено #P +1#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t3_tt:0 "Крупная битва обернулась против вас, но стойкость в бойне дарует истинную выносливость.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +1#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t4_tt:0 "Сокрушительное поражение. Кровь, пролитая на поле бойни, закаляет тело и дух.\nПолучено #P +2#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  bm_battle_defeat_knight_t5_tt:0 "Вы пережили гибельное поражение! Только истинные рыцари крови уходят живыми из такой бойни, навсегда изменившись.\nПолучено #P +3#! опыта направления #V «Авангард»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]\nПолучено #P +2#! опыта направления #V «Просветление»#! свойства [GetTrait('lifestyle_blood_knight').GetName(GetNullCharacter)]"
  grant_blood_magic_interaction.minor:0 "Магическая клятва крови (малая жизненная сила)"
  grant_blood_magic_interaction.minor_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]."
  grant_blood_magic_interaction.major:0 "Обряд кровного братства (большая жизненная сила)"
  grant_blood_magic_interaction.major_desc:0 "[recipient.GetShortUINameNoTooltip] пройдёт посвящение; потребуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E]."
  grant_blood_magic_interaction_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_grant_blood_magic_interaction_requirement:0 "Вам нужны либо [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 100 [piety|E], либо [GetModifier('lifeforce_modifier_minor').GetNameWithTooltip] и 250 [piety|E]"
  NOT_bm_heal_ailment_resource_requirement_tt:0 "У вас должно быть достаточно жизненной силы и благочестия, чтобы исцелить хотя бы один недуг персонажа [recipient.GetShortUINamePossessive]."
  NOT_bm_recipient_already_blessed:0 "Кровь цели уже благословлена"
  bm_birth_blood_knight_child_toast:0 "Родился наследник — рыцарь крови"
  bm_birth_blood_knight_child_tt:0 "В жилах ребёнка пробуждается кровь! Ваше мастерство Древности растёт."
  bm_birth_child_vanguard_toast:0 "Родился ребёнок вашего рода"
  bm_birth_child_vanguard_tt:0 "В вашем доме рождается ребёнок, увеличивая ваш опыт Древности."
  bm_manifest_lifeforce_interaction:0 "Воплотить жизненную силу"
  bm_manifest_lifeforce_interaction_desc:0 "Войти в глубокий медитативный транс и преобразовать духовную мощь в осязаемую жизненную силу через состязание учёности."
  bm_manifest_lifeforce_requirement_tt:0 "Требуется 2-й уровень набожности и не менее 100 благочестия"
  NOT_bm_manifest_lifeforce_requirement_tt:0 "Требуется 2-й уровень набожности и не менее 100 благочестия"
  bm_manifest_lifeforce_cooldown_tt:0 "Воплощать жизненную силу можно только раз в год"
  NOT_bm_manifest_lifeforce_cooldown_tt:0 "Воплощать жизненную силу можно только раз в год"
  bm_manifest_lifeforce_interaction.tier1:0 "Скромная медитация (100 благочестия)"
  bm_manifest_lifeforce_interaction.tier1_desc:0 "Пожертвовать 100 благочестия ради +1 опыта Просветления.\nИсходные вероятности: малая жизненная сила (~33,0%), большая жизненная сила (~17,0%), неудача без результата (~33,0%) и критическая неудача с сильной отдачей (большой штраф, ~17,0%). Высокая учёность снижает общую вероятность неудачи до 4,0% (3% без результата / 1% критической отдачи) и повышает вероятность успеха."
  bm_manifest_lifeforce_interaction.tier2:0 "Сосредоточенное единение (250 благочестия)"
  bm_manifest_lifeforce_interaction.tier2_desc:0 "Пожертвовать 250 благочестия ради +3 опыта Просветления.\nИсходные вероятности: 1 порция большой жизненной силы (50,0%), 2 порции большой жизненной силы (25,0%), неудача без результата (17,0%) и критическая неудача со слабой отдачей (малый штраф, 8,0%). Высокая учёность снижает общую вероятность неудачи до 3,0% (2% без результата / 1% слабой отдачи) и повышает шанс получить 2 порции большой жизненной силы."
  bm_manifest_lifeforce_interaction.tier3:0 "Глубинный тигель (500 благочестия)"
  bm_manifest_lifeforce_interaction.tier3_desc:0 "Пожертвовать 500 благочестия ради +5 опыта Просветления.\nМалая жизненная сила гарантирована сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (15,0%) или дополнительную малую жизненную силу (35,0%). Высокая учёность повышает шанс получить 2 порции большой жизненной силы до 35,0%."
  bm_manifest_lifeforce_interaction.tier4:0 "Запредельное озарение (1000 благочестия)"
  bm_manifest_lifeforce_interaction.tier4_desc:0 "Пожертвовать 1000 благочестия ради +7 опыта Просветления.\nМалая жизненная сила и 1 порция большой жизненной силы гарантированы сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (35,0%) или высшую жизненную силу (15,0%). Высокая учёность повышает шанс получить высшую жизненную силу до 40,0%."
