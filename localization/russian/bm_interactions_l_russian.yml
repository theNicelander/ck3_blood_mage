  bm_get_blood_magic_from_prisoner_interaction.fail:0 "Мне не удалось стать магом крови"
  bm_get_blood_magic_from_prisoner_interaction.desc:0 "Я поедаю плоть пленника, пытаясь обрести его магию крови"

  # Grant Lifeforce
  grant_lifeforce_interaction:0 "Даровать жизненную силу"
  grant_lifeforce_interaction_desc:0 "Передать вашу жизненную силу персонажу [recipient.GetShortUINameNoTooltip]."
