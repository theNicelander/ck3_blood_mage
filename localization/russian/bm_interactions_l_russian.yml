  grant_blood_magic_interaction_desc:0 "[recipient.GetShortUINameNoTooltip] обретёт сверхъестественное свойство образа жизни «Маг крови»."

  # Ask for blood magic
  ask_for_blood_magic_interaction:0 "Попросить дар магии крови"
