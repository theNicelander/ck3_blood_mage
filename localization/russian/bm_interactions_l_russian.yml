  bm_manifest_lifeforce_interaction.tier1:0 "Скромная медитация (100 благочестия)"
  bm_manifest_lifeforce_interaction.tier1_desc:0 "Пожертвовать 100 благочестия ради +1 опыта Просветления.\nИсходные вероятности: малая жизненная сила (~33,0%), большая жизненная сила (~17,0%), неудача без результата (~33,0%) и критическая неудача с сильной отдачей (большой штраф, ~17,0%). Высокая учёность снижает общую вероятность неудачи до 4,0% (3% без результата / 1% критической отдачи) и повышает вероятность успеха."
  bm_manifest_lifeforce_interaction.tier2:0 "Сосредоточенное единение (250 благочестия)"
  bm_manifest_lifeforce_interaction.tier2_desc:0 "Пожертвовать 250 благочестия ради +3 опыта Просветления.\nИсходные вероятности: 1 порция большой жизненной силы (50,0%), 2 порции большой жизненной силы (25,0%), неудача без результата (17,0%) и критическая неудача со слабой отдачей (малый штраф, 8,0%). Высокая учёность снижает общую вероятность неудачи до 3,0% (2% без результата / 1% слабой отдачи) и повышает шанс получить 2 порции большой жизненной силы."
  bm_manifest_lifeforce_interaction.tier3:0 "Глубинный тигель (500 благочестия)"
  bm_manifest_lifeforce_interaction.tier3_desc:0 "Пожертвовать 500 благочестия ради +5 опыта Просветления.\nМалая жизненная сила гарантирована сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (15,0%) или дополнительную малую жизненную силу (35,0%). Высокая учёность повышает шанс получить 2 порции большой жизненной силы до 35,0%."
  bm_manifest_lifeforce_interaction.tier4:0 "Запредельное озарение (1000 благочестия)"
  bm_manifest_lifeforce_interaction.tier4_desc:0 "Пожертвовать 1000 благочестия ради +7 опыта Просветления.\nМалая жизненная сила и 1 порция большой жизненной силы гарантированы сразу, без риска неудачи. Состязание учёности приносит 1 порцию большой жизненной силы (50,0%), 2 порции большой жизненной силы (35,0%) или высшую жизненную силу (15,0%). Высокая учёность повышает шанс получить высшую жизненную силу до 40,0%."
  interaction_category_bm_blood_magic:0 "Магия крови"
  BM_BLOOD_MAGIC_ACTIONS:0 "Магия крови"
  interaction_category_bm_blood_magic_filter_tag_desc:0 "Взаимодействия магии крови"
  grant_lifeforce_interaction.reverse_lifedrain:0 "Обратить вытягивание жизненной силы"
  grant_lifeforce_reverse_lifedrain_requirement:0 "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  NOT_grant_lifeforce_reverse_lifedrain_requirement:0 "Чтобы обратить вытягивание жизненной силы, требуется [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и 25 [piety|E]."
  bm_blood_blessing_interaction:0 "Благословение крови"
  bm_blood_blessing_interaction_desc:0 "Провести священный обряд крови над персонажем [recipient.GetShortUINameNoTooltip], чтобы наделить силой, защитить или освятить."
  bm_blood_blessing_interaction_tooltip:0 "Даровать сверхъестественные благословения, жизненную силу или тайные руны с помощью магии крови."
  bm_blood_blessing_interaction_requirement:0 "Необходимы жизненная сила или благочестие для хотя бы одного благословения."
  NOT_bm_blood_blessing_interaction_requirement:0 "У вас нет необходимой жизненной силы или благочестия для этого благословения."
  bm_blood_blessing_toast:0 "Благословение крови даровано"
  bm_blood_blessing_option_empower:0 "Усилить мага или рыцаря крови"
  bm_blood_blessing_option_empower_desc:0 "Направить жизненную силу в персонажа [recipient.GetShortUINameNoTooltip], чтобы развить оккультные или воинские направления образа жизни."
  bm_blood_blessing_option_grant_lifeforce:0 "Даровать жизненную силу"
  bm_blood_blessing_option_grant_lifeforce_desc:0 "Передать сгущённую жизненную силу персонажу [recipient.GetShortUINameNoTooltip] или восстановить её после недавнего вытягивания."
  bm_blood_blessing_option_bless_blood:0 "Благословить кровь"
  bm_blood_blessing_option_bless_blood_desc:0 "Наполнить жизненной силой ребёнка, родича по династии или присягнувшего рыцаря, благословляя навыки и стойкость."
  bm_blood_blessing_option_anoint_heir:0 "Помазать наследника"
  bm_blood_blessing_option_anoint_heir_desc:0 "Освятить избранного наследника или ребёнка большой порцией сгущённой жизненной силы, назначив преемником вашего наследия крови."
  bm_blood_blessing_option_consecrate_union:0 "Освятить союз"
  bm_blood_blessing_option_consecrate_union_desc:0 "Провести обряд крови над супругом, наложником или любовником, связав жизненную силу с союзом и повысив плодовитость и наследование врождённых свойств."
  bm_blood_blessing_option_inscribe_rune:0 "Начертать руну крови"
  bm_blood_blessing_option_inscribe_rune_desc:0 "Начертать или улучшить постоянную руну крови на персонаже [recipient.GetShortUINameNoTooltip]."
  bm_blood_drain_interaction:0 "Вытягивание крови"
  bm_blood_drain_interaction_desc:0 "Извлечь жизненную силу персонажа [recipient.GetShortUINameNoTooltip] запретными обрядами крови."
  bm_blood_drain_interaction_tooltip:0 "Собрать жизненную силу пленников, подданных, родичей или соперничающих магов."
  bm_blood_drain_interaction_requirement:0 "Вы должны иметь возможность извлечь жизненную силу этого персонажа."
  NOT_bm_blood_drain_interaction_requirement:0 "Вы не можете извлечь жизненную силу этого персонажа."
  bm_blood_drain_toast:0 "Жизненная сила извлечена"
  bm_blood_drain_option_major:0 "Большое вытягивание жизненной силы"
  bm_blood_drain_option_major_desc:0 "Провести смертельный сбор крови пленника, вырвав жизненную силу и сгустив её в большую порцию."
  bm_blood_drain_option_minor:0 "Малое вытягивание жизненной силы"
  bm_blood_drain_option_minor_desc:0 "Вытянуть часть жизненной силы придворного или пленника, ослабив жертву и получив малую жизненную силу."
  bm_blood_drain_option_stored:0 "Вытянуть запасённую жизненную силу"
  bm_blood_drain_option_stored_desc:0 "Извлечь сгущённые запасы жизненной силы прямо из крови персонажа [recipient.GetShortUINameNoTooltip] путём подчинения или оккультного поединка."
  bm_blood_drain_option_tithe:0 "Потребовать десятину крови"
  bm_blood_drain_option_tithe_desc:0 "Воспользоваться властью главы дома, чтобы извлечь жизненную силу взрослого родича."
