  bm_curse_blood.critical_success_title:0 "Жизненная сила похищена"
  bm_curse_blood.critical_success_desc:0 "Проклятие проникло глубоко в вены персонажа [recipient.GetShortUINamePossessive], вызвав тяжёлую болезнь и передав его жизненную силу вам."
  bm_curse_blood.success_title:0 "Проклятие крови наложено"
  bm_curse_blood.success_desc:0 "Кровь персонажа [recipient.GetShortUINamePossessive] связана злым проклятием магии крови. Здоровье и способности жертвы незаметно увядают."
  bm_curse_blood.fail_title:0 "Проклятие отражено"
  bm_curse_blood.fail_desc:0 "[recipient.GetShortUIName] противостоит вашему проклятию крови и узнаёт, кто пытался осквернить кровь."
