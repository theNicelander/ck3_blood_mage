l_russian:
  # Blood Mage Shield & Tier Harvest Toasts
  bm_blood_drain_shield_toast: "@bm_ancient_discipline_icon! Защита жизненной силы снята"
  bm_blood_drain_mage_harvest_toast: "@bm_ancient_discipline_icon! Сущность мага крови поглощена"

  # Decisions
  bm_forge_blood_artifact_decision: "Выковать артефакт крови"
  bm_forge_blood_artifact_decision_desc: "Свяжите большую жизненную силу со сталью, золотом или костью, чтобы создать личный артефакт крови, настроенный на одно из шести направлений. Только маги крови могут раскрыть всю его мощь."
  bm_forge_blood_artifact_decision_tooltip: "Выковать превосходный артефакт крови для любой ячейки снаряжения"
  bm_forge_blood_artifact_decision_confirm: "Начать ковку"
  bm_forge_blood_artifact_decision_effect_tt: "Выберите ячейку снаряжения и направление магии крови, чтобы выковать превосходный артефакт крови (расходует 1 большую жизненную силу, перерыв — 3 года)"

  bm_temper_blood_artifact_decision: "Вызвать Эгиля, чтобы закалить артефакт крови"
  bm_temper_blood_artifact_decision_desc: "Возьмите незакалённый артефакт крови и высшую жизненную силу в Рейкьявик или Цусиму, чтобы встретиться с Эгилем Скаллагримссоном. Победа превратит вашу реликвию в прославленный артефакт."
  bm_temper_blood_artifact_decision_tooltip: "Сразиться с Эгилем Скаллагримссоном, чтобы улучшить выкованный артефакт крови до прославленного"
  bm_temper_blood_artifact_decision_confirm: "Бросить вызов"
  bm_temper_blood_artifact_decision_effect_tt: "Выберите незакалённый артефакт крови и вызовите Эгиля на поединок доблести или учёности (расходует 1 высшую жизненную силу, перерыв — 5 лет)"

  NOT_bm_forge_artifact_cooldown_tt: "Артефакт крови не выковывался в последние 3 года"
  NOT_bm_temper_artifact_cooldown_tt: "Эгиль не вызывался на испытание закалки артефакта крови в последние 5 лет"

  # Events
  bm_blood_artifact.back: "Назад"
  bm_blood_artifact.0001.title: "Ковка артефакта крови: выбор основы"
  bm_blood_artifact.0001.desc: "Горнило гудит от пролитой крови и расплавленного металла. Прежде чем вложить большую жизненную силу, выберите форму будущего артефакта крови."
  bm_blood_artifact.0001.weapon: "Оружие (меч)"
  bm_blood_artifact.0001.regalia: "Регалии"
  bm_blood_artifact.0001.armor: "Доспехи"
  bm_blood_artifact.0001.crown: "Корона"
  bm_blood_artifact.0001.trinket: "Украшение (кольцо)"

  bm_blood_artifact.0002.title: "Ковка артефакта крови: выбор направления"
  bm_blood_artifact.0002.desc: "Основа обрела форму и остывает. Направьте большую жизненную силу через одно из шести направлений магии крови, чтобы закрепить её свойства."
  bm_blood_artifact.0002.radiance: "Сияние (дипломатия и мнение)"
  bm_blood_artifact.0002.fury: "Ярость (военное дело и доблесть)"
  bm_blood_artifact.0002.fortune: "Удача (управление и налоги)"
  bm_blood_artifact.0002.cunning: "Хитрость (интрига и происки)"
  bm_blood_artifact.0002.wisdom: "Мудрость (учёность и благочестие)"
  bm_blood_artifact.0002.ancient: "Древность (здоровье, долголетие и плодовитость)"

  bm_blood_artifact.0010.title: "Горнило Эгиля: выбор реликвии"
  bm_blood_artifact.0010.desc: "Эгиль Скаллагримссон замечает высшую жизненную силу, пылающую в ваших венах, и сплёвывает на дымящуюся землю. «Покажи мне, маг, что хочешь закалить. Покажи, чем готов рискнуть»."
  bm_blood_artifact.0010.opt1: "Закалить [bm_art_opt_1.GetName]"
  bm_blood_artifact.0010.opt2: "Закалить [bm_art_opt_2.GetName]"
  bm_blood_artifact.0010.opt3: "Закалить [bm_art_opt_3.GetName]"

  bm_blood_artifact.0011.title: "Горнило Эгиля: испытание"
  bm_blood_artifact.0011.desc: "Эгиль поднимает зазубренный топор одной рукой, а другой чертит светящуюся руну крови. «Закалишь [bm_temper_target.GetName] сталью и потом или испытаешь свою волю против моей в древних рунах?»"
  bm_blood_artifact.0011.prowess: "Сталь и кровь (поединок — доблесть)"
  bm_blood_artifact.0011.learning: "Руны и воля (магическое состязание — учёность)"
  bm_blood_artifact.0011.learning_win: "Вы одолеваете руны Эгиля и закаляете реликвию"
  bm_blood_artifact.0011.learning_loss: "Руны Эгиля нарушают вашу концентрацию"

  bm_blood_artifact_forged_toast: "@bm_ancient_discipline_icon! Артефакт крови выкован"
  bm_blood_artifact_tempered_toast: "@bm_ancient_discipline_icon! Артефакт крови закалён до прославленного"
  bm_blood_artifact_temper_failed_toast: "@bm_ancient_discipline_icon! Испытание Эгиля провалено"

