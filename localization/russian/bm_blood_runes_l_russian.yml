l_russian:
  bm_carve_galdrastafir_decision:0 "Начертать гальдрастав"
  bm_carve_galdrastafir_decision_desc:0 "Начертав на плоти высшую руну крови, свяжите с ней древний гальдрастав и пробудите его предельную мощь."
  bm_carve_galdrastafir_decision_tooltip:0 "Выбрать гальдрастав, чтобы получить постоянные усиления и уникальные высшие оккультные способности"
  BM_CARVE_GALDRASTAFIR_DECISION_NEXT_STEP_BUTTON:0 "Связать знак"
  bm_carve_galdrastafir_decision_confirm:0 "$BM_CARVE_GALDRASTAFIR_DECISION_NEXT_STEP_BUTTON$"
  bm_carve_galdrastafir_decision_effect:0 "Вы начертаете выбранный гальдрастав поверх высшей руны крови."
  bm_carve_galdrastafir_cooldown_tt:0 "За последние 5 лет гальдрастав не начертан и не заменён"
  NOT_bm_carve_galdrastafir_cooldown_tt:0 "За последние 5 лет гальдрастав не начертан и не заменён"
  bm_stave_already_carved_req:0 "Этот гальдрастав ещё не начертан на вашем теле"
  NOT_bm_stave_already_carved_req:0 "Этот гальдрастав ещё не начертан на вашем теле"
  bm_swap_stave_cost_req:0 "Для смены знака требуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 500#! благочестия"
  NOT_bm_swap_stave_cost_req:0 "Для смены знака требуются [GetModifier('lifeforce_modifier_major').GetNameWithTooltip] и #V 500#! благочестия"
  bm_carve_vegvisir:0 "Вегвизир — Путеводитель"
  bm_carve_vegvisir_tooltip:0 "Повышает скорость и безопасность путешествий, а также скорость передвижения армии.\n\n#weak Высшая способность:#! вдвое сокращает время восстановления #V Кровавой охоты#! и исключает неблагоприятные исходы опасностей в диких землях."
  bm_carve_aegishjalmur:0 "Эгисхьяльм — Шлем ужаса"
  bm_carve_aegishjalmur_tooltip:0 "Повышает доблесть, боевое преимущество и эффективность рыцарей.\n\n#weak Высшая способность:#! в начале битвы устрашает вражеских командиров и рыцарей, накладывая #N -5 доблести#! и #N -0.5 здоровья#! на 1 год."
  bm_carve_feingur:0 "Фейнгюр — Пробуждённое семя"
  bm_carve_feingur_tooltip:0 "Повышает плодовитость, продолжительность детородного возраста, шанс положительной наследственности, здоровье и сопротивляемость эпидемиям.\n\n#weak Высшая способность:#! удваивает опыт направлений за рождение детей и открывает взаимодействие #V «Благословить родословную династии»#!."
  bm_carve_nabrokarstafur:0 "Наброкарстав — Содранная десятина"
  bm_carve_nabrokarstafur_tooltip:0 "Повышает ежемесячный доход и снижает содержание профессиональных полков ценой общего мнения.\n\n#weak Высшая способность:#! приносит #P +20 золота#! за каждую посещённую достопримечательность и обращает #P 10%#! потерь в битве в золото (25–250)."
  bm_carve_hulinhjalmur:0 "Хулинхьяльм — Незримый покров"
  bm_carve_hulinhjalmur_tooltip:0 "Повышает шанс успеха враждебных происков, защиту от враждебных происков и ежемесячный опыт образа жизни.\n\n#weak Высшая способность:#! удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год и приносит #P 1 порцию большой жизненной силы#! за успешное убийство через происки."
  bm_inscribe_rune_other_interaction:0 "Начертать руну крови"
  bm_inscribe_rune_other_interaction_desc:0 "Начертать или улучшить постоянную руну крови на плоти этого персонажа. Она позволит пассивно собирать жизненную силу из окружающего мира; достигнув высшей ступени, персонаж сможет начертать собственный гальдрастав.\n\n#italic Даёт заклинателю опыт Благословения.#!"
  bm_inscribe_rune_other_requirement_tt:0 "Требуются благочестие, жизненная сила, уровень набожности и опыт направления, соответствующие следующей ступени руны."
  NOT_bm_inscribe_rune_other_requirement_tt:0 "Требуются благочестие, жизненная сила, уровень набожности и опыт направления, соответствующие следующей ступени руны."
  bm_blood_rune_cooldown:0 "Недавно начертана руна крови"
  bm_blood_rune_cooldown_desc:0 "Вы недавно начертали или улучшили оккультную руну крови на своей плоти. Магическим шрамам нужно время, чтобы зажить."
  bm_blood_rune_cooldown_tt:0 "За последние 3 года руна крови не начертана и не улучшена"
  NOT_bm_blood_rune_cooldown_tt:0 "За последние 3 года руна крови не начертана и не улучшена"
  bm_blood_rune_other_cooldown:0 "Недавно начертана руна крови на другом"
  bm_blood_rune_other_cooldown_desc:0 "Вы недавно начертали руну крови на другом персонаже и должны восстановить сосредоточение, прежде чем повторять обряд."
  bm_blood_rune_other_cooldown_tt:0 "В последнее время руна крови на другом персонаже не начертана"
  NOT_bm_blood_rune_other_cooldown_tt:0 "В последнее время руна крови на другом персонаже не начертана"
  bm_feingur_bless_dynasty_interaction:0 "Благословить родословную династии"
  bm_feingur_bless_dynasty_interaction_desc:0 "Призвать предельную мощь высшего Фейнгюра, чтобы навсегда вплести благословение жизненной силы, плодовитости и долголетия в кровь вашего ребёнка или родича по династии."
  bm_recipient_already_feingur_blessed:0 "Цель уже обладает постоянным благословением Фейнгюра."
  NOT_bm_recipient_already_feingur_blessed:0 "Цель уже обладает постоянным благословением Фейнгюра."
  bm_feingur_bless_dynasty_toast:0 "Родословная династии благословлена"
  bm_feingur_bless_dynasty_toast_tt:0 "[recipient.GetShortUIName] получает постоянное благословение Фейнгюра!"
  bm_nabrokarstafur_poi_toast:0 "Наброкарстав: достопримечательность разграблена"
  bm_nabrokarstafur_poi_toast_desc:0 "Ваш высший Наброкарстав добыл древние богатства этой достопримечательности: #P +20 золота#!"
  bm_nabrokarstafur_battle_gold_toast:0 "Наброкарстав: содранная добыча"
  bm_nabrokarstafur_battle_gold_tt:0 "Ваш высший Наброкарстав ограбил павших врагов, превратив бойню в #P золото#!."
  bm_hulinhjalmur_murder_lifeforce_toast:0 "Хулинхьяльм: жатва убийства"
  bm_hulinhjalmur_murder_lifeforce_tt:0 "Ваш высший Хулинхьяльм вытянул угасающую сущность жертвы убийства, даровав #P 1 порцию большой жизненной силы#!."
  bm_requires_superior_blood_rune_tt:0 "Требуется [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"
  NOT_bm_requires_superior_blood_rune_tt:0 "Требуется [GetModifier('superior_blood_rune_modifier').GetNameWithTooltip]"

  # Дополнительные строки
