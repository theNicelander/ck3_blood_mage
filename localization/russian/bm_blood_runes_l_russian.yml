l_russian:
  # Standalone Decision: Carve Galdrastafir Stave
  bm_carve_galdrastafir_decision: "Начертать гальдрастав"
  bm_carve_galdrastafir_decision_desc: "Начертав на плоти высшую руну крови, свяжите с ней древний гальдрастав и пробудите его предельную мощь."
  bm_carve_galdrastafir_decision_tooltip: "Выбрать гальдрастав, чтобы получить постоянные усиления и уникальные высшие оккультные способности"
  BM_CARVE_GALDRASTAFIR_DECISION_NEXT_STEP_BUTTON: "Связать знак"
  bm_carve_galdrastafir_decision_confirm: "$BM_CARVE_GALDRASTAFIR_DECISION_NEXT_STEP_BUTTON$"
  bm_carve_galdrastafir_decision_effect: "Вы начертаете выбранный гальдрастав поверх высшей руны крови."
  bm_carve_galdrastafir_toast: "Гальдрастав начертан"
  bm_carve_galdrastafir_cooldown_tt: "За последние 5 лет гальдрастав не начертан и не заменён"
  NOT_bm_carve_galdrastafir_cooldown_tt: "За последние 5 лет гальдрастав не начертан и не заменён"

  # 5 Stave Options
  bm_carve_vegvisir: "Вегвизир — Путеводитель"
  bm_carve_vegvisir_tooltip: "Повышает скорость и безопасность путешествий, а также скорость передвижения армии.\n\n#weak Высшая способность:#! вдвое сокращает время восстановления #V Кровавой охоты#! и исключает неблагоприятные исходы опасностей в диких землях."

  bm_carve_aegishjalmur: "Эгисхьяльм — Шлем ужаса"
  bm_carve_aegishjalmur_tooltip: "Повышает доблесть, боевое преимущество и эффективность рыцарей.\n\n#weak Высшая способность:#! в начале битвы устрашает вражеских командиров и рыцарей, накладывая #N -5 доблести#! и #N -0.5 здоровья#! на 1 год."

  bm_carve_feingur: "Фейнгюр — Пробуждённое семя"
  bm_carve_feingur_tooltip: "Повышает плодовитость, продолжительность детородного возраста, шанс положительной наследственности, здоровье и сопротивляемость эпидемиям.\n\n#weak Высшая способность:#! удваивает опыт направлений за рождение детей и открывает взаимодействие #V «Благословить родословную династии»#!."

  bm_carve_nabrokarstafur: "Наброкарстав — Содранная десятина"
  bm_carve_nabrokarstafur_tooltip: "Повышает ежемесячный доход и снижает содержание профессиональных полков ценой общего мнения.\n\n#weak Высшая способность:#! приносит #P +20 золота#! за каждую посещённую достопримечательность и обращает #P 10%#! потерь в битве в золото (25–250)."

  bm_carve_hulinhjalmur: "Хулинхьяльм — Незримый покров"
  bm_carve_hulinhjalmur_tooltip: "Повышает шанс успеха враждебных происков, защиту от враждебных происков и ежемесячный опыт образа жизни.\n\n#weak Высшая способность:#! удваивает ежегодный опыт настроенного направления до #P +2 опыта#! в год и приносит #P 1 порцию большой жизненной силы#! за успешное убийство через происки."

  # Interaction: Inscribe Rune on Other
  bm_inscribe_rune_other_interaction: "Начертать руну крови"
  bm_inscribe_rune_other_interaction_desc: "Начертать или улучшить постоянную руну крови на плоти этого персонажа. Она позволит пассивно собирать жизненную силу из окружающего мира; достигнув высшей ступени, персонаж сможет начертать собственный гальдрастав.\n\n#italic Даёт заклинателю опыт Благословения.#!"
  bm_inscribe_rune_other_requirement_tt: "Требуются благочестие, жизненная сила, уровень набожности и опыт направления, соответствующие следующей ступени руны."
  NOT_bm_inscribe_rune_other_requirement_tt: "Требуются благочестие, жизненная сила, уровень набожности и опыт направления, соответствующие следующей ступени руны."

  # Cooldowns
  bm_blood_rune_cooldown: "Недавно начертана руна крови"
  bm_blood_rune_cooldown_desc: "Вы недавно начертали или улучшили оккультную руну крови на своей плоти. Магическим шрамам нужно время, чтобы зажить."
  bm_blood_rune_cooldown_tt: "За последние 3 года руна крови не начертана и не улучшена"
  NOT_bm_blood_rune_cooldown_tt: "За последние 3 года руна крови не начертана и не улучшена"

  bm_blood_rune_other_cooldown: "Недавно начертана руна крови на другом"
  bm_blood_rune_other_cooldown_desc: "Вы недавно начертали руну крови на другом персонаже и должны восстановить сосредоточение, прежде чем повторять обряд."
  bm_blood_rune_other_cooldown_tt: "В последнее время руна крови на другом персонаже не начертана"
  NOT_bm_blood_rune_other_cooldown_tt: "В последнее время руна крови на другом персонаже не начертана"

  # Interaction: Feingur Bless Dynasty
  bm_feingur_bless_dynasty_interaction: "Благословить родословную династии"
  bm_feingur_bless_dynasty_interaction_desc: "Призвать предельную мощь высшего Фейнгюра, чтобы навсегда вплести благословение жизненной силы, плодовитости и долголетия в кровь вашего ребёнка или родича по династии."
  bm_recipient_already_feingur_blessed: "Цель уже обладает постоянным благословением Фейнгюра."
  NOT_bm_recipient_already_feingur_blessed: "Цель уже обладает постоянным благословением Фейнгюра."
  bm_feingur_bless_dynasty_toast: "Родословная династии благословлена"
  bm_feingur_bless_dynasty_toast_tt: "[recipient.GetShortUIName] получает постоянное благословение Фейнгюра!"

  # Toasts & Tooltips
  bm_nabrokarstafur_poi_toast: "Наброкарстав: достопримечательность разграблена"
  bm_nabrokarstafur_poi_toast_desc: "Ваш высший Наброкарстав добыл древние богатства этой достопримечательности: #P +20 золота#!"
  bm_nabrokarstafur_battle_gold_toast: "Наброкарстав: содранная добыча"
  bm_nabrokarstafur_battle_gold_tt: "Ваш высший Наброкарстав ограбил павших врагов, превратив бойню в #P золото#!."
  bm_hulinhjalmur_murder_lifeforce_toast: "Хулинхьяльм: жатва убийства"
  bm_hulinhjalmur_murder_lifeforce_tt: "Ваш высший Хулинхьяльм вытянул угасающую сущность жертвы убийства, даровав #P 1 порцию большой жизненной силы#!."
