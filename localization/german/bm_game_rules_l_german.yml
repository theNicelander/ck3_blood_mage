l_german:
  game_rule_category_blood_mages: "@bm_game_rule_icon! Blutmagier"
  rule_bm_lore: "Welt der Blutmagier"
  setting_bm_lore_historical: "Historisch"
  setting_bm_lore_historical_desc: "Verwendet den Kult der Quintessenz mit seinem religiösen Erbe der historischen Spielwelt und seinem Netzwerk heiliger Stätten."
  setting_bm_lore_agot: "Das Lied von Eis und Feuer"
  setting_bm_lore_agot_desc: "Wenn das Begleitmodul Blood Mages - AGOT Religions geladen ist, werden die Kulte der historischen Spielwelt durch weltgetreue Traditionen der Sieben, der Alten Götter, des Ertrunkenen Gottes, R'hllors, der Rhoyne und Valyrias ersetzt."
  rule_bm_physical_alteration: "Erscheinungsbild der Blutmagier"
  setting_bm_physical_alteration_none: "Keine Veränderung"
  setting_bm_physical_alteration_none_desc: "Blutmagie verändert weder die Augen- noch die Haarfarbe eines Blutmagiers."
  setting_bm_physical_alteration_eyes: "Nur Augen"
  setting_bm_physical_alteration_eyes_desc: "Blutmagie verändert mit zunehmender Meisterschaft schrittweise die Augenfarbe eines Blutmagiers, lässt das Haar jedoch unverändert."
  setting_bm_physical_alteration_eyes_hair: "Augen und Haare"
  setting_bm_physical_alteration_eyes_hair_desc: "Blutmagie verändert schrittweise die Augen eines Blutmagiers und lässt mit zunehmender Meisterschaft dessen Haar weiß werden."
  rule_bm_initiation_faith_requirement: "Glaube für die Blutmagier-Initiation"
  setting_bm_initiation_dedicated_cult: "Eigener Blutkult"
  setting_bm_initiation_dedicated_cult_desc: "Nur Anhänger des Kults der Quintessenz oder eines ausdrücklich als Blutmagiekult gekennzeichneten Glaubens können das Initiationsritual durchführen."
  setting_bm_initiation_cult_or_witchcraft_accepted: "Blutkult oder Hexerei akzeptiert"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "Charaktere können das Initiationsritual durchführen, wenn sie dem Kult der Quintessenz, einem ausdrücklich als Blutmagiekult gekennzeichneten Glauben oder einem Glauben folgen, der Hexerei akzeptiert."
  rule_quintessence_religion: "Religion der Blutmagier"
  setting_quintessence_religion_enabled: "Aktiviert"
  setting_quintessence_religion_enabled_desc: "Die Entscheidung, einen Blutmagier-Glauben anzunehmen, ist möglich."
  setting_quintessence_religion_disabled: "Deaktiviert"
  setting_quintessence_religion_disabled_desc: "Die Entscheidung, einen Blutmagier-Glauben anzunehmen, ist deaktiviert."
  setting_quintessence_religion_enabled_player_only: "Nur für Spieler"
  setting_quintessence_religion_enabled_player_only_desc: "Nur Spieler können die Entscheidung treffen, einen Blutmagier-Glauben anzunehmen."
