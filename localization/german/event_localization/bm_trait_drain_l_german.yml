l_german:
 bm_trait_drain.001.b: "Dieser scharfe Verstand könnte mir nützen."
 bm_trait_drain.001.c: "Ich könnte stärker werden..."
 bm_trait_drain.001.d: "Was für eine Schönheit... Warum sollte sie nicht die meine sein?"
 bm_trait_drain.001.desc: "Der Gefangene kniet vor Euch, die Augen weit vor Entsetzen, während karmesinrote Runen auf dem Boden der Kammer aufflammen. Seine Bitten um Gnade verstummen zu einem Flüstern, als Ihr Euch nähert und mit den Fingern arkane Muster in die Luft zeichnet. Ihr spürt, was ihn besonders macht – jenen Funken des Verstandes, jene körperliche Kraft, jene unheimliche Schönheit –, wie ein Leuchtfeuer unter seiner Haut, das nach Eurer Macht ruft.\n\nBlutmagie verlangt ein Opfer, und seine einzigartigen Gaben werden bald Euch gehören. Erwartung liegt schwer in der Luft, während die Ranken Eures Bewusstseins nach ihm greifen und sich darauf vorbereiten, das Gewünschte zu entreißen. Seine Lippen beben und formen verzweifelte Worte:\n\n„Bitte ... alles, nur das nicht ...“\n\nDoch Ihr wisst es besser. Seine Essenz wird Euch weit besser dienen, als sein Fleisch es je vermochte."
 bm_trait_drain.001.e: "Ausgezeichnet."
 bm_trait_drain.001.f: "Welch stattliche Größe ... Wie die Welt von dort oben wohl aussieht?"
 bm_trait_drain.001.fail: "Es gelingt mir nicht, seine Gabe zu rauben"
 bm_trait_drain.001.g: "Sein Blut ist köstlich..."
 bm_trait_drain.001.h: "Diese Kraft könnte mir sehr nützen."
 bm_trait_drain.001.nice: "Ausgezeichnet."
 bm_trait_drain.001.success: "Ich reiße seine Gabe an mich"
 bm_trait_drain.001.title: "Die Essensernte" #deepl:83850483
 bm_trait_drain.001.z: "Lass sie gehen..." #deepl:3514667144
