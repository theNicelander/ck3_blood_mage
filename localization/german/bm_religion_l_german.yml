  # Religion family
  rf_quintessence: "Quintessenz"
  rf_quintessence_desc: "Glaubensrichtungen, die die Beherrschung der im Blut getragenen lebenswichtigen Essenz anstreben."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] Meinung"

  # Core Terms - Religion
  quintessence_religion: "Kult der Quintessenz"
  quintessence_religion_adj: "Quintessenz"
  quintessence_religion_adherent: "Quintessenzialist"
  quintessence_religion_adherent_plural: "Quintessenzialisten"
  quintessence_religion_desc: "Der Kult der Quintessenz betrachtet die ursprüngliche Lebenskraft, die alle Wesen durchströmt, nicht als göttlich, sondern als die höchste Quelle der Macht. Durch verbotene Blutrituale und wohlbedachte Opfer gewinnen, formen und nutzen seine Anhänger diese Essenz, um die Grenzen der Sterblichkeit zu überwinden. Anders als herkömmliche Glaubensrichtungen, die Gottheiten verehren, sehen sich Quintessenzialisten als künftige Gebieter über den Urstoff der Existenz."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "Kult der Quintessenz"
  quintessence_faith_adj: "Quintessenz"
  quintessence_faith_adherent: "Quintessentialist"
  quintessence_faith_adherent_plural: "Quintessentialisten"
  quintessence_faith_desc: "Christliche Quintessentialisten verkünden, dass das auf Golgatha vergossene Blut ein tieferes Geheimnis enthüllte: Das Leben selbst ist ein heiliger Strom, der ausgegossen, empfangen und gemeistert werden kann. Sie interpretieren die Passion, die Märtyrer und die Eucharistie anhand einer verbotenen purpurnen Theologie und lehren, dass jeder Herzschlag das Opfer Christi widerspiegelt und dass diejenigen, die das Geheimnis des Blutes verstehen, die Zerbrechlichkeit des sterblichen Fleisches überwinden können."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Islamische Quintessenzialisten bestehen darauf, dass allein Allah göttlich ist, während das Blut eine Amanah darstellt – ein heiliges Gut, das jedem lebenden Körper anvertraut wurde. Sie behaupten, Propheten, Ärzte und Mystiker hätten jeweils einen Teil seines verborgenen Gesetzes erkannt. Durch disziplinierte Riten, Fasten und sorgfältig bemessene Opfer könnten die Gläubigen den Lebensstrom meistern und sich zugleich der in die Schöpfung eingeschriebenen Ordnung unterwerfen."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Jüdische Quintessenzialisten folgen der alten Lehre, dass das Leben des Fleisches im Blut liegt. Sie betrachten den Bund, die Beschneidung und die Erinnerung an das Tempelopfer als Fragmente einer verborgenen Disziplin und sind der Ansicht, dass Blut sowohl das Erbe der Generationen als auch die Verpflichtungen in sich trägt, die ein Volk verbinden. Über dieses Erbe zu gebieten bedeutet in ihren Augen, den tiefsten Strom der Schöpfung zu berühren."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Östliche Quintessentialisten beschreiben die Quintessenz als den Lebensstrom, der sich durch Samsara bewegt: Atem, Blut, Karma und Bewusstsein sind in einem einzigen Kreislauf vereint. Manche nennen es Prana, während andere es als Mittel verstehen, Anhaftungen zu lösen oder karmische Lasten zu reinigen. Alle lehren, dass anspruchsvolle Riten diesen Strom in Richtung Erwachen, Langlebigkeit und endgültige Befreiung lenken können."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Sinitische Quintessentialisten sind der Ansicht, dass Blut das dichteste Gefäß von qi ist, von den Vorfahren geerbt und unter dem Himmel geordnet. Indem sie die Meridiane des Körpers nachzeichnen, die Toten ehren und Opfer gegen Harmonie abwägen, versuchen sie, die vererbte Essenz zu verfeinern, anstatt sie zu verschwenden. Ein perfektionierter Kreislauf soll Körper, Abstammung und Kosmos in einer einzigen purpurnen Ordnung vereinen."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Ásatrú-Quintessenzialisten lehnen fremde Zugeständnisse ab und erkennen den karmesinroten Strom in Odins Prüfung, der Kampfwut der Einherjar und dem beim Blót vergossenen Blut. Wer mit einem Ziel tötet oder stirbt, setzt Macht für Sippe, Land und Götter frei; Krieg ist Sakrament, Opfer ist Tausch, und die Quintessenz gehört denen, die kühn genug sind, sie zu ergreifen."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Unter den Anhängern der alten Götter gilt Blut als die erste Sprache, die zwischen Sterblichen, Vorfahren und Geistern gesprochen wurde. Quintessentialisten bewahren den Eid, das Opfer und das Opferfest, lehren aber, dass diese Riten mehr tun, als unsichtbare Mächte zu besänftigen: Sie öffnen Kanäle, durch die Kraft vom Tier zum Krieger, von den Toten zu den Lebenden und vom Land zu seinem auserwählten Volk übergeht."
