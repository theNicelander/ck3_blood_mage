l_german:
 bm_blood_mage_story:0 "Blutmagie"
 bm_blood_mage_story_desc:0 "Euer Blut ist Grimoire und Schmelztiegel zugleich. Jeder Ritus vertieft Eure Beherrschung einer Disziplin der karmesinroten Kunst."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help Jede Disziplin erreicht bei 100 Erfahrung die Meisterschaft. Bewegt den Mauszeiger über eine Disziplin, um ihre Fortschrittsregeln anzuzeigen.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Blutgolems"
 BM_CRIMSON_RETINUE:0 "Karmesinrote Krieger und Champions"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Aktualisiert die Blutgolems, Karmesinroten Krieger und Karmesinroten Champions, die derzeit an Eurem Hof dienen"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Aktualisiert die in dieser Geschichtenanzeige gezeigten Charakterlisten"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Keine"
 bm_blood_mage_lifeforce_major:0 "Lebenskraft: #P Großer Vorrat#!"
 bm_blood_mage_lifeforce_minor:0 "Lebenskraft: #V Kleiner Vorrat#!"
 bm_blood_mage_lifeforce_negative_major:0 "Lebenskraft: #N Stark erschöpft#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Lebenskraft: #N Erschöpft#!"
 bm_blood_mage_lifeforce_none:0 "Lebenskraft: #weak Nicht manifestiert#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Lebenskraftstapel#! — #P Groß#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Klein#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Lebenskraft#!\nKleine und große Lebenskraft sind getrennte, stapelbare Vorräte, die durch Lebensentzug und andere Riten gewonnen werden. Blutmagische Fähigkeiten geben an, welchen Vorrat sie verbrauchen; ein Zauber entfernt normalerweise den erforderlichen Stapel und kann Eure Lebenskraft vorübergehend erschöpfen.\n\nSolange sie nicht verbraucht werden, verbessern alle Stapel Gesundheit, Fruchtbarkeit, Lebenserwartung und Seuchenwiderstand. Ein großer Stapel gewährt dreimal so starke Überlebensvorteile wie ein kleiner."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Einstimmung#!: #weak Keine#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Lebenskraft-Einstimmung#!\nGebt durch die Selbstinteraktion #V Lebenskraft-Einstimmung#! eine kleine Lebenskraft und 25 Frömmigkeit aus, um eine Disziplin der Blutmagie zu wählen. Ihr könnt nur eine Einstimmung aufrechterhalten; eine neue ersetzt die bisherige, und die Interaktion hat eine Abklingzeit von fünf Jahren.\n\nJedes Jahr hat die eingestimmte Disziplin eine Chance von 50 %, #P 1 Erfahrung#! zu erhalten. Ihr Einstimmungsmodifikator gewährt außerdem einen disziplinspezifischen passiven Vorteil."
