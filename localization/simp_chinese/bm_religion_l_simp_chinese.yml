  holy_order_knights_of_the_crimson_chalice: "猩红圣杯骑士团"
  holy_order_custodians_of_the_vital_essence: "生命本质的守护者"
  holy_order_crimson_covenant: "猩红契约"
  holy_order_sanguine_disciples: "鲜血门徒"
