  holy_order_bloodbound_sentinels: "血缚哨兵"
  holy_order_scarlet_vanguard: "猩红先锋"

  # Religion family
  rf_quintessence: "精粹"
  rf_quintessence_desc: "寻求掌握血液中所携带的生命本质的信仰。"
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] 意见"

  # Core Terms - Religion
  quintessence_religion: "精粹教派"
  quintessence_religion_adj: "精粹"
  quintessence_religion_adherent: "精粹主义者"
  quintessence_religion_adherent_plural: "精粹主义者"
  quintessence_religion_desc: "精粹教派并不把流经众生的原初生命力视为神性，而将其看作至高权能的源泉。信徒通过禁忌的鲜血仪式和精心衡量的献祭来提取、操纵并驾驭这种精粹，从而超越凡人的局限。与崇拜神祇的传统信仰不同，精粹主义者自视为终将掌控存在根基之人。"
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "精粹教派"
  quintessence_faith_adj: "精粹"
  quintessence_faith_adherent: "精粹主义者"
  quintessence_faith_adherent_plural: "精粹主义者"
  quintessence_faith_desc: "基督教精粹主义者宣称，基督在各各他流下的鲜血揭示了更深的奥秘：生命本身便是一股可以倾注、承接与驾驭的神圣洪流。他们以禁忌的猩红神学诠释受难、殉道者与圣体圣事，教导每一次心跳都回荡着基督的牺牲，而领悟鲜血奥秘之人能够克服凡俗肉身的脆弱。"
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "伊斯兰精粹主义者坚持唯有安拉具有神性，而鲜血是一项阿曼纳——托付于每个生命体内的神圣信托。他们认为先知、医者与神秘主义者都曾窥见其隐秘法则的一角；信徒则可通过严谨的仪式、斋戒与精确衡量的献祭，在服从造物秩序的同时驾驭生命洪流。"
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "犹太精粹主义者以“肉体的生命在血中”这一古老教诲为起点。他们把圣约、割礼以及对圣殿献祭的记忆视为隐秘修持的残篇，并相信鲜血既承载世代相传的遗产，也承载维系族群的义务。在他们看来，支配这份传承便是触及造物最深处的洪流。"
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "东方精粹主义者将精粹描述为贯穿轮回的生命洪流：呼吸、鲜血、业力与意识彼此相系，循环不息。有人称其为普拉纳，也有人把它视为放下执著或洗净业障的途径。他们都教导，严苛的仪式能够引导这股洪流通往觉悟、长寿与最终的解脱。"
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "华夏精粹主义者认为，鲜血是承载气最为浓厚的容器，受之于先祖，循天道而有序。通过探察人体经脉、敬奉亡者，并在献祭与和谐之间求得平衡，他们力求炼化继承而来的精粹，而非任其流失。据说，完美的循环能将肉身、血脉与寰宇统合于同一道猩红秩序之中。"
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "阿萨特鲁精粹主义者拒绝向外来信仰妥协，并在奥丁的试炼、英灵战士的狂怒以及布洛特祭典所流的鲜血中认出猩红洪流。为明确的目的杀戮或赴死，会为氏族、土地和诸神释放力量；战争即圣礼，献祭即交换，而精粹属于有胆量将其驾驭之人。"
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "在古老诸神的追随者中，鲜血被铭记为凡人、先祖与灵魂之间最初的语言。精粹主义者保留誓言、供奉与献祭宴席，却教导这些仪式不只是在安抚无形的力量：它们会打开通道，让力量从野兽流向战士、从死者流向生者，也从土地流向其选民。"
