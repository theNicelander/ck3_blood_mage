l_simp_chinese:
 bm_blood_mage_story:0 "鲜血魔法"
 bm_blood_mage_story_desc:0 "你的血液既是魔典，也是熔炉。每一场仪式都会加深你对一种猩红技艺的掌握。"
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help 每项修行在获得100点经验时达到精通。将鼠标悬停在修行上即可查看其成长规则。#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!：#V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!：#V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!：#V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!：#V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!：#V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "血魔像"
 BM_CRIMSON_RETINUE:0 "猩红战士与勇士"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "刷新当前在你宫廷效力的血魔像、猩红战士和猩红勇士名单"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "刷新此故事面板中显示的人物名单"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "无"
 bm_blood_mage_lifeforce_major:0 "生命力：#P 充沛储备#!"
 bm_blood_mage_lifeforce_minor:0 "生命力：#V 少量储备#!"
 bm_blood_mage_lifeforce_negative_major:0 "生命力：#N 严重枯竭#!"
 bm_blood_mage_lifeforce_negative_minor:0 "生命力：#N 枯竭#!"
 bm_blood_mage_lifeforce_none:0 "生命力：#weak 未显现#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt 生命力层数#! — #P 大型#!：#V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V 小型#!：#V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading 生命力#!\n小型与大型生命力是彼此独立、可以叠加的储备，通过汲取生命和其他仪式获得。血魔法能力会说明消耗哪种储备；施法通常会移除所需层数，并可能暂时耗竭你的生命力。\n\n只要尚未消耗，每层都会提高健康、生育力、预期寿命和疾病抗性。一个大型层数提供的生存收益是一个小型层数的三倍。"
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt 调谐#!：#weak 无#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading 生命力调谐#!\n通过#V 生命力调谐#!自我互动消耗一层小型生命力和25虔诚，选择一项血魔法修行。你只能维持一种调谐；选择新的调谐会取代当前调谐，此互动有五年冷却时间。\n\n每年，所调谐的修行有50%的概率获得#P 1点经验#!。其调谐修正还会提供该修行独有的被动增益。"
