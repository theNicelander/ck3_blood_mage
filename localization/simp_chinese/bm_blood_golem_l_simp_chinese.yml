 blood_golem.002.complete: "完成仪式，让泥巨人为我服务" #deepl:1237508337
 blood_golem.002.complete.tooltip: "您的血球将保持原样，其当前特性将永久绑定" #deepl:821444266
 blood_golem.002.desc: "你的血球站在你面前，等待着进一步的完善。通过你的血魔法，你可以增强你创造物的各个方面，使其更好地为你的目的服务。" #deepl:1478487296
