l_simp_chinese:
 blood_golem.001.a: "起来吧，我的创造物。你的旅程才刚刚开始。" #deepl:3087892187
 blood_golem.001.desc: "仪式法阵已经完成，由你的鲜血与稀有炼金材料混合绘成。法阵中央立着一具粗糙的人形，以红土、河泥与骨粉塑就。当你念出咒语的最后几个音节，鲜血从伸出的双手流入泥塑。\n\n起初毫无动静。随后，泥塑忽然颤抖起来。裂纹遍布其表面，渗出微弱的猩红光芒。人形开始移动，黏土逐渐重塑出清晰的人类五官。关节缓缓弯曲，手指随之舒展，最后由泥土雕成的眼睑睁开，露出两颗闪耀的猩红眼眸。\n\n血魔像踉跄着迈出第一步，随后在你面前跪下。它的嘴唇纹丝不动，声音却直接在你的意识中响起——那是由你的鲜血凝成、如今获得了心智的低语。\n\n“造物主...我生来便为侍奉。”"
 blood_golem.001.title: "血与泥的诞生" #deepl:2091135995
 blood_golem.002.athletic: "赋予身体敏捷性" #deepl:707351949
