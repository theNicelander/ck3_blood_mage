l_simp_chinese:
 bm_blood_rune_decision: "铭刻血符文" #deepl:3737120221
 bm_blood_rune_decision_confirm: "开始血色铭文" #deepl:4124455472
 bm_blood_rune_decision_desc: "用古老的血液魔法在你的肉体上刻上永久的符文，增强你与生命力的联系。这些神秘的纹身可以让你被动地获取周围的生命能量，随着时间的推移增强你的力量。" #deepl:815936124
 bm_blood_rune_decision_tooltip: "在你的身体上永久刻上能产生生命力的血液符文" #deepl:3594712456
 bm_crimson_rune.001.desc: "你展开古老的卷轴，上面描绘着错综复杂的力量图案--血色符文将法师自己的身体转化为采集生命力的容器。这个仪式需要用淬过血的火焰锻造的特殊针头，混合了你自身精华的墨水，以及一个明白每条线都不仅仅是画出来的，而是与你的本体紧密相连的人的稳定的手。然而随着每一滴血和墨水融入你的肉体 你与深红艺术的联系就会加深这些印记是血魔法师真正掌握血魔法的标志--他们不仅仅是血魔法的施法者，更是血魔法的化身。" #deepl:37387575
 bm_crimson_rune.001.major: "主要深红符文--流淌在我肉体上的力量网络" #deepl:2349098484
 bm_crimson_rune.001.minor: "小深红符文--我心上的脉动符文" #deepl:3026977512
 bm_crimson_rune.001.superior: "高级深红符文--将我的皮肤变成活生生的血魔法书" #deepl:3284087262
 bm_crimson_rune.001.title: "铭刻血色符文" #deepl:40768940
 bm_crimson_rune.001.z: "我现在的标记已经足够了" #deepl:1287242383
 bm_crimson_rune_yearly_event_popup.title: "你的深红符文赋予你生命力" #deepl:2384530305
 crimson_runes_effects_list.effects_list: "获得逐级增强的鲜血符文（每一级都会取代上一级）：\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('minor_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('major_crimson_rune_modifier').GetNameWithTooltip]\n#indent_newline: $EFFECT_LIST_BULLET$ [GetModifier('superior_crimson_rune_modifier').GetNameWithTooltip]"
 major_crimson_rune_modifier: "主要深红符文" #deepl:523788520
 major_crimson_rune_modifier_desc: "这些复杂的符文有时会从周围收集[GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]，偶尔还会迸发出[GetModifier('lifeforce_modifier_major').GetNameWithTooltip]。在极少数情况下，两者会同时汇聚。\n\n精致的猩红纹身如活着的血管般蜿蜒过你的躯干与手臂，不断汲取周围的生命精粹，并将其导入你的魔力储备。"
 minor_crimson_rune_modifier: "次要深红符文" #deepl:502427400
 minor_crimson_rune_modifier_desc: "这些基础的鲜血符号偶尔会为你收集[GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]。\n\n覆盖心口的血蚀奥术符号在皮肤下微微搏动，如同第二颗缓慢跳动的心脏，将周围的生命力吸入体内。"
 superior_crimson_rune_modifier: "高级深红符文" #deepl:599601596
 superior_crimson_rune_modifier_desc: "这些精妙绝伦的鲜血铭文常会自行吸引[GetModifier('lifeforce_modifier_minor').GetNameWithTooltip]，也会频繁捕获[GetModifier('lifeforce_modifier_major').GetNameWithTooltip]，有时甚至让两种力量同时显现。\n\n精湛的鲜血铭文覆盖你的要害，有时会如同拥有生命一般在皮肤下游移。你的身体已成为生命力永不停息的通道，连呼吸的空气都能化作力量。"
