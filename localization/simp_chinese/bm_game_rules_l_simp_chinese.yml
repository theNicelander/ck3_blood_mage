l_simp_chinese:
  game_rule_category_blood_mages: "@bm_game_rule_icon! 血法师"
  rule_bm_blood_mage_prevalence: "血法师普遍程度"
  setting_bm_prevalence_player_only: "仅玩家"
  setting_bm_prevalence_player_only_desc: "只有玩家控制的角色可以获得血法师特质。AI角色无法通过任何方式获得，包括自然出现与遗传。"
  setting_bm_prevalence_extremely_rare: "极其罕见"
  setting_bm_prevalence_extremely_rare_desc: "将AI获取血魔法的决策与互动权重乘以0.01（默认值的百分之一）。AI角色保留10%自然生成或遗传的血法师特质。"
  setting_bm_prevalence_rare: "罕见"
  setting_bm_prevalence_rare_desc: "将AI获取血魔法的决策与互动权重乘以0.10（默认值的十分之一）。AI角色保留40%自然生成或遗传的血法师特质。"
  setting_bm_prevalence_uncommon: "不常见"
  setting_bm_prevalence_uncommon_desc: "将AI获取血魔法的决策与互动权重乘以0.50（默认值的一半）。AI角色保留70%自然生成或遗传的血法师特质。"
  setting_bm_prevalence_default: "默认"
  setting_bm_prevalence_default_desc: "使用原有的血法师自然出现、遗传、仪式与互动频率。"
  setting_bm_prevalence_more_frequent: "更频繁"
  setting_bm_prevalence_more_frequent_desc: "将AI获取血魔法的决策与互动权重乘以2.00。AI新生儿从一名血法师父母处遗传的概率约为50%，自然出现的概率约为1.25%。"
  rule_bm_lore: "血法师世界观"
  setting_bm_lore_historical: "历史世界"
  setting_bm_lore_historical_desc: "启用精粹教派及其适配历史世界的宗教传承与圣地网络。"
  setting_bm_lore_agot: "权力的游戏"
  setting_bm_lore_agot_desc: "加载 Blood Mages - AGOT Religions 配套模组后，将历史世界的教派替换为符合七神、旧神、淹神、拉赫洛、洛恩河与瓦雷利亚设定的传统。"
  rule_bm_physical_alteration: "血法师外貌"
  setting_bm_physical_alteration_none: "无改变"
  setting_bm_physical_alteration_none_desc: "血魔法不会改变血法师的眼睛或头发颜色。"
  setting_bm_physical_alteration_eyes: "仅眼睛"
  setting_bm_physical_alteration_eyes_desc: "随着血魔法造诣提升，血法师的眼睛颜色会逐渐改变，但头发保持不变。"
  setting_bm_physical_alteration_eyes_hair: "眼睛与头发"
  setting_bm_physical_alteration_eyes_hair_desc: "随着血魔法造诣提升，血法师的眼睛会逐渐改变，并在造诣更高时令头发变白。"
  rule_bm_initiation_faith_requirement: "血法师入门信仰"
  setting_bm_initiation_dedicated_cult: "专属鲜血教派"
  setting_bm_initiation_dedicated_cult_desc: "只有精粹教派或被明确标记为血魔法教派的信仰追随者才能使用入门仪式。"
  setting_bm_initiation_cult_or_witchcraft_accepted: "鲜血教派或接受巫术"
  setting_bm_initiation_cult_or_witchcraft_accepted_desc: "精粹教派、被明确标记为血魔法教派的信仰或接受巫术的信仰追随者均可使用入门仪式。"
  rule_quintessence_religion: "血法师宗教"
  setting_quintessence_religion_enabled: "启用"
  setting_quintessence_religion_enabled_desc: "接受血法师信仰的决定已经启用。"
  setting_quintessence_religion_disabled: "禁用"
  setting_quintessence_religion_disabled_desc: "接受血法师信仰的决定已被禁用。"
  setting_quintessence_religion_enabled_player_only: "仅限玩家"
  setting_quintessence_religion_enabled_player_only_desc: "只有玩家可以使用这个决定来拥抱血法师信仰。"
