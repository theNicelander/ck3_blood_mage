l_simp_chinese:
 bm_trait_drain.001.b: "这般敏锐的头脑，正可为我所用。"
 bm_trait_drain.001.c: "我还能变得更强..."
 bm_trait_drain.001.d: "何等美貌...为何不能归我所有？"
 bm_trait_drain.001.desc: "囚犯跪在你面前。密室地面上的猩红符文逐一亮起，惊恐映在那双睁大的眼睛里。你缓步逼近，手指在空中勾勒奥秘图案；求饶声随之低落成细语。你感受到令其与众不同的一切——智慧的火花、强健的体魄、摄人心魄的美貌——正在皮肤之下搏动，如同召唤你力量的灯塔。\n\n鲜血魔法需要牺牲，而这些独特的天赋很快就会属于你。意识的触须缓缓伸展，准备抽取你所渴求之物，空气也因期待而凝滞。囚犯双唇颤抖，挤出绝望的哀求：\n\n“求你了...怎样都好，唯独不要这个...”\n\n但你心知肚明。其精粹会比那具血肉更好地为你效力。"
 bm_trait_drain.001.e: "妙极。"
 bm_trait_drain.001.f: "真是高大...不知从那般高度俯瞰，世界会是什么模样？"
 bm_trait_drain.001.fail: "我没能夺走其天赋"
 bm_trait_drain.001.g: "这鲜血真是甘美..."
 bm_trait_drain.001.h: "这份力量正可为我所用。"
 bm_trait_drain.001.nice: "妙极。"
 bm_trait_drain.001.success: "我夺走了其天赋"
 bm_trait_drain.001.title: "精华收获" #deepl:83850483
 bm_trait_drain.001.z: "让他们走..." #deepl:3514667144
