l_korean:
 blood_golem.001.a: "나의 피조물아, 일어나거라. 당신의 여정은 이제 막 시작되었습니다." #deepl:3087892187
 blood_golem.001.desc: "희귀한 연금술 재료와 당신의 피로 그린 의식진이 완성되었습니다. 한가운데에는 붉은 점토와 강의 진흙, 뼛가루를 빚어 만든 투박한 인간 형상이 서 있습니다. 주문의 마지막 구절을 외우자 뻗은 손에서 피가 흘러 점토 형상으로 스며듭니다.\n\n처음에는 아무 일도 일어나지 않습니다. 이윽고 점토 몸체가 떨리기 시작합니다. 표면에 균열이 번지며 희미한 진홍빛이 새어 나오고, 움직이는 점토는 더욱 뚜렷한 인간의 모습을 갖춥니다. 관절이 천천히 굽고 손가락이 움직인 뒤, 마침내 점토로 빚은 눈꺼풀이 열리며 빛나는 진홍색 눈동자가 드러납니다.\n\n피의 골렘은 비틀거리며 첫걸음을 내딛고 당신 앞에 무릎을 꿇습니다. 입은 움직이지 않지만, 이제 의식을 얻은 당신의 피가 속삭이는 목소리가 정신 속에 직접 울립니다.\n\n‘창조주여... 저는 섬기기 위해 살아갑니다.’"
 blood_golem.001.title: "피와 점토의 탄생" #deepl:2091135995
 blood_golem.002.athletic: "물리적 민첩성 부여" #deepl:707351949
 blood_golem.002.berserker: "전투의 분노를 불어넣다" #deepl:2196988672
 blood_golem.002.blademaster: "전투 숙련도 향상" #deepl:1517527460
 blood_golem.002.complete: "의식을 완료하고 골렘을 내 서비스에 묶어두세요." #deepl:1237508337
 blood_golem.002.complete.tooltip: "피의 골렘은 현재 특성이 영구적으로 묶인 채로 그대로 유지됩니다." #deepl:821444266
 blood_golem.002.desc: "여러분의 피의 골렘이 여러분 앞에 서서 더 다듬어지기를 기다리고 있습니다. 피의 마법을 통해 창조물의 다양한 측면을 강화하여 원하는 목적에 더 잘 부합하도록 조형할 수 있습니다." #deepl:1478487296
 blood_golem.002.fail: "향상 실패" #deepl:2724257223
 blood_golem.002.fail_crit: "강화가 치명적으로 실패합니다." #deepl:3130801215
 blood_golem.002.hunter: "사냥 본능을 심어주세요" #deepl:803255364
 blood_golem.002.physique: "형태 강화" #deepl:4042764175
 blood_golem.002.prowess: "능력 교육 부여" #deepl:1990095406
 blood_golem.002.success: "블러드 골렘 강화" #deepl:2195912952
 blood_golem.002.title: "블러드 골렘 강화" #deepl:2724719626
 blood_golem.002.viking: "습격 정신 부여" #deepl:1251793142
 blood_golem_creation_decision: "피의 골렘 생성" #deepl:1599828115
 blood_golem_creation_decision_confirm: "피가 흐르는 흙에 생명을 불어넣다" #deepl:3779183793
 blood_golem_creation_decision_desc: "고대 고서에는 흙으로 만들어지고 생명의 정수로 살아 움직이는 서번트에 대해 이야기합니다. 강력한 마법의 힘이 필요한 복잡한 의식을 통해 자신의 생명력을 인공적인 형태에 묶어 존재 자체가 자신의 피와 연결된 충성스러운 하인을 만들 수 있습니다. 이 피의 골렘은 수호자이자 도구로 사용되며, 필멸의 서번트보다 훨씬 강력한 능력을 지닌 당신의 의지의 연장선상에 있습니다. 이 의식은 상당한 생명력을 소모하지만, 이러한 존재를 창조함으로써 여러분은 피의 마법을 통해 의식의 선물을 부여할 수 있는 진정한 혈술의 대가로 인정받게 됩니다." #deepl:1389326690
 blood_golem_creation_decision_tooltip: "당신의 피의 정수에 묶인 중생을 만들어 흔들림 없는 충성으로 당신을 섬기게 하세요." #deepl:3431592503
 blood_golem_creation_decision_tt: "경건함을 희생해서라도 더 강한 전사를 만들 수 있습니다." #deepl:3693251110
 blood_golem_creator: "블러드 크리에이터" #deepl:3001359713
 blood_golem_creator_desc: "이 캐릭터는 피의 마법을 통해 저에게 생명을 불어넣어 주었습니다." #deepl:2852492382
