l_korean:
 bm_blood_mage_story:0 "피의 마법"
 bm_blood_mage_story_desc:0 "당신의 피는 마도서이자 도가니입니다. 의식을 거듭할 때마다 진홍빛 기예의 한 분야가 더욱 깊어집니다."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help 각 분야는 경험치 100에서 숙련에 도달합니다. 분야 위에 마우스를 올리면 성장 규칙을 확인할 수 있습니다.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "혈액 골렘"
 BM_CRIMSON_RETINUE:0 "진홍빛 전사와 챔피언"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "현재 궁정에서 복무하는 혈액 골렘, 진홍빛 전사, 진홍빛 챔피언 목록을 새로 고칩니다"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "이 이야기 패널에 표시된 인물 목록을 새로 고칩니다"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "없음"
 bm_blood_mage_lifeforce_major:0 "생명력: #P 주요 비축량#!"
 bm_blood_mage_lifeforce_minor:0 "생명력: #V 소량 비축량#!"
 bm_blood_mage_lifeforce_negative_major:0 "생명력: #N 심각하게 고갈됨#!"
 bm_blood_mage_lifeforce_negative_minor:0 "생명력: #N 고갈됨#!"
 bm_blood_mage_lifeforce_none:0 "생명력: #weak 발현되지 않음#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt 생명력 중첩#! — #P 주요#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V 소량#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading 생명력#!\n소량 생명력과 주요 생명력은 생명 흡수와 다른 의식을 통해 얻는 별개의 중첩 가능한 비축량입니다. 혈마법 능력에는 어떤 비축량을 소모하는지 표시되며, 주문을 사용하면 보통 필요한 중첩이 제거되고 생명력이 일시적으로 고갈될 수 있습니다.\n\n소모하지 않은 각 중첩은 건강, 수태력, 기대 수명, 질병 저항을 향상시킵니다. 주요 중첩은 소량 중첩의 세 배에 해당하는 생존 혜택을 제공합니다."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt 조율#!: #weak 없음#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading 생명력 조율#!\n#V 생명력 조율#! 자기 상호작용으로 소량 생명력 하나와 신앙심 25를 소모해 혈마법 분야 하나를 선택합니다. 조율은 하나만 유지할 수 있으며 새 조율을 선택하면 기존 조율이 교체되고, 상호작용에는 5년의 재사용 대기시간이 있습니다.\n\n매년 조율한 분야는 50% 확률로 #P 경험치 1#!을 얻습니다. 조율 변화 요소는 해당 분야에 특화된 지속 효과도 제공합니다."
