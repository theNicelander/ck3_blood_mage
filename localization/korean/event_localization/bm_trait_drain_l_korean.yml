l_korean:
 bm_trait_drain.001.b: "저 날카로운 지성은 쓸모가 있겠군."
 bm_trait_drain.001.c: "더 강해질 수 있겠어..."
 bm_trait_drain.001.d: "참으로 아름답군... 저 아름다움을 내가 갖지 못할 이유가 있나?"
 bm_trait_drain.001.desc: "죄수가 당신 앞에 무릎을 꿇습니다. 방바닥의 진홍빛 룬이 타오르자 크게 뜬 두 눈에 공포가 서립니다. 당신이 다가가 손가락으로 허공에 비전의 문양을 그리자, 자비를 구하던 목소리는 속삭임으로 잦아듭니다. 번뜩이는 지성, 육체의 기량, 기묘한 아름다움처럼 그를 특별하게 만드는 자질들이 당신의 힘을 부르는 등불처럼 피부 아래에서 맥동하는 것이 느껴집니다.\n\n피의 마법에는 희생이 필요하며, 그의 특별한 재능은 곧 당신의 것이 될 것입니다. 의식의 촉수가 뻗어 나가 원하는 것을 뽑아낼 준비를 하는 동안 공기는 기대감으로 무거워집니다. 죄수의 입술이 떨리며 절박한 말을 토해 냅니다.\n\n‘제발... 이것만은 안 됩니다...’\n\n하지만 당신은 알고 있습니다. 그의 육신보다 정수가 훨씬 더 유용하리라는 것을."
 bm_trait_drain.001.e: "훌륭하군."
 bm_trait_drain.001.f: "대단한 키로군... 저 높은 곳에서는 세상이 어떻게 보일까?"
 bm_trait_drain.001.fail: "그의 재능을 빼앗는 데 실패한다"
 bm_trait_drain.001.g: "그의 피는 참으로 감미롭군..."
 bm_trait_drain.001.h: "저 힘은 유용하게 쓸 수 있겠어."
 bm_trait_drain.001.nice: "훌륭하군."
 bm_trait_drain.001.success: "그의 재능을 빼앗는다"
 bm_trait_drain.001.title: "에센스 수확" #deepl:83850483
 bm_trait_drain.001.z: "보내주세요..." #deepl:3514667144
