  # Religion family
  rf_quintessence: "정수"
  rf_quintessence_desc: "피에 담긴 생명의 본질에 대한 지배력을 추구하는 신앙입니다."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] 의견"

  # Core Terms - Religion
  quintessence_religion: "정수 숭배"
  quintessence_religion_adj: "정수주의"
  quintessence_religion_adherent: "정수주의자"
  quintessence_religion_adherent_plural: "정수주의자"
  quintessence_religion_desc: "정수 숭배는 모든 존재 안을 흐르는 원초적 생명력을 신성 그 자체가 아니라 권능의 궁극적인 원천으로 여깁니다. 추종자들은 금단의 혈 의식과 치밀하게 계산된 희생을 통해 이 정수를 뽑아내고 다루어 필멸의 한계를 초월하고자 합니다. 신을 숭배하는 전통적인 신앙과 달리, 정수주의자들은 스스로를 존재의 근원을 지배할 자로 여깁니다."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "정수 숭배"
  quintessence_faith_adj: "정수주의"
  quintessence_faith_adherent: "정수주의자"
  quintessence_faith_adherent_plural: "정수주의자"
  quintessence_faith_desc: "기독교 정수주의자들은 갈보리에서 흘린 피가 더 깊은 신비를 드러냈다고 선포합니다. 생명 자체가 흘려보내고, 받아들이고, 지배할 수 있는 신성한 흐름이라는 것입니다. 그들은 금단의 진홍빛 신학으로 수난과 순교자, 성찬을 해석하며, 모든 심장 박동은 그리스도의 희생을 되울리고 피의 신비를 깨우친 자는 필멸의 육신이 지닌 나약함을 넘어설 수 있다고 가르칩니다."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "이슬람 정수주의자들은 오직 알라만이 신성하며, 피는 모든 생명체에 맡겨진 성스러운 아마나라고 주장합니다. 예언자와 의사, 신비주의자들은 그 숨은 법칙을 저마다 일부씩 엿보았다고 하며, 신도는 엄격한 의식과 단식, 세심하게 헤아린 희생을 통해 창조에 새겨진 질서에 복종하면서도 생명의 흐름을 다스릴 수 있다고 믿습니다."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "유대교 정수주의자들은 육체의 생명이 피에 있다는 오래된 가르침에서 출발합니다. 그들은 언약과 할례, 성전 제사의 기억을 감춰진 수행법의 단편으로 여기며, 피에는 세대를 잇는 유산과 한 민족을 결속하는 의무가 함께 흐른다고 믿습니다. 그 유산을 다스리는 것은 곧 창조의 가장 깊은 흐름에 닿는 일입니다."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "동방의 정수주의자들은 정수를 윤회를 가로지르는 생명의 흐름으로 설명합니다. 호흡과 피, 업과 의식이 하나의 순환으로 이어져 있다는 것입니다. 어떤 이들은 이를 프라나라 부르고, 다른 이들은 집착을 내려놓거나 업의 짐을 씻는 수단으로 이해합니다. 모두가 엄격한 의식을 통해 이 흐름을 깨달음과 장수, 궁극적인 해탈로 돌릴 수 있다고 가르칩니다."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "중화권의 정수주의자들은 피가 기를 가장 짙게 품은 그릇이며, 조상에게서 물려받아 천도의 질서를 따른다고 믿습니다. 몸의 경락을 살피고 망자를 공경하며 희생과 조화의 균형을 맞춤으로써, 물려받은 정수를 낭비하지 않고 정련하려 합니다. 완전한 순환은 몸과 혈통, 우주를 하나의 진홍빛 질서로 묶는다고 전해집니다."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "아사트루 정수주의자들은 외래 신앙과의 타협을 거부하고, 오딘의 시련과 에인헤랴르의 전투 광기, 블로트에서 흘린 피 속에 진홍빛 흐름이 깃들어 있다고 봅니다. 목적을 위해 죽이거나 죽는 행위는 씨족과 땅, 신들에게 힘을 풀어놓습니다. 전쟁은 성례이고 희생은 교환이며, 정수는 이를 거머쥘 만큼 대담한 자의 것입니다."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "옛 신들을 따르는 이들은 피를 필멸자와 조상, 영혼 사이에서 오간 최초의 언어로 기억합니다. 정수주의자들은 맹세와 봉헌, 희생의 연회를 지키면서도, 이 의식들이 보이지 않는 힘을 달래는 데 그치지 않는다고 가르칩니다. 그것들은 짐승에서 전사로, 죽은 자에서 산 자로, 땅에서 선택받은 백성으로 힘이 흐르는 통로를 엽니다."
