l_spanish:
 bm_blood_mage_story:0 "Magia de sangre"
 bm_blood_mage_story_desc:0 "Tu sangre es a la vez grimorio y crisol. Cada rito ahonda tu dominio de una disciplina del arte carmesí."
 BM_BLOOD_MAGE_INFORMATION_STRING:0 "$BM_BLOOD_MAGE_DISCIPLINE_GRID$\n[GetPlayer.Custom('BM_BLOOD_MAGE_LIFEFORCE_DISPLAY')]\n[GetPlayer.Custom('BM_BLOOD_MAGE_ATTUNEMENT_DISPLAY')]\n\n#help Cada disciplina alcanza la maestría con 100 de experiencia. Pasa el cursor sobre una disciplina para ver sus reglas de progreso.#!"
 BM_BLOOD_MAGE_DISCIPLINE_GRID:0 "#size:15 #tooltip:trait_track_ancient_desc @bm_ancient_discipline_icon! $trait_track_ancient$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_ancient_xp_value')|0]/100#!   #tooltip:trait_track_enlightenment_desc @bm_enlightenment_discipline_icon! $trait_track_enlightenment$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_enlightenment_xp_value')|0]/100#!   #tooltip:trait_track_bloodline_desc @bm_bloodline_discipline_icon! $trait_track_bloodline$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_bloodline_xp_value')|0]/100#!\n#tooltip:trait_track_benediction_desc @bm_benediction_discipline_icon! $trait_track_benediction$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_benediction_xp_value')|0]/100#!   #tooltip:trait_track_hematurgy_desc @bm_hematurgy_discipline_icon! $trait_track_hematurgy$#!: #V [GetPlayer.MakeScope.ScriptValue('bm_blood_mage_hematurgy_xp_value')|0]/100#!#!"
 BM_OWNED_BLOOD_GOLEMS:0 "Gólems de sangre"
 BM_CRIMSON_RETINUE:0 "Guerreros y campeones carmesíes"
 BM_REFRESH_BLOOD_MAGIC_ROSTERS_TT:0 "Actualiza la lista de Gólems de sangre, Guerreros carmesíes y Campeones carmesíes que sirven actualmente en tu corte"
 BM_REFRESH_STORY_CHARACTER_LISTS_TT:0 "Actualiza las listas de personajes que aparecen en este panel de historia"
 BM_BLOOD_MAGIC_ROSTER_EMPTY:0 "Ninguno"
 bm_blood_mage_lifeforce_major:0 "Fuerza vital: #P Reserva mayor#!"
 bm_blood_mage_lifeforce_minor:0 "Fuerza vital: #V Reserva menor#!"
 bm_blood_mage_lifeforce_negative_major:0 "Fuerza vital: #N Gravemente agotada#!"
 bm_blood_mage_lifeforce_negative_minor:0 "Fuerza vital: #N Agotada#!"
 bm_blood_mage_lifeforce_none:0 "Fuerza vital: #weak No manifestada#!"
 bm_blood_mage_lifeforce_stacks:0 "#tooltip:bm_blood_mage_lifeforce_tt Acumulaciones de fuerza vital#! — #P Mayores#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_major_stacks').GetValue|0]#!    #V Menores#!: #V [GetPlayer.MakeScope.Var('bm_lifeforce_minor_stacks').GetValue|0]#!"
 bm_blood_mage_lifeforce_tt:0 "#tooltip_heading Fuerza vital#!\nLa fuerza vital menor y mayor son reservas separadas y acumulables que se obtienen mediante el drenaje vital y otros ritos. Las habilidades de magia de sangre indican qué reserva consumen; lanzar un hechizo normalmente elimina la acumulación necesaria y puede agotar temporalmente tu fuerza vital.\n\nMientras no se gaste, cada acumulación mejora la salud, la fertilidad, la esperanza de vida y la resistencia a enfermedades. Una acumulación mayor otorga tres veces los beneficios de supervivencia de una menor."
 bm_blood_mage_attunement_ancient:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #V $trait_track_ancient$#!"
 bm_blood_mage_attunement_enlightenment:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #V $trait_track_enlightenment$#!"
 bm_blood_mage_attunement_bloodline:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #V $trait_track_bloodline$#!"
 bm_blood_mage_attunement_benediction:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #V $trait_track_benediction$#!"
 bm_blood_mage_attunement_hematurgy:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #V $trait_track_hematurgy$#!"
 bm_blood_mage_attunement_none:0 "#tooltip:bm_blood_mage_attunement_tt Sintonía#!: #weak Ninguna#!"
 bm_blood_mage_attunement_tt:0 "#tooltip_heading Sintonía de fuerza vital#!\nGasta una fuerza vital menor y 25 de Piedad mediante la interacción personal #V Sintonía de fuerza vital#! para elegir una disciplina de magia de sangre. Solo puedes mantener una Sintonía; elegir otra reemplaza la actual y la interacción tiene un tiempo de reutilización de cinco años.\n\nCada año, la disciplina sintonizada tiene un 50 % de probabilidad de obtener #P 1 de experiencia#!. Su modificador de Sintonía también otorga una ventaja pasiva propia de esa disciplina."
