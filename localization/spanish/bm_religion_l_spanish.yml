  # Religion family
  rf_quintessence: "Quintaesencia"
  rf_quintessence_desc: "Creencias que buscan el dominio sobre la esencia vital transportada en la sangre."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] Opinión"

  # Core Terms - Religion
  quintessence_religion: "Culto a la quintaesencia"
  quintessence_religion_adj: "quintaesencialista"
  quintessence_religion_adherent: "quintaesencialista"
  quintessence_religion_adherent_plural: "quintaesencialistas"
  quintessence_religion_desc: "El Culto de la Quintaesencia percibe la fuerza vital primordial que fluye a través de todos los seres no como divina, sino como la máxima moneda de poder. A través de rituales de sangre prohibidos y sacrificios calculados, sus seguidores extraen, manipulan y aprovechan esta esencia para trascender las limitaciones de la mortalidad. A diferencia de las religiones convencionales que adoran a deidades, los quintaesencialistas se ven a sí mismos como aspirantes a maestros del sustrato fundamental de la existencia."
  bm_quintessence_identity_group_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_name: "$quintessence_religion$"
  bm_quintessence_identity_doctrine_desc: "$quintessence_religion_desc$"
  # Core Terms - Faith
  quintessence_faith: "Culto a la quintaesencia"
  quintessence_faith_adj: "quintaesencialista"
  quintessence_faith_adherent: "quintaesencialista"
  quintessence_faith_adherent_plural: "quintaesencialistas"
  quintessence_faith_desc: "Los quintaesencialistas cristianos proclaman que la sangre derramada en el Calvario reveló un misterio más profundo: la vida misma es una corriente sagrada que puede verterse, recibirse y dominarse. Interpretan la Pasión, los mártires y la Eucaristía mediante una teología carmesí prohibida, y enseñan que cada latido hace eco del sacrificio de Cristo y que quienes comprenden el misterio de la sangre pueden superar la fragilidad de la carne mortal."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "Los quintaesencialistas islámicos insisten en que sólo Alá es divino, mientras que la sangre es un amanah, un depósito sagrado colocado dentro de cada cuerpo viviente. Afirman que los profetas, los médicos y los místicos vislumbraron parte de su ley oculta, y que a través de ritos disciplinados, ayunos y sacrificios cuidadosamente medidos, los fieles pueden dominar la corriente vital mientras se someten al orden escrito en la creación."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "Los quintaesencialistas judíos comienzan con la antigua enseñanza de que la vida de la carne está en la sangre. Consideran el pacto, la circuncisión y la memoria del sacrificio del templo como fragmentos de una disciplina oculta, y sostienen que la sangre lleva tanto la herencia de generaciones como las obligaciones que unen a un pueblo. Comandar esa herencia es, a sus ojos, tocar la corriente más profunda de la creación."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Los quintaesencialistas orientales describen la Quintaesencia como la corriente vital que se mueve a través del samsara: aliento, sangre, karma y conciencia unidos en una sola circulación. Algunos lo llaman prana, mientras que otros lo entienden como un medio para soltar el apego o limpiar las cargas kármicas. Todos enseñan que ritos exigentes pueden redirigir esta corriente hacia el despertar, la longevidad y la liberación final."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Los quintaesencialistas siníticos sostienen que la sangre es el recipiente más denso del qi, heredado de los antepasados y ordenado bajo el Cielo. Al recorrer los meridianos del cuerpo, honrar a los muertos y equilibrar sacrificio y armonía, buscan refinar la esencia heredada en vez de desperdiciarla. Se dice que una circulación perfecta une cuerpo, linaje y cosmos en un único orden carmesí."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Los quintaesencialistas de Ásatrú rechazan las concesiones extranjeras y reconocen la corriente carmesí en la prueba de Odín, la furia guerrera de los einherjar y la sangre derramada en el blót. Matar o morir con un propósito libera poder para el clan, la tierra y los dioses; la guerra es sacramento, el sacrificio es intercambio y la Quintaesencia pertenece a quienes tienen la audacia necesaria para dominarla."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "Entre los seguidores de los dioses antiguos, la sangre es recordada como el primer idioma hablado entre los mortales, los antepasados y los espíritus. Los quintaesencialistas preservan el juramento, la ofrenda y la fiesta del sacrificio, pero enseñan que estos ritos hacen más que aplacar poderes invisibles: abren canales a través de los cuales la fuerza pasa de la bestia al guerrero, de los muertos a los vivos y de la tierra a su pueblo elegido."
