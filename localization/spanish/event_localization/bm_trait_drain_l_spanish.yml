l_spanish:
 bm_trait_drain.001.b: "Esa mente despierta podría serme útil."
 bm_trait_drain.001.c: "Podría volverme más fuerte..."
 bm_trait_drain.001.d: "Qué belleza... ¿Por qué no habría de ser mía?"
 bm_trait_drain.001.desc: "El prisionero se arrodilla ante ti, con el terror reflejado en sus ojos desorbitados, mientras unas runas carmesí cobran vida sobre el suelo de la cámara. Sus súplicas de clemencia se apagan hasta convertirse en susurros cuando te acercas y trazas símbolos arcanos en el aire con los dedos. Percibes aquello que lo hace especial —esa chispa de inteligencia, esa fortaleza física, esa belleza sobrenatural— palpitando bajo su piel como un faro que llama a tu poder.\n\nLa magia de sangre exige sacrificios, y sus dones únicos pronto serán tuyos. El aire se espesa de expectación mientras los tentáculos de tu conciencia se extienden, dispuestos a extraer lo que deseas. Sus labios tiemblan y forman unas palabras desesperadas:\n\n«Por favor... cualquier cosa menos esto...»\n\nPero tú sabes más. Su esencia te servirá mucho mejor de lo que jamás podría hacerlo su carne."
 bm_trait_drain.001.e: "Excelente."
 bm_trait_drain.001.f: "Qué altura... Me pregunto cómo se verá el mundo desde ahí arriba."
 bm_trait_drain.001.fail: "No consigo arrebatarle su don"
 bm_trait_drain.001.g: "Su sangre es deliciosa..."
 bm_trait_drain.001.h: "Esa fuerza me sería muy útil."
 bm_trait_drain.001.nice: "Excelente."
 bm_trait_drain.001.success: "Le arrebato su don"
 bm_trait_drain.001.title: "La cosecha de esencias" #deepl:83850483
 bm_trait_drain.001.z: "Déjalos ir..." #deepl:3514667144
