 channel_lifeforce_bloodline_desc: "Cada modificador de Dinastía Carmesí concede a la dinastía una probabilidad de obtener experiencia en la senda de Linaje.\n\nMediante ritos sagrados y grandes sacrificios, tu magia de sangre puede trascender tu propia persona e imbuir de poder sobrenatural a todo tu linaje."
