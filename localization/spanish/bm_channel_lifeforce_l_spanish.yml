 bm_channel_lifeforce_bloodline.001.desc: "El círculo ritual está dibujado con mi propia sangre, símbolos sagrados que me conectan con todos los miembros de mi casa. Mientras pronuncio las antiguas palabras, siento que los zarcillos del poder atraviesan el tiempo y el espacio, buscando a aquellos que comparten mi sangre. ¿Qué regalo concederé a mi dinastía para las generaciones venideras?" #deepl:2485545450
